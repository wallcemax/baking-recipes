<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食材賓果｜Just Do Eat</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  :root {
    --bg: #f3ecdd;
    --paper: #fffbf3;
    --ink: #3a2c22;
    --muted: #8a7562;
    --jam: #c1512f;
    --jam-deep: #9c3f24;
    --sage: #6f8f5f;
    --line: #e3d4bb;
    --shadow: 0 18px 40px -18px rgba(58, 44, 34, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 12% -10%, #fff6e2 0%, transparent 40%),
      radial-gradient(circle at 100% 110%, #ecdcc3 0%, transparent 45%),
      var(--bg);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
  }
  .stage { width: min(560px, 100%); margin: auto; padding: 28px 16px 60px; }
  header { text-align: center; margin-bottom: 22px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.22em; color: var(--jam-deep); font-weight: 700; margin-bottom: 6px; }
  h1 { font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(26px, 6vw, 36px); font-weight: 900; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .back-links { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
  .back-links a.back-link { margin-top: 0; }
  a.back-link { display: inline-block; color: var(--jam-deep); font-size: 12px; font-weight: 700; text-decoration: none; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  input, select { width: 100%; border: 1px solid var(--line); background: #fffefb; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--ink); }
  label.field-label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 5px; font-weight: 700; }
  label.field-label:first-child { margin-top: 0; }

  button { font: inherit; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn { width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 800; font-size: 14px; padding: 12px; border-radius: 14px; transition: transform .15s, box-shadow .15s; }
  .btn:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.primary { background: linear-gradient(135deg, var(--jam), var(--jam-deep)); color: #fff6ea; border-color: transparent; }
  .btn.small { width: auto; padding: 7px 14px; font-size: 12px; border-radius: 999px; }

  .room-list-item { width: 100%; text-align: left; background: #fffefb; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: box-shadow .15s; }
  .room-list-item:hover { box-shadow: var(--shadow); }
  .room-list-item b { font-size: 14px; }
  .room-list-item small { display: block; color: var(--muted); margin-top: 3px; font-size: 11px; }

  .players-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
  .player-slot { background: #fffefb; border: 2px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; font-size: 12px; }
  .player-slot.ready { background: #eef4e9; border-color: var(--sage); }
  .player-slot.empty { opacity: .4; }
  .player-slot .pname { font-weight: 800; font-size: 13px; }

  .board { background: linear-gradient(155deg, #8a5a3a, #5c3a24); border-radius: 26px; padding: 12px; box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .tile { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; border: none; cursor: pointer; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 0; perspective: 600px; }
  .tile:disabled { cursor: default; }
  .tile-inner { position: absolute; inset: 0; border-radius: 14px; transition: transform 0.45s cubic-bezier(.32,1.4,.5,1); transform-style: preserve-3d; box-shadow: inset 0 0 0 1px var(--line); }
  .tile.marked .tile-inner { transform: rotateY(180deg); }
  .tile.win .tile-inner { box-shadow: inset 0 0 0 3px var(--sage); }
  .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; backface-visibility: hidden; border-radius: 14px; }
  .face-emoji { font-size: clamp(19px, 5.6vw, 30px); line-height: 1; }
  .face-name { transform: rotateY(180deg); background: linear-gradient(155deg, var(--jam), var(--jam-deep)); color: #fff6ea; font-weight: 800; font-size: clamp(9px, 2.3vw, 12px); text-align: center; padding: 3px 5px; }
  .tile:not(:disabled):hover .tile-inner { box-shadow: inset 0 0 0 2px var(--jam); }

  .turn-banner { background: linear-gradient(135deg, var(--jam), var(--jam-deep)); color: #fff6ea; border-radius: 16px; padding: 12px 16px; text-align: center; font-weight: 900; font-size: 15px; margin-bottom: 12px; }
  .turn-banner.waiting { background: #efe4d0; color: var(--muted); }

  .players-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
  .player-chip { flex-shrink: 0; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .player-chip.active { border-color: var(--jam); background: #fdece4; }
  .player-chip.winner { border-color: var(--sage); background: #eef4e9; }

  .log-box { margin-top: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px 13px; font-size: 12px; color: var(--muted); max-height: 110px; overflow-y: auto; }
  .log-box div { padding: 2px 0; }

  .dice-reveal { text-align: center; }
  .dice-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .dice-item { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; text-align: center; min-width: 74px; }
  .dice-item .dv { font-size: 22px; font-weight: 900; color: var(--jam-deep); }
  .dice-item .dn { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); background: var(--ink); color: #fff6ea; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; opacity: 0; transition: .25s; z-index: 100; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .hidden { display: none !important; }

  /* -------- 連線特效：外層負責定位+旋轉角度(固定不變)，內層負責從0展開到滿長度的
     動畫(這樣兩種transform不會互相打架) -------- */
  .bingo-line-effect { position: fixed; height: 5px; transform-origin: left center; z-index: 400; pointer-events: none; }
  .bingo-line-bar { width: 100%; height: 100%; border-radius: 3px; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #ffd75e, var(--jam), #ffd75e); box-shadow: 0 0 14px 3px rgba(255, 215, 94, .75); }
  .bingo-line-bar.draw { transition: transform .5s cubic-bezier(.22, .85, .3, 1), opacity .45s ease .65s; transform: scaleX(1); opacity: 0; }

  /* 星星粒子：從連線上隨機一點噴出，往CSS變數指定的隨機方向飛散並淡出 */
  .bingo-star { position: fixed; font-size: 15px; z-index: 401; pointer-events: none; transform: translate(-50%, -50%) scale(.4); opacity: 1; }
  .bingo-star.burst { transition: transform .85s cubic-bezier(.18, .75, .3, 1), opacity .85s ease; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(200deg); opacity: 0; }
</style>
</head>
<body>

<div class="stage">
  <header>
    <p class="eyebrow">JUST DO EAT · 小遊戲</p>
    <h1>🎯 食材賓果</h1>
    <p class="sub" id="header-sub">輪流叫牌，全房間同步翻牌，先連成一線贏</p>
    <div class="back-links">
      <a href="game.html" class="back-link">🎮 返回遊戲場</a>
      <a href="index.html" class="back-link">← 回到 JUST DO EAT</a>
    </div>
  </header>

  <div id="login-gate" class="card hidden" style="text-align:center;">
    <p style="margin-bottom:12px;">請先登入才能玩食材賓果</p>
    <button class="btn primary" onclick="googleLogin()">使用 Google 登入</button>
  </div>

  <div id="app-root"></div>
</div>

<div id="toast" class="toast"></div>

<script>
  const FOODS = [
    { emoji: '🍔', name: '漢堡' }, { emoji: '🍕', name: '披薩' }, { emoji: '🍜', name: '拉麵' },
    { emoji: '🍣', name: '壽司' }, { emoji: '🍱', name: '便當' }, { emoji: '🥟', name: '餃子' },
    { emoji: '🍤', name: '蝦子' }, { emoji: '🍗', name: '雞腿' }, { emoji: '🥩', name: '牛排' },
    { emoji: '🍖', name: '排骨' }, { emoji: '🍟', name: '薯條' }, { emoji: '🌮', name: '塔可' },
    { emoji: '🥗', name: '沙拉' }, { emoji: '🍰', name: '蛋糕' }, { emoji: '🍩', name: '甜甜圈' },
    { emoji: '🍦', name: '冰淇淋' }, { emoji: '🍮', name: '布丁' }, { emoji: '🥤', name: '手搖飲' },
    { emoji: '🍹', name: '調酒' }, { emoji: '🍺', name: '啤酒' }, { emoji: '🍎', name: '蘋果' },
    { emoji: '🍌', name: '香蕉' }, { emoji: '🍇', name: '葡萄' }, { emoji: '🍓', name: '草莓' },
    { emoji: '🥑', name: '酪梨' },
  ];
  const MIN_PLAYERS = 2;
  const MAX_PLAYERS_CAP = 8;
  // 5x5總共只有12條可能的線(5列+5欄+2對角線)。用模擬跑過資料：需要6條線以上時，
  // 平均要叫的張數會迅速逼近25(=幾乎要叫完整張卡)，設定越高、賓果遊戲該有的節奏感越薄弱，
  // 所以開放1~6，不開放到12(理論上限)
  const MAX_LINES_NEEDED = 6;

  const firebaseConfig = {
    apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
    authDomain: "recipe-synchronization.firebaseapp.com",
    projectId: "recipe-synchronization",
    storageBucket: "recipe-synchronization.firebasestorage.app",
    messagingSenderId: "559668909743",
    appId: "1:559668909743:web:63dc34572b98839479265a"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let myDisplayName = null;

  function googleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => showToast('登入失敗：' + err.message));
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ============================================================
  // 音效：用Web Audio API即時合成，不依賴外部音效檔案
  // ============================================================
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // 翻牌音效：短促清脆的一聲，模擬卡片翻面的觸感
  function playFlipSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(680, now);
    osc.frequency.exponentialRampToValueAtTime(340, now + 0.09);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }
  // 連成一線音效：4個音符快速上升的琶音，營造慶祝感
  function playLineCompleteSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
    notes.forEach((freq, i) => {
      const startAt = now + i * 0.085;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startAt);
      gain.gain.setValueAtTime(0.001, startAt);
      gain.gain.linearRampToValueAtTime(0.28, startAt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + 0.35);
    });
  }
  // 勝利號角：整場遊戲結束時播放，比遊戲進行中單純連成一線的音效更長、更盛大——
  // 主旋律6個音符的上升琶音，每個音符額外疊加一個高八度的音強化明亮感，最後停在
  // 拉長的和弦上收尾，明顯區隔於中途連線的短促提示音
  function playVictoryFanfare() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const melody = [523.25, 659.25, 783.99, 1046.5, 783.99, 1318.5]; // C5 E5 G5 C6 G5 E6
    melody.forEach((freq, i) => {
      const startAt = now + i * 0.11;
      const dur = i === melody.length - 1 ? 0.6 : 0.22;
      [freq, freq * 2].forEach((f, layer) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = layer === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f, startAt);
        const peak = layer === 0 ? 0.3 : 0.1;
        gain.gain.setValueAtTime(0.001, startAt);
        gain.gain.linearRampToValueAtTime(peak, startAt + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startAt + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startAt);
        osc.stop(startAt + dur);
      });
    });
  }

  auth.onAuthStateChanged(async user => {
    currentUser = user;
    document.getElementById('login-gate').classList.toggle('hidden', !!user);
    if (!user) { document.getElementById('app-root').innerHTML = ''; return; }
    try {
      const doc = await db.collection('userProgress').doc(user.uid).get();
      myDisplayName = (doc.exists && doc.data().nickname) || user.displayName || '玩家';
    } catch (e) { myDisplayName = user.displayName || '玩家'; }
    renderLobby();
  });

  // 回傳目前已經完成的所有線(可能不只一條)，呼叫端自己判斷數量夠不夠達到房主設定的needLines
  function getCompletedLines(board, calledSet) {
    const lines = [];
    for (let r = 0; r < 5; r++) lines.push([0, 1, 2, 3, 4].map(c => r * 5 + c));
    for (let c = 0; c < 5; c++) lines.push([0, 1, 2, 3, 4].map(r => r * 5 + c));
    lines.push([0, 6, 12, 18, 24]);
    lines.push([4, 8, 12, 16, 20]);
    return lines.filter(line => line.every(idx => calledSet.has(board[idx])));
  }
  function shuffledBoard() {
    const arr = Array.from({ length: 25 }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let roomState = { roomId: null, unsubscribe: null };
  let lobbyUnsubscribe = null;
  function cleanupRoom() {
    if (roomState.unsubscribe) { roomState.unsubscribe(); roomState.unsubscribe = null; }
    if (lobbyUnsubscribe) { lobbyUnsubscribe(); lobbyUnsubscribe = null; }
    roomState = { roomId: null, unsubscribe: null };
  }

  function renderLobby() {
    cleanupRoom();
    document.getElementById('app-root').innerHTML = `
      <div class="card">
        <button class="btn primary" style="margin-bottom:10px;" onclick="openCreateRoomForm()">➕ 建立新房間</button>
        <p style="font-weight:800; font-size:13px; margin-bottom:8px;">🚪 目前開放的房間</p>
        <div id="room-list"><p style="text-align:center; color:var(--muted); font-size:13px;">載入中...</p></div>
      </div>
    `;
    lobbyUnsubscribe = db.collection('bingoGameRooms').where('status', '==', 'waiting').limit(20)
      .onSnapshot(snap => {
        const listEl = document.getElementById('room-list');
        if (!listEl) return;
        const staleMs = 30 * 60 * 1000;
        const now = Date.now();
        const activeRooms = snap.docs.filter(doc => {
          const c = doc.data().createdAt;
          if (!c || typeof c.toMillis !== 'function') return true;
          return (now - c.toMillis()) < staleMs;
        });
        if (!activeRooms.length) { listEl.innerHTML = `<p style="text-align:center; color:var(--muted); font-size:13px;">目前沒有開放中的房間，建立一個新的吧！</p>`; return; }
        listEl.innerHTML = activeRooms.map(doc => {
          const d = doc.data();
          return `<button class="room-list-item" onclick="promptJoinRoom('${doc.id}')">
            <b>${escapeHtml(d.roomName || '未命名房間')}</b>
            <small>👑${escapeHtml((d.members[0] && d.members[0].name) || '?')} · ${d.members.length}/${d.maxPlayers}人 · 連${d.linesNeeded || 1}線獲勝</small>
          </button>`;
        }).join('');
      }, err => {
        const listEl = document.getElementById('room-list');
        if (listEl) listEl.innerHTML = `<p style="text-align:center; color:var(--jam-deep); font-size:13px;">載入失敗：${err.message}</p>`;
      });
  }

  function openCreateRoomForm() {
    document.getElementById('app-root').innerHTML = `
      <div class="card">
        <label class="field-label">房間名稱</label>
        <input id="cr-name" placeholder="例如：週末食材賓果">
        <label class="field-label">密碼（給朋友加入用）</label>
        <input id="cr-password" placeholder="設定一個密碼">
        <label class="field-label">最多幾人（2~${MAX_PLAYERS_CAP}人）</label>
        <input id="cr-maxplayers" type="number" min="${MIN_PLAYERS}" max="${MAX_PLAYERS_CAP}" value="4">
        <label class="field-label">需要連成幾條線才算贏（1~${MAX_LINES_NEEDED}）</label>
        <input id="cr-linesneeded" type="number" min="1" max="${MAX_LINES_NEEDED}" value="1">
        <p style="font-size:11px; color:var(--muted); margin:4px 0 0;">5x5卡片總共只有12條可能的線（5列+5欄+2對角線）。1條線最快，平均10幾輪就分勝負；設太高（超過6條）幾乎要叫完整張卡才會贏，節奏會變很慢</p>
        <button class="btn primary" style="margin-top:14px;" onclick="createRoom()">建立房間</button>
        <button class="btn" style="margin-top:8px;" onclick="renderLobby()">返回</button>
      </div>
    `;
  }

  function generateRoomId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  async function createRoom() {
    const roomName = (document.getElementById('cr-name').value || '').trim() || '未命名房間';
    const password = (document.getElementById('cr-password').value || '').trim();
    if (!password) { showToast('請設定密碼'); return; }
    let maxPlayers = parseInt(document.getElementById('cr-maxplayers').value, 10) || 4;
    maxPlayers = Math.min(MAX_PLAYERS_CAP, Math.max(MIN_PLAYERS, maxPlayers));
    let linesNeeded = parseInt(document.getElementById('cr-linesneeded').value, 10) || 1;
    linesNeeded = Math.min(MAX_LINES_NEEDED, Math.max(1, linesNeeded));
    const roomId = generateRoomId();
    try {
      const oldRoomsSnap = await db.collection('bingoGameRooms').where('hostUid', '==', currentUser.uid).get();
      for (const oldDoc of oldRoomsSnap.docs) await oldDoc.ref.delete();

      await db.collection('bingoGameRooms').doc(roomId).set({
        hostUid: currentUser.uid, roomName, password, maxPlayers, linesNeeded,
        members: [{ uid: currentUser.uid, name: myDisplayName }],
        memberUids: [currentUser.uid], readyUids: [],
        status: 'waiting',
        playerBoards: null, diceResults: null, turnOrder: null, currentTurnIndex: 0,
        calledItems: [], winnerUid: null, winLines: null,
        eventLog: [], createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      enterRoom(roomId);
    } catch (err) { showToast('建立房間失敗：' + err.message); }
  }

  function promptJoinRoom(roomId) {
    const password = prompt('請輸入房間密碼');
    if (password === null) return;
    joinRoom(roomId, password);
  }
  async function joinRoom(roomId, password) {
    try {
      const ref = db.collection('bingoGameRooms').doc(roomId);
      const doc = await ref.get();
      if (!doc.exists) { showToast('房間不存在，可能剛好被關閉了'); renderLobby(); return; }
      const data = doc.data();
      if (data.password !== password) { showToast('密碼錯誤'); return; }
      if (data.status !== 'waiting') { showToast('這場遊戲已經開始了，沒辦法中途加入'); return; }
      if (data.members.length >= data.maxPlayers) { showToast('房間已滿'); return; }
      if (data.memberUids.includes(currentUser.uid)) { enterRoom(roomId); return; }
      await ref.update({
        members: firebase.firestore.FieldValue.arrayUnion({ uid: currentUser.uid, name: myDisplayName }),
        memberUids: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
      });
      enterRoom(roomId);
    } catch (err) { showToast('加入房間失敗：' + err.message); }
  }

  let lastAnnouncedDiceReveal = null;
  let previousMyCompletedLines = null; // null代表還沒渲染過，第一次渲染不觸發特效(避免重新整理頁面時，把之前已經連成的線當成新完成)
  let previousCalledCount = null; // 同樣用來偵測「這次渲染是不是有新叫牌」，第一次渲染不播放翻牌音效
  let gameEndCelebrated = false; // 避免遊戲結束畫面重複渲染時，獲勝特效跟著重複播放好幾次
  function enterRoom(roomId) {
    roomState.roomId = roomId;
    previousMyCompletedLines = null;
    previousCalledCount = null;
    gameEndCelebrated = false;
    roomState.unsubscribe = db.collection('bingoGameRooms').doc(roomId).onSnapshot(doc => {
      if (!doc.exists) { showToast('房間已經被關閉'); cleanupRoom(); renderLobby(); return; }
      const data = doc.data();
      if (data.status === 'waiting') renderWaitingRoom(data);
      else if (data.status === 'playing' || data.status === 'gameover') renderGameBoard(data);
    }, err => console.warn('房間同步失敗', err));
  }

  function renderWaitingRoom(data) {
    const isHost = data.hostUid === currentUser.uid;
    const readyUids = data.readyUids || [];
    const iAmReady = readyUids.includes(currentUser.uid);
    const allReady = data.members.length >= MIN_PLAYERS && data.members.every(m => readyUids.includes(m.uid));

    const slots = Array.from({ length: data.maxPlayers }, (_, i) => {
      const m = data.members[i];
      if (!m) return `<div class="player-slot empty">空位</div>`;
      const ready = readyUids.includes(m.uid);
      const kickBtn = (isHost && m.uid !== currentUser.uid)
        ? `<br><button class="btn small" style="margin-top:5px; color:var(--jam-deep);" onclick="event.stopPropagation(); kickMember('${m.uid}','${escapeHtml(m.name).replace(/'/g, "\\'")}')">✕踢除</button>` : '';
      return `<div class="player-slot ${ready ? 'ready' : ''}">${m.uid === data.hostUid ? '👑 ' : ''}<span class="pname">${escapeHtml(m.name)}</span><br>${ready ? '✅已準備' : '⏳準備中'}${kickBtn}</div>`;
    }).join('');

    document.getElementById('app-root').innerHTML = `
      <div class="card">
        <p style="font-size:12px; color:var(--muted);">房間代碼</p>
        <p style="font-size:22px; font-weight:900; letter-spacing:2px;">${roomState.roomId}</p>
        <p style="font-weight:800; font-size:13px; margin:10px 0 6px;">👥 房間成員（${data.members.length}/${data.maxPlayers}）・至少${MIN_PLAYERS}人才能開始</p>
        <div class="players-grid">${slots}</div>
      </div>
      <div class="card">
        <button class="btn primary" style="margin-bottom:8px;" onclick="toggleReady(${!iAmReady})">${iAmReady ? '取消準備' : '✅ 我準備好了'}</button>
        ${isHost
          ? `<button class="btn" onclick="confirmStartGame()" ${allReady ? '' : 'disabled'}>${allReady ? '🎲 開始遊戲（自動擲骰決定順序）' : '等待全部人準備好...'}</button>`
          : `<p style="text-align:center; color:var(--muted); font-size:13px; padding:12px;">${allReady ? '⏳ 等待房主開始遊戲...' : '⏳ 等待全部人準備好...'}</p>`}
      </div>
      <button class="btn" onclick="leaveRoom()">離開房間</button>
    `;
  }

  async function toggleReady(ready) {
    try {
      await db.collection('bingoGameRooms').doc(roomState.roomId).update({
        readyUids: ready ? firebase.firestore.FieldValue.arrayUnion(currentUser.uid) : firebase.firestore.FieldValue.arrayRemove(currentUser.uid),
      });
    } catch (err) { console.warn('切換準備狀態失敗', err); }
  }
  async function kickMember(uid, name) {
    if (!confirm(`確定要把「${name}」踢出房間嗎？`)) return;
    try {
      const ref = db.collection('bingoGameRooms').doc(roomState.roomId);
      const doc = await ref.get();
      const data = doc.data();
      if (data.hostUid !== currentUser.uid) return; // 只有房主能踢人，不只靠前端隱藏按鈕擋
      const members = data.members.filter(m => m.uid !== uid);
      await ref.update({
        members, memberUids: members.map(m => m.uid),
        readyUids: (data.readyUids || []).filter(u => u !== uid),
      });
    } catch (err) { showToast('踢除失敗：' + err.message); }
  }
  async function leaveRoom() {
    try {
      const ref = db.collection('bingoGameRooms').doc(roomState.roomId);
      const doc = await ref.get();
      if (doc.exists) {
        const data = doc.data();
        const members = data.members.filter(m => m.uid !== currentUser.uid);
        if (!members.length || data.hostUid === currentUser.uid) {
          await ref.delete();
        } else {
          await ref.update({
            members, memberUids: members.map(m => m.uid),
            readyUids: (data.readyUids || []).filter(u => u !== currentUser.uid),
          });
        }
      }
    } catch (err) { console.warn(err); }
    cleanupRoom();
    renderLobby();
  }

  async function confirmStartGame() {
    const ref = db.collection('bingoGameRooms').doc(roomState.roomId);
    try {
      const claimed = await db.runTransaction(async (tx) => {
        const freshDoc = await tx.get(ref);
        if (!freshDoc.exists || freshDoc.data().status !== 'waiting') return false;
        const d = freshDoc.data();
        if (d.hostUid !== currentUser.uid) return false; // 只有房主能開始遊戲，不只靠前端隱藏按鈕擋
        const readyUids = d.readyUids || [];
        if (d.members.length < MIN_PLAYERS) return false;
        if (!d.members.every(m => readyUids.includes(m.uid))) return false;

        const playerBoards = {};
        const diceResults = {};
        const tiebreakers = {}; // 同分時要用的固定隨機值，排序開始前先算好、之後排序過程都用同一個值
        d.memberUids.forEach(uid => {
          playerBoards[uid] = shuffledBoard();
          diceResults[uid] = 1 + Math.floor(Math.random() * 6);
          tiebreakers[uid] = Math.random();
        });
        // 這裡刻意不寫成「同分時直接return Math.random()-0.5」——那是JavaScript公認的錯誤寫法，
        // 排序演算法要求比較函式的結果要「一致、可傳遞」(A比B優先、B比C優先，A就一定要比C優先)，
        // 但每次呼叫都重新取一個新亂數會違反這個假設(同一組A、B比較兩次可能得到不同結果)，
        // 不同瀏覽器的排序演算法實作面對這種不一致的比較函式，可能產生不保證公平、甚至偏向
        // 特定位置(例如陣列順序在前/在後的人)的結果。改成排序前就先幫每個人固定好一個隨機值，
        // 排序過程中全程使用同一批固定值比較，才符合排序演算法對比較函式的正確要求
        const turnOrder = [...d.memberUids].sort((a, b) => {
          if (diceResults[b] !== diceResults[a]) return diceResults[b] - diceResults[a];
          return tiebreakers[a] - tiebreakers[b];
        });
        const orderNames = turnOrder.map(uid => d.members.find(m => m.uid === uid).name).join(' → ');

        tx.update(ref, {
          status: 'playing', playerBoards, diceResults, turnOrder, currentTurnIndex: 0,
          calledItems: [], winnerUid: null, winLines: null,
          eventLog: firebase.firestore.FieldValue.arrayUnion(`🎲 遊戲開始！順序：${orderNames}`),
        });
        return true;
      });
      if (!claimed) showToast('還沒全部人準備好，或已經被其他成員開始了');
    } catch (err) { showToast('開始遊戲失敗：' + err.message); }
  }

  function renderGameBoard(data) {
    const myUid = currentUser.uid;
    const myBoard = data.playerBoards[myUid];
    const calledSet = new Set(data.calledItems || []);
    const isGameOver = data.status === 'gameover';
    const isMyTurn = !isGameOver && data.turnOrder[data.currentTurnIndex] === myUid;
    const linesNeeded = data.linesNeeded || 1;

    const diceKey = JSON.stringify(data.diceResults);
    if (!isGameOver && lastAnnouncedDiceReveal !== diceKey && data.calledItems.length === 0) {
      lastAnnouncedDiceReveal = diceKey;
      renderDiceReveal(data);
      return;
    }

    const playersStripHtml = data.turnOrder.map(uid => {
      const m = data.members.find(x => x.uid === uid);
      const isActive = !isGameOver && uid === data.turnOrder[data.currentTurnIndex];
      const isWinner = isGameOver && uid === data.winnerUid;
      return `<div class="player-chip ${isActive ? 'active' : ''} ${isWinner ? 'winner' : ''}">${isWinner ? '🏆' : ''}${escapeHtml(m ? m.name : '?')}</div>`;
    }).join('');

    // 把所有已完成連線的格子索引攤平成一個集合，遊戲結束時要標示的可能不只一條線。
    // winLines存進Firestore時被包成[{cells:[...]}]的格式(繞開Firestore不支援巢狀陣列的限制)，
    // 這裡要對應解開，取每個物件的cells欄位
    const winLineSet = new Set();
    if (isGameOver && data.winLines) data.winLines.forEach(lineObj => (lineObj.cells || []).forEach(idx => winLineSet.add(idx)));
    // 遊戲進行中，額外算一下自己目前已經連成幾條線，讓玩家知道還差幾條
    const myCompletedLines = !isGameOver ? getCompletedLines(myBoard, calledSet) : [];

    // 翻牌音效：比較這次跟上次渲染的叫牌數量，有變化才播放(避免像是交易完成、開啟道具視窗這種
    // 不牽涉叫牌的渲染也誤觸發音效)；第一次渲染(previousCalledCount===null，例如剛整理頁面)不播放
    const calledCount = (data.calledItems || []).length;
    if (previousCalledCount !== null && calledCount > previousCalledCount) playFlipSound();
    previousCalledCount = calledCount;

    // 連線特效偵測：用「線的實際內容」互相比對(不是單純比數量)，找出這次新完成、之前沒有的線——
    // 這樣就算之後線的完成順序不是單純遞增(例如兩條線幾乎同時完成，順序跟預期不同)也不會誤判
    if (!isGameOver && previousMyCompletedLines !== null) {
      const prevKeys = new Set(previousMyCompletedLines.map(l => l.join(',')));
      const newLines = myCompletedLines.filter(l => !prevKeys.has(l.join(',')));
      if (newLines.length > 0) {
        // 用requestAnimationFrame延遲到innerHTML真正渲染完成、格子DOM元素都存在之後才觸發，
        // 不然這時候呼叫getBoundingClientRect()會抓到還沒更新的舊畫面
        requestAnimationFrame(() => newLines.forEach(line => triggerLineEffect(line)));
      }
    }
    previousMyCompletedLines = myCompletedLines;

    // 遊戲真正結束(分出勝負)時的專屬慶祝效果：跟遊戲進行中單純連成一條線不同，這裡要把
    // winLines裡「所有」獲勝的線都畫出來(可能不只一條)，並播放比較盛大的勝利號角，
    // 用gameEndCelebrated旗標確保這個效果只在剛結束的那一刻播一次，不會因為畫面重複渲染
    // (例如其他玩家操作觸發的重繪)就跟著重複播放。
    // 注意：winLines的格子索引是根據「贏家自己的棋盤排列」算出來的，每個玩家拿到的棋盤
    // 排列都不一樣，所以連接線這個視覺特效只能在贏家自己的畫面上顯示才有意義——
    // 其他觀戰的玩家如果也套用同一組索引去連自己畫面上的格子，會連到完全不相關的位置。
    // 非贏家的其他玩家只播放號角音效、不顯示連接線
    if (isGameOver && !gameEndCelebrated && data.winLines) {
      gameEndCelebrated = true;
      requestAnimationFrame(() => {
        playVictoryFanfare();
        if (data.winnerUid === myUid) {
          const linesToShow = data.winLines.map(lineObj => lineObj.cells).filter(Boolean);
          linesToShow.forEach((line, i) => setTimeout(() => triggerLineEffect(line, true), i * 180));
        }
      });
    }

    const gridHtml = myBoard.map((foodIdx, i) => {
      const food = FOODS[foodIdx];
      const marked = calledSet.has(foodIdx);
      const canClick = isMyTurn && !marked;
      const isWinTile = isGameOver && data.winnerUid === myUid && winLineSet.has(i);
      return `<button class="tile ${marked ? 'marked' : ''} ${isWinTile ? 'win' : ''}" ${canClick ? '' : 'disabled'} onclick="callFoodItem(${i})" data-tile-index="${i}" aria-label="${food.name}">
        <div class="tile-inner">
          <div class="face face-emoji">${food.emoji}</div>
          <div class="face face-name">${food.name}</div>
        </div>
      </button>`;
    }).join('');

    let bannerHtml;
    if (isGameOver) {
      const winnerName = (data.members.find(m => m.uid === data.winnerUid) || {}).name || '?';
      const winMsg = linesNeeded === 1 ? '連成一線' : `連成${(data.winLines || []).length}條線`;
      bannerHtml = `<div class="turn-banner">🏆 ${escapeHtml(winnerName)} ${winMsg}，獲勝！</div>`;
    } else if (isMyTurn) {
      bannerHtml = `<div class="turn-banner">👉 輪到你了！點一個你卡上還沒翻開的食材</div>`;
    } else {
      const turnName = (data.members.find(m => m.uid === data.turnOrder[data.currentTurnIndex]) || {}).name || '?';
      bannerHtml = `<div class="turn-banner waiting">⏳ 等待 ${escapeHtml(turnName)} 選擇食材...</div>`;
    }
    const progressHtml = !isGameOver ? `<p style="text-align:center; font-size:12px; color:var(--muted); margin:-4px 0 12px;">目標：連成 ${linesNeeded} 條線・你目前已連成 <b style="color:var(--jam-deep);">${myCompletedLines.length}</b> 條</p>` : '';

    document.getElementById('app-root').innerHTML = `
      <div class="players-strip">${playersStripHtml}</div>
      ${bannerHtml}
      ${progressHtml}
      <div class="board"><div class="grid">${gridHtml}</div></div>
      <div class="log-box">${(data.eventLog || []).slice(-8).reverse().map(e => `<div>${escapeHtml(e)}</div>`).join('')}</div>
      ${isGameOver ? `
        <div style="display:flex; gap:8px; margin-top:14px;">
          ${data.hostUid === myUid ? `<button class="btn primary" style="flex:1;" onclick="backToWaitingRoom()">🔄 再玩一場</button>` : ''}
          <button class="btn" style="flex:1;" onclick="leaveRoom()">離開房間</button>
        </div>
      ` : `<button class="btn" style="margin-top:14px;" onclick="leaveRoom()">離開房間</button>`}
    `;
  }

  function renderDiceReveal(data) {
    const rows = data.turnOrder.map(uid => {
      const m = data.members.find(x => x.uid === uid);
      return `<div class="dice-item"><div class="dv">🎲${data.diceResults[uid]}</div><div class="dn">${escapeHtml(m ? m.name : '?')}</div></div>`;
    }).join('');
    document.getElementById('app-root').innerHTML = `
      <div class="card dice-reveal">
        <p style="font-weight:900; font-size:16px; margin-bottom:6px;">擲骰決定順序！</p>
        <div class="dice-row">${rows}</div>
        <p style="color:var(--muted); font-size:12px;">3 秒後自動開始...</p>
      </div>
    `;
    setTimeout(() => { db.collection('bingoGameRooms').doc(roomState.roomId).get().then(doc => { if (doc.exists) renderGameBoard(doc.data()); }); }, 3000);
  }

  async function callFoodItem(tileIndex) {
    const ref = db.collection('bingoGameRooms').doc(roomState.roomId);
    try {
      await db.runTransaction(async (tx) => {
        const freshDoc = await tx.get(ref);
        const data = freshDoc.data();
        if (data.status !== 'playing') return;
        if (data.turnOrder[data.currentTurnIndex] !== currentUser.uid) return;
        const myBoard = data.playerBoards[currentUser.uid];
        const foodIdx = myBoard[tileIndex];
        if ((data.calledItems || []).includes(foodIdx)) return;

        const newCalledItems = [...(data.calledItems || []), foodIdx];
        const calledSet = new Set(newCalledItems);
        const me = data.members.find(m => m.uid === currentUser.uid);
        const logs = [`🍽️ ${me ? me.name : '有人'} 叫了「${FOODS[foodIdx].name}」`];
        const linesNeeded = data.linesNeeded || 1;

        // 每叫一次牌都要檢查「所有人」有沒有達到房主設定的連線數門檻——因為所有人的同一種
        // 食材會同步被翻開，這次叫的牌搞不好剛好幫別人湊滿需要的線數。
        // 判定順序：先看「喊號者自己」這一叫是否也剛好讓自己達成門檻——如果有，不管其他人是否
        // 同時達成，一律喊號者優先獲勝(獎勵主動叫牌、剛好輪到自己的那個人)。只有喊號者自己沒
        // 達成門檻、但別人達成了，才照原本的turnOrder順位去找出真正的獲勝者。
        let winnerUid = null, winLines = null;
        const callerBoard = data.playerBoards[currentUser.uid];
        const callerCompletedLines = getCompletedLines(callerBoard, calledSet);
        if (callerCompletedLines.length >= linesNeeded) {
          winnerUid = currentUser.uid;
          winLines = callerCompletedLines;
        } else {
          for (const uid of data.turnOrder) {
            const pBoard = data.playerBoards[uid];
            const completedLines = getCompletedLines(pBoard, calledSet);
            if (completedLines.length >= linesNeeded) { winnerUid = uid; winLines = completedLines; break; }
          }
        }

        const updates = { calledItems: newCalledItems, eventLog: firebase.firestore.FieldValue.arrayUnion(...logs) };
        if (winnerUid) {
          updates.status = 'gameover';
          updates.winnerUid = winnerUid;
          // Firestore不支援「陣列裡直接放陣列」這種巢狀結構，winLines本身是陣列(可能不只一條線)、
          // 裡面每一條線又是陣列(5個格子索引)，直接寫入會被拒絕。改成陣列裡放物件、物件的
          // cells欄位才是陣列，繞開這個限制——讀取端要記得對應解開這層包裝
          updates.winLines = winLines.map(line => ({ cells: line }));
          const winnerName = (data.members.find(m => m.uid === winnerUid) || {}).name || '?';
          const winMsg = linesNeeded === 1 ? `🏆 ${winnerName} 連成一線，獲勝！` : `🏆 ${winnerName} 連成${winLines.length}條線，獲勝！`;
          updates.eventLog = firebase.firestore.FieldValue.arrayUnion(...logs, winMsg);
        } else {
          updates.currentTurnIndex = (data.currentTurnIndex + 1) % data.turnOrder.length;
        }
        tx.update(ref, updates);
      });
    } catch (err) { showToast('叫牌失敗：' + err.message); }
  }

  // ============================================================
  // 連線特效：畫一條發光連接線(從線的第一格連到最後一格)+沿線爆發星星粒子。
  // 這兩個都用position:fixed的獨立元素、動畫播完用setTimeout自己移除，刻意不放進
  // app-root的innerHTML樣板裡——因為app-root每次渲染都會整個重寫，放在裡面的話動畫
  // 播到一半就會被砍掉重建，這是之前在美食大富翁的棋子動畫踩過的同一種坑
  // ============================================================
  function triggerLineEffect(line, isVictory) {
    if (!isVictory) playLineCompleteSound(); // 獲勝時的音效統一由playVictoryFanfare處理，這裡不用重複播放
    const firstEl = document.querySelector(`.tile[data-tile-index="${line[0]}"]`);
    const lastEl = document.querySelector(`.tile[data-tile-index="${line[4]}"]`);
    if (!firstEl || !lastEl) return;
    const r1 = firstEl.getBoundingClientRect();
    const r2 = lastEl.getBoundingClientRect();
    const x1 = r1.left + r1.width / 2, y1 = r1.top + r1.height / 2;
    const x2 = r2.left + r2.width / 2, y2 = r2.top + r2.height / 2;
    drawConnectLine(x1, y1, x2, y2);
    spawnStarBurst(x1, y1, x2, y2, isVictory ? 22 : 12); // 獲勝時星星數量加倍，畫面更盛大
  }

  function drawConnectLine(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const length = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    const wrap = document.createElement('div');
    wrap.className = 'bingo-line-effect';
    wrap.style.left = x1 + 'px';
    wrap.style.top = y1 + 'px';
    wrap.style.width = length + 'px';
    wrap.style.transform = `rotate(${angle}deg)`;
    wrap.innerHTML = '<div class="bingo-line-bar"></div>';
    document.body.appendChild(wrap);
    const bar = wrap.querySelector('.bingo-line-bar');
    requestAnimationFrame(() => bar.classList.add('draw'));
    setTimeout(() => wrap.remove(), 1300);
  }

  function spawnStarBurst(x1, y1, x2, y2, starCount = 12) {
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'bingo-star';
      star.textContent = Math.random() < 0.5 ? '✨' : '⭐';
      // 沿著整條線隨機分佈起始點，不是全部從中點噴出，看起來比較像整條線在發光爆開
      const t = Math.random();
      const startX = x1 + (x2 - x1) * t;
      const startY = y1 + (y2 - y1) * t;
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 55;
      star.style.left = startX + 'px';
      star.style.top = startY + 'px';
      star.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      star.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
      document.body.appendChild(star);
      requestAnimationFrame(() => star.classList.add('burst'));
      setTimeout(() => star.remove(), 950);
    }
  }

  async function backToWaitingRoom() {
    lastAnnouncedDiceReveal = null;
    previousMyCompletedLines = null;
    previousCalledCount = null;
    gameEndCelebrated = false;
    try {
      const ref = db.collection('bingoGameRooms').doc(roomState.roomId);
      const doc = await ref.get();
      if (!doc.exists || doc.data().hostUid !== currentUser.uid) return; // 只有房主能重設房間，不只靠前端隱藏按鈕擋
      await ref.update({
        status: 'waiting', readyUids: [],
        playerBoards: null, diceResults: null, turnOrder: null, currentTurnIndex: 0,
        calledItems: [], winnerUid: null, winLines: null, eventLog: [],
      });
    } catch (err) { showToast('重設房間失敗：' + err.message); }
  }
</script>
