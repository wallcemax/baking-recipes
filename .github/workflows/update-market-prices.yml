name: 更新市場價格推薦

on:
  schedule:
    # 每天台灣時間早上7點跑一次（UTC時間前一天23:00，因為台灣是UTC+8）
    - cron: '0 23 * * *'
  workflow_dispatch: {} # 也可以在GitHub網頁上手動點一次「Run workflow」立刻執行，方便測試

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝套件
        run: npm install firebase-admin

      - name: 執行更新腳本
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/update-market-prices.js
