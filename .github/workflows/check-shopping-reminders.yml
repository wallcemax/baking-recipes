name: 檢查採購提醒
on:
  schedule:
    # 每小時第7分鐘跑一次（不是整點0分）——cron是UTC時間，'7 * * * *'代表每小時的第7分鐘，
    # 刻意避開整點(每小時第0分鐘)這個全球所有排程workflow最擁擠的時間點，降低GitHub Actions
    # 排程延遲的機率。GitHub官方文件明講：整點附近是排程負載最高峰，免費方案的repo在這個
    # 時段很容易被延遲甚至直接跳過整個小時，改成偏移幾分鐘可以有效緩解(但沒辦法完全根除，
    # GitHub的schedule觸發本來就不保證準時，這是已知限制，不是bug)
    - cron: '7 * * * *'
  workflow_dispatch: {} # 也可以在GitHub網頁上手動點一次「Run workflow」立刻執行，方便測試
# 加上concurrency設定：確保同一時間只會有「一個」這個workflow在執行。
# 如果排程自動觸發的那次還沒跑完，剛好又手動點了一次「Run workflow」（或反過來），
# 沒有這個設定的話，兩次執行會同時進行，各自獨立判斷「今天還沒發送過提醒」，導致同一則提醒被送兩次。
# group設成固定值（不是動態的），代表這個workflow全域只允許一個執行個體；
# cancel-in-progress設false代表新的執行不會強制取消舊的，而是排隊等舊的先跑完，確保不會漏執行，只是不會同時跑
concurrency:
  group: check-shopping-reminders
  cancel-in-progress: false
jobs:
  check-shopping-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4
      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安裝套件
        run: npm install firebase-admin
      - name: 執行採購提醒檢查腳本
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: node scripts/check-shopping-reminders.js
