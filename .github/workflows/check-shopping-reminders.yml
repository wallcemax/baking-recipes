name: 檢查採購提醒

on:
  schedule:
    # 每小時整點跑一次（cron是UTC時間，'0 * * * *'代表每小時的第0分鐘，不用另外換算台灣時間）
    - cron: '0 * * * *'
  workflow_dispatch: {} # 也可以在GitHub網頁上手動點一次「Run workflow」立刻執行，方便測試

jobs:
  check-shopping-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝套件
        run: npm install firebase-admin

      - name: 執行採購提醒檢查腳本
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-shopping-reminders.js
