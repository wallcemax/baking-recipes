name: 檢查冰箱食材到期

on:
  schedule:
    # 每天台灣時間早上9點跑一次（UTC時間前一天01:00，因為台灣是UTC+8）
    - cron: '0 1 * * *'
  workflow_dispatch: {} # 也可以在GitHub網頁上手動點一次「Run workflow」立刻執行，方便測試

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝套件
        run: npm install firebase-admin

      - name: 執行到期檢查腳本
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-fridge-expiry.js
