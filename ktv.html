<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>KTV系統 - JUST DO EAT</title>
<style>
    :root {
        --cream: #FBF3E7; --paper: #FFFDF9; --espresso: #3A2A1E; --espresso-soft: #6B5847;
        --jam: #A8324A; --line: #EFEAE0;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--cream); color: var(--espresso);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 1.5rem; text-align: center;
    }
    .card {
        background: var(--paper); border-radius: 1.75rem; padding: 3rem 2rem; max-width: 26rem; width: 100%;
        box-shadow: 0 20px 40px -12px rgba(58,42,30,0.15);
    }
    .emoji { font-size: 3rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
    p { font-size: 0.9rem; color: var(--espresso-soft); line-height: 1.6; margin: 0 0 1.75rem; }
    a.back {
        display: inline-block; padding: 0.7rem 1.5rem; border-radius: 999px; background: var(--jam);
        color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎤</div>
        <h1>KTV系統</h1>
        <p>這裡預計會做成獨立的KTV點歌／播放系統，跟主要的食譜網站分開放在這一支檔案裡，
           不會讓首頁的 index.html 越長越大。目前還在建置中，之後的功能會陸續加在這支頁面上。</p>
        <a class="back" href="index.html">← 回到 JUST DO EAT</a>
    </div>
</body>
</html>
