<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>歡唱KTV - JUST DO EAT</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
    :root {
        --cream: #FBF3E7; --paper: #FFFDF9; --espresso: #3A2A1E; --espresso-soft: #6B5847;
        --jam: #A8324A; --jam-dark: #7A1F35; --sage: #6F8C6E; --honey: #C98A2C; --line: #EFEAE0;
        --muted: #B3A492;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: var(--cream); color: var(--espresso);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .hidden { display: none !important; }
    input[type="text"] {
        width: 100%; padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--line);
        background: var(--paper); font-size: 0.9rem; color: var(--espresso);
    }
    .btn {
        padding: 0.7rem 1.2rem; border-radius: 999px; border: none; background: var(--jam); color: #fff;
        font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-outline { background: var(--paper); color: var(--jam); border: 1px solid var(--jam); }
    .btn:disabled { opacity: .5; cursor: default; }

    /* ---------- 大廳（建立/加入房間） ---------- */
    #lobby-view { max-width: 30rem; margin: 0 auto; padding: 2rem 1.25rem; }
    #lobby-view header { text-align: center; margin-bottom: 2rem; }
    #lobby-view header h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
    #lobby-view header a { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
    .lobby-card {
        background: var(--paper); border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.25rem;
        box-shadow: 0 10px 24px -8px rgba(58,42,30,0.12);
    }
    .lobby-card h2 { font-size: 1.05rem; margin: 0 0 0.9rem; }
    .lobby-card input { margin-bottom: 0.7rem; }
    .lobby-card .btn { width: 100%; }

    /* ---------- 房間內：共用列 ---------- */
    #room-info-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        padding: 0.9rem 1.25rem; background: var(--paper); flex-wrap: wrap;
    }
    #room-info-bar .room-info-left { font-size: 0.9rem; font-weight: 600; }
    #room-info-bar .room-info-actions { display: flex; gap: 0.5rem; }

    /* ---------- 房主視角：影片 + 疊加控制介面 ---------- */
    #fullscreen-wrapper {
        position: relative; width: 100%; background: #000;
        display: flex; flex-direction: column;
    }
    #ktv-yt-player-target-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    #host-overlay-ui {
        display: flex; gap: 1px; background: var(--line);
        min-height: 22rem;
    }
    .overlay-panel { background: var(--paper); padding: 1rem; overflow-y: auto; }
    .overlay-left { flex: 1.1; min-width: 0; }
    .overlay-right { flex: 1; min-width: 0; }
    .overlay-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
    .overlay-tab {
        flex: 1; padding: 0.45rem; border-radius: 0.7rem; border: none; background: var(--cream);
        color: var(--espresso-soft); font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .overlay-tab.active { background: var(--jam); color: #fff; }
    .overlay-right h3 { font-size: 0.95rem; margin: 0 0 0.75rem; }

    /* 全螢幕時：影片撐滿整個螢幕，控制面板變成疊在下方的半透明面板 */
    #fullscreen-wrapper:fullscreen { width: 100vw; height: 100vh; }
    #fullscreen-wrapper:fullscreen #ktv-yt-player-target-wrap {
        position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: unset; z-index: 1;
    }
    #fullscreen-wrapper:fullscreen #host-overlay-ui {
        position: absolute; left: 0; right: 0; bottom: 0; height: 40%; z-index: 2;
        background: transparent; min-height: 0;
    }
    #fullscreen-wrapper:fullscreen .overlay-panel {
        background: rgba(20,14,10,0.6); backdrop-filter: blur(8px); color: #F5EBDF;
    }
    #fullscreen-wrapper:fullscreen .overlay-tab { background: rgba(255,255,255,0.12); color: #F5EBDF; }
    #fullscreen-wrapper:fullscreen .overlay-tab.active { background: var(--jam); color: #fff; }
    #fullscreen-wrapper:fullscreen .overlay-right h3 { color: #F5EBDF; }
    #fullscreen-wrapper:fullscreen #toast-stack { top: 1rem; }
    #fullscreen-wrapper:fullscreen input[type="text"] { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.25); }
    #fullscreen-wrapper:fullscreen input[type="text"]::placeholder { color: rgba(255,255,255,0.6); }

    /* ---------- 清單卡片共用樣式 ---------- */
    .ktv-result-card, .ktv-history-card, .ktv-rank-card {
        display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem; border-radius: 0.85rem;
        margin-bottom: 0.5rem; background: rgba(255,255,255,0.04);
    }
    .ktv-result-card img, .ktv-history-card img, .ktv-rank-card img, .ktv-queue-item img {
        width: 3.6rem; height: 2.1rem; object-fit: cover; border-radius: 0.4rem; flex-shrink: 0; background: var(--line);
    }
    .ktv-result-card .info, .ktv-history-card .info, .ktv-rank-card .info { flex: 1; min-width: 0; }
    .ktv-result-card .title, .ktv-history-card .title, .ktv-rank-card .title, .ktv-queue-item .title {
        font-size: 0.8rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ktv-result-card .sub, .ktv-history-card .sub, .ktv-rank-card .sub, .ktv-queue-item .sub {
        font-size: 0.68rem; opacity: 0.65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ktv-add-btn, .ktv-insert-btn {
        flex-shrink: 0; border-radius: 999px; border: none; color: #fff; cursor: pointer; font-size: 0.68rem;
        padding: 0.3rem 0.55rem; white-space: nowrap;
    }
    .ktv-add-btn { background: var(--sage); }
    .ktv-insert-btn { background: var(--honey); }
    .ktv-rank-badge { font-size: 0.7rem; opacity: 0.6; width: 1.3rem; flex-shrink: 0; text-align: center; }

    /* ---------- 佇列（可拖曳排序） ---------- */
    .ktv-queue-item {
        display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 0.85rem;
        margin-bottom: 0.5rem; background: rgba(255,255,255,0.04);
    }
    .ktv-queue-item.dragging { opacity: 0.4; }
    .ktv-queue-drag-handle { cursor: grab; padding: 0 0.3rem; opacity: 0.5; touch-action: none; user-select: none; }
    .ktv-queue-item .remove-btn { flex-shrink: 0; background: none; border: none; opacity: 0.5; font-size: 0.9rem; cursor: pointer; color: inherit; }

    /* ---------- 浮動點歌通知 ---------- */
    #toast-stack {
        position: absolute; top: 1rem; right: 1rem; z-index: 10; display: flex; flex-direction: column;
        gap: 0.5rem; max-width: 14rem; pointer-events: none;
    }
    .ktv-toast {
        background: rgba(20,14,10,0.85); color: #F5EBDF; padding: 0.55rem 0.85rem; border-radius: 0.85rem;
        font-size: 0.75rem; box-shadow: 0 10px 24px -6px rgba(0,0,0,0.35); animation: ktv-toast-in .25s ease;
    }
    @keyframes ktv-toast-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

    /* ---------- 一般成員視角 ---------- */
    #member-view-inner { max-width: 40rem; margin: 0 auto; padding: 1rem 1.25rem; }
    #member-now-playing-bar {
        background: var(--paper); border-radius: 1.1rem; padding: 0.85rem 1.1rem; margin-bottom: 1rem;
        font-size: 0.9rem; box-shadow: 0 4px 12px -4px rgba(58,42,30,0.08);
    }
    .member-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .member-tab {
        flex: 1; padding: 0.55rem; border-radius: 0.9rem; border: none; background: var(--paper);
        color: var(--espresso-soft); font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .member-tab.active { background: var(--jam); color: #fff; }
    .empty-hint { text-align: center; color: var(--muted); font-size: 0.82rem; padding: 1.5rem 1rem; }
</style>
</head>
<body>

    <!-- ---------- 大廳：建立或加入房間 ---------- -->
    <div id="lobby-view">
        <header>
            <h1>🎤 歡唱KTV</h1>
            <a href="index.html">← 回到 JUST DO EAT</a>
        </header>
        <div id="lobby-login-hint" class="lobby-card hidden" style="text-align:center; color:var(--espresso-soft)">請先登入才能建立/加入房間</div>
        <div class="lobby-card">
            <h2>🎉 建立新房間</h2>
            <input id="create-room-name" type="text" placeholder="房間名稱（選填）">
            <input id="create-room-passcode" type="text" placeholder="房間代碼（選填，留空任何人都能加入）">
            <button class="btn" onclick="createRoom()">建立房間</button>
        </div>
        <div class="lobby-card">
            <h2>🚪 加入房間</h2>
            <input id="join-room-code" type="text" placeholder="房號（例如 A3F9K2）" style="text-transform:uppercase">
            <input id="join-room-passcode" type="text" placeholder="房間代碼（如果房主有設定的話）">
            <button class="btn btn-outline" onclick="joinRoom()">加入房間</button>
        </div>
        <p id="lobby-status" class="text-sm" style="color:var(--muted); text-align:center; font-size:0.8rem;"></p>
    </div>

    <!-- ---------- 房間內畫面 ---------- -->
    <div id="room-view" class="hidden">

        <!-- 房主視角 -->
        <div id="host-view" class="hidden">
            <div id="room-info-bar">
                <span class="room-info-left">🎤 <span id="host-room-name"></span> · 房號 <span id="host-room-id" style="color:var(--jam)"></span></span>
                <div class="room-info-actions">
                    <button class="btn btn-outline" onclick="toggleFullscreen()">⛶ 全螢幕</button>
                    <button class="btn" style="background:var(--danger, #C4453F)" onclick="leaveRoomAsHost()">解散房間</button>
                </div>
            </div>
            <div id="fullscreen-wrapper">
                <div id="ktv-yt-player-target-wrap"><div id="ktv-yt-player-target" style="width:100%;height:100%"></div></div>
                <div id="toast-stack"></div>
                <div id="host-overlay-ui">
                    <div class="overlay-panel overlay-left">
                        <div class="overlay-tabs">
                            <button class="overlay-tab active" data-tab="search" onclick="switchOverlayTab('search')">🔍 點歌</button>
                            <button class="overlay-tab" data-tab="history" onclick="switchOverlayTab('history')">📜 歷史</button>
                            <button class="overlay-tab" data-tab="ranking" onclick="switchOverlayTab('ranking')">🔥 熱門</button>
                        </div>
                        <div id="overlay-tab-search" class="overlay-tab-content">
                            <div style="display:flex; gap:0.4rem; margin-bottom:0.6rem;">
                                <input id="host-search-input" type="text" placeholder="輸入歌名或歌手" onkeydown="if(event.key==='Enter') searchKtvSongs()">
                                <button class="btn" style="padding:0.6rem 0.9rem" onclick="searchKtvSongs()">搜尋</button>
                            </div>
                            <div id="host-search-results"></div>
                        </div>
                        <div id="overlay-tab-history" class="overlay-tab-content hidden">
                            <div id="host-history-list"></div>
                        </div>
                        <div id="overlay-tab-ranking" class="overlay-tab-content hidden">
                            <div id="host-ranking-list"></div>
                        </div>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h3>🎶 點歌佇列（可拖曳排序）</h3>
                        <div id="host-queue-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 一般成員視角：沒有播放器畫面，只有點歌+佇列 -->
        <div id="member-view" class="hidden">
            <div id="room-info-bar">
                <span class="room-info-left">🎤 <span id="member-room-name"></span></span>
                <button class="btn" style="background:var(--danger, #C4453F)" onclick="leaveRoomAsMember()">離開房間</button>
            </div>
            <div id="member-view-inner">
                <div id="member-now-playing-bar">🎵 目前歡唱：<strong id="member-now-playing-text">尚未開始，快去點一首歌吧</strong></div>

                <div class="member-tabs">
                    <button class="member-tab active" data-tab="search" onclick="switchMemberTab('search')">🔍 點歌</button>
                    <button class="member-tab" data-tab="history" onclick="switchMemberTab('history')">📜 歷史</button>
                    <button class="member-tab" data-tab="ranking" onclick="switchMemberTab('ranking')">🔥 熱門</button>
                    <button class="member-tab" data-tab="queue" onclick="switchMemberTab('queue')">🎶 佇列</button>
                </div>
                <div id="member-tab-search" class="member-tab-content">
                    <div style="display:flex; gap:0.4rem; margin-bottom:0.75rem;">
                        <input id="member-search-input" type="text" placeholder="輸入歌名或歌手" onkeydown="if(event.key==='Enter') searchKtvSongs()">
                        <button class="btn" style="padding:0.6rem 0.9rem" onclick="searchKtvSongs()">搜尋</button>
                    </div>
                    <div id="member-search-results"></div>
                </div>
                <div id="member-tab-history" class="member-tab-content hidden"><div id="member-history-list"></div></div>
                <div id="member-tab-ranking" class="member-tab-content hidden"><div id="member-ranking-list"></div></div>
                <div id="member-tab-queue" class="member-tab-content hidden"><div id="member-queue-list"></div></div>
            </div>
        </div>
    </div>

<script>
    // ---------------------------------------------------------------
    // Firebase初始化：跟主站(index.html)用同一份設定，共用同一個登入狀態
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
        authDomain: "recipe-synchronization.firebaseapp.com",
        projectId: "recipe-synchronization",
        storageBucket: "recipe-synchronization.firebasestorage.app",
        messagingSenderId: "559668909743",
        appId: "1:559668909743:web:63dc34572b98839479265a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const CLOUDFLARE_AI_PROXY_URL = 'https://baking-recipes-ai.wallcemax.workers.dev/';

    let currentUser = null;
    let currentRoomId = null;
    let currentRoomData = null;
    let isHost = false;
    let roomUnsubscribe = null;
    let prevQueueQids = [];
    let hostLastPlayedVideoId = null;

    auth.onAuthStateChanged(user => {
        currentUser = user;
        document.getElementById('lobby-login-hint').classList.toggle('hidden', !!user);
    });

    function escapeHtmlKtv(str) {
        return String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function showKtvToast(message) {
        const stack = document.getElementById('toast-stack');
        if (!stack) return;
        const el = document.createElement('div');
        el.className = 'ktv-toast';
        el.textContent = message;
        stack.appendChild(el);
        setTimeout(() => el.remove(), 4500);
    }

    // ---------------------------------------------------------------
    // 大廳：建立房間 / 加入房間。房間代碼是休閒等級的機制（像Kahoot那種房間代碼），
    // 不是真正的安全密碼保護，純文字比對，圖個方便讓不想開放的房間有基本門檻
    // ---------------------------------------------------------------
    function generateRoomCode() {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 去掉容易看錯的 I、L、O、0、1
        let code = '';
        for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return code;
    }
    async function createRoom() {
        if (!currentUser) { alert('請先登入才能建立房間'); return; }
        const name = document.getElementById('create-room-name').value.trim() || `${currentUser.displayName || '我'}的房間`;
        const passcode = document.getElementById('create-room-passcode').value.trim();
        const roomId = generateRoomCode();
        try {
            await db.collection('ktvRooms').doc(roomId).set({
                name, passcode: passcode || null,
                hostUid: currentUser.uid, hostName: currentUser.displayName || '房主',
                queue: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            enterRoom(roomId, true);
        } catch (err) {
            document.getElementById('lobby-status').textContent = '⚠️ 建立房間失敗：' + err.message;
        }
    }
    async function joinRoom() {
        if (!currentUser) { alert('請先登入才能加入房間'); return; }
        const roomId = document.getElementById('join-room-code').value.trim().toUpperCase();
        const passcode = document.getElementById('join-room-passcode').value.trim();
        if (!roomId) { alert('請輸入房號'); return; }
        const statusEl = document.getElementById('lobby-status');
        statusEl.textContent = '🔍 查詢房間中...';
        try {
            const doc = await db.collection('ktvRooms').doc(roomId).get();
            if (!doc.exists) { statusEl.textContent = '⚠️ 找不到這個房間，請確認房號是否正確'; return; }
            const room = doc.data();
            if (room.passcode && room.passcode !== passcode) { statusEl.textContent = '⚠️ 房間代碼不正確'; return; }
            statusEl.textContent = '';
            enterRoom(roomId, room.hostUid === currentUser.uid);
        } catch (err) {
            statusEl.textContent = '⚠️ 加入房間失敗：' + err.message;
        }
    }

    // ---------------------------------------------------------------
    // 進入房間：切畫面(房主/成員)，開始即時監聽房間文件
    // ---------------------------------------------------------------
    function enterRoom(roomId, asHost) {
        currentRoomId = roomId;
        isHost = asHost;
        prevQueueQids = [];
        hostLastPlayedVideoId = null;
        document.getElementById('lobby-view').classList.add('hidden');
        document.getElementById('room-view').classList.remove('hidden');
        document.getElementById(asHost ? 'host-view' : 'member-view').classList.remove('hidden');
        document.getElementById(asHost ? 'member-view' : 'host-view').classList.add('hidden');

        if (roomUnsubscribe) roomUnsubscribe();
        roomUnsubscribe = db.collection('ktvRooms').doc(roomId).onSnapshot(doc => {
            if (!doc.exists) {
                // 房主解散了房間（房間文件被刪除），所有正在這個房間裡的人都會即時收到這個通知
                alert('🎤 房間已解散');
                exitToLobby();
                return;
            }
            const data = doc.data();
            const newQueue = data.queue || [];
            // 偵測佇列裡新出現的項目（不管是誰、從哪台裝置點的），跳浮動通知
            newQueue.forEach(q => {
                if (!prevQueueQids.includes(q.qid)) showKtvToast(`🎤 ${q.requestedBy || '有人'} 點播了《${q.title}》`);
            });
            prevQueueQids = newQueue.map(q => q.qid);

            currentRoomData = data;
            renderRoomState();

            if (isHost) {
                const headVideoId = newQueue[0] && newQueue[0].videoId;
                if (headVideoId && headVideoId !== hostLastPlayedVideoId) {
                    hostLastPlayedVideoId = headVideoId;
                    playHostVideo(headVideoId);
                } else if (!headVideoId) {
                    hostLastPlayedVideoId = null;
                }
            }
        }, err => console.warn('房間監聽失敗', err));

        document.getElementById(asHost ? 'host-room-name' : 'member-room-name').textContent = '';
        if (asHost) document.getElementById('host-room-id').textContent = roomId;
        loadRankingList();
        loadHistoryList();
    }
    function exitToLobby() {
        if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
        if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; ytPlayerReady = false; }
        currentRoomId = null; currentRoomData = null; isHost = false;
        document.getElementById('room-view').classList.add('hidden');
        document.getElementById('lobby-view').classList.remove('hidden');
        document.getElementById('join-room-code').value = '';
        document.getElementById('join-room-passcode').value = '';
    }
    // 房主離開＝解散房間，所有人都會被踢出（透過上面onSnapshot偵測到文件被刪除）
    async function leaveRoomAsHost() {
        if (!confirm('確定要解散這個房間嗎？所有人都會被移出房間。')) return;
        try {
            await db.collection('ktvRooms').doc(currentRoomId).delete();
        } catch (err) {
            alert('解散房間失敗：' + err.message);
        }
        exitToLobby();
    }
    // 一般成員離開：只是自己退出，房間繼續開著給其他人用
    function leaveRoomAsMember() {
        exitToLobby();
    }

    function renderRoomState() {
        if (!currentRoomData) return;
        const nameEl = document.getElementById(isHost ? 'host-room-name' : 'member-room-name');
        if (nameEl) nameEl.textContent = currentRoomData.name || '';
        const queue = currentRoomData.queue || [];
        if (isHost) {
            renderQueueList('host-queue-list', queue, true);
        } else {
            renderQueueList('member-queue-list', queue, false);
            document.getElementById('member-now-playing-text').textContent = queue[0] ? queue[0].title : '尚未開始，快去點一首歌吧';
        }
    }

    // ---------------------------------------------------------------
    // 分頁切換（房主的疊加介面 / 一般成員的頁面）
    // ---------------------------------------------------------------
    function switchOverlayTab(tab) {
        ['search', 'history', 'ranking'].forEach(t => {
            document.getElementById(`overlay-tab-${t}`).classList.toggle('hidden', t !== tab);
        });
        document.querySelectorAll('.overlay-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'history') loadHistoryList();
        if (tab === 'ranking') loadRankingList();
    }
    function switchMemberTab(tab) {
        ['search', 'history', 'ranking', 'queue'].forEach(t => {
            document.getElementById(`member-tab-${t}`).classList.toggle('hidden', t !== tab);
        });
        document.querySelectorAll('.member-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'history') loadHistoryList();
        if (tab === 'ranking') loadRankingList();
    }
    function toggleFullscreen() {
        const el = document.getElementById('fullscreen-wrapper');
        if (document.fullscreenElement) document.exitFullscreen();
        else el.requestFullscreen().catch(err => alert('無法進入全螢幕：' + err.message));
    }

    // ---------------------------------------------------------------
    // 搜尋：不管輸入什麼，前面一律加「KTV」關鍵字，提高搜到伴唱版影片的機率
    // ---------------------------------------------------------------
    async function searchKtvSongs() {
        const input = document.getElementById(isHost ? 'host-search-input' : 'member-search-input');
        const resultsEl = document.getElementById(isHost ? 'host-search-results' : 'member-search-results');
        const query = input.value.trim();
        if (!query) return;
        resultsEl.innerHTML = '<div class="empty-hint">搜尋中...</div>';
        try {
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'youtube_search', query: `KTV ${query}` }),
            });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || `搜尋失敗(${res.status})`);
            const results = data.results || [];
            resultsEl.innerHTML = results.length ? results.map(r => {
                const songData = JSON.stringify({ videoId: r.videoId, title: r.title, thumbnail: r.thumbnail }).replace(/'/g, '&#39;');
                return `<div class="ktv-result-card">
                    <img src="${r.thumbnail || ''}" alt="">
                    <div class="info">
                        <div class="title">${escapeHtmlKtv(r.title)}</div>
                        <div class="sub">${escapeHtmlKtv(r.channelTitle || '')}</div>
                    </div>
                    <button class="ktv-add-btn" onclick='addSongToQueue(${songData})'>＋ 點歌</button>
                    <button class="ktv-insert-btn" onclick='addSongToQueue(${songData}, true)'>⚡ 插播</button>
                </div>`;
            }).join('') : '<div class="empty-hint">找不到符合的影片，換個關鍵字試試</div>';
        } catch (err) {
            resultsEl.innerHTML = `<div class="empty-hint">⚠️ ${escapeHtmlKtv(err.message)}</div>`;
        }
    }

    // ---------------------------------------------------------------
    // 點歌：加進房間佇列，同時記一筆房間歷史紀錄，並更新全域熱門排行計數
    // ---------------------------------------------------------------
    async function addSongToQueue(song, insertNext) {
        if (!currentUser) { alert('請先登入才能點歌'); return; }
        if (!currentRoomId || !currentRoomData) return;
        const entry = {
            qid: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            videoId: song.videoId, title: song.title, thumbnail: song.thumbnail || '',
            requestedBy: currentUser.displayName || '匿名', requestedByUid: currentUser.uid,
            addedAt: Date.now(),
        };
        const queue = (currentRoomData.queue || []).slice();
        if (insertNext && queue.length) queue.splice(1, 0, entry); // 插播：排在現正播放的下一首
        else queue.push(entry);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue });
            db.collection('ktvRooms').doc(currentRoomId).collection('history').add({
                videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail,
                requestedBy: entry.requestedBy, addedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }).catch(err => console.warn('寫入房間歷史紀錄失敗', err));
            db.collection('ktvGlobalSongStats').doc(entry.videoId).set({
                videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail,
                count: firebase.firestore.FieldValue.increment(1),
            }, { merge: true }).catch(err => console.warn('更新熱門排行失敗', err));
        } catch (err) {
            alert('點歌失敗：' + err.message);
        }
    }
    async function removeQueueItem(qid) {
        if (!isHost || !currentRoomData) return;
        const queue = (currentRoomData.queue || []).filter(q => q.qid !== qid);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue });
        } catch (err) { console.warn('移除歌曲失敗', err); }
    }

    // ---------------------------------------------------------------
    // 佇列渲染：房主可以拖曳排序（用Pointer Events，滑鼠/觸控都支援），一般成員唯讀
    // ---------------------------------------------------------------
    function renderQueueList(containerId, queue, draggable) {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (!queue.length) { el.innerHTML = '<div class="empty-hint">目前還沒有人點歌</div>'; return; }
        el.innerHTML = queue.map((q, i) => `
            <div class="ktv-queue-item" data-qid="${q.qid}">
                ${draggable ? `<span class="ktv-queue-drag-handle" onpointerdown="startQueueDrag(event, '${q.qid}')">⠿</span>` : ''}
                <img src="${q.thumbnail || ''}" alt="">
                <div class="info" style="flex:1; min-width:0;">
                    <div class="title">${i === 0 ? '▶ ' : ''}${escapeHtmlKtv(q.title)}</div>
                    <div class="sub">${escapeHtmlKtv(q.requestedBy || '')}點的${i === 0 ? '・現正歡唱' : ''}</div>
                </div>
                ${draggable ? `<button class="remove-btn" onclick="removeQueueItem('${q.qid}')" title="移除">✕</button>` : ''}
            </div>
        `).join('');
    }
    // 拖曳排序：用Pointer Events統一處理滑鼠跟觸控，拖完之後依畫面上最終順序整份寫回Firestore
    function startQueueDrag(e, qid) {
        if (!isHost) return;
        e.preventDefault();
        const item = e.target.closest('.ktv-queue-item');
        const list = document.getElementById('host-queue-list');
        const items = () => [...list.querySelectorAll('.ktv-queue-item')];
        item.classList.add('dragging');

        function onMove(ev) {
            const y = ev.clientY;
            const afterEl = items().find(el => {
                if (el === item) return false;
                const rect = el.getBoundingClientRect();
                return y < rect.top + rect.height / 2;
            });
            if (afterEl) list.insertBefore(item, afterEl);
            else list.appendChild(item);
        }
        function onUp() {
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            item.classList.remove('dragging');
            const newOrderQids = items().map(el => el.dataset.qid);
            const queue = currentRoomData.queue || [];
            const reordered = newOrderQids.map(id => queue.find(q => q.qid === id)).filter(Boolean);
            db.collection('ktvRooms').doc(currentRoomId).update({ queue: reordered })
                .catch(err => { console.warn('拖曳排序失敗', err); renderQueueList('host-queue-list', queue, true); });
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
    }

    // ---------------------------------------------------------------
    // 歷史點歌紀錄：這個房間點過的歌，新到舊排列
    // ---------------------------------------------------------------
    async function loadHistoryList() {
        const targets = [document.getElementById('host-history-list'), document.getElementById('member-history-list')].filter(Boolean);
        if (!targets.length || !currentRoomId) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvRooms').doc(currentRoomId).collection('history').orderBy('addedAt', 'desc').limit(30).get();
            const html = snap.empty ? '<div class="empty-hint">這個房間還沒有點歌紀錄</div>' : snap.docs.map(doc => {
                const h = doc.data();
                return `<div class="ktv-history-card">
                    <img src="${h.thumbnail || ''}" alt="">
                    <div class="info">
                        <div class="title">${escapeHtmlKtv(h.title)}</div>
                        <div class="sub">${escapeHtmlKtv(h.requestedBy || '')}</div>
                    </div>
                    <button class="ktv-add-btn" onclick='addSongToQueue(${JSON.stringify({ videoId: h.videoId, title: h.title, thumbnail: h.thumbnail }).replace(/'/g, "&#39;")})'>＋</button>
                </div>`;
            }).join('');
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // ---------------------------------------------------------------
    // 熱門點歌排行：全域累計，不分房間、不分時間，依點歌次數排序
    // ---------------------------------------------------------------
    async function loadRankingList() {
        const targets = [document.getElementById('host-ranking-list'), document.getElementById('member-ranking-list')].filter(Boolean);
        if (!targets.length) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvGlobalSongStats').orderBy('count', 'desc').limit(20).get();
            const html = snap.empty ? '<div class="empty-hint">還沒有任何點歌紀錄</div>' : snap.docs.map((doc, i) => {
                const s = doc.data();
                return `<div class="ktv-rank-card">
                    <span class="ktv-rank-badge">${i + 1}</span>
                    <img src="${s.thumbnail || ''}" alt="">
                    <div class="info">
                        <div class="title">${escapeHtmlKtv(s.title)}</div>
                        <div class="sub">被點過 ${s.count || 0} 次</div>
                    </div>
                    <button class="ktv-add-btn" onclick='addSongToQueue(${JSON.stringify({ videoId: s.videoId, title: s.title, thumbnail: s.thumbnail }).replace(/'/g, "&#39;")})'>＋</button>
                </div>`;
            }).join('');
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }

    // ---------------------------------------------------------------
    // 房主播放器：跟做菜音樂功能同一招，只用單一影片ID載入播放，這個網站上唯一確認穩定的
    // YouTube嵌入方式，完全不使用YouTube播放清單的嵌入/串接機制
    // ---------------------------------------------------------------
    let ytPlayer = null;
    let ytPlayerReady = false;
    let ytApiReadyPromise = null;
    function loadYoutubeIframeApi() {
        if (ytApiReadyPromise) return ytApiReadyPromise;
        ytApiReadyPromise = new Promise(resolve => {
            if (window.YT && window.YT.Player) { resolve(); return; }
            const prevCallback = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
                if (typeof prevCallback === 'function') prevCallback();
                resolve();
            };
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        });
        return ytApiReadyPromise;
    }
    async function playHostVideo(videoId) {
        await loadYoutubeIframeApi();
        if (!ytPlayer) {
            ytPlayer = new YT.Player('ktv-yt-player-target', {
                width: '100%', height: '100%', videoId,
                playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
                events: {
                    onReady: () => { ytPlayerReady = true; },
                    onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) advanceQueue(); },
                },
            });
        } else if (ytPlayerReady) {
            ytPlayer.loadVideoById(videoId);
        }
    }
    // 歌播完了：把佇列最前面那首拿掉，接下一首（其他裝置會透過onSnapshot同步收到變化）
    async function advanceQueue() {
        if (!currentRoomData || !currentRoomId) return;
        const newQueue = (currentRoomData.queue || []).slice(1);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue: newQueue });
        } catch (err) { console.warn('推進佇列失敗', err); }
    }
</script>
