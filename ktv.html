<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>歡唱KTV - JUST DO EAT</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
    :root {
        --cream: #FBF3E7; --paper: #FFFDF9; --espresso: #3A2A1E; --espresso-soft: #6B5847;
        --jam: #A8324A; --jam-dark: #7A1F35; --sage: #6F8C6E; --honey: #C98A2C; --line: #EFEAE0;
        --muted: #B3A492; --danger: #C4453F;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: var(--cream); color: var(--espresso);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .hidden { display: none !important; }
    input[type="text"], input[type="password"] {
        width: 100%; padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--line);
        background: var(--paper); font-size: 0.9rem; color: var(--espresso);
    }
    .btn {
        padding: 0.7rem 1.2rem; border-radius: 999px; border: none; background: var(--jam); color: #fff;
        font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-outline { background: var(--paper); color: var(--jam); border: 1px solid var(--jam); }
    .btn-danger { background: var(--danger); }
    .btn:disabled { opacity: .5; cursor: default; }

    /* ---------- 房間列表 ---------- */
    #room-list-view { max-width: 32rem; margin: 0 auto; padding: 2rem 1.25rem; }
    #room-list-view header { text-align: center; margin-bottom: 1.5rem; }
    #room-list-view header h1 { font-size: 1.6rem; margin: 0 0 0.3rem; }
    #room-list-view header a { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
    .lobby-card {
        background: var(--paper); border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.25rem;
        box-shadow: 0 10px 24px -8px rgba(58,42,30,0.12);
    }
    .lobby-card h2 { font-size: 1.05rem; margin: 0 0 0.9rem; }
    .lobby-card input { margin-bottom: 0.7rem; }
    .lobby-card .btn { width: 100%; }
    #own-room-hint {
        background: rgba(201,138,44,0.12); border-radius: 1.1rem; padding: 1rem 1.2rem; margin-bottom: 1.25rem;
        font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
    }
    .room-list-item {
        display: flex; align-items: center; gap: 0.75rem; background: var(--paper); border-radius: 1.1rem;
        padding: 0.85rem 1.1rem; margin-bottom: 0.6rem; cursor: pointer; box-shadow: 0 4px 12px -4px rgba(58,42,30,0.08);
    }
    .room-list-item:hover { background: var(--cream); }
    .room-list-item .info { flex: 1; min-width: 0; }
    .room-list-item .name { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-list-item .sub { font-size: 0.72rem; color: var(--muted); }
    .room-list-item .lock-icon { flex-shrink: 0; opacity: 0.6; }

    /* ---------- 房間內：非全螢幕時的共用列 ---------- */
    #room-info-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        padding: 0.9rem 1.25rem; background: var(--paper); flex-wrap: wrap;
    }
    #room-info-bar .room-info-left { font-size: 0.9rem; font-weight: 600; }
    #room-info-bar .room-info-actions { display: flex; gap: 0.5rem; }

    /* ---------- 房主視角：影片 + 疊加控制介面 ---------- */
    #fullscreen-wrapper {
        position: relative; width: 100%; background: #000;
        display: flex; flex-direction: column;
    }
    #ktv-yt-player-target-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    #host-overlay-ui {
        display: flex; gap: 1px; background: var(--line);
        min-height: 22rem;
    }
    .overlay-panel { background: var(--paper); padding: 1rem; overflow-y: auto; }
    .overlay-left { flex: 1.2; min-width: 0; }
    .overlay-right { flex: 1; min-width: 0; }
    .overlay-tabs { display: flex; gap: 0.35rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .overlay-tab {
        flex: 1 1 auto; min-width: 4rem; padding: 0.4rem; border-radius: 0.7rem; border: none; background: var(--cream);
        color: var(--espresso-soft); font-size: 0.72rem; font-weight: 600; cursor: pointer;
    }
    .overlay-tab.active { background: var(--jam); color: #fff; }
    .overlay-right h3 { font-size: 0.95rem; margin: 0 0 0.6rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .skip-btn { font-size: 0.68rem; padding: 0.3rem 0.6rem; border-radius: 999px; border: none; background: var(--honey); color: #fff; cursor: pointer; white-space: nowrap; }

    /* 全螢幕時：影片撐滿整個螢幕，控制面板變成「上方一條可點擊展開的資訊列」，
       預設收合、往下拉才展開，避免蓋住歌詞（歌詞通常在畫面下方，所以面板不能放下面） */
    #fullscreen-wrapper:fullscreen { width: 100vw; height: 100vh; }
    #fullscreen-wrapper:fullscreen #ktv-yt-player-target-wrap {
        position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: unset; z-index: 1;
    }
    #fullscreen-wrapper:fullscreen #host-overlay-ui {
        position: absolute; left: 0; right: 0; top: 0; bottom: auto; z-index: 3;
        background: transparent; min-height: 0; flex-direction: column; gap: 0;
    }
    #fullscreen-wrapper:not(:fullscreen) #overlay-toggle-bar { display: none; } /* 非全螢幕不需要這條收合列 */
    #overlay-toggle-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        padding: 0.7rem 1.1rem; background: rgba(20,14,10,0.65); backdrop-filter: blur(6px);
        color: #F5EBDF; font-size: 0.8rem; cursor: pointer;
    }
    #overlay-toggle-bar .room-code-badge { color: var(--honey); font-weight: 700; }
    #overlay-toggle-bar .disband-inline-btn {
        background: rgba(196,69,63,0.85); color: #fff; border: none; border-radius: 999px;
        padding: 0.3rem 0.7rem; font-size: 0.68rem; cursor: pointer; flex-shrink: 0;
    }
    #fullscreen-wrapper:fullscreen #host-overlay-body {
        max-height: 0; overflow: hidden; transition: max-height .25s ease;
    }
    #fullscreen-wrapper:fullscreen #host-overlay-ui.expanded #host-overlay-body {
        max-height: 65vh; display: flex;
    }
    #fullscreen-wrapper:fullscreen .overlay-panel {
        background: rgba(20,14,10,0.6); backdrop-filter: blur(8px); color: #F5EBDF;
    }
    #fullscreen-wrapper:fullscreen .overlay-tab { background: rgba(255,255,255,0.12); color: #F5EBDF; }
    #fullscreen-wrapper:fullscreen .overlay-tab.active { background: var(--jam); color: #fff; }
    #fullscreen-wrapper:fullscreen .overlay-right h3 { color: #F5EBDF; }
    #fullscreen-wrapper:fullscreen #toast-stack { top: 3.2rem; }
    #fullscreen-wrapper:fullscreen input[type="text"] { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.25); }
    #fullscreen-wrapper:fullscreen input[type="text"]::placeholder { color: rgba(255,255,255,0.6); }

    /* ---------- 清單卡片共用樣式 ---------- */
    .ktv-result-card, .ktv-history-card, .ktv-rank-card {
        display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 0.85rem;
        margin-bottom: 0.5rem; background: rgba(255,255,255,0.04); flex-wrap: wrap;
    }
    .ktv-result-card img, .ktv-history-card img, .ktv-rank-card img, .ktv-queue-item img {
        width: 3.2rem; height: 1.9rem; object-fit: cover; border-radius: 0.4rem; flex-shrink: 0; background: var(--line);
    }
    .ktv-result-card .info, .ktv-history-card .info, .ktv-rank-card .info { flex: 1; min-width: 0; }
    .ktv-result-card .title, .ktv-history-card .title, .ktv-rank-card .title, .ktv-queue-item .title {
        font-size: 0.78rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ktv-result-card .sub, .ktv-history-card .sub, .ktv-rank-card .sub, .ktv-queue-item .sub {
        font-size: 0.66rem; opacity: 0.65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ktv-card-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .ktv-add-btn, .ktv-insert-btn, .ktv-fav-btn {
        flex-shrink: 0; border-radius: 999px; border: none; color: #fff; cursor: pointer; font-size: 0.64rem;
        padding: 0.28rem 0.5rem; white-space: nowrap;
    }
    .ktv-add-btn { background: var(--sage); }
    .ktv-insert-btn { background: var(--honey); }
    .ktv-fav-btn { background: var(--jam); }
    .ktv-rank-badge { font-size: 0.7rem; opacity: 0.6; width: 1.3rem; flex-shrink: 0; text-align: center; }

    /* ---------- 佇列（可拖曳排序） ---------- */
    .ktv-queue-item {
        display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 0.85rem;
        margin-bottom: 0.5rem; background: rgba(255,255,255,0.04);
    }
    .ktv-queue-item.dragging { opacity: 0.4; }
    .ktv-queue-drag-handle { cursor: grab; padding: 0 0.3rem; opacity: 0.5; touch-action: none; user-select: none; }
    .ktv-queue-item .remove-btn { flex-shrink: 0; background: none; border: none; opacity: 0.5; font-size: 0.9rem; cursor: pointer; color: inherit; }

    /* ---------- 浮動通知（點歌/加入房間） ---------- */
    #toast-stack {
        position: absolute; top: 1rem; right: 1rem; z-index: 10; display: flex; flex-direction: column;
        gap: 0.5rem; max-width: 14rem; pointer-events: none;
    }
    .ktv-toast {
        background: rgba(20,14,10,0.85); color: #F5EBDF; padding: 0.55rem 0.85rem; border-radius: 0.85rem;
        font-size: 0.75rem; box-shadow: 0 10px 24px -6px rgba(0,0,0,0.35); animation: ktv-toast-in .25s ease;
    }
    @keyframes ktv-toast-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

    /* ---------- 掌聲鼓勵：疊在影片上的慶祝動畫，好幾種效果隨機挑一種 ---------- */
    #reaction-layer { position: absolute; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
    .reaction-emoji {
        position: absolute; bottom: -3rem; font-size: 2.2rem; animation: reaction-float 2.6s ease-in forwards;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    @keyframes reaction-float {
        0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.6); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: translateY(-90vh) translateX(var(--drift, 0px)) rotate(var(--spin, 20deg)) scale(1.1); opacity: 0; }
    }
    #reaction-banner {
        position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0.7); z-index: 9;
        font-size: 2.4rem; font-weight: 800; color: #fff; text-shadow: 0 4px 16px rgba(0,0,0,0.5);
        opacity: 0; pointer-events: none; text-align: center;
    }
    #reaction-banner.show { animation: reaction-banner-pop 1.6s ease-out forwards; }
    @keyframes reaction-banner-pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        35% { transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* ---------- 一般成員視角 ---------- */
    #member-view-inner { max-width: 40rem; margin: 0 auto; padding: 1rem 1.25rem; }
    #member-now-playing-bar {
        background: var(--paper); border-radius: 1.1rem; padding: 0.85rem 1.1rem; margin-bottom: 1rem;
        font-size: 0.9rem; box-shadow: 0 4px 12px -4px rgba(58,42,30,0.08); display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
    }
    #applause-btn {
        background: var(--jam); color: #fff; border: none; border-radius: 999px; padding: 0.5rem 1rem;
        font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .member-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .member-tab {
        flex: 1 1 auto; min-width: 4.2rem; padding: 0.5rem; border-radius: 0.9rem; border: none; background: var(--paper);
        color: var(--espresso-soft); font-size: 0.74rem; font-weight: 600; cursor: pointer;
    }
    .member-tab.active { background: var(--jam); color: #fff; }
    .empty-hint { text-align: center; color: var(--muted); font-size: 0.82rem; padding: 1.5rem 1rem; }

    /* ---------- 密碼輸入小視窗 ---------- */
    #passcode-modal-backdrop {
        position: fixed; inset: 0; background: rgba(58,42,30,0.4); z-index: 50;
        display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    }
    #passcode-modal { background: var(--paper); border-radius: 1.5rem; padding: 1.5rem; width: 100%; max-width: 22rem; }
    #passcode-modal h3 { margin: 0 0 0.75rem; font-size: 1.05rem; }
    #passcode-modal input { margin-bottom: 1rem; }
    #passcode-modal .btn-row { display: flex; gap: 0.6rem; }
    #passcode-modal .btn-row .btn { flex: 1; }
</style>
</head>
<body>

    <!-- ---------- 房間列表：建立新房間 / 目前存在的房間清單 ---------- -->
    <div id="room-list-view">
        <header>
            <h1>🎤 歡唱KTV</h1>
            <a href="index.html">← 回到 JUST DO EAT</a>
        </header>
        <div id="lobby-login-hint" class="lobby-card hidden" style="text-align:center; color:var(--espresso-soft)">請先登入才能建立/加入房間</div>

        <!-- 已經有房間在開的時候顯示這個，取代建立房間的表單。這個區塊改用即時監聽，
             不管你是用哪台裝置建立的房間，所有裝置上的這個頁面都會馬上反映出來 -->
        <div id="own-room-hint" class="hidden">
            <span>🎤 你已經有一個進行中的房間：<strong id="own-room-name"></strong>，請先解散才能建立新房間</span>
            <button class="btn" onclick="rejoinOwnRoom()">前往我的房間</button>
        </div>

        <div id="create-room-card" class="lobby-card">
            <h2>🎉 建立新房間</h2>
            <input id="create-room-name" type="text" placeholder="房間名稱（選填）">
            <input id="create-room-passcode" type="text" placeholder="房間代碼（選填，留空任何人都能加入）">
            <button class="btn" onclick="createRoom()">建立房間</button>
        </div>

        <div class="lobby-card">
            <h2>🚪 目前開著的房間</h2>
            <div id="room-list-container"><p class="empty-hint">載入中...</p></div>
        </div>
        <p id="lobby-status" style="color:var(--muted); text-align:center; font-size:0.8rem;"></p>
    </div>

    <!-- 加入有密碼的房間時跳出來輸入密碼 -->
    <div id="passcode-modal-backdrop" class="hidden">
        <div id="passcode-modal">
            <h3>🔒 這個房間需要代碼</h3>
            <input id="passcode-modal-input" type="text" placeholder="輸入房間代碼">
            <div class="btn-row">
                <button class="btn" onclick="confirmJoinWithPasscode()">加入</button>
                <button class="btn btn-outline" onclick="closePasscodeModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- ---------- 房間內畫面 ---------- -->
    <div id="room-view" class="hidden">

        <!-- 房主視角 -->
        <div id="host-view" class="hidden">
            <div id="room-info-bar">
                <span class="room-info-left">🎤 <span id="host-room-name"></span> · 房號 <span id="host-room-id" style="color:var(--jam)"></span> · 👥 <span id="host-member-count">1</span>人</span>
                <div class="room-info-actions">
                    <button class="btn btn-outline" onclick="toggleFullscreen()">⛶ 全螢幕</button>
                    <button class="btn btn-danger" onclick="leaveRoomAsHost()">解散房間</button>
                </div>
            </div>
            <div id="fullscreen-wrapper">
                <div id="ktv-yt-player-target-wrap"><div id="ktv-yt-player-target" style="width:100%;height:100%"></div></div>
                <div id="reaction-layer"></div>
                <div id="reaction-banner"></div>
                <div id="toast-stack"></div>
                <div id="host-overlay-ui">
                    <div id="overlay-toggle-bar">
                        <span onclick="toggleOverlayExpanded()" style="flex:1; cursor:pointer;">🎤 <span id="overlay-room-name"></span> · 房號 <span class="room-code-badge" id="overlay-room-id"></span> · 👥 <span id="overlay-member-count">1</span>人 · <span id="overlay-toggle-icon">▼ 點歌／佇列</span></span>
                        <button class="disband-inline-btn" onclick="leaveRoomAsHost()">解散房間</button>
                    </div>
                    <div id="host-overlay-body">
                    <div class="overlay-panel overlay-left">
                        <div class="overlay-tabs">
                            <button class="overlay-tab active" data-tab="search" onclick="switchOverlayTab('search')">🔍點歌</button>
                            <button class="overlay-tab" data-tab="history" onclick="switchOverlayTab('history')">📜歷史</button>
                            <button class="overlay-tab" data-tab="ranking" onclick="switchOverlayTab('ranking')">🔥熱門</button>
                            <button class="overlay-tab" data-tab="myhistory" onclick="switchOverlayTab('myhistory')">📗我的</button>
                            <button class="overlay-tab" data-tab="favorites" onclick="switchOverlayTab('favorites')">⭐最愛</button>
                        </div>
                        <div id="overlay-tab-search" class="overlay-tab-content">
                            <div style="display:flex; gap:0.4rem; margin-bottom:0.6rem;">
                                <input id="host-search-input" type="text" placeholder="輸入歌名或歌手" onkeydown="if(event.key==='Enter') searchKtvSongs()">
                                <button class="btn" style="padding:0.6rem 0.9rem" onclick="searchKtvSongs()">搜尋</button>
                            </div>
                            <div id="host-search-results"></div>
                        </div>
                        <div id="overlay-tab-history" class="overlay-tab-content hidden"><div id="host-history-list"></div></div>
                        <div id="overlay-tab-ranking" class="overlay-tab-content hidden"><div id="host-ranking-list"></div></div>
                        <div id="overlay-tab-myhistory" class="overlay-tab-content hidden"><div id="host-myhistory-list"></div></div>
                        <div id="overlay-tab-favorites" class="overlay-tab-content hidden"><div id="host-favorites-list"></div></div>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h3>🎶 點歌佇列 <button class="skip-btn" onclick="advanceQueue()">⏭ 切歌</button></h3>
                        <div id="host-queue-list"></div>
                    </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 一般成員視角：純點歌遙控器，沒有播放畫面（因為畫面不會跟房主同步） -->
        <div id="member-view" class="hidden">
            <div id="room-info-bar">
                <span class="room-info-left">🎤 <span id="member-room-name"></span></span>
                <button class="btn btn-danger" onclick="leaveRoomAsMember()">離開房間</button>
            </div>
            <div id="member-view-inner">
                <div id="member-now-playing-bar">
                    <span>🎵 目前歡唱：<strong id="member-now-playing-text">尚未開始，快去點一首歌吧</strong></span>
                    <button id="applause-btn" onclick="sendApplause()">👏 掌聲鼓勵</button>
                </div>

                <div class="member-tabs">
                    <button class="member-tab active" data-tab="queue" onclick="switchMemberTab('queue')">🎶佇列</button>
                    <button class="member-tab" data-tab="search" onclick="switchMemberTab('search')">🔍點歌</button>
                    <button class="member-tab" data-tab="history" onclick="switchMemberTab('history')">📜歷史</button>
                    <button class="member-tab" data-tab="ranking" onclick="switchMemberTab('ranking')">🔥熱門</button>
                    <button class="member-tab" data-tab="myhistory" onclick="switchMemberTab('myhistory')">📗我的</button>
                    <button class="member-tab" data-tab="favorites" onclick="switchMemberTab('favorites')">⭐最愛</button>
                </div>
                <div id="member-tab-queue" class="member-tab-content"><div id="member-queue-list"></div></div>
                <div id="member-tab-search" class="member-tab-content hidden">
                    <div style="display:flex; gap:0.4rem; margin-bottom:0.75rem;">
                        <input id="member-search-input" type="text" placeholder="輸入歌名或歌手" onkeydown="if(event.key==='Enter') searchKtvSongs()">
                        <button class="btn" style="padding:0.6rem 0.9rem" onclick="searchKtvSongs()">搜尋</button>
                    </div>
                    <div id="member-search-results"></div>
                </div>
                <div id="member-tab-history" class="member-tab-content hidden"><div id="member-history-list"></div></div>
                <div id="member-tab-ranking" class="member-tab-content hidden"><div id="member-ranking-list"></div></div>
                <div id="member-tab-myhistory" class="member-tab-content hidden"><div id="member-myhistory-list"></div></div>
                <div id="member-tab-favorites" class="member-tab-content hidden"><div id="member-favorites-list"></div></div>
            </div>
        </div>
    </div>

<script>
    // ---------------------------------------------------------------
    // Firebase初始化：跟主站(index.html)用同一份設定，共用同一個登入狀態
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
        authDomain: "recipe-synchronization.firebaseapp.com",

    const auth = firebase.auth();

    const CLOUDFLARE_AI_PROXY_URL = 'https://baking-recipes-ai.wallcemax.workers.dev/';

    let currentUser = null;
    let currentRoomId = null;
    let currentRoomData = null;
    let isHost = false;
    let roomUnsubscribe = null;
    let membersUnsubscribe = null;
    let reactionsUnsubscribe = null;
    let ownRoomUnsubscribe = null;

    let prevMemberUids = [];

    function escapeHtmlKtv(str) {
        return String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function showKtvToast(message) {
        const stack = document.getElementById('toast-stack');
        if (!stack) return;
        const el = document.createElement('div');
        el.className = 'ktv-toast';
        el.textContent = message;
        stack.appendChild(el);
        setTimeout(() => el.remove(), 4500);
    }

    // ---------------------------------------------------------------
    // 房間列表：顯示目前所有開著的房間＋人數＋是否需要密碼；同時「即時監聽」自己是不是已經
    // 有一個進行中的房間——之前這裡是只查一次的get()，如果你在別的裝置建立了房間，這個頁面
    // 沒有重新整理就不會發現，變成同一個帳號可以在兩台裝置各開一間房間。改成onSnapshot即時監聽，
    // 不管從哪個裝置建立/解散房間，所有分頁都會馬上反映最新狀態
    // ---------------------------------------------------------------
    function watchOwnRoom() {
        if (ownRoomUnsubscribe) ownRoomUnsubscribe();
        ownRoomUnsubscribe = db.collection('ktvRooms').where('hostUid', '==', currentUser.uid).limit(1)
            .onSnapshot(snap => {
                const hint = document.getElementById('own-room-hint');
                const createCard = document.getElementById('create-room-card');
                if (!snap.empty) {
                    const room = snap.docs[0].data();
                    document.getElementById('own-room-name').textContent = room.name || '';
                    hint.classList.remove('hidden');
                    createCard.classList.add('hidden');
                    hint.dataset.roomId = snap.docs[0].id;
                } else {
                    hint.classList.add('hidden');
                    createCard.classList.remove('hidden');
                }
            }, err => console.warn('監聽自己的房間失敗', err));
    }
    function rejoinOwnRoom() {
        const roomId = document.getElementById('own-room-hint').dataset.roomId;
        if (roomId) enterRoom(roomId, true);
    }
    function loadRoomList() {
        db.collection('ktvRooms').orderBy('createdAt', 'desc').onSnapshot(snap => {
            const container = document.getElementById('room-list-container');
            if (snap.empty) { container.innerHTML = '<p class="empty-hint">目前沒有開著的房間，建立一個新的吧</p>'; return; }
            container.innerHTML = snap.docs.map(doc => {
                const room = doc.data();
                const roomId = doc.id;
                return `<div class="room-list-item" onclick="tryJoinRoom('${roomId}')">
                    <div class="info">
                        <div class="name">${escapeHtmlKtv(room.name || roomId)}</div>
                        <div class="sub">房主：${escapeHtmlKtv(room.hostName || '')} · 👥 ${room.memberCount || 0}人</div>
                    </div>
                    ${room.passcode ? '<span class="lock-icon">🔒</span>' : ''}
                </div>`;
            }).join('');
        }, err => console.warn('讀取房間列表失敗', err));
    }
    // 點房間列表項目：沒密碼直接加入，有密碼跳出密碼輸入視窗
    async function tryJoinRoom(roomId) {
        if (!currentUser) { alert('請先登入才能加入房間'); return; }
        try {
            const doc = await db.collection('ktvRooms').doc(roomId).get();
            if (!doc.exists) { alert('這個房間剛剛已經被解散了'); return; }
            const room = doc.data();
            if (room.passcode) {
                pendingJoinRoomId = roomId;
                document.getElementById('passcode-modal-input').value = '';
                document.getElementById('passcode-modal-backdrop').classList.remove('hidden');
            } else {
                enterRoom(roomId, room.hostUid === currentUser.uid);
            }
        } catch (err) {
            alert('加入房間失敗：' + err.message);
        }
    }
    async function confirmJoinWithPasscode() {
        const input = document.getElementById('passcode-modal-input').value.trim();
        const roomId = pendingJoinRoomId;
        try {
            const doc = await db.collection('ktvRooms').doc(roomId).get();
            if (!doc.exists) { alert('這個房間剛剛已經被解散了'); closePasscodeModal(); return; }
            const room = doc.data();
            if (room.passcode !== input) { alert('房間代碼不正確'); return; }
            closePasscodeModal();
            enterRoom(roomId, room.hostUid === currentUser.uid);
        } catch (err) {
            alert('加入房間失敗：' + err.message);
        }
    }
    function closePasscodeModal() {
        document.getElementById('passcode-modal-backdrop').classList.add('hidden');
        pendingJoinRoomId = null;
    }

    function generateRoomCode() {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 去掉容易看錯的 I、L、O、0、1
        let code = '';
        for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return code;
    }
    async function createRoom() {
        if (!currentUser) { alert('請先登入才能建立房間'); return; }
        const name = document.getElementById('create-room-name').value.trim() || `${currentUser.displayName || '我'}的房間`;
        const passcode = document.getElementById('create-room-passcode').value.trim();
        const roomId = generateRoomCode();
        try {
            await db.collection('ktvRooms').doc(roomId).set({
                name, passcode: passcode || null,
                hostUid: currentUser.uid, hostName: currentUser.displayName || '房主',
                queue: [], memberCount: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            enterRoom(roomId, true);
        } catch (err) {
            document.getElementById('lobby-status').textContent = '⚠️ 建立房間失敗：' + err.message;
        }
    }

    // ---------------------------------------------------------------
    // 進入房間：切畫面(房主/成員)，加入成員名單(memberCount+1，房主自己也會被計入)，
    // 開始即時監聽房間文件+成員名單+掌聲反應
    // ---------------------------------------------------------------
    async function enterRoom(roomId, asHost) {
        currentRoomId = roomId;
        isHost = asHost;
        prevQueueQids = [];
        prevMemberUids = [];
        hostLastPlayedVideoId = null;
        document.getElementById('room-list-view').classList.add('hidden');
        document.getElementById('room-view').classList.remove('hidden');
        document.getElementById(asHost ? 'host-view' : 'member-view').classList.remove('hidden');
        document.getElementById(asHost ? 'member-view' : 'host-view').classList.add('hidden');

        // 把自己（不管房主還是一般成員）寫進這個房間的成員名單，離開時會再刪掉。
        // 用await確保這一步真的完成、也把錯誤印出來，方便之後如果人數異常可以從Console查
        try {
            await db.collection('ktvRooms').doc(roomId).collection('members').doc(currentUser.uid)
                .set({ uid: currentUser.uid, name: currentUser.displayName || '匿名', joinedAt: firebase.firestore.FieldValue.serverTimestamp() });
            await db.collection('ktvRooms').doc(roomId).update({ memberCount: firebase.firestore.FieldValue.increment(1) });
        } catch (err) {
            console.error('加入成員名單失敗', err);
        }

        if (roomUnsubscribe) roomUnsubscribe();
        roomUnsubscribe = db.collection('ktvRooms').doc(roomId).onSnapshot(doc => {
            if (!doc.exists) {
                alert('🎤 房間已解散');
                exitToLobby();
                return;
            }
            const data = doc.data();
            const newQueue = data.queue || [];
            newQueue.forEach(q => {
                if (!prevQueueQids.includes(q.qid)) showKtvToast(`🎤 ${q.requestedBy || '有人'} 點播了《${q.title}》`);
            });
            prevQueueQids = newQueue.map(q => q.qid);

            currentRoomData = data;
            renderRoomState();

            if (isHost) {
                const headVideoId = newQueue[0] && newQueue[0].videoId;
                if (headVideoId && headVideoId !== hostLastPlayedVideoId) {
                    hostLastPlayedVideoId = headVideoId;
                    playHostVideo(headVideoId);
                } else if (!headVideoId) {
                    hostLastPlayedVideoId = null;
                }
            }
        }, err => console.warn('房間監聽失敗', err));

        // 成員名單監聽：算目前人數（不管房主還是成員都算在內）、偵測新加入的人
        if (membersUnsubscribe) membersUnsubscribe();
        membersUnsubscribe = db.collection('ktvRooms').doc(roomId).collection('members').onSnapshot(snap => {
            const uids = snap.docs.map(d => d.id);
            if (isHost) {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added' && !prevMemberUids.includes(change.doc.id) && change.doc.id !== currentUser.uid) {
                        showKtvToast(`👋 ${change.doc.data().name || '有人'} 已加入房間`);
                    }
                });
            }
            prevMemberUids = uids;
            const countText = String(snap.size);
            ['host-member-count', 'overlay-member-count'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = countText; });
        }, err => console.warn('成員名單監聽失敗', err));

        // 掌聲鼓勵反應：只有房主端需要監聽並觸發畫面上的動畫
        if (isHost) {
            if (reactionsUnsubscribe) reactionsUnsubscribe();
            let reactionsFirstLoad = true;
            reactionsUnsubscribe = db.collection('ktvRooms').doc(roomId).collection('reactions').onSnapshot(snap => {
                if (reactionsFirstLoad) { reactionsFirstLoad = false; return; } // 剛進房間時舊的反應不要重播一次
                snap.docChanges().forEach(change => {
                    if (change.type === 'added') playReactionAnimation(change.doc.data());
                });
            }, err => console.warn('掌聲反應監聽失敗', err));
        }

        document.getElementById(asHost ? 'host-room-name' : 'member-room-name').textContent = '';
        if (asHost) {
            document.getElementById('host-room-id').textContent = roomId;
            document.getElementById('overlay-room-id').textContent = roomId;
            // 房主建立/進入房間後自動全螢幕，需要使用者手勢才能觸發，這裡緊接在建立房間的點擊事件內，
            // 大部分瀏覽器允許在使用者互動後的同一輪呼叫鏈裡要求全螢幕
            const wrapper = document.getElementById('fullscreen-wrapper');
            wrapper.requestFullscreen().catch(() => {}); // 失敗就算了（例如瀏覽器政策不允許），不用跳錯誤打斷使用者
        }
        loadRankingList();
        loadHistoryList();
        loadMyHistoryList();
        loadFavoritesList();
    }
    function exitToLobby() {
        if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
        if (membersUnsubscribe) { membersUnsubscribe(); membersUnsubscribe = null; }
        if (reactionsUnsubscribe) { reactionsUnsubscribe(); reactionsUnsubscribe = null; }
        leaveMemberRecord();
        if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; ytPlayerReady = false; }
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        currentRoomId = null; currentRoomData = null; isHost = false;
        document.getElementById('room-view').classList.add('hidden');
        document.getElementById('room-list-view').classList.remove('hidden');
    }
    // 把自己從成員名單移除、人數減一。這是「盡力而為」的機制：正常按離開房間會確實執行，
    // 但如果使用者直接關掉分頁/瀏覽器，這段程式碼可能來不及跑完，人數統計偶爾可能因此出現誤差，
    // 這是純前端＋Firestore（沒有像即時資料庫那種onDisconnect機制）架構下難以完全避免的限制
    function leaveMemberRecord() {
        if (!currentRoomId || !currentUser) return;
        const roomId = currentRoomId;
        db.collection('ktvRooms').doc(roomId).collection('members').doc(currentUser.uid).delete()
            .then(() => db.collection('ktvRooms').doc(roomId).update({ memberCount: firebase.firestore.FieldValue.increment(-1) }))
            .catch(err => console.warn('移除成員名單失敗', err));
    }
    window.addEventListener('beforeunload', leaveMemberRecord);

    // 房主離開＝解散房間，所有人都會被踢出（透過上面onSnapshot偵測到文件被刪除）
    async function leaveRoomAsHost() {
        if (!confirm('確定要解散這個房間嗎？所有人都會被移出房間。')) return;
        try {
            await db.collection('ktvRooms').doc(currentRoomId).delete();
        } catch (err) {
            alert('解散房間失敗：' + err.message);
        }
        exitToLobby();
    }
    // 一般成員離開：只是自己退出，房間繼續開著給其他人用

    function renderRoomState() {
        if (!currentRoomData) return;
        const nameEl = document.getElementById(isHost ? 'host-room-name' : 'member-room-name');
        if (nameEl) nameEl.textContent = currentRoomData.name || '';
        const overlayNameEl = document.getElementById('overlay-room-name');
        if (overlayNameEl) overlayNameEl.textContent = currentRoomData.name || '';
        const queue = currentRoomData.queue || [];
        if (isHost) {
            renderQueueList('host-queue-list', queue, true);
        } else {
            renderQueueList('member-queue-list', queue, false);

    // ---------------------------------------------------------------
    // 房主全螢幕疊加介面：頂端一條收合列，點擊展開/收合搜尋+歷史+熱門+佇列面板，
    // 預設收合，避免遮住畫面下方常見的歌詞顯示區域
    // ---------------------------------------------------------------
    function toggleOverlayExpanded() {

    function switchOverlayTab(tab) {

    function switchMemberTab(tab) {

            document.getElementById(`member-tab-${t}`).classList.toggle('hidden', t !== tab);

        document.querySelectorAll('.member-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

        if (tab === 'ranking') loadRankingList();

    function toggleFullscreen() {
        const el = document.getElementById('fullscreen-wrapper');
        if (document.fullscreenElement) document.exitFullscreen();
        else el.requestFullscreen().catch(err => alert('無法進入全螢幕：' + err.message));

    // ---------------------------------------------------------------
    // 掌聲鼓勵：成員按下去，寫一筆反應事件到房間的reactions子集合，房主端監聽到就在
    // 播放畫面上疊一個動畫。準備好幾種不同的動畫效果，每次隨機挑一種，不會每次都一樣
    // ---------------------------------------------------------------
    const REACTION_TYPES = [
        { emojis: ['👏','👏','👏','👏'], banner: '👏 掌聲鼓勵 👏' },
        { emojis: ['🎉','🎊','✨','🎉'], banner: '🎉 太棒了！ 🎉' },
        { emojis: ['❤️','💕','💖','❤️'], banner: '❤️ 唱得真好 ❤️' },
        { emojis: ['🔥','🔥','🔥','🔥'], banner: '🔥 神級演出 🔥' },
        { emojis: ['⭐','🌟','✨','⭐'], banner: '⭐ 安可安可 ⭐' },
    ];
    async function sendApplause() {
        if (!currentUser || !currentRoomId) return;
        const typeIndex = Math.floor(Math.random() * REACTION_TYPES.length);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).collection('reactions').add({
                uid: currentUser.uid, name: currentUser.displayName || '有人',
                typeIndex, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
        } catch (err) { console.warn('送出掌聲失敗', err); }
    }
    function playReactionAnimation(reaction) {
        const type = REACTION_TYPES[reaction.typeIndex] || REACTION_TYPES[0];
        const layer = document.getElementById('reaction-layer');
        const banner = document.getElementById('reaction-banner');
        if (!layer || !banner) return;
        // 一批表情符號從畫面底部往上飄，每個位置/飄移方向/速度都隨機一點，看起來比較自然
        for (let i = 0; i < 16; i++) {
            const el = document.createElement('span');
            el.className = 'reaction-emoji';
            el.textContent = type.emojis[Math.floor(Math.random() * type.emojis.length)];
            el.style.left = `${Math.random() * 90 + 3}%`;
            el.style.setProperty('--drift', `${(Math.random() - 0.5) * 160}px`);
            el.style.setProperty('--spin', `${(Math.random() - 0.5) * 60}deg`);
            el.style.animationDelay = `${Math.random() * 0.6}s`;
            el.style.fontSize = `${1.6 + Math.random() * 1.4}rem`;
            layer.appendChild(el);
            setTimeout(() => el.remove(), 3400);
        }
        banner.textContent = `${type.banner}（${reaction.name || '有人'}）`;
        banner.classList.remove('show');
        void banner.offsetWidth; // 強制觸發reflow，讓同一個動畫可以連續重複播放
        banner.classList.add('show');
    }

    // ---------------------------------------------------------------
    // 搜尋：不管輸入什麼，前面一律加「KTV」關鍵字，提高搜到伴唱版影片的機率
    // ---------------------------------------------------------------
    async function searchKtvSongs() {
        const input = document.getElementById(isHost ? 'host-search-input' : 'member-search-input');
        const resultsEl = document.getElementById(isHost ? 'host-search-results' : 'member-search-results');
        const query = input.value.trim();
        if (!query) return;
        resultsEl.innerHTML = '<div class="empty-hint">搜尋中...</div>';
        try {
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'youtube_search', query: `KTV ${query}` }),
            });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || `搜尋失敗(${res.status})`);
            const results = data.results || [];
            resultsEl.innerHTML = results.length ? results.map(r => buildSongCard(r, 'result')).join('') : '<div class="empty-hint">找不到符合的影片，換個關鍵字試試</div>';
        } catch (err) {
            resultsEl.innerHTML = `<div class="empty-hint">⚠️ ${escapeHtmlKtv(err.message)}</div>`;
        }
    }

    // ---------------------------------------------------------------
    // 統一的歌曲卡片產生器：搜尋結果/歷史/熱門排行/我的歷史/我的最愛都共用這個，
    // 一致提供「加入佇列」「插播」「收藏」三個動作按鈕（收藏可以切換收藏/取消收藏）
    // ---------------------------------------------------------------
    function buildSongCard(song, kind, extra) {
        const songData = JSON.stringify({ videoId: song.videoId, title: song.title, thumbnail: song.thumbnail }).replace(/'/g, '&#39;');
        const isFav = userFavoriteVideoIds.has(song.videoId);
        const favBtn = `<button class="ktv-fav-btn" onclick='toggleFavoriteSong(${songData})' title="${isFav ? '取消收藏' : '收藏這首歌'}">${isFav ? '💛' : '⭐'}</button>`;
        let subText = '';
        if (kind === 'result') subText = escapeHtmlKtv(song.channelTitle || '');
        else if (kind === 'history' || kind === 'myhistory') subText = escapeHtmlKtv(song.requestedBy || '');
        else if (kind === 'ranking') subText = `被點過 ${song.count || 0} 次`;
        else if (kind === 'favorite') subText = '我收藏的歌';
        const rankBadge = extra && extra.rank ? `<span class="ktv-rank-badge">${extra.rank}</span>` : '';
        return `<div class="ktv-result-card">
            ${rankBadge}
            <img src="${song.thumbnail || ''}" alt="">
            <div class="info">
                <div class="title">${escapeHtmlKtv(song.title)}</div>
                <div class="sub">${subText}</div>
            </div>
            <div class="ktv-card-actions">
                <button class="ktv-add-btn" onclick='addSongToQueue(${songData})'>＋</button>
                <button class="ktv-insert-btn" onclick='addSongToQueue(${songData}, true)'>⚡</button>
                ${favBtn}
            </div>
        </div>`;
    }

    // ---------------------------------------------------------------
    // 點歌：加進房間佇列，同時記一筆房間歷史紀錄（含自己的uid，之後「我的歷史」分頁靠這個過濾），
    // 並更新全域熱門排行計數
    // ---------------------------------------------------------------
    async function addSongToQueue(song, insertNext) {
        if (!currentUser) { alert('請先登入才能點歌'); return; }
        if (!currentRoomId || !currentRoomData) return;
        const entry = {
            qid: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            videoId: song.videoId, title: song.title, thumbnail: song.thumbnail || '',
            requestedBy: currentUser.displayName || '匿名', requestedByUid: currentUser.uid,
            addedAt: Date.now(),
        };
        const queue = (currentRoomData.queue || []).slice();
        if (insertNext && queue.length) queue.splice(1, 0, entry); // 插播：排在現正播放的下一首
        else queue.push(entry);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue });
            db.collection('ktvRooms').doc(currentRoomId).collection('history').add({
                videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail,
                requestedBy: entry.requestedBy, requestedByUid: entry.requestedByUid,
                addedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }).catch(err => console.warn('寫入房間歷史紀錄失敗', err));
            db.collection('ktvGlobalSongStats').doc(entry.videoId).set({
                videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail,
                count: firebase.firestore.FieldValue.increment(1),
            }, { merge: true }).catch(err => console.warn('更新熱門排行失敗', err));
        } catch (err) {
            alert('點歌失敗：' + err.message);
        }
    }
    async function removeQueueItem(qid) {
        if (!isHost || !currentRoomData) return;
        const queue = (currentRoomData.queue || []).filter(q => q.qid !== qid);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue });
        } catch (err) { console.warn('移除歌曲失敗', err); }
    }

    // ---------------------------------------------------------------
    // 佇列渲染：房主可以拖曳排序（用Pointer Events，滑鼠/觸控都支援），一般成員唯讀
    // ---------------------------------------------------------------
    function renderQueueList(containerId, queue, draggable) {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (!queue.length) { el.innerHTML = '<div class="empty-hint">目前還沒有人點歌</div>'; return; }
        el.innerHTML = queue.map((q, i) => `
            <div class="ktv-queue-item" data-qid="${q.qid}">
                ${draggable ? `<span class="ktv-queue-drag-handle" onpointerdown="startQueueDrag(event, '${q.qid}')">⠿</span>` : ''}
                <img src="${q.thumbnail || ''}" alt="">
                <div class="info" style="flex:1; min-width:0;">
                    <div class="title">${i === 0 ? '▶ ' : ''}${escapeHtmlKtv(q.title)}</div>
                    <div class="sub">${escapeHtmlKtv(q.requestedBy || '')}點的${i === 0 ? '・現正歡唱' : ''}</div>
                </div>
                ${draggable ? `<button class="remove-btn" onclick="removeQueueItem('${q.qid}')" title="移除">✕</button>` : ''}
            </div>
        `).join('');
    }
    // 拖曳排序：用Pointer Events統一處理滑鼠跟觸控，拖完之後依畫面上最終順序整份寫回Firestore
    function startQueueDrag(e, qid) {
        if (!isHost) return;
        e.preventDefault();
        const item = e.target.closest('.ktv-queue-item');
        const list = document.getElementById('host-queue-list');
        const items = () => [...list.querySelectorAll('.ktv-queue-item')];
        item.classList.add('dragging');

        function onMove(ev) {
            const y = ev.clientY;
            const afterEl = items().find(el => {
                if (el === item) return false;
                const rect = el.getBoundingClientRect();
                return y < rect.top + rect.height / 2;
            });
            if (afterEl) list.insertBefore(item, afterEl);
            else list.appendChild(item);
        }
        function onUp() {
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            item.classList.remove('dragging');
            const newOrderQids = items().map(el => el.dataset.qid);
            const queue = currentRoomData.queue || [];
            const reordered = newOrderQids.map(id => queue.find(q => q.qid === id)).filter(Boolean);
            db.collection('ktvRooms').doc(currentRoomId).update({ queue: reordered })
                .catch(err => { console.warn('拖曳排序失敗', err); renderQueueList('host-queue-list', queue, true); });
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
    }

    // ---------------------------------------------------------------
    // 歷史點歌紀錄：這個房間點過的歌，新到舊排列；支援插播
    // ---------------------------------------------------------------
    async function loadHistoryList() {
        const targets = [document.getElementById('host-history-list'), document.getElementById('member-history-list')].filter(Boolean);
        if (!targets.length || !currentRoomId) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvRooms').doc(currentRoomId).collection('history').orderBy('addedAt', 'desc').limit(30).get();
            const html = snap.empty ? '<div class="empty-hint">這個房間還沒有點歌紀錄</div>' : snap.docs.map(doc => buildSongCard(doc.data(), 'history')).join('');
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // 我的歷史：只顯示自己點過的（用房間歷史紀錄裡的requestedByUid過濾，不用另外開一個collection）
    async function loadMyHistoryList() {
        const targets = [document.getElementById('host-myhistory-list'), document.getElementById('member-myhistory-list')].filter(Boolean);
        if (!targets.length || !currentRoomId || !currentUser) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvRooms').doc(currentRoomId).collection('history')
                .where('requestedByUid', '==', currentUser.uid).get();
            const docs = snap.docs.map(d => d.data());
            docs.sort((a, b) => {
                const toMillis = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : 0;
                return toMillis(b.addedAt) - toMillis(a.addedAt);
            });
            const html = docs.length ? docs.map(d => buildSongCard(d, 'myhistory')).join('') : '<div class="empty-hint">你在這個房間還沒點過歌</div>';
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // ---------------------------------------------------------------
    // 熱門點歌排行：全域累計，不分房間、不分時間，依點歌次數排序；支援插播
    // ---------------------------------------------------------------
    async function loadRankingList() {
        const targets = [document.getElementById('host-ranking-list'), document.getElementById('member-ranking-list')].filter(Boolean);
        if (!targets.length) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvGlobalSongStats').orderBy('count', 'desc').limit(20).get();
            const html = snap.empty ? '<div class="empty-hint">還沒有任何點歌紀錄</div>' : snap.docs.map((doc, i) => buildSongCard(doc.data(), 'ranking', { rank: i + 1 })).join('');
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // ---------------------------------------------------------------
    // 個人最愛歌曲：不分房間，跨房間持續保存，房主/成員都能用
    // ---------------------------------------------------------------
    async function loadUserFavoriteIds() {
        if (!currentUser) return;
        try {
            const snap = await db.collection('ktvUserFavorites').where('uid', '==', currentUser.uid).get();
            userFavoriteVideoIds = new Set(snap.docs.map(d => d.data().videoId));
        } catch (err) { console.warn('讀取收藏清單失敗', err); }
    }
    async function toggleFavoriteSong(song) {
        if (!currentUser) { alert('請先登入才能收藏歌曲'); return; }
        const docId = `${currentUser.uid}_${song.videoId}`;
        const ref = db.collection('ktvUserFavorites').doc(docId);
        try {
            if (userFavoriteVideoIds.has(song.videoId)) {
                await ref.delete();
                userFavoriteVideoIds.delete(song.videoId);
            } else {
                await ref.set({ uid: currentUser.uid, videoId: song.videoId, title: song.title, thumbnail: song.thumbnail || '', addedAt: firebase.firestore.FieldValue.serverTimestamp() });
                userFavoriteVideoIds.add(song.videoId);
            }
            // 收藏狀態變了，把目前畫面上有顯示歌曲卡片的地方都重新渲染一次，讓⭐/💛icon立刻反映最新狀態
            loadFavoritesList();
            if (currentRoomData) renderRoomState();
        } catch (err) {
            alert('收藏失敗：' + err.message);
        }
    }
    async function loadFavoritesList() {
        const targets = [document.getElementById('host-favorites-list'), document.getElementById('member-favorites-list')].filter(Boolean);
        if (!targets.length || !currentUser) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvUserFavorites').where('uid', '==', currentUser.uid).get();
            const docs = snap.docs.map(d => d.data());
            docs.sort((a, b) => {
                const toMillis = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : 0;
                return toMillis(b.addedAt) - toMillis(a.addedAt);
            });
            const html = docs.length ? docs.map(d => buildSongCard(d, 'favorite')).join('') : '<div class="empty-hint">還沒有收藏任何歌曲，看到喜歡的歌按⭐收藏起來吧</div>';
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }

    // ---------------------------------------------------------------
    // 房主播放器：跟做菜音樂功能同一招，只用單一影片ID載入播放，這個網站上唯一確認穩定的
    // YouTube嵌入方式，完全不使用YouTube播放清單的嵌入/串接機制
    // ---------------------------------------------------------------
    let ytPlayer = null;
    let ytPlayerReady = false;
    let ytApiReadyPromise = null;
    function loadYoutubeIframeApi() {
        if (ytApiReadyPromise) return ytApiReadyPromise;
        ytApiReadyPromise = new Promise(resolve => {
            if (window.YT && window.YT.Player) { resolve(); return; }
            const prevCallback = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
                if (typeof prevCallback === 'function') prevCallback();
                resolve();
            };
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        });
        return ytApiReadyPromise;
    }
    async function playHostVideo(videoId) {
        await loadYoutubeIframeApi();
        if (!ytPlayer) {
            ytPlayer = new YT.Player('ktv-yt-player-target', {
                width: '100%', height: '100%', videoId,
                playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
                events: {
                    onReady: () => { ytPlayerReady = true; },
                    onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) advanceQueue(); },
                },
            });
        } else if (ytPlayerReady) {
            ytPlayer.loadVideoById(videoId);
        }
    }
    // 把佇列最前面那首拿掉，接下一首——不管是歌自然播完(ENDED事件)還是房主手動按「切歌」，
    // 都是呼叫這個函式（其他裝置會透過onSnapshot同步收到變化）
    async function advanceQueue() {
        if (!currentRoomData || !currentRoomId) return;
        const newQueue = (currentRoomData.queue || []).slice(1);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue: newQueue });
        } catch (err) { console.warn('推進佇列失敗', err); }
    }
</script>
