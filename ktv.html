<script>
    // ---------------------------------------------------------------
    // Firebase初始化：跟主站(index.html)用同一份設定，共用同一個登入狀態
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
        authDomain: "recipe-synchronization.firebaseapp.com",
        projectId: "recipe-synchronization",
        storageBucket: "recipe-synchronization.firebasestorage.app",
        messagingSenderId: "559668909743",
        appId: "1:559668909743:web:63dc34572b98839479265a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const CLOUDFLARE_AI_PROXY_URL = 'https://baking-recipes-ai.wallcemax.workers.dev/';

    let currentUser = null;
    let myDisplayName = null; // 快取自己的顯示名稱：優先用個人頁面設定的暱稱，沒設定就退回Google帳號名稱
    let currentRoomId = null;
    let currentRoomData = null;
    let isHost = false;
    let roomUnsubscribe = null;
    let membersUnsubscribe = null;
    let reactionsUnsubscribe = null;
    let ownRoomUnsubscribe = null;
    let prevQueueQids = [];
    let prevMemberUids = [];
    let hostLastPlayedVideoId = null;
    let nextUpAnnouncedForVideo = null; // 目前這首歌是不是已經廣播過「快結束了，下一位請準備」，避免每秒輪詢重複廣播
    let nextUpPollTimer = null;
    let pendingJoinRoomId = null; // 等待輸入密碼的房間ID
    let userFavoriteVideoIds = new Set(); // 目前登入者收藏的歌曲videoId集合，方便快速判斷某首歌有沒有收藏過

    auth.onAuthStateChanged(user => {
        currentUser = user;
        document.getElementById('lobby-login-hint').classList.toggle('hidden', !!user);
        if (user) {
            watchOwnRoom();
            loadRoomList();
            loadUserFavoriteIds();
        }
    });

    // 連線狀態提示：只是簡單監聽瀏覽器本身的網路連線狀態（不是Firestore專屬的連線狀態，
    // Firestore的SDK沒有提供簡單的「目前有沒有連上」監聽器），斷線時至少讓使用者知道
    // 「畫面卡住是因為網路不通」，不是網站本身壞掉，恢復連線後提示也會跟著消失
    function showConnectionBanner(offline) {
        let banner = document.getElementById('ktv-connection-banner');
        if (!banner) {
            banner = document.createElement('div');
            banner.id = 'ktv-connection-banner';
            banner.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:9999; text-align:center; padding:0.5rem; font-size:0.8rem; font-weight:600; color:#fff;';
            document.body.appendChild(banner);
        }
        if (offline) {
            banner.textContent = '⚠️ 網路連線中斷，資料可能無法即時更新';
            banner.style.background = 'var(--danger)';
            banner.style.display = 'block';
        } else {
            banner.textContent = '✅ 已恢復連線';
            banner.style.background = 'var(--sage)';
            setTimeout(() => { banner.style.display = 'none'; }, 2500);
        }
    }
    window.addEventListener('offline', () => showConnectionBanner(true));
    window.addEventListener('online', () => showConnectionBanner(false));

    function escapeHtmlKtv(str) {
        return String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    // 解析自己的顯示名稱：優先用「個人頁面」設定的暱稱，沒設定就退回原本的Google帳號名稱。
    // 只查一次快取起來，不用每次點歌/送掌聲都重新查一次資料庫
    async function resolveMyDisplayName() {
        if (myDisplayName) return myDisplayName;
        if (!currentUser) return '';
        try {
            const doc = await db.collection('userProfiles').doc(currentUser.uid).get();
            const nickname = doc.exists ? (doc.data().nickname || '') : '';
            myDisplayName = nickname.trim() || currentUser.displayName || '匿名';
        } catch (err) {
            myDisplayName = currentUser.displayName || '匿名';
        }
        return myDisplayName;
    }
    function showKtvToast(message, durationMs) {
        const stack = document.getElementById(isHost ? 'toast-stack' : 'member-toast-stack');
        if (!stack) return;
        const el = document.createElement('div');
        el.className = 'ktv-toast';
        el.textContent = message;
        stack.appendChild(el);
        setTimeout(() => el.remove(), durationMs || 4500);
    }

    // ---------------------------------------------------------------
    // 房間列表：顯示目前所有開著的房間＋人數＋是否需要密碼；同時「即時監聽」自己是不是已經
    // 有一個進行中的房間——之前這裡是只查一次的get()，如果你在別的裝置建立了房間，這個頁面
    // 沒有重新整理就不會發現，變成同一個帳號可以在兩台裝置各開一間房間。改成onSnapshot即時監聽，
    // 不管從哪個裝置建立/解散房間，所有分頁都會馬上反映最新狀態
    // ---------------------------------------------------------------
    // ---------------------------------------------------------------
    // 「目前人在哪個房間」：不管是房主還是一般成員，同一時間只能待在一個房間裡。
    // 用ktvUserRoomStatus這份文件即時監聽，不管從哪個裝置建立/加入/離開房間，
    // 所有分頁都會馬上反映最新狀態，房間列表跟建立房間表單都會依這個狀態顯示/隱藏
    // ---------------------------------------------------------------
    let currentRoomStatus = null;
    let hasAutoResumed = false; // 這次頁面載入有沒有已經自動恢復過房間，只在剛載入時做一次，避免之後手動離開房間又被強制拉回去
    function watchOwnRoom() {
        if (ownRoomUnsubscribe) ownRoomUnsubscribe();
        ownRoomUnsubscribe = db.collection('ktvUserRoomStatus').doc(currentUser.uid).onSnapshot(doc => {
            const hint = document.getElementById('own-room-hint');
            const createCard = document.getElementById('create-room-card');
            currentRoomStatus = doc.exists ? doc.data() : null;
            if (currentRoomStatus && currentRoomStatus.roomId) {
                document.getElementById('own-room-name').textContent =
                    (currentRoomStatus.isHost ? '你是房主：' : '你已加入：') + (currentRoomStatus.roomName || currentRoomStatus.roomId);
                hint.classList.remove('hidden');
                createCard.classList.add('hidden');
                hint.dataset.roomId = currentRoomStatus.roomId;
                hint.dataset.isHost = currentRoomStatus.isHost ? '1' : '';
                // 重新整理頁面（或第一次打開這個頁面）發現本來就在某個房間，直接自動幫使用者
                // 重新進入，不用等使用者手動點「前往我的房間」——這樣重新整理也不會把人踢出房間，
                // 也不用靠beforeunload這種不可靠、容易誤判的機制去偵測「使用者是不是真的離開了」
                if (!hasAutoResumed && !currentRoomId) {
                    hasAutoResumed = true;
                    enterRoom(currentRoomStatus.roomId, currentRoomStatus.isHost, currentRoomStatus.roomName);
                }
            } else {
                hint.classList.add('hidden');
                createCard.classList.remove('hidden');
            }
        }, err => console.warn('監聽目前房間狀態失敗', err));
    }
    // 在使用者點擊當下、還沒開始任何await非同步等待之前，就先切換畫面+要求全螢幕。
    // 瀏覽器只認「使用者剛點擊的那一瞬間」算數，中間如果先跑了好幾個await查資料庫，
    // 等真的要全螢幕的時候瀏覽器會認為這個授權已經過期而拒絕，畫面就會卡在非全螢幕、
    // 什麼控制項都看不到的狀態。所以這個函式必須在onclick一開始就同步呼叫
    function prepareHostViewForFullscreen() {
        document.getElementById('room-list-view').classList.add('hidden');
        document.getElementById('room-view').classList.remove('hidden');
        document.getElementById('host-view').classList.remove('hidden');
        document.getElementById('member-view').classList.add('hidden');
        const wrapper = document.getElementById('fullscreen-wrapper');
        if (wrapper) wrapper.requestFullscreen().catch(() => {});
    }
    function rejoinOwnRoom() {
        const hint = document.getElementById('own-room-hint');
        const roomId = hint.dataset.roomId;
        if (!roomId) return;
        if (hint.dataset.isHost === '1') prepareHostViewForFullscreen(); // 已知是房主，點擊當下立刻要求全螢幕
        enterRoom(roomId, hint.dataset.isHost === '1', currentRoomStatus && currentRoomStatus.roomName);
    }
    function loadRoomList() {
        db.collection('ktvRooms').orderBy('createdAt', 'desc').onSnapshot(async snap => {
            const container = document.getElementById('room-list-container');
            if (snap.empty) { container.innerHTML = '<p class="empty-hint">目前沒有開著的房間，建立一個新的吧</p>'; return; }
            // 人數改成直接查真實的成員名單筆數，不再信任另外維護的memberCount計數欄位——
            // 加減計數器只要漏算一次就會永遠兜不起來，直接讀真實資料才不會再發生「人數一直增加、
            // 跟實際狀況對不上」的問題。原本想用count()聚合查詢（不用抓回整份文件、比較省流量），
            // 但目前載入的Firebase SDK版本不支援這個方法，改用最基本、確定支援的.get()方式，
            // 直接讀取成員名單有幾筆文件(snap.size)
            const rooms = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const counts = await Promise.all(rooms.map(r =>
                db.collection('ktvRooms').doc(r.id).collection('members').get()
                    .then(memberSnap => memberSnap.size).catch(() => 0)
            ));
            // 房主名稱(hostName)是建房那一刻寫死存進房間文件裡的舊名字，不會因為房主之後
            // 改了暱稱就跟著變——這裡額外查一次每個房主「現在」設定的暱稱，查得到就蓋掉顯示，
            // 查不到（沒設定過暱稱）才退回顯示原本存的hostName，做法跟排行榜、食譜作者名稱
            // 用的是同一套邏輯
            const hostNames = await Promise.all(rooms.map(r => {
                if (!r.hostUid) return Promise.resolve(r.hostName || '');
                return db.collection('userProfiles').doc(r.hostUid).get()
                    .then(doc => (doc.exists && doc.data().nickname) ? doc.data().nickname : (r.hostName || ''))
                    .catch(() => r.hostName || '');
            }));
            container.innerHTML = rooms.map((room, i) => {
                const icon = room.roomIcon ? `<img src="${room.roomIcon}" class="room-icon-thumb" alt="">` : '';
                return `<div class="room-list-item" onclick="tryJoinRoom('${room.id}')">
                    ${icon}
                    <div class="info">
                        <div class="name">${escapeHtmlKtv(room.name || room.id)}</div>
                        <div class="sub">房主：${escapeHtmlKtv(hostNames[i])} · 👥 ${counts[i]}人</div>
                    </div>
                    ${room.passcode ? '<span class="lock-icon">🔒</span>' : ''}
                </div>`;
            }).join('');
        }, err => console.warn('讀取房間列表失敗', err));
    }
    // 點房間列表項目：沒密碼直接加入，有密碼跳出密碼輸入視窗
    async function tryJoinRoom(roomId) {
        if (!currentUser) { alert('請先登入才能加入房間'); return; }
        try {
            const doc = await db.collection('ktvRooms').doc(roomId).get();
            if (!doc.exists) { alert('這個房間剛剛已經被解散了'); return; }
            // 同一時間只能待在一個房間，不管目前是房主還是一般成員都要先擋下來
            if (currentRoomStatus && currentRoomStatus.roomId && currentRoomStatus.roomId !== roomId) {
                alert(`你目前已經在房間「${currentRoomStatus.roomName || currentRoomStatus.roomId}」裡，請先離開才能加入其他房間`);
                return;
            }
            const room = doc.data();
            // 房主重新加入自己的房間，不用再輸入密碼——不然萬一忘記自己設的密碼，
            // 會連自己的房間都進不去，變成刪不掉、也管理不了
            if (room.passcode && room.hostUid !== currentUser.uid) {
                pendingJoinRoomId = roomId;
                document.getElementById('passcode-modal-input').value = '';
                document.getElementById('passcode-modal-backdrop').classList.remove('hidden');
            } else {
                enterRoom(roomId, room.hostUid === currentUser.uid, room.name);
            }
        } catch (err) {
            alert('加入房間失敗：' + err.message);
        }
    }
    async function confirmJoinWithPasscode() {
        const input = document.getElementById('passcode-modal-input').value.trim();
        const roomId = pendingJoinRoomId;
        try {
            const doc = await db.collection('ktvRooms').doc(roomId).get();
            if (!doc.exists) { alert('這個房間剛剛已經被解散了'); closePasscodeModal(); return; }
            if (currentRoomStatus && currentRoomStatus.roomId && currentRoomStatus.roomId !== roomId) {
                alert(`你目前已經在房間「${currentRoomStatus.roomName || currentRoomStatus.roomId}」裡，請先離開才能加入其他房間`);
                closePasscodeModal();
                return;
            }
            const room = doc.data();
            if (room.passcode !== input) { alert('房間代碼不正確'); return; }
            closePasscodeModal();
            enterRoom(roomId, room.hostUid === currentUser.uid, room.name);
        } catch (err) {
            alert('加入房間失敗：' + err.message);
        }
    }
    function closePasscodeModal() {
        document.getElementById('passcode-modal-backdrop').classList.add('hidden');
        pendingJoinRoomId = null;
    }

    function generateRoomCode() {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 去掉容易看錯的 I、L、O、0、1
        let code = '';
        for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return code;
    }
    async function createRoom() {
        if (!currentUser) { alert('請先登入才能建立房間'); return; }
        // 已經在某個房間裡（房主或成員身份都算），不能再建立新的
        if (currentRoomStatus && currentRoomStatus.roomId) {
            alert(`你目前已經在房間「${currentRoomStatus.roomName || currentRoomStatus.roomId}」裡，請先離開才能建立新房間`);
            return;
        }
        prepareHostViewForFullscreen(); // 建立房間的人一定是房主，點擊當下立刻切畫面+要求全螢幕
        const myName = await resolveMyDisplayName();
        const name = document.getElementById('create-room-name').value.trim() || `${myName}的房間`;
        const passcode = document.getElementById('create-room-passcode').value.trim();
        const roomId = generateRoomCode();
        try {
            await db.collection('ktvRooms').doc(roomId).set({
                name, passcode: passcode || null,
                hostUid: currentUser.uid, hostName: myName,
                queue: [], roomIcon: null,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            enterRoom(roomId, true, name);
        } catch (err) {
            document.getElementById('lobby-status').textContent = '⚠️ 建立房間失敗：' + err.message;
        }
    }

    // ---------------------------------------------------------------
    // 進入房間：切畫面(房主/成員)，把自己加進成員名單，開始即時監聽房間文件+成員名單+掌聲反應，
    // 同時寫入ktvUserRoomStatus記錄「我現在在這個房間」。人數一律直接從成員名單的真實筆數
    // 計算（count()聚合查詢或監聽的snap.size），不再另外維護一個計數欄位，避免計數跟實際
    // 狀況兜不起來的問題
    // ---------------------------------------------------------------
    async function enterRoom(roomId, asHost, roomName) {
        currentRoomId = roomId;
        isHost = asHost;
        prevQueueQids = [];
        prevMemberUids = [];
        hostLastPlayedVideoId = null;
        resetReactionUiState(); // 多一層保險，確保不會帶著上一個房間殘留的掌聲動畫狀態進到新房間
        lastPlayedWheelSpinToken = null;
        lastAnnouncedWheelResultAt = 0;
        document.getElementById('room-list-view').classList.add('hidden');
        document.getElementById('room-view').classList.remove('hidden');
        document.getElementById(asHost ? 'host-view' : 'member-view').classList.remove('hidden');
        document.getElementById(asHost ? 'member-view' : 'host-view').classList.add('hidden');

        // 把自己（不管房主還是一般成員）寫進這個房間的成員名單，離開時會再刪掉。
        // 用.set()是因為同一個人重複進入同一個房間，文件ID(=uid)一樣，只是覆寫同一筆，
        // 不會變成好幾筆重複資料
        try {
            const memberRef = db.collection('ktvRooms').doc(roomId).collection('members').doc(currentUser.uid);
            const myName = await resolveMyDisplayName();
            await memberRef.set({ uid: currentUser.uid, name: myName, joinedAt: firebase.firestore.FieldValue.serverTimestamp() });
            // 記錄「我現在在這個房間」，離開時會清掉。這份文件是判斷「同一時間只能待在
            // 一個房間」的唯一依據，建立/加入房間前都會先檢查這個
            await db.collection('ktvUserRoomStatus').doc(currentUser.uid).set({
                roomId, roomName: roomName || '', isHost: asHost,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
        } catch (err) {
            console.error('加入成員名單失敗', err);
        }

        if (roomUnsubscribe) roomUnsubscribe();
        let lastNextUpAnnouncedAt = 0;
        roomUnsubscribe = db.collection('ktvRooms').doc(roomId).onSnapshot(doc => {
            if (!doc.exists) {
                alert('🎤 房間已解散');
                exitToLobby();
                return;
            }
            const data = doc.data();
            const newQueue = data.queue || [];
            newQueue.forEach(q => {
                if (!prevQueueQids.includes(q.qid)) showKtvToast(`🎤 ${q.requestedBy || '有人'} 點播了《${q.title}》`);
            });
            prevQueueQids = newQueue.map(q => q.qid);

            // 快結束前20秒的「下一位請準備」廣播：全部裝置都會收到，不是只有房主
            const notice = data.nextUpAnnouncement;
            if (notice && notice.announcedAt && notice.announcedAt > lastNextUpAnnouncedAt) {
                lastNextUpAnnouncedAt = notice.announcedAt;
                showKtvToast(`🎵 接下來為您播放下一首：《${notice.title}》（${notice.requestedBy || '有人'}點的，請準備）`, 8000);
            }

            // 命運輪盤：發起/轉動/結果，全部透過這個房間監聽同步給所有裝置
            handleWheelEventUpdate(data.wheelEvent);

            currentRoomData = data;
            renderRoomState();

            if (isHost) {
                const headVideoId = newQueue[0] && newQueue[0].videoId;
                if (headVideoId && headVideoId !== hostLastPlayedVideoId) {
                    hostLastPlayedVideoId = headVideoId;
                    playHostVideo(headVideoId);
                } else if (!headVideoId) {
                    hostLastPlayedVideoId = null;
                }
            }
        }, err => console.warn('房間監聽失敗', err));

        // 成員名單監聽：算目前人數（不管房主還是成員都算在內）、偵測誰加入/離開房間。
        // 用「監聽建立的當下時間」當基準，只有joinedAt晚於這個時間點的才算是「剛剛加入」，
        // 這樣不管房主還是一般成員，只要人在房間裡都收得到通知，也不會因為「這是我進房間後
        // 收到的第一批資料」就誤判成新加入（之前用一個布林旗標「跳過第一次」來擋，
        // 但這個做法沒辦法正確處理「離開」事件，也容易在時機湊巧時漏判）
        const membersListenerAttachedAt = Date.now();
        if (membersUnsubscribe) membersUnsubscribe();
        membersUnsubscribe = db.collection('ktvRooms').doc(roomId).collection('members').onSnapshot(snap => {
            const uids = snap.docs.map(d => d.id);
            snap.docChanges().forEach(change => {
                const memberUid = change.doc.id;
                if (memberUid === currentUser.uid) return; // 自己加入/離開不用通知自己
                if (change.type === 'added') {
                    const joinedAtMs = change.doc.data().joinedAt && change.doc.data().joinedAt.toMillis ? change.doc.data().joinedAt.toMillis() : Date.now();
                    if (joinedAtMs >= membersListenerAttachedAt) {
                        showKtvToast(`👋 ${change.doc.data().name || '有人'} 已加入房間`);
                    }
                } else if (change.type === 'removed' && prevMemberUids.includes(memberUid)) {
                    showKtvToast(`🚪 ${change.doc.data().name || '有人'} 已離開房間`);
                }
            });
            prevMemberUids = uids;
            const countText = String(snap.size);
            ['host-member-count', 'overlay-member-count'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = countText; });
        }, err => console.warn('成員名單監聽失敗', err));

        // 掌聲鼓勵反應：房主跟一般成員都要監聽並觸發畫面上的動畫，不是只有房主看得到。
        // 一樣改用時間戳記比對，不用「跳過第一次」那種旗標
        const reactionsListenerAttachedAt = Date.now();
        if (reactionsUnsubscribe) reactionsUnsubscribe();
        reactionsUnsubscribe = db.collection('ktvRooms').doc(roomId).collection('reactions').onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                if (change.type !== 'added') return;
                const reaction = change.doc.data();
                // 自己剛剛送出的那則反應，畫面已經在sendApplause()裡立即播放過一次了，
                // 這裡收到自己那份不用再播第二次
                if (reaction.uid === currentUser.uid) return;
                const createdAtMs = reaction.createdAt && reaction.createdAt.toMillis ? reaction.createdAt.toMillis() : Date.now();
                if (createdAtMs >= reactionsListenerAttachedAt) playReactionAnimation(reaction);
            });
        }, err => console.warn('掌聲反應監聽失敗', err));

        // host-room-name/host-room-id這兩個舊元素在上次把room-info-bar清空時已經拿掉了，
        // 房主的房間資訊現在只顯示在疊加介面的overlay-room-name/overlay-room-id裡
        if (asHost) {
            document.getElementById('overlay-room-name').textContent = roomName || '';
            document.getElementById('overlay-room-id').textContent = roomId;
            // 房主建立/進入房間後自動全螢幕，需要使用者手勢才能觸發，這裡緊接在建立房間的點擊事件內，
            // 大部分瀏覽器允許在使用者互動後的同一輪呼叫鏈裡要求全螢幕
            const wrapper = document.getElementById('fullscreen-wrapper');
            wrapper.requestFullscreen().catch(() => {}); // 失敗就算了（例如瀏覽器政策不允許），不用跳錯誤打斷使用者
        } else {
            document.getElementById('member-room-name').textContent = '';
        }
        loadRankingList();
        loadHistoryList();
        loadMyHistoryList();
        loadFavoritesList();
    }
    function exitToLobby() {
        if (roomUnsubscribe) { roomUnsubscribe(); roomUnsubscribe = null; }
        if (membersUnsubscribe) { membersUnsubscribe(); membersUnsubscribe = null; }
        if (reactionsUnsubscribe) { reactionsUnsubscribe(); reactionsUnsubscribe = null; }
        if (wheelUnsubscribe) { wheelUnsubscribe(); wheelUnsubscribe = null; }
        if (nextUpPollTimer) { clearInterval(nextUpPollTimer); nextUpPollTimer = null; }
        leaveMemberRecord();
        if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; ytPlayerReady = false; }
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        resetReactionUiState(); // 清掉掌聲動畫的殘留狀態，避免下次進房間/進全螢幕時被意外重播
        closeWheelModal();
        currentRoomId = null; currentRoomData = null; isHost = false;
        document.getElementById('room-view').classList.add('hidden');
        document.getElementById('room-list-view').classList.remove('hidden');
    }
    // 掌聲動畫用的.show這個class，動畫播完之後只是視覺上停在透明(opacity:0)，
    // class本身沒有被拿掉，元素其實還在「動畫完成但保留最後一格」的狀態。離開房間時
    // 明確拿掉這個class、清空文字內容，確保下次進房間(尤其自動進全螢幕觸發版面重新計算時)
    // 不會意外把這個殘留的動畫重新播放一次，變成「文字跳出來但沒有飄動表情符號」的假動畫
    function resetReactionUiState() {
        ['reaction-banner', 'member-reaction-banner'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.classList.remove('show'); el.textContent = ''; }
        });
        ['reaction-layer', 'member-reaction-layer'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '';
        });
    }
    // 把自己從成員名單移除。這是「盡力而為」的機制：正常按離開房間會確實執行，
    // 但如果使用者直接關掉分頁/瀏覽器，這段程式碼可能來不及跑完，人數統計偶爾可能因此短暫
    // 出現誤差，這是純前端＋Firestore（沒有像即時資料庫那種onDisconnect機制）架構下難以完全
    // 避免的限制；但因為人數是直接讀真實名單筆數算出來的，不是另外維護的計數器，
    // 就算某次沒清乾淨，等使用者下次重新整理房間列表時數字也會自動修正回來，不會一直累積誤差
    function leaveMemberRecord() {
        if (!currentRoomId || !currentUser) return;
        const roomId = currentRoomId;
        db.collection('ktvRooms').doc(roomId).collection('members').doc(currentUser.uid).delete()
            .catch(err => console.warn('移除成員名單失敗', err));
        db.collection('ktvUserRoomStatus').doc(currentUser.uid).delete()
            .catch(err => console.warn('清除目前房間狀態失敗', err));
    }
    // 注意：這裡刻意不註冊beforeunload事件去清除房間狀態，因為beforeunload在單純按F5
    // 重新整理的時候也會觸發，如果拿它來清除ktvUserRoomStatus，重新整理=系統誤判成
    // 「已經離開房間」，狀態被清掉之後又能重新建立房間，變成無限建房的bug。
    // 改成下面watchOwnRoom()偵測到「本來就在某個房間」時自動重新進入，取代原本這種
    // 不可靠的離開偵測機制

    // 房主離開＝解散房間，所有人都會被踢出（透過上面onSnapshot偵測到文件被刪除）
    async function leaveRoomAsHost() {
        if (!confirm('確定要解散這個房間嗎？所有人都會被移出房間。')) return;
        try {
            await db.collection('ktvRooms').doc(currentRoomId).delete();
        } catch (err) {
            alert('解散房間失敗：' + err.message);
        }
        exitToLobby();
    }
    // 一般成員離開：只是自己退出，房間繼續開著給其他人用
    function leaveRoomAsMember() {
        exitToLobby();
    }

    function renderRoomState() {
        if (!currentRoomData) return;
        if (!isHost) {
            const nameEl = document.getElementById('member-room-name');
            if (nameEl) nameEl.textContent = currentRoomData.name || '';
        }
        const overlayNameEl = document.getElementById('overlay-room-name');
        if (overlayNameEl) overlayNameEl.textContent = currentRoomData.name || '';
        const queue = currentRoomData.queue || [];
        if (isHost) {
            renderQueueList('host-queue-list', queue, true);
        } else {
            renderQueueList('member-queue-list', queue, false);
            document.getElementById('member-now-playing-text').textContent = queue[0] ? queue[0].title : '尚未開始，快去點一首歌吧';
        }
    }

    // ---------------------------------------------------------------
    // 房主全螢幕疊加介面：頂端一條收合列，點擊展開/收合搜尋+歷史+熱門+佇列面板，
    // 預設收合，避免遮住畫面下方常見的歌詞顯示區域
    // ---------------------------------------------------------------
    function toggleOverlayExpanded() {
        document.getElementById('host-overlay-ui').classList.toggle('expanded');
    }
    function switchOverlayTab(tab) {
        ['search', 'history', 'ranking', 'myhistory', 'favorites'].forEach(t => {
            document.getElementById(`overlay-tab-${t}`).classList.toggle('hidden', t !== tab);
        });
        document.querySelectorAll('.overlay-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'history') loadHistoryList();
        if (tab === 'ranking') loadRankingList();
        if (tab === 'myhistory') loadMyHistoryList();
        if (tab === 'favorites') loadFavoritesList();
    }
    function switchMemberTab(tab) {
        ['queue', 'search', 'history', 'ranking', 'myhistory', 'favorites'].forEach(t => {
            document.getElementById(`member-tab-${t}`).classList.toggle('hidden', t !== tab);
        });
        document.querySelectorAll('.member-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'history') loadHistoryList();
        if (tab === 'ranking') loadRankingList();
        if (tab === 'myhistory') loadMyHistoryList();
        if (tab === 'favorites') loadFavoritesList();
    }
    function toggleFullscreen() {
        const el = document.getElementById('fullscreen-wrapper');
        if (document.fullscreenElement) document.exitFullscreen();
        else el.requestFullscreen().catch(err => alert('無法進入全螢幕：' + err.message));
    }

    // ---------------------------------------------------------------
    // 房間圖案：房主可以從7張圖裡選一張，設定後房間列表的名稱前面會顯示這個圖案
    // ---------------------------------------------------------------
    const ROOM_ICON_OPTIONS = [
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/karaoke_3040142_tzon5y.png',
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/music_14852655_zul9op.png',
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/karaoke_3931576_qzvy7c.png',
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/karaoke_2445497_ourspd.png',
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/sound_11365157_jsb2yg.png',
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/karaoke_6431432_azesf2.png',
        'https://res.cloudinary.com/bumzwp9g/image/upload/v1786012690/karaoke_1323595_qt3nht.png',
    ];
    function toggleRoomIconPicker() {
        const picker = document.getElementById('room-icon-picker');
        if (picker.classList.contains('hidden')) {
            picker.innerHTML = ROOM_ICON_OPTIONS.map(url =>
                `<img src="${url}" onclick="selectRoomIcon('${url}')" style="width:2.3rem; height:2.3rem; object-fit:contain; border-radius:0.5rem; cursor:pointer; padding:0.2rem; background:var(--cream);">`
            ).join('');
            picker.classList.remove('hidden');
        } else {
            picker.classList.add('hidden');
        }
    }
    async function selectRoomIcon(url) {
        if (!isHost || !currentRoomId) return;
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ roomIcon: url });
            document.getElementById('room-icon-picker').classList.add('hidden');
            showKtvToast('🖼 房間圖案已更新');
        } catch (err) {
            alert('設定房間圖案失敗：' + err.message);
        }
    }

    // ---------------------------------------------------------------
    // 掌聲鼓勵：成員按下去，寫一筆反應事件到房間的reactions子集合，房主端監聽到就在
    // 播放畫面上疊一個動畫。準備好幾種不同的動畫效果，每次隨機挑一種，不會每次都一樣
    // ---------------------------------------------------------------
    const REACTION_TYPES = [
        { emojis: ['👏','👏','👏','👏'], banner: '👏 掌聲鼓勵 👏' },
        { emojis: ['🎉','🎊','✨','🎉'], banner: '🎉 太棒了！ 🎉' },
        { emojis: ['❤️','💕','💖','❤️'], banner: '❤️ 唱得真好 ❤️' },
        { emojis: ['🔥','🔥','🔥','🔥'], banner: '🔥 神級演出 🔥' },
        { emojis: ['⭐','🌟','✨','⭐'], banner: '⭐ 安可安可 ⭐' },
    ];
    async function sendApplause() {
        if (!currentUser || !currentRoomId) return;
        const typeIndex = Math.floor(Math.random() * REACTION_TYPES.length);
        // 先在自己畫面上立即播放一次，不用等Firestore寫入+監聽回來的來回時間，
        // 點下去馬上就有反應。其他人那邊會透過下面的reactions監聽收到、各自播放
        playReactionAnimation({ typeIndex, name: await resolveMyDisplayName(), uid: currentUser.uid });
        try {
            await db.collection('ktvRooms').doc(currentRoomId).collection('reactions').add({
                uid: currentUser.uid, name: await resolveMyDisplayName(),
                typeIndex, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            cleanupOldReactions(); // 順手清掉這個房間裡的舊反應紀錄，不用另外跑排程
        } catch (err) { console.warn('送出掌聲失敗', err); }
    }
    // 掌聲反應這個子集合只會一直新增、沒有人會去讀舊資料，放著不管長期會一直累積。
    // 每次有人送新的掌聲，順便清掉5分鐘前的舊紀錄——量不大，用最簡單的方式處理，
    // 不用另外架設排程機制（例如Cloud Functions）
    let lastReactionCleanupAt = 0;
    async function cleanupOldReactions() {
        const now = Date.now();
        if (now - lastReactionCleanupAt < 60000) return; // 一分鐘內清過就先不用再清一次，避免太頻繁查詢
        lastReactionCleanupAt = now;
        try {
            const fiveMinAgo = firebase.firestore.Timestamp.fromMillis(now - 5 * 60 * 1000);
            const snap = await db.collection('ktvRooms').doc(currentRoomId).collection('reactions')
                .where('createdAt', '<', fiveMinAgo).get();
            if (snap.empty) return;
            const batch = db.batch();
            snap.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
        } catch (err) { console.warn('清理舊掌聲紀錄失敗', err); }
    }
    function playReactionAnimation(reaction) {
        const type = REACTION_TYPES[reaction.typeIndex] || REACTION_TYPES[0];
        // 房主視角疊在影片上(#reaction-layer)，一般成員視角沒有影片可疊，用蓋住整個頁面的版本
        const layer = document.getElementById(isHost ? 'reaction-layer' : 'member-reaction-layer');
        const banner = document.getElementById(isHost ? 'reaction-banner' : 'member-reaction-banner');
        if (!layer || !banner) return;
        // 一批表情符號從畫面底部往上飄，每個位置/飄移方向/速度都隨機一點，看起來比較自然
        for (let i = 0; i < 16; i++) {
            const el = document.createElement('span');
            el.className = 'reaction-emoji';
            el.textContent = type.emojis[Math.floor(Math.random() * type.emojis.length)];
            el.style.left = `${Math.random() * 90 + 3}%`;
            el.style.setProperty('--drift', `${(Math.random() - 0.5) * 160}px`);
            el.style.setProperty('--spin', `${(Math.random() - 0.5) * 60}deg`);
            el.style.animationDelay = `${Math.random() * 0.6}s`;
            el.style.fontSize = `${1.6 + Math.random() * 1.4}rem`;
            layer.appendChild(el);
            setTimeout(() => el.remove(), 3400);
        }
        banner.textContent = `${type.banner}（${reaction.name || '有人'}）`;
        banner.classList.remove('show');
        void banner.offsetWidth; // 強制觸發reflow，讓同一個動畫可以連續重複播放
        banner.classList.add('show');
    }

    // ---------------------------------------------------------------
    // 搜尋：不管輸入什麼，前面一律加「KTV」關鍵字，提高搜到伴唱版影片的機率
    // ---------------------------------------------------------------
    // 把搜尋關鍵字轉成可以當Firestore文件ID用的安全字串（去掉斜線等不合法字元、統一小寫去空白）
    function sanitizeSearchCacheKey(query) {
        return query.trim().toLowerCase().replace(/[\/\.\#\$\[\]]/g, '_').slice(0, 200) || 'empty';
    }
    // 搜尋：優先從Firestore快取讀（不管是誰之前搜過同樣的關鍵字，結果都共用），完全不消耗
    // YouTube Data API的每日配額。快取結果下面一律附一顆「深度搜尋」按鈕，只有使用者真的
    // 對快取結果不滿意、自己按下去，才會真的呼叫YouTube API即時搜尋（那個才會消耗配額）
    async function searchKtvSongs() {
        const input = document.getElementById(isHost ? 'host-search-input' : 'member-search-input');
        const resultsEl = document.getElementById(isHost ? 'host-search-results' : 'member-search-results');
        const query = input.value.trim();
        if (!query) return;
        resultsEl.innerHTML = '<div class="empty-hint">查詢快取中...</div>';
        try {
            const cacheKey = sanitizeSearchCacheKey(query);
            const doc = await db.collection('ktvSearchCache').doc(cacheKey).get();
            const cachedResults = (doc.exists && doc.data().results) || [];
            renderSearchResultsWithDeepSearch(cachedResults, resultsEl, !cachedResults.length);
        } catch (err) {
            resultsEl.innerHTML = `<div class="empty-hint">⚠️ ${escapeHtmlKtv(err.message)}</div>`;
        }
    }
    // 深度搜尋：真的呼叫YouTube Data API即時搜尋，會消耗每日配額。搜到的結果會存回Firestore
    // 快取，之後任何人（不只自己）搜同樣的關鍵字都能直接沿用，不用再消耗配額
    async function deepSearchKtvSongs() {
        const input = document.getElementById(isHost ? 'host-search-input' : 'member-search-input');
        const resultsEl = document.getElementById(isHost ? 'host-search-results' : 'member-search-results');
        const query = input.value.trim();
        if (!query) return;
        resultsEl.innerHTML = '<div class="empty-hint">深度搜尋中（呼叫YouTube即時查詢）...</div>';
        try {
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'youtube_search', query: `KTV ${query}` }),
            });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || `搜尋失敗(${res.status})`);
            const results = data.results || [];
            const cacheKey = sanitizeSearchCacheKey(query);
            db.collection('ktvSearchCache').doc(cacheKey).set({
                query, results, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }).catch(err => console.warn('寫入搜尋快取失敗', err));
            renderSearchResultsWithDeepSearch(results, resultsEl, false);
        } catch (err) {
            resultsEl.innerHTML = `<div class="empty-hint">⚠️ ${escapeHtmlKtv(err.message)}</div>`;
        }
    }
    function renderSearchResultsWithDeepSearch(results, resultsEl, isEmpty) {
        const cardsHtml = results.length
            ? results.map(r => buildSongCard(r, 'result')).join('')
            : `<div class="empty-hint">${isEmpty ? '目前沒有快取結果' : '找不到符合的影片，換個關鍵字試試'}</div>`;
        resultsEl.innerHTML = cardsHtml + `<button class="btn btn-outline" style="width:100%; margin-top:0.6rem;" onclick="deepSearchKtvSongs()">🔍 深度搜尋（呼叫YouTube即時查詢）</button>`;
    }

    // ---------------------------------------------------------------
    // 統一的歌曲卡片產生器：搜尋結果/歷史/熱門排行/我的歷史/我的最愛都共用這個，
    // 一致提供「加入佇列」「插播」「收藏」三個動作按鈕（收藏可以切換收藏/取消收藏）
    // ---------------------------------------------------------------
    function buildSongCard(song, kind, extra) {
        const songData = JSON.stringify({ videoId: song.videoId, title: song.title, thumbnail: song.thumbnail }).replace(/'/g, '&#39;');
        const isFav = userFavoriteVideoIds.has(song.videoId);
        const favBtn = `<button class="ktv-fav-btn" data-video-id="${song.videoId}" onclick='toggleFavoriteSong(${songData})' title="${isFav ? '取消收藏' : '加入最愛歌曲'}">${isFav ? '❤️' : '🤍'}</button>`;
        let subText = '';
        if (kind === 'result') subText = escapeHtmlKtv(song.channelTitle || '');
        else if (kind === 'history' || kind === 'myhistory') subText = escapeHtmlKtv(song.requestedBy || '');
        else if (kind === 'ranking') subText = `被點過 ${song.count || 0} 次`;
        else if (kind === 'favorite') subText = '我收藏的歌';
        const rankBadge = extra && extra.rank ? `<span class="ktv-rank-badge">${extra.rank}</span>` : '';
        return `<div class="ktv-result-card">
            ${rankBadge}
            <img src="${song.thumbnail || ''}" alt="">
            <div class="info">
                <div class="title">${escapeHtmlKtv(song.title)}</div>
                <div class="sub">${subText}</div>
            </div>
            <div class="ktv-card-actions">
                <button class="ktv-add-btn" onclick='addSongToQueue(${songData})'>＋</button>
                <button class="ktv-insert-btn" onclick='addSongToQueue(${songData}, true)'>⚡</button>
                ${favBtn}
            </div>
        </div>`;
    }

    // ---------------------------------------------------------------
    // 點歌：加進房間佇列，同時記一筆房間歷史紀錄（含自己的uid，之後「我的歷史」分頁靠這個過濾），
    // 並更新全域熱門排行計數
    // ---------------------------------------------------------------
    async function addSongToQueue(song, insertNext) {
        if (!currentUser) { alert('請先登入才能點歌'); return; }
        if (!currentRoomId || !currentRoomData) return;
        const entry = {
            qid: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            videoId: song.videoId, title: song.title, thumbnail: song.thumbnail || '',
            requestedBy: await resolveMyDisplayName(), requestedByUid: currentUser.uid,
            addedAt: Date.now(),
        };
        const queue = (currentRoomData.queue || []).slice();
        if (insertNext && queue.length) queue.splice(1, 0, entry); // 插播：排在現正播放的下一首
        else queue.push(entry);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue });
            db.collection('ktvRooms').doc(currentRoomId).collection('history').add({
                videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail,
                requestedBy: entry.requestedBy, requestedByUid: entry.requestedByUid,
                addedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }).catch(err => console.warn('寫入房間歷史紀錄失敗', err));
            db.collection('ktvGlobalSongStats').doc(entry.videoId).set({
                videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail,
                count: firebase.firestore.FieldValue.increment(1),
            }, { merge: true }).catch(err => console.warn('更新熱門排行失敗', err));
            recordUserHistory(entry); // 跨房間的個人歷史歌單，不是只記在這個房間裡
            // 告訴點歌的人自己排第幾位，不是只有跳「點播了什麼」的通知卻不知道還要等多久
            const position = queue.findIndex(q => q.qid === entry.qid) + 1;
            const positionText = position === 1 ? '現在就是你（下一首播放）' : `目前排第 ${position} 位`;
            showKtvToast(`🎵 已加入佇列，${positionText}`);
        } catch (err) {
            alert('點歌失敗：' + err.message);
        }
    }
    async function removeQueueItem(qid) {
        if (!isHost || !currentRoomData) return;
        const queue = (currentRoomData.queue || []).filter(q => q.qid !== qid);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue });
        } catch (err) { console.warn('移除歌曲失敗', err); }
    }

    // ---------------------------------------------------------------
    // 佇列渲染：房主可以拖曳排序（用Pointer Events，滑鼠/觸控都支援），一般成員唯讀
    // ---------------------------------------------------------------
    function renderQueueList(containerId, queue, draggable) {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (!queue.length) { el.innerHTML = '<div class="empty-hint">目前還沒有人點歌</div>'; return; }
        el.innerHTML = queue.map((q, i) => `
            <div class="ktv-queue-item" data-qid="${q.qid}">
                ${draggable ? `<span class="ktv-queue-drag-handle" onpointerdown="startQueueDrag(event, '${q.qid}')">⠿</span>` : ''}
                <img src="${q.thumbnail || ''}" alt="">
                <div class="info" style="flex:1; min-width:0;">
                    <div class="title">${i === 0 ? '▶ ' : ''}${escapeHtmlKtv(q.title)}</div>
                    <div class="sub">${escapeHtmlKtv(q.requestedBy || '')}點的${i === 0 ? '・現正歡唱' : ''}</div>
                </div>
                ${draggable ? `<button class="remove-btn" onclick="removeQueueItem('${q.qid}')" title="移除">✕</button>` : ''}
            </div>
        `).join('');
    }
    // 拖曳排序：用Pointer Events統一處理滑鼠跟觸控，拖完之後依畫面上最終順序整份寫回Firestore
    function startQueueDrag(e, qid) {
        if (!isHost) return;
        e.preventDefault();
        const item = e.target.closest('.ktv-queue-item');
        const list = document.getElementById('host-queue-list');
        const items = () => [...list.querySelectorAll('.ktv-queue-item')];
        item.classList.add('dragging');

        function onMove(ev) {
            const y = ev.clientY;
            const afterEl = items().find(el => {
                if (el === item) return false;
                const rect = el.getBoundingClientRect();
                return y < rect.top + rect.height / 2;
            });
            if (afterEl) list.insertBefore(item, afterEl);
            else list.appendChild(item);
        }
        function onUp() {
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            item.classList.remove('dragging');
            const newOrderQids = items().map(el => el.dataset.qid);
            const queue = currentRoomData.queue || [];
            const reordered = newOrderQids.map(id => queue.find(q => q.qid === id)).filter(Boolean);
            db.collection('ktvRooms').doc(currentRoomId).update({ queue: reordered })
                .catch(err => { console.warn('拖曳排序失敗', err); renderQueueList('host-queue-list', queue, true); });
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
    }

    // ---------------------------------------------------------------
    // 歷史點歌紀錄：這個房間點過的歌，新到舊排列；支援插播
    // ---------------------------------------------------------------
    async function loadHistoryList() {
        const targets = [document.getElementById('host-history-list'), document.getElementById('member-history-list')].filter(Boolean);
        if (!targets.length || !currentRoomId) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvRooms').doc(currentRoomId).collection('history').orderBy('addedAt', 'desc').limit(30).get();
            const html = snap.empty ? '<div class="empty-hint">這個房間還沒有點歌紀錄</div>' : snap.docs.map(doc => buildSongCard(doc.data(), 'history')).join('');
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // 個人歷史歌單：跨房間持續保存(存在ktvUserHistory/{uid}這份文件的entries陣列裡)，
    // 不是房間範圍的資料，換到別人的房間一樣看得到自己過去點過的歌。最多存30筆，
    // 每次點歌都把新的一筆插到最前面，超過30筆就把最舊的壓掉
    async function recordUserHistory(entry) {
        if (!currentUser) return;
        const ref = db.collection('ktvUserHistory').doc(currentUser.uid);
        try {
            const doc = await ref.get();
            let entries = (doc.exists && doc.data().entries) || [];
            entries = entries.filter(e => e.videoId !== entry.videoId); // 同一首歌再點一次，搬到最前面而不是重複列出
            entries.unshift({ videoId: entry.videoId, title: entry.title, thumbnail: entry.thumbnail, addedAt: Date.now() });
            if (entries.length > 30) entries = entries.slice(0, 30); // 只留最新30筆，超過的（舊的）壓掉
            await ref.set({ uid: currentUser.uid, entries }, { merge: true });
        } catch (err) { console.warn('記錄個人歷史歌單失敗', err); }
    }
    async function loadMyHistoryList() {
        const targets = [document.getElementById('host-myhistory-list'), document.getElementById('member-myhistory-list')].filter(Boolean);
        if (!targets.length || !currentUser) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const doc = await db.collection('ktvUserHistory').doc(currentUser.uid).get();
            const entries = (doc.exists && doc.data().entries) || [];
            const html = entries.length ? entries.map(d => buildSongCard(d, 'myhistory')).join('') : '<div class="empty-hint">你還沒有點過任何歌，快去搜尋點歌試試</div>';
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // ---------------------------------------------------------------
    // 熱門點歌排行：全域累計，不分房間、不分時間，依點歌次數排序；支援插播
    // ---------------------------------------------------------------
    async function loadRankingList() {
        const targets = [document.getElementById('host-ranking-list'), document.getElementById('member-ranking-list')].filter(Boolean);
        if (!targets.length) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvGlobalSongStats').orderBy('count', 'desc').limit(100).get();
            const html = snap.empty ? '<div class="empty-hint">還沒有任何點歌紀錄</div>' : snap.docs.map((doc, i) => buildSongCard(doc.data(), 'ranking', { rank: i + 1 })).join('');
            targets.forEach(el => el.innerHTML = html);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    // ---------------------------------------------------------------
    // 個人最愛歌曲：不分房間，跨房間持續保存，房主/成員都能用
    // ---------------------------------------------------------------
    async function loadUserFavoriteIds() {
        if (!currentUser) return;
        try {
            const snap = await db.collection('ktvUserFavorites').where('uid', '==', currentUser.uid).get();
            userFavoriteVideoIds = new Set(snap.docs.map(d => d.data().videoId));
        } catch (err) { console.warn('讀取收藏清單失敗', err); }
    }
    async function toggleFavoriteSong(song) {
        if (!currentUser) { alert('請先登入才能收藏歌曲'); return; }
        const docId = `${currentUser.uid}_${song.videoId}`;
        const ref = db.collection('ktvUserFavorites').doc(docId);
        const willFavorite = !userFavoriteVideoIds.has(song.videoId);
        try {
            if (willFavorite) {
                await ref.set({ uid: currentUser.uid, videoId: song.videoId, title: song.title, thumbnail: song.thumbnail || '', addedAt: firebase.firestore.FieldValue.serverTimestamp() });
                userFavoriteVideoIds.add(song.videoId);
                showKtvToast(`❤️ 已加入最愛歌曲《${song.title}》`);
            } else {
                await ref.delete();
                userFavoriteVideoIds.delete(song.videoId);
                showKtvToast(`🤍 已從最愛歌曲移除《${song.title}》`);
            }
            // 把畫面上所有跟這首歌有關的收藏按鈕（同一首歌可能同時出現在搜尋結果+歷史+排行裡）
            // 都更新圖示，並加上一個跳動動畫，這樣按下去有立即的視覺回饋，不用自己跑去最愛分頁確認有沒有成功
            document.querySelectorAll(`.ktv-fav-btn[data-video-id="${song.videoId}"]`).forEach(btn => {
                btn.textContent = willFavorite ? '❤️' : '🤍';
                btn.title = willFavorite ? '取消收藏' : '加入最愛歌曲';
                btn.classList.remove('fav-pop');
                void btn.offsetWidth; // 強制reflow，讓動畫可以連續重複觸發
                btn.classList.add('fav-pop');
            });
            loadFavoritesList();
        } catch (err) {
            alert('收藏失敗：' + err.message);
        }
    }
    let cachedFavoriteEntries = []; // 快取完整的最愛歌曲清單，搜尋列輸入時直接在前端過濾，不用每次都重新查一次資料庫
    async function loadFavoritesList() {
        const targets = [document.getElementById('host-favorites-list'), document.getElementById('member-favorites-list')].filter(Boolean);
        if (!targets.length || !currentUser) return;
        targets.forEach(el => el.innerHTML = '<div class="empty-hint">載入中...</div>');
        try {
            const snap = await db.collection('ktvUserFavorites').where('uid', '==', currentUser.uid).get();
            const docs = snap.docs.map(d => d.data());
            docs.sort((a, b) => {
                const toMillis = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : 0;
                return toMillis(b.addedAt) - toMillis(a.addedAt);
            });
            cachedFavoriteEntries = docs;
            renderFavoritesList(docs, targets);
        } catch (err) {
            targets.forEach(el => el.innerHTML = `<div class="empty-hint">⚠️ 載入失敗：${escapeHtmlKtv(err.message)}</div>`);
        }
    }
    function renderFavoritesList(docs, targets) {
        const html = docs.length ? docs.map(d => buildSongCard(d, 'favorite')).join('') : '<div class="empty-hint">還沒有收藏任何歌曲，看到喜歡的歌按🤍收藏起來吧</div>';
        (targets || [document.getElementById('host-favorites-list'), document.getElementById('member-favorites-list')].filter(Boolean)).forEach(el => el.innerHTML = html);
    }
    // 最愛歌曲的搜尋列：純前端過濾快取好的清單，不用另外查資料庫
    function filterFavoritesList(who) {
        const term = document.getElementById(`${who}-favorites-search`).value.trim().toLowerCase();
        const filtered = term ? cachedFavoriteEntries.filter(e => (e.title || '').toLowerCase().includes(term)) : cachedFavoriteEntries;
        const target = document.getElementById(`${who}-favorites-list`);
        if (target) renderFavoritesList(filtered, [target]);
    }

    // ---------------------------------------------------------------
    // 房主播放器：跟做菜音樂功能同一招，只用單一影片ID載入播放，這個網站上唯一確認穩定的
    // YouTube嵌入方式，完全不使用YouTube播放清單的嵌入/串接機制
    // ---------------------------------------------------------------
    let ytPlayer = null;
    let ytPlayerReady = false;
    let ytApiReadyPromise = null;
    function loadYoutubeIframeApi() {
        if (ytApiReadyPromise) return ytApiReadyPromise;
        ytApiReadyPromise = new Promise(resolve => {
            if (window.YT && window.YT.Player) { resolve(); return; }
            const prevCallback = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
                if (typeof prevCallback === 'function') prevCallback();
                resolve();
            };
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        });
        return ytApiReadyPromise;
    }
    async function playHostVideo(videoId) {
        await loadYoutubeIframeApi();
        nextUpAnnouncedForVideo = null; // 換新影片了，「快結束提醒」的旗標要重置，不然新歌會被誤判成已經提醒過
        if (!ytPlayer) {
            ytPlayer = new YT.Player('ktv-yt-player-target', {
                width: '100%', height: '100%', videoId,
                playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
                events: {
                    onReady: () => { ytPlayerReady = true; startNextUpPolling(); },
                    onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) advanceQueue(); },
                },
            });
        } else if (ytPlayerReady) {
            ytPlayer.loadVideoById(videoId);
        }
    }
    // 把佇列最前面那首拿掉，接下一首——不管是歌自然播完(ENDED事件)還是房主手動按「切歌」，
    // 都是呼叫這個函式（其他裝置會透過onSnapshot同步收到變化）
    async function advanceQueue() {
        if (!currentRoomData || !currentRoomId) return;
        const newQueue = (currentRoomData.queue || []).slice(1);
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({ queue: newQueue });
        } catch (err) { console.warn('推進佇列失敗', err); }
    }
    // 每秒檢查一次播放進度，剩不到20秒且佇列裡有下一首的話，廣播提醒下一位點歌的人準備。
    // 只有房主端知道實際播放進度，所以這個輪詢/廣播只在房主端執行，其他人透過房間監聽收到廣播
    function startNextUpPolling() {
        if (nextUpPollTimer) clearInterval(nextUpPollTimer);
        nextUpPollTimer = setInterval(() => {
            if (!isHost || !ytPlayer || !ytPlayerReady || !currentRoomData) return;
            try {
                const duration = ytPlayer.getDuration();
                const current = ytPlayer.getCurrentTime();
                if (!duration) return;
                const remaining = duration - current;
                const queue = currentRoomData.queue || [];
                const next = queue[1]; // queue[0]是現在正在唱的，queue[1]才是下一首
                if (remaining <= 20 && remaining > 0 && next && nextUpAnnouncedForVideo !== queue[0].videoId) {
                    nextUpAnnouncedForVideo = queue[0].videoId; // 這首歌只廣播一次，不要每秒重複廣播
                    db.collection('ktvRooms').doc(currentRoomId).update({
                        nextUpAnnouncement: { title: next.title, requestedBy: next.requestedBy, announcedAt: Date.now() },
                    }).catch(err => console.warn('廣播下一位提醒失敗', err));
                }
            } catch (err) {}
        }, 1000);
    }

    // ---------------------------------------------------------------
    // 命運輪盤：任何人都能發起，輸入一個「事件」文字，轉盤上是目前房間裡所有人的暱稱，
    // 轉出來的結果全部裝置都會同步收到通知。結果存在房間文件的wheelEvent欄位（不是子集合，
    // 因為同一時間只會有一場輪盤在進行），任何人的動作變化都會透過房間監聽同步給所有人
    // ---------------------------------------------------------------
    let wheelUnsubscribe = null;
    const WHEEL_OUTCOME_LABELS = {
        1: '轉盤正常停下', 2: '轉盤衝過頭又彈回來', 3: '發生了空間轉移！',
        4: '指針突然彎曲指向隔壁', 5: '指針突然變長指向對面', 6: '一陣風吹來，重新轉動了一次',
        7: '轉盤越轉越快，整個滾走了',
    };
    function openWheelModal() {
        const modal = document.getElementById(isHost ? 'wheel-modal' : 'member-wheel-modal');
        if (modal) modal.classList.remove('hidden');
        renderWheelUI(currentRoomData && currentRoomData.wheelEvent);
    }
    function closeWheelModal() {
        ['wheel-modal', 'member-wheel-modal'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });
    }
    // 發起輪盤：把目前房間裡的所有成員名單（房主+全部成員的暱稱）存進wheelEvent，
    // 這份名單在整場輪盤期間固定不變，不會因為有人中途離開/加入而改變轉盤上的名字
    async function submitWheelEvent() {
        if (!currentUser || !currentRoomId) return;
        const input = document.getElementById(isHost ? 'wheel-event-input' : 'member-wheel-event-input');
        const eventText = input ? input.value.trim() : '';
        if (!eventText) { showKtvToast('⚠️ 請輸入這次輪盤的事件內容'); return; }
        try {
            const membersSnap = await db.collection('ktvRooms').doc(currentRoomId).collection('members').get();
            const participants = membersSnap.docs.map(d => ({ uid: d.id, name: d.data().name || '匿名' }));
            // 人數不足的提示改用跟其他通知一樣的toast，不要用原生alert()——瀏覽器的alert()是
            // 系統層級的對話框，跳出來會強制把頁面踢出全螢幕，這是之前「訊息跳出來就離開全螢幕」
            // 這個問題的原因
            if (participants.length < 2) { showKtvToast('⚠️ 房間裡至少要有2個人才能轉輪盤'); return; }
            const myName = await resolveMyDisplayName();
            await db.collection('ktvRooms').doc(currentRoomId).update({
                wheelEvent: {
                    active: true, phase: 'waiting',
                    initiatedBy: myName, initiatedByUid: currentUser.uid,
                    eventText, participants,
                    outcomeType: null, resultUid: null, resultName: null, spinToken: null,
                },
            });
        } catch (err) {
            showKtvToast('⚠️ 發起輪盤失敗：' + err.message);
        }
    }
    // 每一種特效結果的「總時長」(毫秒)，全部裝置都是照這個時間各自倒數顯示結果通知，
    // 不再依賴「動畫播完之後由某一台裝置負責廣播」這種容易漏掉的做法——這是之前
    // 「只有正常轉停有通知」的bug根源：其他六種特效各自的動畫流程比較複雜（有些甚至還有
    // 巢狀的setTimeout），只要中間任何一步出錯或邏輯漏接，負責廣播的那一步就永遠不會執行到。
    // 現在改成：轉動的當下就已經決定好最終結果並廣播出去，動畫只是「演給大家看」，
    // 通知本身不依賴動畫有沒有順利播完
    const WHEEL_OUTCOME_DURATION = { 1: 4700, 2: 5700, 3: 4700, 4: 5700, 5: 5400, 6: 7700, 7: 6200 };
    const WHEEL_COLORS = ['#A8324A','#C98A2C','#6F8C6E','#5B7A96','#7A1F35','#8A5A28','#3A6B5A','#4A5B7A','#9C4A6A','#B08A3C','#5A7A9C','#7A9C5A'];
    // 轉動：任何人都可以按，在這裡就直接決定好「最終結果」（哪一種特效、最後中獎的是誰），
    // 立刻整包廣播出去。彎曲指到隔壁/往回彈變鄰居這幾種特效，都會讓「最終結果」跟「一開始
    // 隨機選到的那一格」不一樣（改成隔壁/前一格），確保動畫演的方向跟公布的結果是一致的
    async function spinWheelNow() {
        if (!currentRoomData || !currentRoomData.wheelEvent || !currentRoomId) return;
        const participants = currentRoomData.wheelEvent.participants || [];
        const n = participants.length;
        if (n < 2) return;
        const outcomeType = Math.floor(Math.random() * 7) + 1;
        const baseIndex = Math.floor(Math.random() * n);
        let finalIndex = baseIndex;
        let noWinner = false;
        if (outcomeType === 2) finalIndex = (baseIndex - 1 + n) % n; // 往回彈：落在baseIndex的前一格交界，彈回前一位
        else if (outcomeType === 4) finalIndex = (baseIndex + 1) % n; // 指針彎曲：落在baseIndex的後一格交界，彎向後一位
        else if (outcomeType === 5) finalIndex = (baseIndex + Math.floor(n / 2)) % n; // 指針變長：對面那一位
        else if (outcomeType === 6) finalIndex = (baseIndex + 1 + Math.floor(Math.random() * (n - 1))) % n; // 一陣風重轉：換一個不同的人
        else if (outcomeType === 7) noWinner = true; // 轉盤滾走：沒有人中獎
        const finalName = noWinner ? null : participants[finalIndex].name;
        const finalUid = noWinner ? null : participants[finalIndex].uid;
        try {
            await db.collection('ktvRooms').doc(currentRoomId).update({
                'wheelEvent.phase': 'spinning',
                'wheelEvent.outcomeType': outcomeType,
                'wheelEvent.baseResultIndex': baseIndex,
                'wheelEvent.resultUid': finalUid,
                'wheelEvent.resultName': finalName,
                'wheelEvent.noWinner': noWinner,
                'wheelEvent.spinToken': `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            });
        } catch (err) { console.warn('轉動輪盤失敗', err); }
    }
    // 依照wheelEvent目前的狀態(phase)決定畫面要顯示輸入表單、還是轉盤。骨架只在第一次
    // 建立canvas的時候畫出來，之後同一場輪盤期間資料更新都不會重新蓋掉整個容器，
    // 避免把正在跑的canvas動畫打斷
    function renderWheelUI(wheelEvent) {
        const container = document.getElementById(isHost ? 'wheel-modal-inner' : 'member-wheel-modal-inner');
        if (!container) return;
        const canvasId = isHost ? 'wheel-canvas' : 'member-wheel-canvas';
        const pointerId = isHost ? 'wheel-pointer' : 'member-wheel-pointer';
        const oppPointerId = isHost ? 'wheel-pointer-opposite' : 'member-wheel-pointer-opposite';

        if (!wheelEvent || !wheelEvent.active) {
            container.innerHTML = `
                <h3 style="font-size:1.15rem; font-weight:800; margin-bottom:0.4rem;">🎡 命運輪盤</h3>
                <p style="font-size:0.78rem; opacity:0.8; margin-bottom:0.5rem;">輸入這次輪盤要決定的事件，轉盤上會是目前房間裡所有人的暱稱</p>
                <div class="wheel-input-row">
                    <input id="${isHost ? 'wheel-event-input' : 'member-wheel-event-input'}" type="text" placeholder="例如：下一句接著唱">
                    <button class="btn" onclick="submitWheelEvent()">送出</button>
                </div>
                <button onclick="closeWheelModal()" style="margin-top:1rem; background:none; border:none; color:rgba(255,255,255,0.7); font-size:0.76rem; cursor:pointer;">關閉</button>
            `;
            return;
        }
        if (!document.getElementById(canvasId)) {
            container.innerHTML = `
                <h3 style="font-size:1.05rem; font-weight:800; margin-bottom:0.2rem;">🎡 ${escapeHtmlKtv(wheelEvent.initiatedBy)} 發起了命運輪盤</h3>
                <p style="font-size:0.85rem; margin-bottom:0.5rem;">事件：<strong>${escapeHtmlKtv(wheelEvent.eventText)}</strong></p>
                <div class="wheel-dial-wrap" id="wheel-dial-wrap">
                    <div id="${pointerId}"></div>
                    <div id="${oppPointerId}"></div>
                    <canvas id="${canvasId}" width="216" height="216"></canvas>
                </div>
                <p class="wheel-result-banner" id="wheel-status-text"></p>
                <button class="btn" style="width:100%; margin-top:0.2rem;" id="wheel-spin-btn" onclick="spinWheelNow()">🎯 命運轉動</button>
                <button onclick="closeWheelModal()" style="margin-top:0.7rem; background:none; border:none; color:rgba(255,255,255,0.7); font-size:0.76rem; cursor:pointer;">關閉（輪盤還會繼續進行）</button>
            `;
            drawWheelCanvas(canvasId, wheelEvent.participants, 0);
        }
        const spinBtn = document.getElementById('wheel-spin-btn');
        if (spinBtn) spinBtn.style.display = wheelEvent.phase === 'waiting' ? '' : 'none';

        if (wheelEvent.phase === 'spinning' && wheelEvent.spinToken && wheelEvent.spinToken !== lastPlayedWheelSpinToken) {
            lastPlayedWheelSpinToken = wheelEvent.spinToken;
            playWheelSpinAnimation(wheelEvent);
        }
    }
    let lastPlayedWheelSpinToken = null;
    // 用canvas畫轉盤：每個人固定分到大小相等的扇形，各自不同顏色，文字用canvas畫、
    // 會跟著扇形角度自然排列，不會像疊HTML文字那樣模糊、對不準扇形
    function drawWheelCanvas(canvasId, participants, rotationDeg, overrideNames) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, radius = W / 2;
        const n = participants.length;
        const anglePerSeg = (2 * Math.PI) / n;
        const rotRad = (rotationDeg * Math.PI) / 180;
        ctx.clearRect(0, 0, W, W);
        for (let i = 0; i < n; i++) {
            const start = rotRad + i * anglePerSeg - Math.PI / 2; // -90度讓角度0從正上方(指針位置)開始算
            const end = start + anglePerSeg;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius - 3, start, end);
            ctx.closePath();
            ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
            ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1a120a'; ctx.stroke();
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(start + anglePerSeg / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px "Noto Sans TC", sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 3;
            const name = (overrideNames && overrideNames[i]) || participants[i].name;
            ctx.fillText(name.length > 6 ? name.slice(0, 6) + '…' : name, radius - 12, 4);
            ctx.restore();
        }
        ctx.beginPath(); ctx.arc(radius, radius, 14, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
    }
    // 七種特效結果的實際動畫播放。每個裝置各自根據廣播來的outcomeType/baseResultIndex/
    // resultName自己算動畫、自己播放，最終結果字（誰中獎）全部裝置都一樣（在spinWheelNow()
    // 就已經決定好了），只是動畫過程細節不強求每一台裝置完全一致
    function playWheelSpinAnimation(wheelEvent) {
        const canvasId = isHost ? 'wheel-canvas' : 'member-wheel-canvas';
        const pointer = document.getElementById(isHost ? 'wheel-pointer' : 'member-wheel-pointer');
        const oppPointer = document.getElementById(isHost ? 'wheel-pointer-opposite' : 'member-wheel-pointer-opposite');
        const dialWrap = document.getElementById('wheel-dial-wrap');
        const statusText = document.getElementById('wheel-status-text');
        const canvas = document.getElementById(canvasId);
        if (!canvas || !pointer) return;
        pointer.style.opacity = '1';
        pointer.style.transform = 'translateX(-50%) rotate(0deg)';
        if (oppPointer) oppPointer.classList.remove('show');
        if (dialWrap) { dialWrap.style.transition = ''; dialWrap.style.transform = ''; }

        const participants = wheelEvent.participants || [];
        const n = participants.length;
        const segAngle = 360 / n;
        const baseIndex = wheelEvent.baseResultIndex || 0;
        const outcomeType = wheelEvent.outcomeType || 1;
        // 圈數跟總轉動時間都加一點隨機浮動，每次轉起來速度感覺不會完全一樣，比較不死板
        const spins = 5 + Math.floor(Math.random() * 4);
        const spinMs = 3600 + Math.floor(Math.random() * 900);

        // 乾淨、可驗證的角度計算：給一個目標格子索引，算出「絕對旋轉角度」，保證(1)一定比
        // minAfterDeg大(確保動畫是往同一個方向繼續轉，不會突然反方向跳)、(2)一定精準對齊
        // 讓那個格子的中心真的落在指針底下。之前用「currentRot加減一段公式」手動推算，很容易
        // 算錯（一陣風重轉、往回彈這兩個特效之前的視覺結果跟廣播結果對不起來，就是這樣算錯的），
        // 現在統一都用這個函式算，不用再手動兜公式
        function angleForIndex(idx, offsetWithinSeg, minAfterDeg, extraSpins) {
            const offset = offsetWithinSeg === undefined ? 0.5 : offsetWithinSeg; // 0~1，0.5是正中央
            const targetMod = (((-(idx * segAngle + segAngle * offset)) % 360) + 360) % 360;
            const baseCount = Math.ceil(((minAfterDeg || 0) - targetMod) / 360);
            return (baseCount + (extraSpins || 0)) * 360 + targetMod;
        }

        // 正常停止的時候，落點不要每次都精準卡在格子正中央——那樣每次停在同一個人身上時，
        // 指針位置都長得一模一樣，會顯得死板不自然。改成在格子範圍內隨機取一個位置
        // (避開太靠近邊緣、容易誤判成別格的範圍)，看起來比較像真實轉盤會有的隨機感
        const normalOffset = 0.25 + Math.random() * 0.5; // 落在格子中間偏一點的範圍內，不會太靠邊界

        let landingDeg;
        if (outcomeType === 2) landingDeg = angleForIndex(baseIndex, 0.5, 0, spins); // 先讓人以為要停在baseIndex，等一下才彈到鄰居
        else if (outcomeType === 4) landingDeg = angleForIndex(baseIndex, 0.5 + 0.42, 0, spins); // 落在baseIndex靠近後一格邊界那一側，等一下指針彎過去
        else landingDeg = angleForIndex(baseIndex, normalOffset, 0, spins);

        let currentRot = 0;
        const targetRot = landingDeg;
        const startTime = Date.now();
        function animateMainSpin() {
            const t = Math.min((Date.now() - startTime) / spinMs, 1);
            const eased = 1 - Math.pow(1 - t, 3); // ease-out
            currentRot = targetRot * eased;
            drawWheelCanvas(canvasId, participants, currentRot);
            if (t < 1) requestAnimationFrame(animateMainSpin);
            else onMainSpinDone();
        }
        requestAnimationFrame(animateMainSpin);

        function onMainSpinDone() {
            if (outcomeType === 2) {
                // 先明顯衝過交界線一點(繼續往同方向多轉一小段，看起來像要越過baseIndex)，
                // 再彈回鄰居格子中央定案——鄰居的角度一樣用angleForIndex算，保證跟最終
                // 公布的resultName對得起來
                const neighborIdx = (baseIndex - 1 + n) % n;
                const overshoot = currentRot + segAngle * 0.55;
                const bounceBack = angleForIndex(neighborIdx, 0.5, overshoot);
                animateTween(canvasId, participants, currentRot, overshoot, 380, () => {
                    animateTween(canvasId, participants, overshoot, bounceBack, 480, () => finishAfterDelay());
                });
            } else if (outcomeType === 3) {
                // 空間轉移：交換另外兩個(不是中獎者)的名字文字，純視覺效果，中獎結果不變
                const others = [...Array(n).keys()].filter(i => i !== baseIndex);
                let overrideNames = null;
                if (others.length >= 2) {
                    const a = others[Math.floor(Math.random() * others.length)];
                    let b = others[Math.floor(Math.random() * others.length)];
                    if (b === a) b = others[(others.indexOf(a) + 1) % others.length];
                    overrideNames = participants.map(p => p.name);
                    const tmp = overrideNames[a]; overrideNames[a] = overrideNames[b]; overrideNames[b] = tmp;
                }
                drawWheelCanvas(canvasId, participants, currentRot, overrideNames);
                if (statusText) statusText.textContent = '✨ 發生了空間轉移！';
                finishAfterDelay();
            } else if (outcomeType === 4) {
                // 指針先小幅度左右搖擺猶豫一下（增加緊張感），最後才彎向鄰居格子那一側定案
                pointer.style.transition = 'transform 0.18s ease-in-out';
                pointer.style.transform = 'translateX(-50%) rotate(-10deg)';
                setTimeout(() => { pointer.style.transform = 'translateX(-50%) rotate(14deg)'; }, 180);
                setTimeout(() => {
                    pointer.style.transition = 'transform 0.5s cubic-bezier(.34,1.56,.64,1)';
                    pointer.style.transform = 'translateX(-50%) rotate(30deg)';
                }, 380);
                finishAfterDelay(900);
            } else if (outcomeType === 5) {
                // 原本朝上的指針縮小消失，底部的指針同時放大冒出來，感覺像同一根指針「移到」對面，
                // 不會同時看到兩根都很明顯的指針
                pointer.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
                pointer.style.transform = 'translateX(-50%) scale(0)';
                pointer.style.opacity = '0';
                if (oppPointer) oppPointer.classList.add('show');
                finishAfterDelay(600);
            } else if (outcomeType === 6) {
                if (statusText) statusText.textContent = '🌬️ 一陣風吹來了...';
                setTimeout(() => {
                    // 用wheelEvent裡已經決定好的resultUid反推它在participants的位置，用乾淨的
                    // angleForIndex算出正確角度直接轉到那格——之前這裡手動兜公式算錯了
                    // (currentRot的餘數被重複算了一次)，導致畫面停的位置跟廣播出去的結果對不起來
                    const targetIdx = participants.findIndex(p => p.uid === wheelEvent.resultUid);
                    const idx = targetIdx >= 0 ? targetIdx : baseIndex;
                    const newTarget = angleForIndex(idx, 0.5, currentRot, 2);
                    animateTween(canvasId, participants, currentRot, newTarget, 2000, () => finishAfterDelay());
                }, 900);
            } else if (outcomeType === 7) {
                if (statusText) statusText.textContent = '💨 轉盤越轉越快...';
                let flyRot = currentRot;
                const flyStart = Date.now();
                if (dialWrap) {
                    dialWrap.style.transition = 'transform 1.4s cubic-bezier(.5,-0.3,.9,.4)';
                    dialWrap.style.transform = 'translate(130vw, -15vh) rotate(60deg)';
                }
                (function flySpin() {
                    const elapsed = Date.now() - flyStart;
                    if (elapsed > 1400) { finishAfterDelay(); return; }
                    flyRot += 25; // 飛走的同時持續加速旋轉，不是凍結畫面
                    drawWheelCanvas(canvasId, participants, flyRot);
                    requestAnimationFrame(flySpin);
                })();
                if (statusText) setTimeout(() => { statusText.textContent = '😱 轉盤直接滾走了！'; }, 500);
            } else {
                finishAfterDelay();
            }
        }
        // 動畫的最後一步只更新畫面上的小字提示，真正「跳出右上角通知」的時機統一交給
        // handleWheelEventUpdate()按照這個特效類型固定的時長處理，不是這裡自己決定，
        // 這樣才能確保全部裝置的通知時機一致，也不會因為這支動畫函式中途出錯而漏發通知
        function finishAfterDelay(extraDelayMs) {
            setTimeout(() => {
                if (statusText) statusText.textContent = wheelEvent.noWinner ? '😱 沒有人被選中！' : `🎯 命運之神決定了：${wheelEvent.resultName}`;
            }, extraDelayMs || 0);
        }
    }
    // 小工具：讓canvas從一個角度平滑轉到另一個角度，給彈回/重轉這種需要中途轉一小段的效果用
    function animateTween(canvasId, participants, fromDeg, toDeg, durationMs, onDone) {
        const start = Date.now();
        function step() {
            const t = Math.min((Date.now() - start) / durationMs, 1);
            const eased = t < 1 ? 1 - Math.pow(1 - t, 2) : 1;
            const deg = fromDeg + (toDeg - fromDeg) * eased;
            drawWheelCanvas(canvasId, participants, deg);
            if (t < 1) requestAnimationFrame(step);
            else if (onDone) onDone();
        }
        requestAnimationFrame(step);
    }
    // 監聽wheelEvent：不管是誰的裝置，只要偵測到新的spinToken，就照這個特效類型對應的
    // 固定時長，自己倒數、自己跳出「命運之神決定了...」的通知——不依賴某一台裝置的動畫
    // 有沒有順利播完，這是這次修正「其他六種特效都沒有通知」的關鍵改動
    let lastScheduledWheelToken = null;
    function handleWheelEventUpdate(wheelEvent) {
        if (!wheelEvent || !wheelEvent.active) return;
        if (wheelEvent.phase === 'spinning' && wheelEvent.spinToken && wheelEvent.spinToken !== lastScheduledWheelToken) {
            lastScheduledWheelToken = wheelEvent.spinToken;
            const duration = WHEEL_OUTCOME_DURATION[wheelEvent.outcomeType] || 4700;
            // 動畫播完之後等1秒，先把輪盤視窗關掉，再跳出右上角通知——不是通知先跳、視窗
            // 隔幾秒才慢慢關掉，這樣結果公布跟畫面收起來的節奏比較乾脆
            setTimeout(() => {
                setTimeout(() => {
                    closeWheelModal();
                    const msg = wheelEvent.noWinner
                        ? `😱 命運之神也沒轍！沒有人被選中，${wheelEvent.initiatedBy} 只好自己來：${wheelEvent.eventText}`
                        : `🎯 命運之神決定了：${wheelEvent.resultName} ${wheelEvent.eventText}`;
                    showKtvToast(msg);
                }, 1000);
            }, duration);
            // 只有發起人的裝置負責在結果公布之後把輪盤狀態收掉，恢復成可以重新發起，
            // 避免每台裝置都各自嘗試寫入造成衝突
            if (currentUser && currentUser.uid === wheelEvent.initiatedByUid) {
                setTimeout(() => {
                    db.collection('ktvRooms').doc(currentRoomId).update({ wheelEvent: { active: false } }).catch(() => {});
                }, duration + 1500);
            }
        }
        const modal = document.getElementById(isHost ? 'wheel-modal' : 'member-wheel-modal');
        if (modal && !modal.classList.contains('hidden')) renderWheelUI(wheelEvent);
    }
</script>
