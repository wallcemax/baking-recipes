<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>車泊趣 - JUST DO EAT</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
    /* ============================================================
       設計主題：星空營火（Night Campsite）
       想像坐在營火旁，跟認識很久的車泊老朋友聊天——深夜星空是舞台，
       營火的暖橘光是唯一的溫暖來源，山巒剪影是安靜的背景。
       這不是食譜網站的暖色紙感，是屬於車泊、屬於夜晚公路的另一種調性。
       ============================================================ */
    :root {
        --night: #0B1526;        /* 最深的夜空 */
        --night-mid: #16233D;    /* 夜空漸層中段 */
        --panel: #1C2C4A;        /* 卡片/面板底色，比夜空稍亮一階 */
        --panel-soft: #24365a;   /* 卡片內的次層元素 */
        --ember: #F2994A;        /* 營火暖橘，主要強調色 */
        --ember-hot: #EB5E28;    /* 熾焰橘紅，行動按鈕/重點 */
        --starlight: #EAF2F5;    /* 星光白，主要文字 */
        --dim: #8B9DB5;          /* 夜霧藍灰，次要文字 */
        --moss: #52A37C;         /* 苔蘚綠，自然/成功狀態 */
        --danger: #E8604C;
        --line: rgba(234,242,245,0.1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        margin: 0; min-height: 100vh; color: var(--starlight);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(ellipse 120% 60% at 50% 0%, var(--night-mid) 0%, var(--night) 55%);
        position: relative; overflow-x: hidden;
    }
    .display-font { font-family: 'Kalam', 'Noto Sans TC', cursive; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .hidden { display: none !important; }

    /* ---------- 簽名視覺元素：滿版星空 ---------- */
    #starfield {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image:
            radial-gradient(1.5px 1.5px at 20px 30px, rgba(234,242,245,0.9), transparent),
            radial-gradient(1px 1px at 90px 80px, rgba(234,242,245,0.7), transparent),
            radial-gradient(1.5px 1.5px at 160px 40px, rgba(234,242,245,0.8), transparent),
            radial-gradient(1px 1px at 210px 110px, rgba(234,242,245,0.6), transparent),
            radial-gradient(1.5px 1.5px at 270px 20px, rgba(234,242,245,0.9), transparent),
            radial-gradient(1px 1px at 320px 90px, rgba(234,242,245,0.5), transparent),
            radial-gradient(1.5px 1.5px at 40px 150px, rgba(234,242,245,0.7), transparent),
            radial-gradient(1px 1px at 130px 180px, rgba(234,242,245,0.6), transparent),
            radial-gradient(1.5px 1.5px at 240px 160px, rgba(234,242,245,0.8), transparent),
            radial-gradient(1px 1px at 350px 200px, rgba(234,242,245,0.5), transparent);
        background-size: 400px 220px; background-repeat: repeat;
        animation: twinkle 4s ease-in-out infinite alternate;
        opacity: 0.65;
    }
    @keyframes twinkle { from { opacity: 0.45; } to { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { #starfield { animation: none; opacity: 0.65; } }

    /* ---------- 簽名視覺元素：底部山巒剪影(固定不動，安靜的地平線) ---------- */
    #mountains {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none;
        height: 14vh; min-height: 90px;
    }
    #mountains svg { width: 100%; height: 100%; display: block; }

    /* ---------- 簽名視覺元素：營火光暈(呼吸般的明滅，聊天輸入框旁的溫暖光源) ---------- */
    #campfire-glow {
        position: fixed; left: 50%; bottom: -6rem; transform: translateX(-50%); z-index: 1; pointer-events: none;
        width: 32rem; height: 20rem; border-radius: 50%;
        background: radial-gradient(circle, rgba(242,153,74,0.35) 0%, rgba(235,94,40,0.12) 40%, transparent 70%);
        animation: flicker 3.2s ease-in-out infinite;
    }
    @keyframes flicker {
        0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) { #campfire-glow { animation: none; opacity: 0.85; } }

    /* ---------- 內容層(在星空/山巒之上) ---------- */
    .content-layer { position: relative; z-index: 2; }

    input[type="text"] {
        width: 100%; padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--line);
        background: var(--panel-soft); font-size: 0.9rem; color: var(--starlight);
    }
    input[type="text"]::placeholder { color: var(--dim); }
    input[type="text"]:focus { outline: none; border-color: var(--ember); }
    .btn {
        padding: 0.7rem 1.2rem; border-radius: 999px; border: none;
        background: linear-gradient(135deg, var(--ember), var(--ember-hot)); color: #1A0F08;
        font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap;
        box-shadow: 0 4px 14px -4px rgba(235,94,40,0.5);
    }
    .btn-outline { background: transparent; color: var(--ember); border: 1px solid var(--ember); box-shadow: none; }
    .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }

    header { text-align: center; padding: 2rem 1.25rem 1rem; }
    header .eyebrow { color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.3rem; }
    header h1 {
        font-size: 2rem; margin: 0 0 0.4rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        text-shadow: 0 0 20px rgba(242,153,74,0.4);
    }
    header h1 img { width: 1.8rem; height: 1.8rem; object-fit: contain; filter: drop-shadow(0 0 8px rgba(242,153,74,0.6)); }
    header a { color: var(--dim); font-size: 0.8rem; text-decoration: none; }
    header a:hover { color: var(--ember); }

    #login-gate {
        max-width: 24rem; margin: 4rem auto; padding: 2.2rem 1.8rem; background: var(--panel);
        border-radius: 1.5rem; text-align: center; border: 1px solid var(--line);
        box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    }
    #login-gate p { color: var(--dim); font-size: 0.9rem; margin-bottom: 1.3rem; line-height: 1.6; }

    #carcamp-root { max-width: 40rem; margin: 0 auto; padding: 0 1.25rem 8rem; }

    /* ---------- 定位狀態列：像GPS座標讀數 ---------- */
    #location-status {
        display: flex; align-items: center; gap: 0.5rem; background: var(--panel);
        border: 1px solid var(--line); border-radius: 1.1rem; padding: 0.7rem 1rem; margin-bottom: 1rem;
        font-size: 0.82rem; color: var(--dim);
    }
    #location-status.ready { color: var(--moss); border-color: rgba(82,163,124,0.3); }
    #location-status button { margin-left: auto; }

    /* ---------- 地圖來源管理：像裝備清單 ---------- */
    #sources-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1.2rem; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    #sources-panel summary { cursor: pointer; font-weight: 700; font-size: 0.95rem; color: var(--starlight); }
    #sources-panel summary::marker { color: var(--ember); }
    .source-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); font-size: 0.82rem; }
    .source-item:last-child { border-bottom: none; }
    .source-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-item .status-badge { font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 999px; background: var(--panel-soft); color: var(--dim); }
    .source-item .status-badge.ready { background: rgba(82,163,124,0.15); color: var(--moss); }
    .source-item .status-badge.error { background: rgba(232,96,76,0.15); color: var(--danger); }
    #add-source-form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }

    /* ---------- 對話區：營火旁的閒聊 ---------- */
    #chat-log { display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.2rem; min-height: 4rem; }
    .chat-bubble { padding: 0.85rem 1.1rem; border-radius: 1.2rem; font-size: 0.9rem; line-height: 1.6; max-width: 88%; }
    .chat-bubble.user {
        align-self: flex-end; background: linear-gradient(135deg, var(--ember), var(--ember-hot));
        color: #1A0F08; font-weight: 500; border-bottom-right-radius: 0.3rem;
        box-shadow: 0 6px 18px -6px rgba(235,94,40,0.4);
    }
    .chat-bubble.ai {
        align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
        border-bottom-left-radius: 0.3rem; box-shadow: 0 6px 18px -6px rgba(0,0,0,0.35);
    }
    .chat-bubble.loading { align-self: flex-start; color: var(--dim); font-style: italic; }

    /* ---------- 目前對話錨點提示：像隨身指南針，讓使用者知道AI現在鎖定在哪 ---------- */
    #anchor-chip {
        display: inline-flex; align-items: center; gap: 0.5rem; background: var(--panel-soft, var(--panel));
        border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.9rem; margin-bottom: 0.7rem;
        font-size: 0.78rem; color: var(--dim); align-self: flex-start;
    }
    #anchor-chip button {
        background: none; border: none; color: var(--dim); cursor: pointer; font-size: 0.85rem;
        line-height: 1; padding: 0 0.15rem;
    }
    #anchor-chip button:hover { color: var(--ember); }

    #question-form { display: flex; gap: 0.6rem; margin-bottom: 1.4rem; position: sticky; bottom: 1rem; z-index: 3; }
    #question-form input { flex: 1; }

    /* ---------- 地圖顯示：像探險家的地圖 ---------- */
    #map-container {
        width: 100%; height: 22rem; border-radius: 1.2rem; overflow: hidden; background: var(--panel);
        margin-bottom: 1rem; border: 1px solid var(--line); box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    }
    #places-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .place-card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 0.85rem 1.05rem;
        box-shadow: 0 6px 18px -6px rgba(0,0,0,0.3); cursor: pointer; transition: border-color 0.15s;
    }
    .place-card:hover { border-color: var(--ember); }
    .place-card .name { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.25rem; color: var(--starlight); }
    .place-card .reason { font-size: 0.8rem; color: var(--dim); }
</style>
</head>
<body>

<div id="starfield"></div>
<div id="mountains">
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none">
        <polygon points="0,200 0,130 180,50 340,110 520,30 700,100 860,45 1040,120 1220,60 1440,110 1440,200" fill="#111d33"/>
        <polygon points="0,200 0,160 220,90 460,150 680,80 920,145 1160,95 1440,150 1440,200" fill="#0d1626"/>
    </svg>
</div>
<div id="campfire-glow"></div>

<div class="content-layer">
<header>
    <p class="eyebrow">JUST DO EAT</p>
    <h1 class="display-font"><img src="https://res.cloudinary.com/bumzwp9g/image/upload/v1787555200/caravan_430750_hwe5jm.png" alt="">車泊趣</h1>
    <a href="index.html">← 回主站</a>
</header>

<div id="login-gate" class="hidden">
    <p>登入後才能使用車泊趣，查詢你自己新增的地圖資料</p>
    <button class="btn" onclick="carcampGoogleLogin()">使用 Google 帳號登入</button>
</div>

<div id="carcamp-root" class="hidden">
    <div id="location-status">
        <span id="location-status-text">📍 正在取得你的位置...</span>
        <button class="btn btn-outline" style="display:none;" id="retry-location-btn" onclick="requestLocation()">重新定位</button>
    </div>

    <details id="sources-panel">
        <summary>🗺️ 地圖來源管理</summary>
        <div id="sources-list" style="margin-top:0.8rem;"></div>
        <button class="btn btn-outline hidden" id="seed-default-btn" style="margin-top:0.6rem; width:100%;" onclick="carcampSeedDefault()">一鍵設定地圖（車床天地總圖）</button>
        <div id="add-source-form">
            <input type="text" id="new-source-name" placeholder="幫這份地圖取個名字">
            <input type="text" id="new-source-url" placeholder="貼上 Google 我的地圖分享連結">
            <button class="btn" onclick="carcampAddSource()">新增我的私人地圖</button>
        </div>
    </details>

    <div id="chat-log"></div>

    <div id="anchor-chip" class="hidden">
        <span id="anchor-chip-text"></span>
        <button type="button" onclick="carcampClearAnchor()" title="不是這裡？點掉讓我改用你目前的位置">✕</button>
    </div>

    <form id="question-form" onsubmit="carcampAskQuestion(event)">
        <input type="text" id="question-input" placeholder="今晚可以車泊睡哪？" autocomplete="off">
        <button class="btn" type="submit">送出</button>
    </form>

    <div id="map-container"></div>
    <div id="places-list"></div>
</div>
</div>

<script>
    // ---------------------------------------------------------------
    // Firebase初始化：跟主站(index.html)用同一份設定，共用同一個登入狀態
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
        authDomain: "recipe-synchronization.firebaseapp.com",
        projectId: "recipe-synchronization",
        storageBucket: "recipe-synchronization.firebasestorage.app",
        messagingSenderId: "559668909743",
        appId: "1:559668909743:web:63dc34572b98839479265a"
    };
    firebase.initializeApp(firebaseConfig);
    const carcampAuth = firebase.auth();
    const CLOUDFLARE_AI_PROXY_URL = 'https://baking-recipes-ai.wallcemax.workers.dev/';

    // TODO: 換成你自己申請的Google Maps JavaScript API金鑰(免信用卡的示範金鑰即可先測試)，
    // 申請方式請見交付文件裡的「Google Maps API金鑰申請步驟」
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAVrKwugAJB9-x46a98jXQV-R4yKpJQPAs';

    let carcampCurrentUser = null;
    let carcampUserLat = null;
    let carcampUserLng = null;
    let carcampMap = null;
    let carcampMarkers = [];
    let carcampSourcesCache = [];

    // ---------------------------------------------------------------
    // 對話記憶：只存在瀏覽器記憶體裡（純前端陣列，不寫進Firestore、不佔任何資料庫成本），
    // 頁面重新整理或登出就會自然清空——這本來就符合「記得這場對話最近聊過什麼」的需求，
    // 不需要跨裝置/跨天保存。每筆只存「question(裁到60字)」+「answer摘要(裁到100字)+
    // 推薦地點名稱」，不存完整的AI長篇回答內容，這樣即使聊到第10輪，附加在prompt裡的
    // 歷史紀錄總長度還是控制在小範圍內，不會讓AI呼叫的token用量隨對話輪數線性爆增。
    // 最多只保留最近10筆，超過就把最舊的丟掉(見下方carcampAskQuestion裡的shift())。
    // ---------------------------------------------------------------
    const CARCAMP_HISTORY_MAX_TURNS = 10;
    let carcampHistory = [];

    // 上一輪查詢實際定位到的地點錨點(Worker回傳的debug.anchor)，用來讓「沒提地名的追問」
    // (例如問完「雲林口湖」之後接著問「那還有哪些」)能延續同一個地方，而不是被Worker誤判成
    // 「這次沒提地名」就退回使用者的GPS位置——詳細原因見worker.js裡carcampResolveLocationAnchor
    // 的相關註解。只存最基本的lat/lng/locationName，不是完整物件，跟history一樣輕量。
    let carcampLastAnchor = null;

    // 目前對話錨點提示：把carcampLastAnchor視覺化成一個小標籤，貼在輸入框上面，讓使用者
    // 隨時知道AI現在心裡認定「你在講哪裡」，不用等答案文不對題才發現AI猜錯了地方。
    // 只有在anchor有locationName(代表是靠地名解析出來的，不是單純GPS)時才顯示——
    // 純GPS查詢本來就沒有「講到哪個地方」這件事，不需要特別標示。
    function carcampUpdateAnchorChip() {
        const chip = document.getElementById('anchor-chip');
        const chipText = document.getElementById('anchor-chip-text');
        if (carcampLastAnchor && carcampLastAnchor.locationName) {
            chipText.textContent = `目前聊到：${carcampLastAnchor.locationName}`;
            chip.classList.remove('hidden');
        } else {
            chip.classList.add('hidden');
        }
    }
    // 使用者點掉標籤 = 「不是這裡」，清掉記住的錨點，下一句問題如果也沒提新地名，
    // 就會照原本的規則退回使用者目前的GPS位置，不會再被上一輪的地方卡住
    function carcampClearAnchor() {
        carcampLastAnchor = null;
        carcampUpdateAnchorChip();
    }

    carcampAuth.onAuthStateChanged(user => {
        carcampCurrentUser = user;
        carcampHistory = []; // 換帳號/登出時清空對話記憶，避免把上一個使用者的對話內容誤帶給下一個人
        carcampLastAnchor = null; // 同理，地點錨點也要一起清空，避免帶到下一個使用者的對話裡
        carcampUpdateAnchorChip();
        document.getElementById('login-gate').classList.toggle('hidden', !!user);
        document.getElementById('carcamp-root').classList.toggle('hidden', !user);
        if (user) {
            document.getElementById('seed-default-btn').classList.toggle('hidden', user.email !== 'wallcemax@gmail.com');
            requestLocation();
            loadCarcampSources();
            carcampShowMemoryIntroOnce();
        }
    });

    // 第一次進到對話區時，用輕鬆的口吻講一句「我會記得什麼、不會記得什麼」，讓使用者對這個
    // 工具的記憶能力有合理預期，不用去看文件或猜——只在chat-log目前是空的時候顯示一次，
    // 避免每次登入都重複洗版
    function carcampShowMemoryIntroOnce() {
        const chatLog = document.getElementById('chat-log');
        if (!chatLog || chatLog.children.length) return;
        chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">嗨～我是你的車泊老朋友🚐 這場對話裡聊過的東西我會記得（最近10輪），你重新整理頁面或登出就會忘光光重新開始，這樣才不會越聊越吃資源，你可以放心聊～</div>`);
    }

    async function carcampSeedDefault() {
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_seed_default', idToken }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('設定失敗：' + (data.error || '未知錯誤')); return; }
            alert(`設定完成！共抓到 ${data.placemarkCount} 個地點。`);
            loadCarcampSources();
        } catch (err) {
            alert('設定失敗（網路或連線問題）：' + err.message);
        }
    }

    function carcampGoogleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        carcampAuth.signInWithPopup(provider).catch(err => {
            if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
                carcampAuth.signInWithRedirect(provider).catch(() => {});
            } else {
                alert('登入失敗：' + err.message);
            }
        });
    }

    // ---------------------------------------------------------------
    // 定位：一進頁面就要求瀏覽器定位權限，讓AI一開始就知道使用者目前位置——
    // 使用者拒絕權限或定位失敗時，改用文字輸入的縣市/地區名稱當退回方案(由AI從問題文字裡
    // 自行判斷地點，不強制一定要有座標；但沒有座標就沒辦法做「依距離篩選候選地點」這一步，
    // 查詢範圍會變成整份地圖，結果可能比較不精準)
    // ---------------------------------------------------------------
    function requestLocation() {
        const statusEl = document.getElementById('location-status-text');
        const retryBtn = document.getElementById('retry-location-btn');
        statusEl.textContent = '📍 正在取得你的位置...';
        retryBtn.style.display = 'none';
        if (!navigator.geolocation) {
            statusEl.textContent = '⚠️ 這個瀏覽器不支援定位，AI會用你問題裡提到的地名判斷';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                carcampUserLat = pos.coords.latitude;
                carcampUserLng = pos.coords.longitude;
                statusEl.textContent = '📍 已定位，AI會優先推薦你附近的地點';
                document.getElementById('location-status').classList.add('ready');
                initCarcampMap();
            },
            err => {
                statusEl.textContent = '⚠️ 無法取得位置(' + err.message + ')，可以直接在問題裡描述地區';
                retryBtn.style.display = 'inline-block';
            },
            { enableHighAccuracy: false, timeout: 10000 }
        );
    }

    // ---------------------------------------------------------------
    // Google Maps嵌入：動態載入Maps JavaScript API，初始化地圖置中在使用者位置
    // ---------------------------------------------------------------
    let carcampMapsApiLoading = false;
    function initCarcampMap() {
        if (carcampMap || carcampMapsApiLoading) return;
        if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === '你的Google Maps API金鑰') {
            document.getElementById('map-container').innerHTML = '<p style="padding:1rem; color:var(--dim); font-size:0.85rem;">尚未設定Google Maps API金鑰，地圖無法顯示。請參考交付文件申請金鑰後填入carcamp.html裡的GOOGLE_MAPS_API_KEY。</p>';
            return;
        }
        carcampMapsApiLoading = true;
        window.__carcampMapReady = () => {
            carcampMap = new google.maps.Map(document.getElementById('map-container'), {
                center: { lat: carcampUserLat || 23.9738, lng: carcampUserLng || 120.9820 }, // 沒有定位時退回台灣中心點
                zoom: carcampUserLat ? 12 : 8,
            });
            if (carcampUserLat) {
                new google.maps.Marker({
                    position: { lat: carcampUserLat, lng: carcampUserLng }, map: carcampMap,
                    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
                    title: '你目前的位置',
                });
            }
        };
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=__carcampMapReady`;
        script.async = true;
        document.head.appendChild(script);
    }

    // 在地圖上標示AI推薦的地點清單，清掉舊的標記再畫新的
    function renderCarcampMarkers(places) {
        carcampMarkers.forEach(m => m.setMap(null));
        carcampMarkers = [];
        if (!carcampMap || !places.length) return;
        const bounds = new google.maps.LatLngBounds();
        places.forEach(p => {
            const marker = new google.maps.Marker({
                position: { lat: p.lat, lng: p.lng }, map: carcampMap, title: p.name,
            });
            // InfoWindow背景固定是白色(不受頁面深色主題影響)，這裡一定要明確指定深色文字，
            // 不能讓它繼承頁面body設定的--starlight(近白色，是給深色背景配的文字顏色)，
            // 不然白底配近白色字會幾乎看不清楚——這正是之前反映「地圖文字太淡」的原因
            const infoWindow = new google.maps.InfoWindow({
                content: `<div style="color:#1A2333; font-family:'Noto Sans TC',sans-serif; padding:2px;"><strong style="font-size:0.95rem;">${p.name}</strong><br><span style="color:#4A5568; font-size:0.85rem;">${p.reason || ''}</span></div>`,
            });
            marker.addListener('click', () => infoWindow.open(carcampMap, marker));
            carcampMarkers.push(marker);
            bounds.extend({ lat: p.lat, lng: p.lng });
        });
        if (carcampUserLat) bounds.extend({ lat: carcampUserLat, lng: carcampUserLng });
        carcampMap.fitBounds(bounds);
    }

    // ---------------------------------------------------------------
    // 問答：送出問題給Worker的carcamp_query動作，把答案顯示成聊天泡泡、
    // 推薦地點畫在地圖上+列成卡片清單
    // ---------------------------------------------------------------
    function escapeHtmlCarcamp(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    async function carcampAskQuestion(event) {
        event.preventDefault();
        const input = document.getElementById('question-input');
        const question = input.value.trim();
        if (!question) return;
        input.value = '';

        const chatLog = document.getElementById('chat-log');
        chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble user">${escapeHtmlCarcamp(question)}</div>`);
        const loadingId = 'loading-' + Date.now();
        chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble loading" id="${loadingId}">思考中...</div>`);
        chatLog.scrollIntoView({ behavior: 'smooth', block: 'end' });

        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'carcamp_query', idToken, question,
                    userLat: carcampUserLat, userLng: carcampUserLng,
                    // 把目前記得的最近對話紀錄一起送給Worker，讓AI回答時能理解「這個」「那附近」
                    // 這類指涉、或避免重複推薦同一個地點。這裡送的是「這次提問之前」累積的紀錄，
                    // 不包含這次剛送出的問題(這次的問答要等拿到答案之後才會被存進歷史)
                    history: carcampHistory,
                    // 把上一輪實際定位到的錨點也一起送過去，讓Worker在這次問題完全沒提地名時
                    // 可以延續上一輪的地方，而不是退回使用者現在的GPS位置(見上方carcampLastAnchor的說明)
                    previousAnchor: carcampLastAnchor,
                    // 這個瀏覽器記得的長期偏好分類(只是軟性參考，見下方carcampGetPreferenceHint的說明)
                    preferenceHint: carcampGetPreferenceHint(),
                }),
            });
            const data = await res.json();
            document.getElementById(loadingId)?.remove();
            if (!res.ok || data.error) {
                chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">查詢失敗：${escapeHtmlCarcamp(data.error || '未知錯誤')}</div>`);
                return;
            }
            chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">${escapeHtmlCarcamp(data.answer)}</div>`);
            chatLog.scrollIntoView({ behavior: 'smooth', block: 'end' });
            renderCarcampMarkers(data.places || []);
            renderCarcampPlacesList(data.places || []);
            carcampRememberTurn(question, data.answer, data.places);
            carcampUpdatePreferenceStats(data.places);
            // 記住這一輪Worker實際用的錨點，下一輪如果沒提新地名就可以延續用這個
            // (data.debug是Worker這次回傳的診斷資訊，理論上一定會有，這裡保守判斷一下避免報錯)
            if (data.debug && data.debug.anchor) {
                carcampLastAnchor = {
                    lat: data.debug.anchor.lat,
                    lng: data.debug.anchor.lng,
                    locationName: data.debug.anchor.locationName || null,
                };
            } else {
                carcampLastAnchor = null;
            }
            carcampUpdateAnchorChip();
        } catch (err) {
            document.getElementById(loadingId)?.remove();
            chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">查詢失敗（網路或連線問題）：${escapeHtmlCarcamp(err.message)}</div>`);
        }
    }

    // 只留摘要進歷史記憶，不留完整回答內容：完整的AI回答可能好幾百字，10輪存下來會讓
    // 之後每一次查詢的prompt都跟著變得很長(等於每問一次都要多付一次前面所有輪次的token)。
    // 這裡裁到最多100字+最多列5個推薦地點名稱，同時保留「這輪聊了什麼、推薦了誰」這個
    // 對後續追問(「那附近呢」「還有其他選擇嗎」)真正有用的資訊
    function carcampRememberTurn(question, answer, places) {
        const placesNote = (places && places.length)
            ? `（推薦：${places.slice(0, 5).map(p => p.name).join('、')}）`
            : '';
        carcampHistory.push({
            q: (question || '').slice(0, 60),
            a: (answer || '').slice(0, 100) + placesNote,
        });
        if (carcampHistory.length > CARCAMP_HISTORY_MAX_TURNS) carcampHistory.shift();
    }

    // ---------------------------------------------------------------
    // 輕量長期偏好記憶：跟上面carcampHistory不一樣，這個存在瀏覽器的localStorage，
    // 不會因為重新整理頁面或這場對話結束就消失(但只留在「這台裝置的這個瀏覽器」，不會
    // 跨裝置同步，也不會傳到任何資料庫)，讓AI能漸漸抓到「這個人平常比較常問什麼類型」。
    // 只是軟性參考，不是硬性篩選規則——這次問題本身想問什麼，永遠比過去的習慣重要，
    // Worker那邊的prompt也會這樣要求AI。用uid當key的一部分，換帳號登入不會混到別人的紀錄。
    // ---------------------------------------------------------------
    function carcampPrefStorageKey() {
        return carcampCurrentUser ? `carcamp_pref_${carcampCurrentUser.uid}` : null;
    }
    function carcampLoadPrefStats() {
        const key = carcampPrefStorageKey();
        if (!key) return {};
        try {
            return JSON.parse(localStorage.getItem(key) || '{}') || {};
        } catch (err) {
            return {}; // 讀取失敗(例如無痕模式擋掉localStorage)不影響主要功能，安靜當作沒有紀錄
        }
    }
    function carcampUpdatePreferenceStats(places) {
        const key = carcampPrefStorageKey();
        if (!key || !places || !places.length) return;
        try {
            const stats = carcampLoadPrefStats();
            places.forEach(p => {
                const top = p.folderPath && p.folderPath[0];
                if (!top) return;
                stats[top] = (stats[top] || 0) + 1;
            });
            localStorage.setItem(key, JSON.stringify(stats));
        } catch (err) {
            // 寫入失敗(例如無痕模式、儲存空間被擋)不影響主要問答功能，安靜跳過就好
        }
    }
    // 取出目前累積次數最高的分類，當作這次請求附帶的軟性提示。次數太少(<3次)代表樣本
    // 還不夠，先不提示，避免只問過一兩次就被貼上標籤、反而讓後續回答被過度引導
    function carcampGetPreferenceHint() {
        const stats = carcampLoadPrefStats();
        const entries = Object.entries(stats);
        if (!entries.length) return null;
        entries.sort((a, b) => b[1] - a[1]);
        const [topName, topCount] = entries[0];
        return topCount >= 3 ? topName : null;
    }

    function renderCarcampPlacesList(places) {
        const listEl = document.getElementById('places-list');
        if (!places.length) { listEl.innerHTML = ''; return; }
        listEl.innerHTML = places.map((p, i) => `
            <div class="place-card" onclick="carcampFocusPlace(${i})">
                <div class="name">📍 ${escapeHtmlCarcamp(p.name)}</div>
                <div class="reason">${escapeHtmlCarcamp(p.reason || '')}</div>
            </div>
        `).join('');
        window.__carcampLastPlaces = places;
    }
    function carcampFocusPlace(index) {
        const p = window.__carcampLastPlaces?.[index];
        if (!p || !carcampMap) return;
        carcampMap.panTo({ lat: p.lat, lng: p.lng });
        carcampMap.setZoom(15);
        const marker = carcampMarkers[index];
        if (marker) google.maps.event.trigger(marker, 'click');
    }

    // ---------------------------------------------------------------
    // 地圖來源管理：列出目前可查詢的來源(公開+自己的)、新增私人地圖
    // ---------------------------------------------------------------
    async function loadCarcampSources() {
        const listEl = document.getElementById('sources-list');
        listEl.innerHTML = '<p style="font-size:0.8rem; color:var(--dim);">載入中...</p>';
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_list_sources', idToken }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { listEl.innerHTML = `<p style="font-size:0.8rem; color:var(--danger);">載入失敗：${escapeHtmlCarcamp(data.error || '未知錯誤')}</p>`; return; }
            carcampSourcesCache = data.sources || [];
            renderCarcampSourcesList();
        } catch (err) {
            listEl.innerHTML = `<p style="font-size:0.8rem; color:var(--danger);">載入失敗（網路或連線問題）：${escapeHtmlCarcamp(err.message)}</p>`;
        }
    }

    function renderCarcampSourcesList() {
        const listEl = document.getElementById('sources-list');
        if (!carcampSourcesCache.length) {
            listEl.innerHTML = '<p style="font-size:0.8rem; color:var(--dim);">還沒有任何地圖來源，在下方新增一個吧！</p>';
            return;
        }
        const statusLabel = { pending: '準備中', ready: '就緒', error: '失敗' };
        listEl.innerHTML = carcampSourcesCache.map(s => `
            <div class="source-item">
                <span class="name">${s.isPublic ? '🌐' : '🔒'} ${escapeHtmlCarcamp(s.name)}${s.status === 'ready' ? `（${s.placemarkCount}個地點）` : ''}</span>
                <span class="status-badge ${s.status}">${statusLabel[s.status] || s.status}</span>
                <button class="btn btn-outline" style="padding:0.35rem 0.7rem; font-size:0.75rem;" onclick="carcampRefreshSource('${s.id}')">🔄</button>
                <button class="btn btn-outline" style="padding:0.35rem 0.7rem; font-size:0.75rem; color:var(--danger); border-color:var(--danger);" onclick="carcampDeleteSource('${s.id}', '${escapeHtmlCarcamp(s.name).replace(/'/g, "\\'")}')">🗑️</button>
            </div>
        `).join('');
    }

    async function carcampRefreshSource(sourceId) {
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_refresh_source', idToken, sourceId }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('重新整理失敗：' + (data.error || '未知錯誤')); return; }
            alert(`重新整理完成，共 ${data.placemarkCount} 個地點。`);
            loadCarcampSources();
        } catch (err) {
            alert('重新整理失敗（網路或連線問題）：' + err.message);
        }
    }

    async function carcampDeleteSource(sourceId, sourceName) {
        if (!confirm(`確定要刪除「${sourceName}」嗎？這個動作無法復原，底下所有的地點資料都會一併清除。`)) return;
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_delete_source', idToken, sourceId }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('刪除失敗：' + (data.error || '未知錯誤')); return; }
            loadCarcampSources();
        } catch (err) {
            alert('刪除失敗（網路或連線問題）：' + err.message);
        }
    }

    async function carcampAddSource() {
        const name = document.getElementById('new-source-name').value.trim();
        const mapUrlOrMid = document.getElementById('new-source-url').value.trim();
        if (!name || !mapUrlOrMid) { alert('請填寫地圖名稱跟連結'); return; }
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_add_source', idToken, name, mapUrlOrMid, isPublic: false }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('新增失敗：' + (data.error || '未知錯誤')); return; }
            // 新增後立刻觸發重新整理，讓資料馬上可以查詢，不用使用者自己再多按一次
            const refreshRes = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_refresh_source', idToken, sourceId: data.sourceId }),
            });
            const refreshData = await refreshRes.json();
            if (!refreshRes.ok || refreshData.error) {
                alert('地圖已新增，但抓取資料時發生問題：' + (refreshData.error || '未知錯誤') + '\n請確認地圖分享設定是否為「知道連結的使用者均可查看」');
            } else {
                alert(`新增成功！共抓到 ${refreshData.placemarkCount} 個地點，現在可以直接問AI了。`);
            }
            document.getElementById('new-source-name').value = '';
            document.getElementById('new-source-url').value = '';
        } catch (err) {
            alert('新增失敗（網路或連線問題）：' + err.message);
        }
    }
</script>
</body>
</html>
