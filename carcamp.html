<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>車泊趣 - JUST DO EAT</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
    /* ============================================================
       設計主題：星空營火（Night Campsite）
       想像坐在營火旁，跟認識很久的車泊老朋友聊天——深夜星空是舞台，
       營火的暖橘光是唯一的溫暖來源，山巒剪影是安靜的背景。
       這不是食譜網站的暖色紙感，是屬於車泊、屬於夜晚公路的另一種調性。
       ============================================================ */
    :root {
        --night: #0B1526;        /* 最深的夜空 */
        --night-mid: #16233D;    /* 夜空漸層中段 */
        --panel: #1C2C4A;        /* 卡片/面板底色，比夜空稍亮一階 */
        --panel-soft: #24365a;   /* 卡片內的次層元素 */
        --ember: #F2994A;        /* 營火暖橘，主要強調色 */
        --ember-hot: #EB5E28;    /* 熾焰橘紅，行動按鈕/重點 */
        --starlight: #EAF2F5;    /* 星光白，主要文字 */
        --dim: #8B9DB5;          /* 夜霧藍灰，次要文字 */
        --moss: #52A37C;         /* 苔蘚綠，自然/成功狀態 */
        --danger: #E8604C;
        --line: rgba(234,242,245,0.1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        margin: 0; min-height: 100vh; color: var(--starlight);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(ellipse 120% 60% at 50% 0%, var(--night-mid) 0%, var(--night) 55%);
        position: relative; overflow-x: hidden;
    }
    .display-font { font-family: 'Kalam', 'Noto Sans TC', cursive; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .hidden { display: none !important; }

    /* ---------- 簽名視覺元素：滿版星空 ---------- */
    #starfield {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image:
            radial-gradient(1.5px 1.5px at 20px 30px, rgba(234,242,245,0.9), transparent),
            radial-gradient(1px 1px at 90px 80px, rgba(234,242,245,0.7), transparent),
            radial-gradient(1.5px 1.5px at 160px 40px, rgba(234,242,245,0.8), transparent),
            radial-gradient(1px 1px at 210px 110px, rgba(234,242,245,0.6), transparent),
            radial-gradient(1.5px 1.5px at 270px 20px, rgba(234,242,245,0.9), transparent),
            radial-gradient(1px 1px at 320px 90px, rgba(234,242,245,0.5), transparent),
            radial-gradient(1.5px 1.5px at 40px 150px, rgba(234,242,245,0.7), transparent),
            radial-gradient(1px 1px at 130px 180px, rgba(234,242,245,0.6), transparent),
            radial-gradient(1.5px 1.5px at 240px 160px, rgba(234,242,245,0.8), transparent),
            radial-gradient(1px 1px at 350px 200px, rgba(234,242,245,0.5), transparent);
        background-size: 400px 220px; background-repeat: repeat;
        animation: twinkle 4s ease-in-out infinite alternate;
        opacity: 0.65;
    }
    @keyframes twinkle { from { opacity: 0.45; } to { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { #starfield { animation: none; opacity: 0.65; } }

    /* ---------- 簽名視覺元素：底部山巒剪影(固定不動，安靜的地平線) ---------- */
    #mountains {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none;
        height: 14vh; min-height: 90px;
    }
    #mountains svg { width: 100%; height: 100%; display: block; }

    /* ---------- 簽名視覺元素：營火光暈(呼吸般的明滅，聊天輸入框旁的溫暖光源) ---------- */
    #campfire-glow {
        position: fixed; left: 50%; bottom: -6rem; transform: translateX(-50%); z-index: 1; pointer-events: none;
        width: 32rem; height: 20rem; border-radius: 50%;
        background: radial-gradient(circle, rgba(242,153,74,0.35) 0%, rgba(235,94,40,0.12) 40%, transparent 70%);
        animation: flicker 3.2s ease-in-out infinite;
    }
    @keyframes flicker {
        0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) { #campfire-glow { animation: none; opacity: 0.85; } }

    /* ---------- 內容層(在星空/山巒之上) ---------- */
    .content-layer { position: relative; z-index: 2; }

    input[type="text"] {
        width: 100%; padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--line);
        background: var(--panel-soft); font-size: 0.9rem; color: var(--starlight);
    }
    input[type="text"]::placeholder { color: var(--dim); }
    input[type="text"]:focus { outline: none; border-color: var(--ember); }
    .btn {
        padding: 0.7rem 1.2rem; border-radius: 999px; border: none;
        background: linear-gradient(135deg, var(--ember), var(--ember-hot)); color: #1A0F08;
        font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap;
        box-shadow: 0 4px 14px -4px rgba(235,94,40,0.5);
    }
    .btn-outline { background: transparent; color: var(--ember); border: 1px solid var(--ember); box-shadow: none; }
    .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }

    header { text-align: center; padding: 2rem 1.25rem 1rem; }
    header .eyebrow { color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.3rem; }
    header h1 {
        font-size: 2rem; margin: 0 0 0.4rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        text-shadow: 0 0 20px rgba(242,153,74,0.4);
    }
    header h1 img { width: 1.8rem; height: 1.8rem; object-fit: contain; filter: drop-shadow(0 0 8px rgba(242,153,74,0.6)); }
    header a { color: var(--dim); font-size: 0.8rem; text-decoration: none; }
    header a:hover { color: var(--ember); }

    #login-gate {
        max-width: 24rem; margin: 4rem auto; padding: 2.2rem 1.8rem; background: var(--panel);
        border-radius: 1.5rem; text-align: center; border: 1px solid var(--line);
        box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    }
    #login-gate p { color: var(--dim); font-size: 0.9rem; margin-bottom: 1.3rem; line-height: 1.6; }

    #carcamp-root { max-width: 40rem; margin: 0 auto; padding: 0 1.25rem 8rem; }

    /* ---------- 定位狀態列：像GPS座標讀數 ---------- */
    #location-status {
        display: flex; align-items: center; gap: 0.5rem; background: var(--panel);
        border: 1px solid var(--line); border-radius: 1.1rem; padding: 0.7rem 1rem; margin-bottom: 1rem;
        font-size: 0.82rem; color: var(--dim);
    }
    #location-status.ready { color: var(--moss); border-color: rgba(82,163,124,0.3); }
    #location-status button { margin-left: auto; }

    /* ---------- 地圖來源管理：像裝備清單 ---------- */
    #sources-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1.2rem; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    #sources-panel summary { cursor: pointer; font-weight: 700; font-size: 0.95rem; color: var(--starlight); }
    #sources-panel summary::marker { color: var(--ember); }
    .source-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); font-size: 0.82rem; }
    .source-item:last-child { border-bottom: none; }
    .source-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-item .status-badge { font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 999px; background: var(--panel-soft); color: var(--dim); }
    .source-item .status-badge.ready { background: rgba(82,163,124,0.15); color: var(--moss); }
    .source-item .status-badge.error { background: rgba(232,96,76,0.15); color: var(--danger); }
    #add-source-form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }

    /* ---------- 對話區：營火旁的閒聊 ---------- */
    #chat-log { display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.2rem; min-height: 4rem; }
    .chat-bubble { padding: 0.85rem 1.1rem; border-radius: 1.2rem; font-size: 0.9rem; line-height: 1.6; max-width: 88%; }
    .chat-bubble.user {
        align-self: flex-end; background: linear-gradient(135deg, var(--ember), var(--ember-hot));
        color: #1A0F08; font-weight: 500; border-bottom-right-radius: 0.3rem;
        box-shadow: 0 6px 18px -6px rgba(235,94,40,0.4);
    }
    .chat-bubble.ai {
        align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
        border-bottom-left-radius: 0.3rem; box-shadow: 0 6px 18px -6px rgba(0,0,0,0.35);
    }
    .chat-bubble.loading { align-self: flex-start; color: var(--dim); font-style: italic; }

    #question-form { display: flex; gap: 0.6rem; margin-bottom: 1.4rem; position: sticky; bottom: 1rem; z-index: 3; }
    #question-form input { flex: 1; }

    /* ---------- 地圖顯示：像探險家的地圖 ---------- */
    #map-container {
        width: 100%; height: 22rem; border-radius: 1.2rem; overflow: hidden; background: var(--panel);
        margin-bottom: 1rem; border: 1px solid var(--line); box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    }
    #places-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .place-card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 0.85rem 1.05rem;
        box-shadow: 0 6px 18px -6px rgba(0,0,0,0.3); cursor: pointer; transition: border-color 0.15s;
    }
    .place-card:hover { border-color: var(--ember); }
    .place-card-main { cursor: pointer; }
    .place-card .name { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.25rem; color: var(--starlight); }
    .place-card .reason { font-size: 0.8rem; color: var(--dim); }

    /* ---------- 地點卡片動作列：免綁信用卡的導航解法(開Google地圖App/網頁做真正的路線規劃) ---------- */
    .place-card-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .place-card-actions a {
        font-size: 0.75rem; padding: 0.3rem 0.75rem; border-radius: 999px;
        background: var(--panel-soft); color: var(--dim); border: 1px solid var(--line);
        text-decoration: none; white-space: nowrap; cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
        font-family: inherit;
    }
    .place-card-actions a:hover { border-color: var(--ember); color: var(--ember); }

    /* ---------- 查無法標記的地點：AI提到、但系統查不到足夠可靠的地圖資料，不畫成一般的
       地點卡片(避免假裝已經驗證過)，只給一個Google地圖搜尋連結，並明確標示要自行確認 ---------- */
    #unverified-places-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
    .unverified-card { background: var(--panel); border: 1px dashed rgba(232,96,76,0.5); border-radius: 1rem; padding: 0.75rem 1rem; font-size: 0.82rem; }
    .unverified-card .unverified-label { color: var(--danger); font-weight: 700; font-size: 0.75rem; margin-bottom: 0.3rem; }
    .unverified-card .name { font-weight: 700; color: var(--starlight); margin-bottom: 0.2rem; }
    .unverified-card .reason { color: var(--dim); font-size: 0.78rem; margin-bottom: 0.55rem; }
    .unverified-card a {
        font-size: 0.75rem; padding: 0.3rem 0.75rem; border-radius: 999px;
        background: var(--panel-soft); color: var(--dim); border: 1px solid var(--line);
        text-decoration: none; white-space: nowrap;
    }
    .unverified-card a:hover { border-color: var(--ember); color: var(--ember); }

    /* ---------- 點選地點即時顯示天氣：卡片內展開，不用先問AI ---------- */
    .weather-inline { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--line); font-size: 0.78rem; color: var(--dim); }
    .weather-inline .weather-now { color: var(--starlight); font-weight: 600; margin-bottom: 0.35rem; }
    .weather-inline .weather-days { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    .weather-inline .weather-day b { color: var(--starlight); margin-right: 0.2rem; }
    .weather-inline .weather-alert { margin-top: 0.4rem; color: var(--danger); font-weight: 600; }
    .weather-inline .weather-loading, .weather-inline .weather-error { font-style: italic; }

    /* ---------- 行程規劃：出發地→目的地，真實路線分天行程 ---------- */
    #itinerary-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1.2rem; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    #itinerary-panel summary { cursor: pointer; font-weight: 700; font-size: 0.95rem; color: var(--starlight); }
    #itinerary-panel summary::marker { color: var(--ember); }
    #itinerary-intro { font-size: 0.78rem; color: var(--dim); line-height: 1.6; margin: 0.6rem 0 0; }
    #itinerary-form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
    .itinerary-summary { background: var(--panel-soft); border-radius: 1rem; padding: 0.9rem 1.05rem; margin-bottom: 0.9rem; }
    .itinerary-summary-route { font-weight: 700; font-size: 0.95rem; color: var(--starlight); margin-bottom: 0.3rem; }
    .itinerary-summary-stats { font-size: 0.78rem; color: var(--ember); margin-bottom: 0.5rem; }
    .itinerary-summary p { font-size: 0.85rem; color: var(--dim); line-height: 1.6; margin: 0; }
    .itinerary-day { border-top: 1px dashed var(--line); padding-top: 0.9rem; margin-top: 0.9rem; }
    .itinerary-day-title { font-weight: 700; font-size: 0.92rem; color: var(--ember); display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .itinerary-day-km { font-size: 0.72rem; color: var(--dim); font-weight: 400; }
    .itinerary-day-narrative { font-size: 0.85rem; color: var(--starlight); line-height: 1.6; margin: 0 0 0.6rem; }
    .itinerary-day-stops { display: flex; flex-direction: column; gap: 0.5rem; }
    .itinerary-error { font-size: 0.85rem; color: var(--danger); margin: 0; }
    .itinerary-loading { font-size: 0.85rem; color: var(--dim); margin: 0; }

    /* ---------- 行程規劃v2：天數+逐項新增途經點+自由文字補充 ---------- */
    .itinerary-days-field { display: flex; align-items: center; gap: 0.5rem; }
    .itinerary-days-field label { font-size: 0.82rem; color: var(--dim); white-space: nowrap; }
    .itinerary-days-field input[type="number"] { width: 4.5rem; flex: none; }
    #itinerary-stops-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .itinerary-stop-item {
        display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
        background: var(--panel-soft); border-radius: 0.7rem; padding: 0.5rem 0.7rem; font-size: 0.82rem;
    }
    .itinerary-stop-item .stop-name { color: var(--starlight); font-weight: 600; }
    .itinerary-stop-item .stop-category { color: var(--dim); font-size: 0.75rem; margin-left: 0.4rem; }
    .itinerary-stop-remove {
        background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1rem;
        line-height: 1; padding: 0.1rem 0.3rem;
    }
    .itinerary-stop-remove:hover { color: var(--danger); }
    .itinerary-stop-add-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .itinerary-stop-add-row input[type="text"] { flex: 1 1 10rem; }
    .itinerary-stop-add-row select { flex: none; width: auto; }
    #itinerary-freeform { min-height: 3.2rem; resize: vertical; font-family: inherit; }
    .itinerary-field-label { font-size: 0.78rem; color: var(--dim); margin: 0.4rem 0 0.1rem; }
    .itinerary-quota-note { font-size: 0.78rem; color: var(--ember); margin: 0.4rem 0 0; line-height: 1.6; }
    .itinerary-warning-note { font-size: 0.78rem; color: var(--danger); margin: 0.4rem 0 0; line-height: 1.6; }
    .itinerary-tag { display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.45rem; border-radius: 999px; margin-left: 0.4rem; font-weight: 700; }
    .itinerary-tag-required { background: rgba(82, 163, 124, 0.18); color: #52A37C; }
    .itinerary-tag-supplemented { background: rgba(242, 153, 74, 0.18); color: var(--ember); }
    .itinerary-tag-missing { background: rgba(235, 94, 40, 0.18); color: var(--danger); }
    .itinerary-excluded-list, .itinerary-unresolved-list { font-size: 0.78rem; color: var(--dim); line-height: 1.7; margin: 0.3rem 0 0; padding-left: 1.1rem; }

    /* ---------- 分類篩選chip：不用開口問AI，點幾下就能直接瀏覽 ---------- */
    .section-label { font-size: 0.82rem; color: var(--dim); font-weight: 700; margin-bottom: 0.6rem; }
    #category-chips-panel { margin-bottom: 1rem; }
    #category-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
        padding: 0.4rem 0.85rem; border-radius: 999px; border: 1px solid var(--line);
        background: var(--panel); color: var(--dim); font-size: 0.8rem; cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .chip .count { opacity: 0.7; margin-left: 0.15rem; }
    .chip:hover { border-color: var(--ember); color: var(--starlight); }
    .chip.active {
        background: linear-gradient(135deg, var(--ember), var(--ember-hot)); color: #1A0F08;
        border-color: transparent; font-weight: 700;
    }

</style>
</head>
<body>

<div id="starfield"></div>
<div id="mountains">
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none">
        <polygon points="0,200 0,130 180,50 340,110 520,30 700,100 860,45 1040,120 1220,60 1440,110 1440,200" fill="#111d33"/>
        <polygon points="0,200 0,160 220,90 460,150 680,80 920,145 1160,95 1440,150 1440,200" fill="#0d1626"/>
    </svg>
</div>
<div id="campfire-glow"></div>

<div class="content-layer">
<header>
    <p class="eyebrow">JUST DO EAT</p>
    <h1 class="display-font"><img src="https://res.cloudinary.com/bumzwp9g/image/upload/v1787555200/caravan_430750_hwe5jm.png" alt="">車泊趣</h1>
    <a href="index.html">← 回主站</a>
</header>

<div id="login-gate" class="hidden">
    <p>登入後才能使用車泊趣，查詢你自己新增的地圖資料</p>
    <button class="btn" onclick="carcampGoogleLogin()">使用 Google 帳號登入</button>
</div>

<div id="carcamp-root" class="hidden">
    <div id="location-status">
        <span id="location-status-text">📍 正在取得你的位置...</span>
        <button class="btn btn-outline" style="display:none;" id="retry-location-btn" onclick="requestLocation()">重新定位</button>
    </div>

    <details id="sources-panel">
        <summary>🗺️ 地圖來源管理</summary>
        <div id="sources-list" style="margin-top:0.8rem;"></div>
        <button class="btn btn-outline hidden" id="seed-default-btn" style="margin-top:0.6rem; width:100%;" onclick="carcampSeedDefault()">一鍵設定地圖（車床天地總圖）</button>
        <div id="add-source-form">
            <input type="text" id="new-source-name" placeholder="幫這份地圖取個名字">
            <input type="text" id="new-source-url" placeholder="貼上 Google 我的地圖分享連結">
            <button class="btn" onclick="carcampAddSource()">新增我的私人地圖</button>
        </div>
    </details>

    <details id="itinerary-panel">
        <summary>🧭 智慧行程規劃（天數＋途經點，真實路線＋自動配額）</summary>
        <p id="itinerary-intro">用Google地圖真實路線規劃車泊行程：填天數、放幾個一定要去的點（車宿/美食/景點都可以），系統會依真實開車時間算出最順路的安排——車宿/美食點提供太少會自動補推薦，提供太多也會自動篩選並說明原因。</p>
        <form id="itinerary-form" onsubmit="carcampPlanItinerary(event)">
            <input type="text" id="itinerary-origin" placeholder="出發地（留空＝用目前位置）">
            <input type="text" id="itinerary-destination" placeholder="目的地，例如：台南" required>
            <div class="itinerary-days-field">
                <label for="itinerary-days">天數</label>
                <input type="number" id="itinerary-days" min="1" max="14" step="1" value="1">
            </div>

            <p class="itinerary-field-label">途經點（一定要去的車宿/美食/景點，可不填）</p>
            <div id="itinerary-stops-list"></div>
            <div class="itinerary-stop-add-row">
                <input type="text" id="itinerary-stop-name-input" placeholder="地點名稱，例如：桃園某美食">
                <select id="itinerary-stop-category-input">
                    <option value="unknown">不確定</option>
                    <option value="camp">車宿</option>
                    <option value="food">美食</option>
                    <option value="attraction">景點</option>
                </select>
                <button type="button" class="btn btn-outline" onclick="carcampAddItineraryStop()">＋ 新增地點</button>
            </div>

            <p class="itinerary-field-label">或用一段話補充想去的地方（AI會自動解析）</p>
            <textarea id="itinerary-freeform" placeholder="例如：途中想在嘉義找地方車宿，順便吃個美食"></textarea>

            <button class="btn" type="submit" id="itinerary-submit-btn">規劃行程</button>
        </form>
        <div id="itinerary-result"></div>
    </details>

    <div id="category-chips-panel" class="hidden">
        <div class="section-label">🏷️ 依分類快速瀏覽（不用開口問，點一下就好）</div>
        <div id="category-chips"></div>
    </div>

    <div id="chat-log"></div>

    <form id="question-form" onsubmit="carcampAskQuestion(event)">
        <input type="text" id="question-input" placeholder="今晚可以車泊睡哪？" autocomplete="off">
        <button class="btn" type="submit">送出</button>
    </form>

    <div id="map-container"></div>
    <div id="places-list"></div>
    <div id="unverified-places-list"></div>
</div>
</div>

<script>
    // ---------------------------------------------------------------
    // Firebase初始化：跟主站(index.html)用同一份設定，共用同一個登入狀態
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
        authDomain: "recipe-synchronization.firebaseapp.com",
        projectId: "recipe-synchronization",
        storageBucket: "recipe-synchronization.firebasestorage.app",
        messagingSenderId: "559668909743",
        appId: "1:559668909743:web:63dc34572b98839479265a"
    };
    firebase.initializeApp(firebaseConfig);
    const carcampAuth = firebase.auth();
    const CLOUDFLARE_AI_PROXY_URL = 'https://baking-recipes-ai.wallcemax.workers.dev/';

    // TODO: 換成你自己申請的Google Maps JavaScript API金鑰(免信用卡的示範金鑰即可先測試)，
    // 申請方式請見交付文件裡的「Google Maps API金鑰申請步驟」
    const GOOGLE_MAPS_API_KEY = 'AIzaSyAVrKwugAJB9-x46a98jXQV-R4yKpJQPAs';

    let carcampCurrentUser = null;
    let carcampUserLat = null;
    let carcampUserLng = null;
    let carcampMap = null;
    let carcampMarkers = [];
    let carcampSourcesCache = [];

    // ---------------------------------------------------------------
    // 對話記憶：只存在瀏覽器記憶體裡（純前端陣列，不寫進Firestore、不佔任何資料庫成本），
    // 頁面重新整理或登出就會自然清空——這本來就符合「記得這場對話最近聊過什麼」的需求，
    // 不需要跨裝置/跨天保存。每筆只存「question(裁到60字)」+「answer摘要(裁到100字)+
    // 推薦地點名稱」，不存完整的AI長篇回答內容，這樣即使聊到第10輪，附加在prompt裡的
    // 歷史紀錄總長度還是控制在小範圍內，不會讓AI呼叫的token用量隨對話輪數線性爆增。
    // 最多只保留最近10筆，超過就把最舊的丟掉(見下方carcampAskQuestion裡的shift())。
    // ---------------------------------------------------------------
    const CARCAMP_HISTORY_MAX_TURNS = 10;
    let carcampHistory = [];

    // 上一輪查詢實際定位到的地點錨點(Worker回傳的debug.anchor)，用來讓「沒提地名的追問」
    // (例如問完「雲林口湖」之後接著問「那還有哪些」)能延續同一個地方，而不是被Worker誤判成
    // 「這次沒提地名」就退回使用者的GPS位置——詳細原因見worker.js裡carcampResolveLocationAnchor
    // 的相關註解。只存最基本的lat/lng/locationName，不是完整物件，跟history一樣輕量。
    let carcampLastAnchor = null;

    carcampAuth.onAuthStateChanged(user => {
        carcampCurrentUser = user;
        carcampHistory = []; // 換帳號/登出時清空對話記憶，避免把上一個使用者的對話內容誤帶給下一個人
        carcampLastAnchor = null; // 同理，地點錨點也要一起清空，避免帶到下一個使用者的對話裡
        carcampActiveCategories = new Set(); // 分類篩選chip的選取狀態也一樣，不要帶到下一個使用者
        document.getElementById('login-gate').classList.toggle('hidden', !!user);
        document.getElementById('carcamp-root').classList.toggle('hidden', !user);
        if (user) {
            document.getElementById('seed-default-btn').classList.toggle('hidden', user.email !== 'wallcemax@gmail.com');
            requestLocation();
            loadCarcampSources();
            carcampLoadCategories();
        }
    });

    async function carcampSeedDefault() {
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_seed_default', idToken }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('設定失敗：' + (data.error || '未知錯誤')); return; }
            alert(`設定完成！共抓到 ${data.placemarkCount} 個地點。`);
            loadCarcampSources();
        } catch (err) {
            alert('設定失敗（網路或連線問題）：' + err.message);
        }
    }

    function carcampGoogleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        carcampAuth.signInWithPopup(provider).catch(err => {
            if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
                carcampAuth.signInWithRedirect(provider).catch(() => {});
            } else {
                alert('登入失敗：' + err.message);
            }
        });
    }

    // ---------------------------------------------------------------
    // 定位：一進頁面就要求瀏覽器定位權限，讓AI一開始就知道使用者目前位置——
    // 使用者拒絕權限或定位失敗時，改用文字輸入的縣市/地區名稱當退回方案(由AI從問題文字裡
    // 自行判斷地點，不強制一定要有座標；但沒有座標就沒辦法做「依距離篩選候選地點」這一步，
    // 查詢範圍會變成整份地圖，結果可能比較不精準)
    // ---------------------------------------------------------------
    function requestLocation() {
        const statusEl = document.getElementById('location-status-text');
        const retryBtn = document.getElementById('retry-location-btn');
        statusEl.textContent = '📍 正在取得你的位置...';
        retryBtn.style.display = 'none';
        if (!navigator.geolocation) {
            statusEl.textContent = '⚠️ 這個瀏覽器不支援定位，可以直接在問題裡描述地區';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                carcampUserLat = pos.coords.latitude;
                carcampUserLng = pos.coords.longitude;
                statusEl.textContent = '📍 已定位，會優先推薦你附近的地點';
                document.getElementById('location-status').classList.add('ready');
                initCarcampMap();
            },
            err => {
                statusEl.textContent = '⚠️ 無法取得位置(' + err.message + ')，可以直接在問題裡描述地區';
                retryBtn.style.display = 'inline-block';
            },
            { enableHighAccuracy: false, timeout: 10000 }
        );
    }

    // ---------------------------------------------------------------
    // Google Maps嵌入：動態載入Maps JavaScript API，初始化地圖置中在使用者位置
    // ---------------------------------------------------------------
    let carcampMapsApiLoading = false;
    function initCarcampMap() {
        if (carcampMap || carcampMapsApiLoading) return;
        if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === '你的Google Maps API金鑰') {
            document.getElementById('map-container').innerHTML = '<p style="padding:1rem; color:var(--dim); font-size:0.85rem;">尚未設定Google Maps API金鑰，地圖無法顯示。請參考交付文件申請金鑰後填入carcamp.html裡的GOOGLE_MAPS_API_KEY。</p>';
            return;
        }
        carcampMapsApiLoading = true;
        window.__carcampMapReady = () => {
            carcampMap = new google.maps.Map(document.getElementById('map-container'), {
                center: { lat: carcampUserLat || 23.9738, lng: carcampUserLng || 120.9820 }, // 沒有定位時退回台灣中心點
                zoom: carcampUserLat ? 12 : 8,
            });
            if (carcampUserLat) {
                new google.maps.Marker({
                    position: { lat: carcampUserLat, lng: carcampUserLng }, map: carcampMap,
                    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
                    title: '你目前的位置',
                });
            }
        };
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=__carcampMapReady`;
        script.async = true;
        document.head.appendChild(script);
    }

    // 在地圖上標示AI推薦的地點清單，清掉舊的標記再畫新的
    function renderCarcampMarkers(places) {
        carcampMarkers.forEach(m => m.setMap(null));
        carcampMarkers = [];
        if (!carcampMap || !places.length) return;
        const bounds = new google.maps.LatLngBounds();
        places.forEach(p => {
            const marker = new google.maps.Marker({
                position: { lat: p.lat, lng: p.lng }, map: carcampMap, title: p.name,
            });
            // InfoWindow背景固定是白色(不受頁面深色主題影響)，這裡一定要明確指定深色文字，
            // 不能讓它繼承頁面body設定的--starlight(近白色，是給深色背景配的文字顏色)，
            // 不然白底配近白色字會幾乎看不清楚——這正是之前反映「地圖文字太淡」的原因
            const infoWindow = new google.maps.InfoWindow({
                content: `<div style="color:#1A2333; font-family:'Noto Sans TC',sans-serif; padding:2px;"><strong style="font-size:0.95rem;">${p.name}</strong><br><span style="color:#4A5568; font-size:0.85rem;">${p.reason || ''}</span></div>`,
            });
            marker.addListener('click', () => infoWindow.open(carcampMap, marker));
            carcampMarkers.push(marker);
            bounds.extend({ lat: p.lat, lng: p.lng });
        });
        if (carcampUserLat) bounds.extend({ lat: carcampUserLat, lng: carcampUserLng });
        carcampMap.fitBounds(bounds);
    }

    // ---------------------------------------------------------------
    // 問答：送出問題給Worker的carcamp_query動作，把答案顯示成聊天泡泡、
    // 推薦地點畫在地圖上+列成卡片清單
    // ---------------------------------------------------------------
    function escapeHtmlCarcamp(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    async function carcampAskQuestion(event) {
        event.preventDefault();
        const input = document.getElementById('question-input');
        const question = input.value.trim();
        if (!question) return;
        input.value = '';

        const chatLog = document.getElementById('chat-log');
        chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble user">${escapeHtmlCarcamp(question)}</div>`);
        const loadingId = 'loading-' + Date.now();
        chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble loading" id="${loadingId}">思考中...</div>`);
        chatLog.scrollIntoView({ behavior: 'smooth', block: 'end' });

        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'carcamp_query', idToken, question,
                    userLat: carcampUserLat, userLng: carcampUserLng,
                    // 把目前記得的最近對話紀錄一起送給Worker，讓AI回答時能理解「這個」「那附近」
                    // 這類指涉、或避免重複推薦同一個地點。這裡送的是「這次提問之前」累積的紀錄，
                    // 不包含這次剛送出的問題(這次的問答要等拿到答案之後才會被存進歷史)
                    history: carcampHistory,
                    // 把上一輪實際定位到的錨點也一起送過去，讓Worker在這次問題完全沒提地名時
                    // 可以延續上一輪的地方，而不是退回使用者現在的GPS位置(見上方carcampLastAnchor的說明)
                    previousAnchor: carcampLastAnchor,
                    // 這個瀏覽器記得的長期偏好分類(只是軟性參考，見下方carcampGetPreferenceHint的說明)
                    preferenceHint: carcampGetPreferenceHint(),
                }),
            });
            const data = await res.json();
            document.getElementById(loadingId)?.remove();
            if (!res.ok || data.error) {
                chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">查詢失敗：${escapeHtmlCarcamp(data.error || '未知錯誤')}</div>`);
                return;
            }
            chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">${escapeHtmlCarcamp(data.answer)}</div>`);
            chatLog.scrollIntoView({ behavior: 'smooth', block: 'end' });
            renderCarcampMarkers(data.places || []);
            renderCarcampPlacesList(data.places || []);
            // AI回答裡提到、但系統查不到足夠可靠地圖資料的地點(通常是搜尋grounding不足或
            // 地理編碼失敗)，不會出現在上面的地點卡片/地圖標記裡——這裡額外顯示成一組
            // 「查無法標記」的卡片，至少給使用者一個Google地圖搜尋連結可以點，而不是讓
            // answer文字講得煞有其事、底下卻完全沒有任何可以點擊的東西
            renderCarcampUnverifiedPlaces(data.unverifiedPlaces || []);
            carcampRememberTurn(question, data.answer, data.places);
            carcampUpdatePreferenceStats(data.places);
            // 記住這一輪Worker實際用的錨點，下一輪如果沒提新地名就可以延續用這個
            // (data.debug是Worker這次回傳的診斷資訊，理論上一定會有，這裡保守判斷一下避免報錯)
            if (data.debug && data.debug.anchor) {
                carcampLastAnchor = {
                    lat: data.debug.anchor.lat,
                    lng: data.debug.anchor.lng,
                    locationName: data.debug.anchor.locationName || null,
                };
            } else {
                carcampLastAnchor = null;
            }
        } catch (err) {
            document.getElementById(loadingId)?.remove();
            chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">查詢失敗（網路或連線問題）：${escapeHtmlCarcamp(err.message)}</div>`);
        }
    }

    // 只留摘要進歷史記憶，不留完整回答內容：完整的AI回答可能好幾百字，10輪存下來會讓
    // 之後每一次查詢的prompt都跟著變得很長(等於每問一次都要多付一次前面所有輪次的token)。
    // 這裡裁到最多100字+最多列5個推薦地點名稱，同時保留「這輪聊了什麼、推薦了誰」這個
    // 對後續追問(「那附近呢」「還有其他選擇嗎」)真正有用的資訊
    function carcampRememberTurn(question, answer, places) {
        const placesNote = (places && places.length)
            ? `（推薦：${places.slice(0, 5).map(p => p.name).join('、')}）`
            : '';
        carcampHistory.push({
            q: (question || '').slice(0, 60),
            a: (answer || '').slice(0, 100) + placesNote,
        });
        if (carcampHistory.length > CARCAMP_HISTORY_MAX_TURNS) carcampHistory.shift();
    }

    // ---------------------------------------------------------------
    // 輕量長期偏好記憶：跟上面carcampHistory不一樣，這個存在瀏覽器的localStorage，
    // 不會因為重新整理頁面或這場對話結束就消失(但只留在「這台裝置的這個瀏覽器」，不會
    // 跨裝置同步，也不會傳到任何資料庫)，讓AI能漸漸抓到「這個人平常比較常問什麼類型」。
    // 只是軟性參考，不是硬性篩選規則——這次問題本身想問什麼，永遠比過去的習慣重要，
    // Worker那邊的prompt也會這樣要求AI。用uid當key的一部分，換帳號登入不會混到別人的紀錄。
    // ---------------------------------------------------------------
    function carcampPrefStorageKey() {
        return carcampCurrentUser ? `carcamp_pref_${carcampCurrentUser.uid}` : null;
    }
    function carcampLoadPrefStats() {
        const key = carcampPrefStorageKey();
        if (!key) return {};
        try {
            return JSON.parse(localStorage.getItem(key) || '{}') || {};
        } catch (err) {
            return {}; // 讀取失敗(例如無痕模式擋掉localStorage)不影響主要功能，安靜當作沒有紀錄
        }
    }
    function carcampUpdatePreferenceStats(places) {
        const key = carcampPrefStorageKey();
        if (!key || !places || !places.length) return;
        try {
            const stats = carcampLoadPrefStats();
            places.forEach(p => {
                const top = p.folderPath && p.folderPath[0];
                if (!top) return;
                stats[top] = (stats[top] || 0) + 1;
            });
            localStorage.setItem(key, JSON.stringify(stats));
        } catch (err) {
            // 寫入失敗(例如無痕模式、儲存空間被擋)不影響主要問答功能，安靜跳過就好
        }
    }
    // 取出目前累積次數最高的分類，當作這次請求附帶的軟性提示。次數太少(<3次)代表樣本
    // 還不夠，先不提示，避免只問過一兩次就被貼上標籤、反而讓後續回答被過度引導
    function carcampGetPreferenceHint() {
        const stats = carcampLoadPrefStats();
        const entries = Object.entries(stats);
        if (!entries.length) return null;
        entries.sort((a, b) => b[1] - a[1]);
        const [topName, topCount] = entries[0];
        return topCount >= 3 ? topName : null;
    }

    function renderCarcampPlacesList(places) {
        const listEl = document.getElementById('places-list');
        if (!places.length) {
            listEl.innerHTML = '';
            window.__carcampLastPlaces = [];
            return;
        }
        listEl.innerHTML = places.map((p, i) => `
            <div class="place-card">
                <div class="place-card-main" onclick="carcampFocusPlace(${i})">
                    <div class="name">📍 ${escapeHtmlCarcamp(p.name)}</div>
                    <div class="reason">${escapeHtmlCarcamp(p.reason || '')}</div>
                </div>
                <div class="place-card-actions">
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">🧭 導航</a>
                </div>
                <div class="weather-inline hidden" id="weather-inline-${i}"></div>
            </div>
        `).join('');
        window.__carcampLastPlaces = places;
    }
    // AI提到、但系統查不到足夠可靠地圖資料(沒有真的搜尋依據，或搜尋有依據但地理編碼查不到
    // 座標)的地點：不畫成一般的地點卡片，避免看起來像是已經驗證過座標的正常結果，只給一個
    // Google地圖「搜尋」連結(不是導航，因為沒有座標可以導航)，讓使用者自己確認是否存在、
    // 地址是否正確
    function renderCarcampUnverifiedPlaces(list) {
        const el = document.getElementById('unverified-places-list');
        if (!el) return;
        if (!list || !list.length) { el.innerHTML = ''; return; }
        el.innerHTML = list.map(p => `
            <div class="unverified-card">
                <div class="unverified-label">⚠️ 查無法標記的地點，請自行確認</div>
                <div class="name">${escapeHtmlCarcamp(p.name)}</div>
                ${p.reason ? `<div class="reason">${escapeHtmlCarcamp(p.reason)}</div>` : ''}
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}" target="_blank" rel="noopener">🔍 用Google地圖搜尋</a>
            </div>
        `).join('');
    }

    function carcampFocusPlace(index) {
        const p = window.__carcampLastPlaces?.[index];
        if (!p) return;
        if (carcampMap) {
            carcampMap.panTo({ lat: p.lat, lng: p.lng });
            carcampMap.setZoom(15);
            const marker = carcampMarkers[index];
            if (marker) google.maps.event.trigger(marker, 'click');
        }
        // 點選地點就直接查這個地點的天氣，不用先問過AI、也不用問題裡提到天氣關鍵字才會有——
        // 跟AI問答裡「候選清單依天氣關鍵字才enrich」是兩條獨立的路徑
        carcampShowPlaceWeather(index, p);
    }

    // ---------------------------------------------------------------
    // 點選地點即時顯示天氣：卡片內展開一塊天氣資訊，不用先問AI。用一個遞增token擋掉
    // 「使用者很快點了好幾個不同地點」時，較早那次還沒回來的請求覆蓋掉後面新點的結果
    // ---------------------------------------------------------------
    const carcampWeatherTokens = {};
    async function carcampShowPlaceWeather(index, place) {
        const el = document.getElementById(`weather-inline-${index}`);
        if (!el) return;
        el.classList.remove('hidden');
        const myToken = (carcampWeatherTokens[index] = (carcampWeatherTokens[index] || 0) + 1);
        el.innerHTML = '<span class="weather-loading">🌡️ 查詢天氣中...</span>';
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_place_weather', idToken, lat: place.lat, lng: place.lng }),
            });
            const data = await res.json();
            if (carcampWeatherTokens[index] !== myToken) return; // 這份結果已經過期(使用者點了別的地點)，不要蓋掉新的顯示
            if (!res.ok || data.error || !data.weather) {
                el.innerHTML = `<span class="weather-error">⚠️ 天氣查詢失敗${data.error ? '：' + escapeHtmlCarcamp(data.error) : ''}</span>`;
                return;
            }
            const w = data.weather;
            const daysHtml = (w.forecast || []).map(d => `<span class="weather-day"><b>${escapeHtmlCarcamp(d.label)}</b>${d.minTempC ?? '--'}~${d.maxTempC ?? '--'}°C ${escapeHtmlCarcamp(d.condition || '')} 🌧️${d.chanceOfRain}%</span>`).join('');
            const alertHtml = (w.alerts && w.alerts.length)
                ? `<div class="weather-alert">⚠️ ${w.alerts.map(a => escapeHtmlCarcamp(a)).join('；')}</div>`
                : '';
            el.innerHTML = `
                <div class="weather-now">🌡️ 現在 ${w.current.tempC ?? '--'}°C・${escapeHtmlCarcamp(w.current.condition || '')}</div>
                <div class="weather-days">${daysHtml}</div>
                ${alertHtml}
            `;
        } catch (err) {
            if (carcampWeatherTokens[index] !== myToken) return;
            el.innerHTML = `<span class="weather-error">⚠️ 天氣查詢失敗（網路或連線問題）</span>`;
        }
    }

    // ---------------------------------------------------------------
    // 分類篩選chip：不經過AI，直接依資料夾第一層分類瀏覽地點
    // ---------------------------------------------------------------
    let carcampCategoriesCache = [];
    let carcampActiveCategories = new Set();

    async function carcampLoadCategories() {
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_list_categories', idToken }),
            });
            const data = await res.json();
            if (!res.ok || data.error || !data.categories) return; // 分類清單只是輔助瀏覽功能，失敗不用打擾使用者
            carcampCategoriesCache = data.categories;
            renderCarcampCategoryChips();
        } catch (err) {
            // 同上，安靜跳過就好，不影響主要問答功能
        }
    }

    function renderCarcampCategoryChips() {
        const wrap = document.getElementById('category-chips-panel');
        const listEl = document.getElementById('category-chips');
        if (!carcampCategoriesCache.length) { wrap.classList.add('hidden'); return; }
        wrap.classList.remove('hidden');
        listEl.innerHTML = carcampCategoriesCache.map(c => `
            <button type="button" class="chip ${carcampActiveCategories.has(c.name) ? 'active' : ''}" onclick="carcampToggleCategoryChip('${c.name.replace(/'/g, "\\'")}')">${escapeHtmlCarcamp(c.name)}<span class="count">(${c.count})</span></button>
        `).join('');
    }

    async function carcampToggleCategoryChip(name) {
        if (carcampActiveCategories.has(name)) {
            carcampActiveCategories.delete(name);
        } else {
            carcampActiveCategories.add(name);
        }
        renderCarcampCategoryChips();
        if (carcampActiveCategories.size) {
            await carcampBrowseCategories();
        }
    }

    async function carcampBrowseCategories() {
        const chatLog = document.getElementById('chat-log');
        const loadingId = 'loading-' + Date.now();
        chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble loading" id="${loadingId}">依分類瀏覽中...</div>`);
        chatLog.scrollIntoView({ behavior: 'smooth', block: 'end' });
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'carcamp_browse_category', idToken,
                    categories: Array.from(carcampActiveCategories),
                    userLat: carcampUserLat, userLng: carcampUserLng,
                }),
            });
            const data = await res.json();
            document.getElementById(loadingId)?.remove();
            if (!res.ok || data.error) {
                chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">瀏覽失敗：${escapeHtmlCarcamp(data.error || '未知錯誤')}</div>`);
                return;
            }
            const places = data.places || [];
            const categoryLabel = Array.from(carcampActiveCategories).map(escapeHtmlCarcamp).join('、');
            chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">依「${categoryLabel}」分類，找到 ${data.totalMatched} 個地點${data.truncated ? `（只顯示最近的${places.length}個）` : ''}。</div>`);
            chatLog.scrollIntoView({ behavior: 'smooth', block: 'end' });
            renderCarcampMarkers(places);
            renderCarcampPlacesList(places);
            renderCarcampUnverifiedPlaces([]); // 分類瀏覽完全不經過AI/搜尋，不會有「查無法標記」的地點，清掉上一次問答留下的殘留
        } catch (err) {
            document.getElementById(loadingId)?.remove();
            chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble ai">瀏覽失敗（網路或連線問題）：${escapeHtmlCarcamp(err.message)}</div>`);
        }
    }

    // ---------------------------------------------------------------
    // 地圖來源管理：列出目前可查詢的來源(公開+自己的)、新增私人地圖
    // ---------------------------------------------------------------
    async function loadCarcampSources() {
        const listEl = document.getElementById('sources-list');
        listEl.innerHTML = '<p style="font-size:0.8rem; color:var(--dim);">載入中...</p>';
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_list_sources', idToken }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { listEl.innerHTML = `<p style="font-size:0.8rem; color:var(--danger);">載入失敗：${escapeHtmlCarcamp(data.error || '未知錯誤')}</p>`; return; }
            carcampSourcesCache = data.sources || [];
            renderCarcampSourcesList();
        } catch (err) {
            listEl.innerHTML = `<p style="font-size:0.8rem; color:var(--danger);">載入失敗（網路或連線問題）：${escapeHtmlCarcamp(err.message)}</p>`;
        }
    }

    function renderCarcampSourcesList() {
        const listEl = document.getElementById('sources-list');
        if (!carcampSourcesCache.length) {
            listEl.innerHTML = '<p style="font-size:0.8rem; color:var(--dim);">還沒有任何地圖來源，在下方新增一個吧！</p>';
            return;
        }
        const statusLabel = { pending: '準備中', ready: '就緒', error: '失敗' };
        listEl.innerHTML = carcampSourcesCache.map(s => `
            <div class="source-item">
                <span class="name">${s.isPublic ? '🌐' : '🔒'} ${escapeHtmlCarcamp(s.name)}${s.status === 'ready' ? `（${s.placemarkCount}個地點）` : ''}</span>
                <span class="status-badge ${s.status}">${statusLabel[s.status] || s.status}</span>
                <button class="btn btn-outline" style="padding:0.35rem 0.7rem; font-size:0.75rem;" onclick="carcampRefreshSource('${s.id}')">🔄</button>
                <button class="btn btn-outline" style="padding:0.35rem 0.7rem; font-size:0.75rem; color:var(--danger); border-color:var(--danger);" onclick="carcampDeleteSource('${s.id}', '${escapeHtmlCarcamp(s.name).replace(/'/g, "\\'")}')">🗑️</button>
            </div>
        `).join('');
    }

    async function carcampRefreshSource(sourceId) {
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_refresh_source', idToken, sourceId }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('重新整理失敗：' + (data.error || '未知錯誤')); return; }
            alert(`重新整理完成，共 ${data.placemarkCount} 個地點。`);
            loadCarcampSources();
        } catch (err) {
            alert('重新整理失敗（網路或連線問題）：' + err.message);
        }
    }

    async function carcampDeleteSource(sourceId, sourceName) {
        if (!confirm(`確定要刪除「${sourceName}」嗎？這個動作無法復原，底下所有的地點資料都會一併清除。`)) return;
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_delete_source', idToken, sourceId }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('刪除失敗：' + (data.error || '未知錯誤')); return; }
            loadCarcampSources();
        } catch (err) {
            alert('刪除失敗（網路或連線問題）：' + err.message);
        }
    }

    async function carcampAddSource() {
        const name = document.getElementById('new-source-name').value.trim();
        const mapUrlOrMid = document.getElementById('new-source-url').value.trim();
        if (!name || !mapUrlOrMid) { alert('請填寫地圖名稱跟連結'); return; }
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_add_source', idToken, name, mapUrlOrMid, isPublic: false }),
            });
            const data = await res.json();
            if (!res.ok || data.error) { alert('新增失敗：' + (data.error || '未知錯誤')); return; }
            // 新增後立刻觸發重新整理，讓資料馬上可以查詢，不用使用者自己再多按一次
            const refreshRes = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'carcamp_refresh_source', idToken, sourceId: data.sourceId }),
            });
            const refreshData = await refreshRes.json();
            if (!refreshRes.ok || refreshData.error) {
                alert('地圖已新增，但抓取資料時發生問題：' + (refreshData.error || '未知錯誤') + '\n請確認地圖分享設定是否為「知道連結的使用者均可查看」');
            } else {
                alert(`新增成功！共抓到 ${refreshData.placemarkCount} 個地點，現在可以直接開始問了。`);
            }
            document.getElementById('new-source-name').value = '';
            document.getElementById('new-source-url').value = '';
        } catch (err) {
            alert('新增失敗（網路或連線問題）：' + err.message);
        }
    }

    // ---------------------------------------------------------------
    // 行程規劃v2：使用者填天數、逐項新增一定要去的途經點(車宿/美食/景點)，或用一段話讓AI
    // 解析——Worker那邊會把這些點解析成座標、算出真實路線跟最順路的拜訪順序、依天數分天、
    // 計算車宿/美食配額(超額自動篩選並附理由、不足自動沿路補推薦真實地點)，AI只負責把已經
    // 排定的地點寫成自然敘述。前端這裡負責維護「逐項新增」清單的畫面狀態、把表單內容送出去，
    // 然後把結果渲染成「總覽+配額提醒+每天一個區塊」，並在地圖上畫出路線跟每一天的停靠點。
    // ---------------------------------------------------------------
    let carcampItineraryStops = []; // { name, category }

    function renderCarcampItineraryStopsList() {
        const listEl = document.getElementById('itinerary-stops-list');
        const categoryLabel = { camp: '車宿', food: '美食', attraction: '景點', unknown: '不確定' };
        listEl.innerHTML = carcampItineraryStops.map((s, i) => `
            <div class="itinerary-stop-item">
                <span><span class="stop-name">${escapeHtmlCarcamp(s.name)}</span><span class="stop-category">（${categoryLabel[s.category] || '不確定'}）</span></span>
                <button type="button" class="itinerary-stop-remove" onclick="carcampRemoveItineraryStop(${i})" aria-label="移除">✕</button>
            </div>
        `).join('');
    }

    function carcampAddItineraryStop() {
        const nameInput = document.getElementById('itinerary-stop-name-input');
        const categoryInput = document.getElementById('itinerary-stop-category-input');
        const name = nameInput.value.trim();
        if (!name) { alert('請輸入地點名稱'); return; }
        carcampItineraryStops.push({ name, category: categoryInput.value || 'unknown' });
        nameInput.value = '';
        categoryInput.value = 'unknown';
        nameInput.focus();
        renderCarcampItineraryStopsList();
    }

    function carcampRemoveItineraryStop(index) {
        carcampItineraryStops.splice(index, 1);
        renderCarcampItineraryStopsList();
    }

    async function carcampPlanItinerary(event) {
        event.preventDefault();
        const originText = document.getElementById('itinerary-origin').value.trim();
        const destinationText = document.getElementById('itinerary-destination').value.trim();
        if (!destinationText) { alert('請輸入目的地'); return; }

        let tripDays = parseInt(document.getElementById('itinerary-days').value, 10);
        if (!Number.isFinite(tripDays) || tripDays < 1) tripDays = 1;

        const freeformNote = document.getElementById('itinerary-freeform').value.trim();

        const resultEl = document.getElementById('itinerary-result');
        const submitBtn = document.getElementById('itinerary-submit-btn');

        // 出發地：使用者有自己輸入地名就用地名(讓Worker那邊查Geocoding API)，沒輸入的話
        // 退回目前定位到的GPS座標；兩者都沒有就沒辦法規劃，先擋掉、不要送一個沒有出發地的
        // 請求白白浪費一次Routes API額度
        const requestBody = {
            action: 'carcamp_itinerary',
            destinationText,
            tripDays,
            requestedStops: carcampItineraryStops,
            freeformNote,
            preferenceHint: carcampGetPreferenceHint(),
        };
        if (originText) {
            requestBody.originText = originText;
        } else if (Number.isFinite(carcampUserLat) && Number.isFinite(carcampUserLng)) {
            requestBody.originLat = carcampUserLat;
            requestBody.originLng = carcampUserLng;
        } else {
            alert('請輸入出發地，或允許定位權限後再試一次');
            return;
        }

        submitBtn.disabled = true;
        resultEl.innerHTML = '<p class="itinerary-loading">規劃中，要先算真實路線、解析途經點、再計算配額，可能要等一下下...</p>';
        try {
            const idToken = await carcampCurrentUser.getIdToken();
            requestBody.idToken = idToken;
            const res = await fetch(CLOUDFLARE_AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody),
            });
            const data = await res.json();
            if (!res.ok || data.error) {
                resultEl.innerHTML = `<p class="itinerary-error">規劃失敗：${escapeHtmlCarcamp(data.error || '未知錯誤')}</p>`;
                return;
            }
            renderCarcampItinerary(data);
        } catch (err) {
            resultEl.innerHTML = `<p class="itinerary-error">規劃失敗（網路或連線問題）：${escapeHtmlCarcamp(err.message)}</p>`;
        } finally {
            submitBtn.disabled = false;
        }
    }

    function renderCarcampItinerary(data) {
        const resultEl = document.getElementById('itinerary-result');
        const totalHours = Number.isFinite(data.totalDurationMinutes) ? Math.round(data.totalDurationMinutes / 60 * 10) / 10 : null;
        const days = Array.isArray(data.days) ? data.days : [];
        const categoryLabel = { camp: '🏕️ 車宿', food: '🍜 美食', attraction: '🎡 景點', unknown: '📍 停靠點' };

        const missingDaySlots = Number.isFinite(data.missingDaySlots) ? data.missingDaySlots : 0;
        const missingDaysNote = missingDaySlots > 0
            ? `<p class="itinerary-warning-note">⚠️ 提供的途經點不夠湊出完整${data.requestedDays}天的行程，目前只能排出${data.actualDays}天——建議再多指定${missingDaySlots}個車宿點，行程就能延長。</p>`
            : '';

        const campShortfall = data.quota?.camp?.shortfall || 0;
        const foodShortfall = data.quota?.food?.shortfall || 0;
        const quotaNote = (campShortfall > 0 || foodShortfall > 0)
            ? `<p class="itinerary-warning-note">⚠️ ${campShortfall > 0 ? `還有${campShortfall}晚沒找到合適的車宿點` : ''}${campShortfall > 0 && foodShortfall > 0 ? '，' : ''}${foodShortfall > 0 ? `還缺${foodShortfall}個美食點沒補到` : ''}，可以自己在地圖來源裡補充資料，或再規劃一次試試看。</p>`
            : '';

        const excludedStops = Array.isArray(data.excludedStops) ? data.excludedStops : [];
        const excludedHtml = excludedStops.length
            ? `<p class="itinerary-field-label">已自動排除的超額地點</p><ul class="itinerary-excluded-list">${excludedStops.map(e => `<li>${escapeHtmlCarcamp(e.reason || e.name)}</li>`).join('')}</ul>`
            : '';

        const unresolvedStops = Array.isArray(data.unresolvedStops) ? data.unresolvedStops : [];
        const unresolvedHtml = unresolvedStops.length
            ? `<p class="itinerary-field-label">這幾個地點查不到，已略過</p><ul class="itinerary-unresolved-list">${unresolvedStops.map(u => `<li>${escapeHtmlCarcamp(u.name)}：${escapeHtmlCarcamp(u.reason || '')}</li>`).join('')}</ul>`
            : '';

        const summaryHtml = `
            <div class="itinerary-summary">
                <div class="itinerary-summary-route">🚗 ${escapeHtmlCarcamp(data.origin?.label || '出發地')} → ${escapeHtmlCarcamp(data.destination?.label || '目的地')}</div>
                <div class="itinerary-summary-stats">全程約${Number.isFinite(data.totalDistanceKm) ? data.totalDistanceKm.toFixed(0) : '--'}公里${totalHours != null ? `・開車約${totalHours}小時` : ''}・共${days.length}天</div>
                <p>${escapeHtmlCarcamp(data.tripSummary || '')}</p>
                ${missingDaysNote}${quotaNote}${excludedHtml}${unresolvedHtml}
            </div>
        `;
        const daysHtml = days.map(d => {
            const kmText = Number.isFinite(d.drivingKmThisDay) ? `<span class="itinerary-day-km">約${d.drivingKmThisDay.toFixed(0)}公里</span>` : '';
            const stops = Array.isArray(d.stops) ? d.stops : [];
            const campMissingHtml = d.isCampNight && d.needsCampSupplement
                ? `<p class="itinerary-warning-note">⚠️ 這天還沒找到合適的車宿點${d.campSupplementFailedReason ? `（${escapeHtmlCarcamp(d.campSupplementFailedReason)}）` : ''}</p>`
                : '';
            const stopsHtml = stops.length ? `<div class="itinerary-day-stops">${stops.map(s => {
                const tag = s.supplemented
                    ? '<span class="itinerary-tag itinerary-tag-supplemented">系統補推薦</span>'
                    : '<span class="itinerary-tag itinerary-tag-required">指定必去</span>';
                return `
                <div class="place-card">
                    <div class="place-card-main">
                        <div class="name">${categoryLabel[s.category] || '📍'} ${escapeHtmlCarcamp(s.name)}${tag}</div>
                    </div>
                    <div class="place-card-actions">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">🧭 導航</a>
                    </div>
                </div>
            `;
            }).join('')}</div>` : '';
            return `
                <div class="itinerary-day">
                    <div class="itinerary-day-title">${escapeHtmlCarcamp(d.dayTitle || `Day ${d.day}`)}${kmText}</div>
                    <p class="itinerary-day-narrative">${escapeHtmlCarcamp(d.narrative || '')}</p>
                    ${campMissingHtml}
                    ${stopsHtml}
                </div>
            `;
        }).join('');
        resultEl.innerHTML = summaryHtml + daysHtml;
        renderCarcampItineraryOnMap(data);
    }

    // 行程規劃結果畫在地圖上：清掉問答功能留下的舊標記，改畫這趟路線的polyline+出發/目的地
    // 標記+每天推薦的停靠點標記。跟renderCarcampMarkers共用同一個carcampMarkers陣列(反正
    // 同一時間只會顯示問答結果或行程結果其中一種)，另外用carcampItineraryPolyline單獨記錄
    // 路線圖層，方便下次規劃前先清掉舊路線
    let carcampItineraryPolyline = null;
    function renderCarcampItineraryOnMap(data) {
        carcampMarkers.forEach(m => m.setMap(null));
        carcampMarkers = [];
        if (carcampItineraryPolyline) {
            carcampItineraryPolyline.setMap(null);
            carcampItineraryPolyline = null;
        }
        if (!carcampMap) return;

        const bounds = new google.maps.LatLngBounds();

        if (Array.isArray(data.polyline) && data.polyline.length > 1) {
            carcampItineraryPolyline = new google.maps.Polyline({
                path: data.polyline.map(p => ({ lat: p.lat, lng: p.lng })),
                geodesic: true, strokeColor: '#F2994A', strokeOpacity: 0.9, strokeWeight: 4,
            });
            carcampItineraryPolyline.setMap(carcampMap);
            data.polyline.forEach(p => bounds.extend({ lat: p.lat, lng: p.lng }));
        }

        if (data.origin && Number.isFinite(data.origin.lat) && Number.isFinite(data.origin.lng)) {
            const originMarker = new google.maps.Marker({
                position: { lat: data.origin.lat, lng: data.origin.lng }, map: carcampMap,
                title: '出發：' + (data.origin.label || ''),
                label: { text: '起', color: '#1A0F08', fontWeight: '700' },
                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10, fillColor: '#52A37C', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
            });
            carcampMarkers.push(originMarker);
            bounds.extend({ lat: data.origin.lat, lng: data.origin.lng });
        }

        if (data.destination && Number.isFinite(data.destination.lat) && Number.isFinite(data.destination.lng)) {
            const destMarker = new google.maps.Marker({
                position: { lat: data.destination.lat, lng: data.destination.lng }, map: carcampMap,
                title: '目的地：' + (data.destination.label || ''),
                label: { text: '終', color: '#fff', fontWeight: '700' },
                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10, fillColor: '#EB5E28', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
            });
            carcampMarkers.push(destMarker);
            bounds.extend({ lat: data.destination.lat, lng: data.destination.lng });
        }

        (Array.isArray(data.days) ? data.days : []).forEach(d => {
            const categoryLabel = { camp: '車宿', food: '美食', attraction: '景點', unknown: '停靠點' };
            (Array.isArray(d.stops) ? d.stops : []).forEach(s => {
                if (!Number.isFinite(s.lat) || !Number.isFinite(s.lng)) return;
                const detailText = `${categoryLabel[s.category] || '停靠點'}${s.supplemented ? '・系統補推薦' : '・指定必去'}`;
                const marker = new google.maps.Marker({
                    position: { lat: s.lat, lng: s.lng }, map: carcampMap, title: `Day${d.day}：${s.name}`,
                });
                const infoWindow = new google.maps.InfoWindow({
                    content: `<div style="color:#1A2333; font-family:'Noto Sans TC',sans-serif; padding:2px;"><strong style="font-size:0.95rem;">Day${d.day}・${s.name}</strong><br><span style="color:#4A5568; font-size:0.85rem;">${detailText}</span></div>`,
                });
                marker.addListener('click', () => infoWindow.open(carcampMap, marker));
                carcampMarkers.push(marker);
                bounds.extend({ lat: s.lat, lng: s.lng });
            });
        });

        if (!bounds.isEmpty()) carcampMap.fitBounds(bounds);
    }
</script>
</body>
</html>
