      projectId: "recipe-synchronization",
      storageBucket: "recipe-synchronization.firebasestorage.app",
      messagingSenderId: "559668909743",
      appId: "1:559668909743:web:63dc34572b98839479265a"
    };
    firebase.initializeApp(firebaseConfig);
    window.mpAuth = firebase.auth();
    window.mpDb = firebase.firestore();

    mpAuth.onAuthStateChanged(async user => {
      mpCurrentUser = user;
      document.getElementById('mp-login-gate').classList.toggle('hidden', !!user);
      if (!user) { document.getElementById('mp-root').innerHTML = ''; return; }
      try {
        const doc = await mpDb.collection('userProgress').doc(user.uid).get();
        mpDisplayName = (doc.exists && doc.data().nickname) || user.displayName || '艦長';
      } catch (e) { mpDisplayName = user.displayName || '艦長'; }
      renderMpLobby();
    });
  }
  function googleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    mpAuth.signInWithPopup(provider).catch(err => alert('登入失敗：' + err.message));
  }
  function mpCleanupRoom() {
    if (mpRoomState.unsubscribe) { mpRoomState.unsubscribe(); mpRoomState.unsubscribe = null; }
    if (mpLobbyUnsubscribe) { mpLobbyUnsubscribe(); mpLobbyUnsubscribe = null; }
    if (mpBattleUnsubscribe) { mpBattleUnsubscribe(); mpBattleUnsubscribe = null; }
    mpBattleListenerSetup = false;
    mpMyCombatState = null;
    mpRoomState = { roomId: null, unsubscribe: null };
  }

  // ---------- 大廳：房間列表 ----------
  function renderMpLobby() {
    mpCleanupRoom();
    document.getElementById('mp-root').innerHTML = `
      <div class="mp-panel" style="text-align:left;">
        <button class="mp-btn primary" onclick="openMpCreateForm()">➕ 建立新房間</button>
        <p style="font-weight:800; font-size:13px; margin:14px 0 8px;">🚪 目前開放的房間</p>
        <div id="mp-room-list"><p style="text-align:center; color:var(--muted); font-size:12px;">載入中...</p></div>
      </div>
    `;
    mpLobbyUnsubscribe = mpDb.collection('navalBattleRooms').where('status', '==', 'waiting').limit(20)
      .onSnapshot(snap => {
        const listEl = document.getElementById('mp-room-list');
        if (!listEl) return;
        if (snap.empty) { listEl.innerHTML = `<p style="text-align:center; color:var(--muted); font-size:12px;">目前沒有開放中的房間，建立一個新的吧！</p>`; return; }
        listEl.innerHTML = snap.docs.map(doc => {
          const d = doc.data();
          return `<button class="mp-room-list-item" onclick="promptMpJoin('${doc.id}')">
            <b>${escapeHtmlMp(d.roomName || '未命名房間')}</b>
            <small>👑${escapeHtmlMp((d.members[0] && d.members[0].name) || '?')} · ${d.members.length}/${d.maxPlayers}人</small>
          </button>`;
        }).join('');
      }, err => {
        const listEl = document.getElementById('mp-room-list');
        if (listEl) listEl.innerHTML = `<p style="text-align:center; color:var(--critical); font-size:12px;">載入失敗：${err.message}</p>`;
      });
  }
  function escapeHtmlMp(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 解析戰報文字：依照「我」的uid，判斷這則戰報該顯示哪個版本——perUid裡有明確指定我的話
  // 用那個版本(可能是客製化文字，也可能是null代表對我隱藏)，沒有特別指定就用default(旁觀者
  // 看到的公開版本，同樣可能是null代表旁觀者看不到這則)
  function resolveMpLogText(entry) {
    if (typeof entry === 'string') return entry; // 相容極早期可能殘留的純文字格式
    if (entry.perUid && Object.prototype.hasOwnProperty.call(entry.perUid, mpCurrentUser.uid)) {
      return entry.perUid[mpCurrentUser.uid];
    }
    return entry.default;
  }

  function openMpCreateForm() {
    document.getElementById('mp-root').innerHTML = `
      <div class="mp-panel" style="text-align:left;">
        <label class="mp-label">房間名稱</label>
        <input class="mp-input" id="mp-cr-name" placeholder="例如：週末海戰">
        <label class="mp-label">密碼</label>
        <input class="mp-input mp-input-large" id="mp-cr-password" placeholder="設定一個密碼">
        <label class="mp-label">最多幾人（2~4人）</label>
        <input class="mp-input" id="mp-cr-maxplayers" type="number" min="2" max="4" value="4">
        <button class="mp-btn primary" style="margin-top:14px;" onclick="createMpRoom()">建立房間</button>
        <button class="mp-btn" onclick="renderMpLobby()">返回</button>
      </div>
    `;
  }
  function generateMpRoomId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }
  async function createMpRoom() {
    const roomName = (document.getElementById('mp-cr-name').value || '').trim() || '未命名房間';
    const password = (document.getElementById('mp-cr-password').value || '').trim();
    if (!password) { alert('請設定密碼'); return; }
    let maxPlayers = parseInt(document.getElementById('mp-cr-maxplayers').value, 10) || 4;
    maxPlayers = Math.min(MP_MAX_PLAYERS_CAP, Math.max(MP_MIN_PLAYERS, maxPlayers));
    const roomId = generateMpRoomId();
    try {
      const oldRoomsSnap = await mpDb.collection('navalBattleRooms').where('hostUid', '==', mpCurrentUser.uid).get();
      for (const oldDoc of oldRoomsSnap.docs) await oldDoc.ref.delete();
      await mpDb.collection('navalBattleRooms').doc(roomId).set({
        hostUid: mpCurrentUser.uid, roomName, password, maxPlayers,
        members: [{ uid: mpCurrentUser.uid, name: mpDisplayName, direction: null, shipSelected: false, ready: false }],
        memberUids: [mpCurrentUser.uid],
        status: 'waiting',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      mpEnterRoom(roomId);
    } catch (err) { alert('建立房間失敗：' + err.message); }
  }
  let mpJoinModalRoomId = null;
  function promptMpJoin(roomId) {
    mpJoinModalRoomId = roomId;
    document.getElementById('mp-join-password-input').value = '';
    document.getElementById('mp-join-modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('mp-join-password-input').focus(), 50);
  }
  function closeMpJoinModal() {
    document.getElementById('mp-join-modal').classList.add('hidden');
    mpJoinModalRoomId = null;
  }
  function confirmMpJoinModal() {
    const password = document.getElementById('mp-join-password-input').value;
    const roomId = mpJoinModalRoomId;
    closeMpJoinModal();
    if (roomId) mpJoinRoom(roomId, password);
  }
  async function mpJoinRoom(roomId, password) {
    try {
      const ref = mpDb.collection('navalBattleRooms').doc(roomId);
      const doc = await ref.get();
      if (!doc.exists) { alert('房間不存在'); renderMpLobby(); return; }
      const data = doc.data();
      if (data.password !== password) { alert('密碼錯誤'); return; }
      if (data.status !== 'waiting') { alert('這場遊戲已經開始了'); return; }
      if (data.members.length >= data.maxPlayers) { alert('房間已滿'); return; }
      if (data.memberUids.includes(mpCurrentUser.uid)) { mpEnterRoom(roomId); return; }
      await ref.update({
        members: firebase.firestore.FieldValue.arrayUnion({ uid: mpCurrentUser.uid, name: mpDisplayName, direction: null, shipSelected: false, ready: false }),
        memberUids: firebase.firestore.FieldValue.arrayUnion(mpCurrentUser.uid),
      });
      mpEnterRoom(roomId);
    } catch (err) { alert('加入房間失敗：' + err.message); }
  }

  async function mpEnterRoom(roomId) {
    mpRoomState.roomId = roomId;
    // 讀回自己之前選過的船型(如果有)，避免重新整理頁面後本地的mpMySelectedShip變數
    // 被重置成空，導致畫面誤以為還沒選過船——這份資料只有本人能讀，不影響隱私隔離
    try {
      const shipDoc = await mpDb.collection('navalBattleRooms').doc(roomId).collection('privateShips').doc(mpCurrentUser.uid).get();
      if (shipDoc.exists) mpMySelectedShip = shipDoc.data().shipType;
    } catch (err) { console.warn('讀取先前選過的船型失敗', err); }
    mpRoomState.unsubscribe = mpDb.collection('navalBattleRooms').doc(roomId).onSnapshot(doc => {
      if (!doc.exists) { alert('房間已經被關閉'); mpCleanupRoom(); renderMpLobby(); return; }
      const data = doc.data();
      window.__mpLastRoomData = data; // 隨時保持最新，戰鬥畫面重新渲染要用這份而不是舊的closure
      if (data.status === 'waiting') { renderMpWaitingRoom(data); return; }
      if (data.status === 'positioning') {
        renderMpPositioningView(data);
        finalizeMpBattleIfReady(data); // 每個人都選好位置後，任何一個客戶端偵測到都可以觸發真正開戰
        return;
      }
      // 進入戰鬥狀態：確保私有戰鬥狀態監聽器只設定一次，然後不管是房間資料變化(這裡)還是
      // 自己的戰鬥狀態變化(下面那個監聽器)，都要用「最新」的房間資料重新渲染——之前的bug是
      // 渲染只在第一次進入戰鬥時執行，之後房間資料再怎麼更新(包含戰報更新等)畫面都不會跟著動
      setupMpBattleListenerIfNeeded();
      renderMpBattleView(data);
    }, err => console.warn('房間同步失敗', err));
  }

  let mpBattleListenerSetup = false;
  let mpAutoEndTurnLock = false;
  function setupMpBattleListenerIfNeeded() {
    if (mpBattleListenerSetup) return; // 只需要設定一次這個監聽器本身，但它觸發時一律用最新房間資料渲染
    mpBattleListenerSetup = true;
    const roomRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
    mpBattleUnsubscribe = roomRef.collection('privateCombatState').doc(mpCurrentUser.uid).onSnapshot(doc => {
      if (!doc.exists) return; // 房主可能還在初始化中，稍等它建立
      mpMyCombatState = doc.data();
      checkIncomingAttack(mpMyCombatState); // 偵測有沒有新的攻擊打過來，觸發砲彈落下動畫
      if (window.__mpLastRoomData) renderMpBattleView(window.__mpLastRoomData);

      // 移動次數用完+已經開過火(每回合限一次)，不用手動按「結束回合」，自動觸發——
      // 用mpAutoEndTurnLock避免這個監聽器短時間內重複觸發好幾次結束回合請求
      const roomD = window.__mpLastRoomData;
      const isMyTurnNow = roomD && roomD.turnOrder && roomD.turnOrder[roomD.currentTurnIndex] === mpCurrentUser.uid;
      if (isMyTurnNow && !mpAutoEndTurnLock && mpMyCombatState.actionsLeftThisTurn <= 0 && mpMyCombatState.hasFiredThisTurn) {
        mpAutoEndTurnLock = true;
        setTimeout(() => { mpEndTurn(); mpAutoEndTurnLock = false; }, 800); // 稍微延遲一下，讓玩家看得到最後一個動作的畫面回饋才切換回合
      }
    });
  }

  // 復原機制：如果房間狀態已經變成playing、但戰鬥初始化一直沒有真正完成(turnOrder遲遲沒出現，
  // 可能是Worker呼叫失敗、網路問題等)，房主可以按這個按鈕把房間重設回等待室重新開始，
  // 不然房間會永遠卡在playing狀態、沒辦法再按「開始遊戲」
  async function mpResetStuckRoom() {
    if (!confirm('確定要把房間重設回等待室嗎？大家的準備狀態會被清空，需要重新準備一次。')) return;
    try {
      const roomRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(roomRef);
        const data = doc.data();
        if (data.hostUid !== mpCurrentUser.uid) return;
        const members = data.members.map(m => ({ ...m, ready: false }));
        tx.update(roomRef, {
          status: 'waiting', members, battleInitialized: false,
          turnOrder: null, currentTurnIndex: 0, combatLog: [], eliminatedUids: [], winnerUid: null,
        });
      });
    } catch (err) { alert('重設失敗：' + err.message); }
  }

  // ---------- 等待室：成員列表 + 選方位 + 選船型(私有) + 準備 ----------
  function renderMpWaitingRoom(data) {
    const isHost = data.hostUid === mpCurrentUser.uid;
    const me = data.members.find(m => m.uid === mpCurrentUser.uid);
    const takenDirections = new Set(data.members.filter(m => m.uid !== mpCurrentUser.uid && m.direction).map(m => m.direction));
    const allReady = data.members.length >= MP_MIN_PLAYERS && data.members.every(m => m.direction && m.shipSelected && m.ready);

    const memberCards = Array.from({ length: data.maxPlayers }, (_, i) => {
      const m = data.members[i];
      if (!m) return `<div class="mp-member-card empty">空位</div>`;
      return `<div class="mp-member-card ${m.ready ? 'ready' : ''}">
        <div class="mp-mname">${m.uid === data.hostUid ? '👑' : ''}${escapeHtmlMp(m.name)}</div>
        <div>${m.direction ? DIRECTION_LABEL[m.direction] : '未選方位'}</div>
        <div>${m.shipSelected ? '🚢 已選船（保密）' : '⏳ 未選船'}</div>
        <div>${m.ready ? '✅ 已準備' : '⏳ 準備中'}</div>
      </div>`;
    }).join('');

    const directionBtns = Object.keys(DIRECTION_LABEL).map(dir => {
      const isMine = me.direction === dir;
      const takenByOther = takenDirections.has(dir);
      return `<button class="mp-direction-btn ${isMine ? 'selected' : ''}" ${takenByOther ? 'disabled' : ''} onclick="pickMpDirection('${dir}')">${DIRECTION_LABEL[dir]}${takenByOther ? '（已被選走）' : ''}</button>`;
    }).join('');

    const shipBtns = Object.entries(SHIP_TYPES).map(([key, spec]) => {
      // 自己選過的船型，本地state會記住(見mpMySelectedShip)，用來畫面呈現「你選的是哪一艘」；
      // 但這個資訊完全不會寫進公開的房間文件，只有自己這個瀏覽器session知道
      const isMine = mpMySelectedShip === key;
      // 顯示特殊武器的威力(一般砲彈固定威力100，每艘船都一樣，不用特別列；特殊武器才是
      // 各船型真正的差異化重點)，以及AOE範圍或多發次數這類額外資訊
      const specialWeaponKey = Object.keys(spec.weapons).find(k => k !== 'normal');
      const sw = spec.weapons[specialWeaponKey];
      const swExtra = sw.aoe ? `範圍${sw.aoe.w}x${sw.aoe.h}` : sw.shots ? `${sw.shots}連發` : sw.pattern ? '間隔陣型' : '';
      return `<button class="mp-ship-btn ${isMine ? 'selected' : ''}" ${me.ready ? 'disabled' : ''} onclick="pickMpShip('${key}')">
        <b>${spec.name}</b>血量${spec.maxHealth}・體積${spec.length}x${spec.width}・移動${spec.baseActions}
        <br><span style="color:var(--muted);">特殊武器威力${sw.power}${swExtra ? '・' + swExtra : ''}（限${sw.uses}次）</span>
      </button>`;
    }).join('');

    document.getElementById('mp-root').innerHTML = `
      <div class="mp-panel" style="text-align:left; max-width:600px;">
        <p style="font-size:11px; color:var(--muted);">房間代碼</p>
        <p style="font-size:20px; font-weight:900; letter-spacing:2px;">${mpRoomState.roomId}</p>
        <p style="font-weight:800; font-size:13px; margin:10px 0 4px;">👥 房間成員（${data.members.length}/${data.maxPlayers}）</p>
        <div class="mp-members-grid">${memberCards}</div>

        <p style="font-weight:800; font-size:13px; margin:14px 0 4px;">🧭 選擇你的方位（東南西北海，每人限選一個）</p>
        <div class="mp-direction-grid">${directionBtns}</div>

        <p style="font-weight:800; font-size:13px; margin:14px 0 4px;">🚢 選擇你的船隻（其他玩家看不到你選了什麼，取消準備後可以重選）</p>
        <div class="mp-ship-grid">${shipBtns}</div>
        ${me.ready ? `<p class="mp-locked-note">✅ 已準備，取消準備才能重新選船</p>` : ''}

        <button class="mp-btn primary" style="margin-top:14px;" onclick="toggleMpReady(${!me.ready})" ${(!me.direction || !me.shipSelected) ? 'disabled' : ''}>${me.ready ? '取消準備' : '✅ 我準備好了'}</button>
        ${isHost ? `<button class="mp-btn" onclick="confirmMpStartGame()" ${allReady ? '' : 'disabled'}>${allReady ? '⚓ 開始遊戲' : '等待全部人準備好...'}</button>` : `<p style="text-align:center; color:var(--muted); font-size:12px; margin-top:8px;">${allReady ? '⏳ 等待房主開始遊戲...' : '⏳ 等待全部人準備好...'}</p>`}
        <button class="mp-btn" onclick="leaveMpRoom()">離開房間</button>
      </div>
    `;
  }

  async function pickMpDirection(direction) {
    // 樂觀更新：立刻用本地修改過的資料重新渲染，不等Firestore寫入完成才等onSnapshot觸發
    // 重新渲染——畫面會立刻反映剛剛的點擊，不會有「看起來沒反應」的延遲感。實際寫入
    // 還是照常進行，最終onSnapshot回來的真實資料會自動校正(例如方位其實被別人搶走了)
    if (window.__mpLastRoomData) {
      const optimisticData = {
        ...window.__mpLastRoomData,
        members: window.__mpLastRoomData.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, direction } : m),
      };
      renderMpWaitingRoom(optimisticData);
    }
    try {
      const ref = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(ref);
        const data = doc.data();
        // 交易內重新確認這個方位還沒被「別人」搶走，避免兩人幾乎同時點選同一個方位的race condition
        const takenByOther = data.members.some(m => m.uid !== mpCurrentUser.uid && m.direction === direction);
        if (takenByOther) return;
        const members = data.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, direction } : m);
        tx.update(ref, { members });
      });
    } catch (err) { alert('選擇方位失敗：' + err.message); }
  }

  // 本地記住自己選的船型(只是為了畫面呈現「你選的是這艘」，不會寫進公開資料)；
  // 真正寫入的是navalBattleRooms/{roomId}/privateShips/{myUid}這個子集合，
  // Firestore安全規則會限制只有uid等於自己的人才能讀取——這是在伺服器端judge的，
  // 不是前端不顯示而已，其他玩家用開發者工具檢查網路封包也讀不到這筆資料。
  // 已經準備好的狀態下不能重選(要先取消準備)，用交易確保跟其他同時發生的操作
  // (切換準備/選方位)不會互相覆蓋掉彼此的修改
  let mpMySelectedShip = null;
  async function pickMpShip(shipType) {
    // 先更新本地變數，再做任何Firestore寫入——因為寫入members陣列會立刻觸發onSnapshot
    // 重新渲染畫面，如果本地變數的更新排在寫入後面，重新渲染當下讀到的還是舊值，
    // 畫面就會顯示成「沒選中」，要等到之後某個別的動作再次觸發重新渲染才會看到正確結果
    mpMySelectedShip = shipType;
    // 樂觀更新：跟pickMpDirection同樣的做法，立刻用本地修改過的資料重新渲染
    if (window.__mpLastRoomData) {
      const optimisticData = {
        ...window.__mpLastRoomData,
        members: window.__mpLastRoomData.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, shipSelected: true } : m),
      };
      renderMpWaitingRoom(optimisticData);
    }
    try {
      const roomRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(roomRef);
        const data = doc.data();
        const me = data.members.find(m => m.uid === mpCurrentUser.uid);
        if (me.ready) return; // 已經準備好了，要先取消準備才能重選，保險檢查(介面按鈕理論上已經disabled)
        const members = data.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, shipSelected: true } : m);
        tx.update(roomRef, { members });
      });
      // privateShips這份寫入本身不需要跟members陣列包在同一個交易裡(不同集合，Firestore
      // 交易可以跨集合，但這裡分開寫沒有race condition風險，因為只有自己會寫自己的privateShips)
      await mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId)
        .collection('privateShips').doc(mpCurrentUser.uid).set({ shipType });
    } catch (err) { alert('選擇船型失敗：' + err.message); }
  }

  // 切換準備狀態：改用交易保護，避免跟選方位/選船型幾乎同時發生時，用舊資料覆蓋掉對方的修改
  async function toggleMpReady(ready) {
    if (window.__mpLastRoomData) {
      const optimisticData = {
        ...window.__mpLastRoomData,
        members: window.__mpLastRoomData.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, ready } : m),
      };
      renderMpWaitingRoom(optimisticData);
    }
    try {
      const ref = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(ref);
        const data = doc.data();
        const members = data.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, ready } : m);
        tx.update(ref, { members });
      });
    } catch (err) { console.warn('切換準備狀態失敗', err); }
  }

  async function confirmMpStartGame() {
    try {
      const ref = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      const claimed = await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(ref);
        const data = doc.data();
        if (data.hostUid !== mpCurrentUser.uid) return false; // 只有房主能開始遊戲
        if (data.status !== 'waiting') return false;
        if (data.members.length < MP_MIN_PLAYERS) return false;
        if (!data.members.every(m => m.direction && m.shipSelected && m.ready)) return false;
        // 先進入「選位置」階段，不直接開戰——每個人要先在自己的地圇上選好船隻起始位置，
        // 全部人都選好之後才會真正進入戰鬥(見finalizeMpBattleIfReady)
        const members = data.members.map(m => ({ ...m, positioned: false }));
        tx.update(ref, { status: 'positioning', members });
        return true;
      });
      if (!claimed) alert('還沒全部人準備好，或已經開始了');
    } catch (err) { alert('開始遊戲失敗：' + err.message); }
  }

  // ============================================================
  // 真正的戰鬥系統：每個玩家在自己的20x20地圖上有一艘船，開火是「盲打」——
  // 選定要攻擊的方位、在對方海域範圍內任選座標開火，看不到對方船隻實際位置。
  //
  // 資料結構：navalBattleRooms/{roomId}/privateCombatState/{uid} 存放每個人的
  // 即時戰鬥狀態(位置/血量/著火/移動上限扣減/武器次數/潛水艇下潛狀態等)。
  //
  // ✅ 開火判定(座標模糊化、傷害計算、命中/落空、傷害敘述分級)已經改成透過Cloudflare
  // Worker在伺服器端處理(呼叫naval_battle_fire這個action)，Worker用service account
  // 的權限同時讀寫攻擊方跟防守方的私有資料，前端這裡完全不會讀到對方的精確座標/血量——
  // 這是真正的伺服器端隔離，不是介面不顯示而已。相關演算法(模糊座標、傷害敘述分級)的
  // 實作現在都在worker.js的handleNavalBattleFire函式裡，不在這個檔案。
  // ============================================================
  function colLetter(c) { return String.fromCharCode(64 + c); }

  let mpMyCombatState = null;
  let mpBattleUnsubscribe = null;
  let mpTargetDirection = null; // 目前選定要攻擊的方位
  let mpBattleSelectedWeapon = 'normal';
  let mpPendingFireCell = null; // 已經點選但還沒按下發射鍵確認的瞄準座標{row,col}
  let mpFiringLock = false;

  // ---------- 開始遊戲：房主觸發，初始化每個人的戰鬥狀態(各自在自己的20x20地圖隨機起始位置) ----------
  // 開始戰鬥的初始化：改成呼叫Worker的naval_battle_init動作，由Worker用service account
  // 的權限幫每個人建立初始戰鬥狀態(隨機起始位置/滿血/武器次數)——房主的瀏覽器本身
  // 沒有權限直接寫入別人的私有資料(privateCombatState現在收緊成只有本人能讀寫)
  // 選位置階段：所有人都確認位置後(members裡每個人的positioned都是true)，任何一個
  // 客戶端偵測到都可以觸發Worker做真正的開戰初始化——跟之前一樣用battleInitialized
  // 這個旗標防止重複執行，不需要限定只有房主觸發(反正Worker內部本身也有防重複的判斷)
  let mpFinalizeRetryCount = 0;
  async function finalizeMpBattleIfReady(data) {
    if (data.battleInitialized) return;
    if (!data.members.every(m => m.positioned)) { mpFinalizeRetryCount = 0; return; } // 還沒全部人選好位置
    try {
      const idToken = await mpCurrentUser.getIdToken();
      const res = await fetch(NAVAL_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'naval_battle_init', idToken, roomId: mpRoomState.roomId }),
      });
      const result = await res.json();
      if (!res.ok || result.error) {
        console.warn('開戰初始化失敗', result.error);
        // 自動重試最多3次(間隔1.5秒)：全部人都選好位置了卻失敗，很可能是短暫的資料同步延遲
        // (例如Worker讀到的房間資料還沒反映最後一個人剛寫入的positioned:true)，重試通常會成功
        if (mpFinalizeRetryCount < 3) {
          mpFinalizeRetryCount++;
          setTimeout(() => { if (window.__mpLastRoomData) finalizeMpBattleIfReady(window.__mpLastRoomData); }, 1500);
        } else {
          // 重試3次都還失敗，才真的把錯誤攤開給使用者看，並提供重新整理頁面的建議
          const rootEl = document.getElementById('mp-root');
          if (rootEl) {
            const warnEl = document.createElement('p');
            warnEl.style.cssText = 'color:var(--critical); font-size:12px; text-align:center; margin-top:10px;';
            warnEl.textContent = `⚠️ 開戰初始化失敗：${result.error || '未知錯誤'}（已重試3次），請重新整理頁面再試一次`;
            rootEl.appendChild(warnEl);
          }
        }
      } else {
        mpFinalizeRetryCount = 0;
      }
    } catch (err) {
      console.warn('開戰初始化失敗', err);
      if (mpFinalizeRetryCount < 3) {
        mpFinalizeRetryCount++;
        setTimeout(() => { if (window.__mpLastRoomData) finalizeMpBattleIfReady(window.__mpLastRoomData); }, 1500);
      }
    }
  }

  // 選位置畫面：玩家在自己的地圖上點一格當作船隻起始位置(可以點好幾次重選)，用旋轉按鈕
  // 決定朝向，確認後才真正寫入資料。這個階段直接寫進自己的privateCombatState(只有本人能讀寫，
  // 不需要透過Worker)，因為只是設定「自己的」船隻資料，不涉及讀到別人的隱私資料
  let mpPendingPosition = null; // {row, col, heading}，還沒確認前的本地預覽狀態
  function renderMpPositioningView(data) {
    const me = data.members.find(m => m.uid === mpCurrentUser.uid);
    if (me.positioned) {
      document.getElementById('mp-root').innerHTML = `
        <div class="mp-panel">
          <p>✅ 位置已確認</p>
          <p style="font-size:12px; color:var(--muted); margin-top:8px;">等待其他玩家選擇位置中...</p>
        </div>
      `;
      return;
    }
    if (!mpMySelectedShip) return; // 理論上不會發生(等待室已經檢查過shipSelected)，防呆
    const spec = SHIP_TYPES[mpMySelectedShip];
    if (!mpPendingPosition) mpPendingPosition = { row: 10, col: 10, heading: 'N' };
    const previewShip = { ...mpPendingPosition };
    const inBounds = shipWithinBoundsGeneric(previewShip, spec);

    document.getElementById('mp-root').innerHTML = `
      <div class="game-layout">
        <div class="game-main">
          <div class="map-stage" id="mp-own-map-stage">
            <div class="map-tilt" id="mp-own-map-tilt">
              <div class="map-frame">
                <div class="grid20" id="mp-own-grid"></div>
              </div>
            </div>
          </div>
          <p class="coord-readout mono">🚢 點地圖選擇「${spec.name}」的起始位置${!inBounds ? '（超出地圖範圍，請重新選擇）' : ''}</p>
        </div>
        <div class="game-sidebar">
          <div class="turn-panel">
            <p class="turn-title">選擇起始位置</p>
            <div class="move-btns">
              <button class="move-btn" onclick="mpRotatePending('left')">↺<span class="btn-label">左轉</span></button>
              <button class="move-btn" onclick="mpRotatePending('right')">↻<span class="btn-label">右轉</span></button>
            </div>
            <button class="mp-btn primary" style="margin-top:14px;" ${inBounds ? '' : 'disabled'} onclick="mpConfirmPosition()">✅ 確認位置</button>
          </div>
        </div>
      </div>
    `;
    window.__mpLastRoomData = data;

    const ownGridEl = document.getElementById('mp-own-grid');
    let cellsHtml = '';
    for (let r = 1; r <= MAP_SIZE; r++) for (let c = 1; c <= MAP_SIZE; c++) {
      cellsHtml += `<div class="cell mp-fireable" data-row="${r}" data-col="${c}" onclick="mpPickPendingPosition(${r},${c})"></div>`;
    }
    ownGridEl.innerHTML = cellsHtml;
    if (inBounds) {
      const cells = getShipCellsGeneric(previewShip, spec);
      const rows = cells.map(c => c.row), cols = cells.map(c => c.col);
      const minRow = Math.min(...rows), maxRow = Math.max(...rows), minCol = Math.min(...cols), maxCol = Math.max(...cols);
      const cellPct = 100 / MAP_SIZE;
      const shipEl = document.createElement('div');
      shipEl.className = `ship-block type-${mpMySelectedShip} state-intact heading-${previewShip.heading}`;
      shipEl.style.position = 'absolute';
      shipEl.style.top = `${(minRow - 1) * cellPct}%`;
      shipEl.style.left = `${(minCol - 1) * cellPct}%`;
      shipEl.style.width = `${(maxCol - minCol + 1) * cellPct}%`;
      shipEl.style.height = `${(maxRow - minRow + 1) * cellPct}%`;
      shipEl.innerHTML = `<span class="bow-arrow">${BOW_ARROW[previewShip.heading]}</span>`;
      ownGridEl.style.position = 'relative';
      ownGridEl.appendChild(shipEl);
    }
    resizeMpOwnGridToFit();
  }
  function mpPickPendingPosition(row, col) {
    mpPendingPosition = { row, col, heading: (mpPendingPosition && mpPendingPosition.heading) || 'N' };
    renderMpPositioningView(window.__mpLastRoomData);
  }
  function mpRotatePending(dir) {
    if (!mpPendingPosition) return;
    mpPendingPosition.heading = dir === 'left' ? TURN_LEFT[mpPendingPosition.heading] : TURN_RIGHT[mpPendingPosition.heading];
    renderMpPositioningView(window.__mpLastRoomData);
  }
  async function mpConfirmPosition() {
    if (!mpPendingPosition || !mpMySelectedShip) return;
    const spec = SHIP_TYPES[mpMySelectedShip];
    if (!shipWithinBoundsGeneric(mpPendingPosition, spec)) return;
    try {
      // 直接寫進自己的privateCombatState(只有本人能讀寫，不需要透過Worker)：先只存位置資料，
      // 血量/武器次數等其餘欄位留給Worker在真正開戰時(finalizeMpBattleIfReady)一併補齊
      await mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId)
        .collection('privateCombatState').doc(mpCurrentUser.uid)
        .set({ row: mpPendingPosition.row, col: mpPendingPosition.col, heading: mpPendingPosition.heading, positionConfirmed: true }, { merge: true });

      const roomRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(roomRef);
        const data = doc.data();
        const members = data.members.map(m => m.uid === mpCurrentUser.uid ? { ...m, positioned: true } : m);
        tx.update(roomRef, { members });
      });
      mpPendingPosition = null;
    } catch (err) { alert('確認位置失敗：' + err.message); }
  }

  function shipWithinBoundsGeneric(ship, spec) {
    return getShipCellsGeneric(ship, spec).every(c => c.row >= 1 && c.row <= MAP_SIZE && c.col >= 1 && c.col <= MAP_SIZE);
  }
  // 跟單機demo版本的getShipCells邏輯完全一樣，但吃明確傳入的spec參數(不依賴全域的myShip)，
  // 因為連線模式要同時處理「自己的船」計算，跟spec本身無關myShip變數
  function getShipCellsGeneric(ship, spec) {
    const { row, col, heading } = ship;
    const cells = [];
    const centerIdx = spec.length === 2 ? 0 : 1;
    const cells2 = [];
    for (let len = 0; len < spec.length; len++) {
      for (let wid = 0; wid < spec.width; wid++) {
        const lenOffset = len - centerIdx;
        const widOffset = wid;
        let r, c;
        if (heading === 'N') { r = row - lenOffset; c = col + widOffset; }
        else if (heading === 'S') { r = row + lenOffset; c = col + widOffset; }
        else if (heading === 'E') { r = row + widOffset; c = col + lenOffset; }
        else if (heading === 'W') { r = row + widOffset; c = col - lenOffset; }
        const zone = ZONE_MAP_BY_LENGTH[spec.length][len];
        cells2.push({ row: r, col: c, isBow: len === spec.length - 1, zone });
      }
    }
    return cells2;
  }

  function renderMpBattleView(roomData) {
    if (!mpMyCombatState) {
      document.getElementById('mp-root').innerHTML = `<div class="mp-panel"><p>正在準備戰場...</p></div>`;
      return;
    }
    // 防呆：turnOrder還沒設定好，代表Worker的戰鬥初始化還在進行中或失敗了，先顯示等待畫面，
    // 不要繼續往下執行(下面的邏輯會用到turnOrder，沒防呆的話會直接當機)。房主額外看得到
    // 復原按鈕，避免初始化真的失敗時房間永遠卡住
    if (!roomData.turnOrder) {
      const isHost = roomData.hostUid === mpCurrentUser.uid;
      document.getElementById('mp-root').innerHTML = `
        <div class="mp-panel">
          <p>⏳ 戰鬥初始化中，請稍候...</p>
          <p style="font-size:11px; color:var(--muted); margin-top:8px;">如果這個畫面卡住超過幾秒鐘，可能是初始化過程中發生問題</p>
          ${isHost ? `<button class="mp-btn" style="margin-top:10px;" onclick="mpResetStuckRoom()">🔄 重設回等待室</button>` : ''}
        </div>
      `;
      return;
    }
    const spec = SHIP_TYPES[mpMyCombatState.shipType];
    const isMyTurn = roomData.turnOrder && roomData.turnOrder[roomData.currentTurnIndex] === mpCurrentUser.uid;
    const myDirection = roomData.members.find(m => m.uid === mpCurrentUser.uid).direction;
    const opponents = roomData.members.filter(m => m.uid !== mpCurrentUser.uid && !(roomData.eliminatedUids || []).includes(m.uid));
    const maxActions = Math.max(0, spec.baseActions - mpMyCombatState.actionPenalty);
    const healthPct = Math.max(0, mpMyCombatState.health / spec.maxHealth);

    const myCells = getShipCellsGeneric(mpMyCombatState, spec);
    const rows = myCells.map(c => c.row), cols = myCells.map(c => c.col);
    const minRow = Math.min(...rows), maxRow = Math.max(...rows), minCol = Math.min(...cols), maxCol = Math.max(...cols);
    const cellPct = 100 / MAP_SIZE;
    const stateClass = mpMyCombatState.health <= 0 ? 'wrecked' : healthPct <= .25 ? 'critical' : healthPct <= .75 ? 'damaged' : 'intact';

    const targetBtns = opponents.map(m => `<button class="mp-direction-btn ${mpTargetDirection === m.direction ? 'selected' : ''}" onclick="mpSelectTarget('${m.direction}')">${DIRECTION_LABEL[m.direction]}<br><small>${escapeHtmlMp(m.name)}</small></button>`).join('');

    const weaponBtns = Object.entries(spec.weapons).map(([key, w]) => {
      const left = w.uses === null ? '無限' : `${mpMyCombatState.weaponUsesLeft[key] ?? 0}/${w.uses}`;
      const depleted = w.uses !== null && (mpMyCombatState.weaponUsesLeft[key] ?? 0) <= 0;
      return `<button class="mp-ship-btn ${mpBattleSelectedWeapon === key ? 'selected' : ''}" ${depleted ? 'disabled' : ''} onclick="mpBattleSelectedWeapon='${key}'; renderMpBattleView(window.__mpLastRoomData);"><b>${w.name}</b>威力${w.power}・剩餘${left}</button>`;
    }).join('');

    // 開火條件：選好目標方位、還沒開過火(每回合限一次)、輪到自己——符合才能選座標+按發射鍵
    const canSelectFireCell = isMyTurn && !!mpTargetDirection && !mpMyCombatState.hasFiredThisTurn;
    const readyToFire = canSelectFireCell && !!mpPendingFireCell;

    document.getElementById('mp-root').innerHTML = `
      <div class="game-layout">
        <div class="game-main">
          <div class="map-stage" id="mp-own-map-stage">
            <div class="map-tilt" id="mp-own-map-tilt">
              <div class="map-frame">
                <div class="grid20" id="mp-own-grid"></div>
              </div>
            </div>
          </div>
          <p class="coord-readout mono">${isMyTurn ? '👉 輪到你了！' : `⏳ 等待 ${escapeHtmlMp(roomData.members.find(m => m.uid === roomData.turnOrder[roomData.currentTurnIndex]).name)} 行動...`}　你是 ${DIRECTION_LABEL[myDirection]}（${spec.name}）${mpMyCombatState.hasFiredThisTurn ? '　✅ 這回合已經開過火了' : canSelectFireCell ? `　🎯 點座標瞄準${DIRECTION_LABEL[mpTargetDirection]}` : ''}</p>
        </div>

        <div class="game-sidebar">
          <div class="turn-panel">
            <p class="turn-title">🚢 操作「你的船」號（${spec.name}）</p>
            <p class="health-readout mono">血量：<b>${Math.max(0, mpMyCombatState.health)}</b> / ${spec.maxHealth}</p>
            <div class="health-bar${healthPct <= .25 ? ' low' : healthPct <= .75 ? ' mid' : ''}"><i style="width:${Math.round(healthPct * 100)}%;"></i></div>
            <p class="actions-left">本回合剩餘操作次數：<b>${mpMyCombatState.actionsLeftThisTurn}</b> / ${maxActions}</p>
            <p class="fire-status" style="visibility:${mpMyCombatState.onFire ? 'visible' : 'hidden'};">🔥 著火中，每回合開始損失最大血量10%，撲滅需花費2次移動次數</p>
            ${mpMyCombatState.submarineSurfaced ? `<p class="fire-status" style="visibility:visible;">⚓ 浮出水面，無法下潛</p>` : ''}
            <div class="move-btns">
              <button class="move-btn" ${(!isMyTurn || mpMyCombatState.actionsLeftThisTurn <= 0) ? 'disabled' : ''} onclick="mpDoShipAction('left')">↺<span class="btn-label">左轉</span></button>
              <button class="move-btn" ${(!isMyTurn || mpMyCombatState.actionsLeftThisTurn <= 0) ? 'disabled' : ''} onclick="mpDoShipAction('forward')">↑<span class="btn-label">前進</span></button>
              <button class="move-btn" ${(!isMyTurn || mpMyCombatState.actionsLeftThisTurn <= 0) ? 'disabled' : ''} onclick="mpDoShipAction('right')">↻<span class="btn-label">右轉</span></button>
            </div>
            <div class="move-btns" style="margin-top:6px;">
              <button class="move-btn small" ${(!isMyTurn || mpMyCombatState.actionsLeftThisTurn <= 0 || mpMyCombatState.actionPenalty <= 0) ? 'disabled' : ''} onclick="mpRepairMovement()">🔧<span class="btn-label">修復(1)</span></button>
              <button class="move-btn small" ${(!isMyTurn || mpMyCombatState.actionsLeftThisTurn < 2 || !mpMyCombatState.onFire) ? 'disabled' : ''} onclick="mpExtinguishFire()">🧯<span class="btn-label">滅火(2)</span></button>
              ${mpMyCombatState.shipType === 'submarine' && mpMyCombatState.submarineSurfaced ? `<button class="move-btn small" ${(!isMyTurn || mpMyCombatState.actionsLeftThisTurn < 2) ? 'disabled' : ''} onclick="mpRepairDive()">⚓<span class="btn-label">修復下潛(2)</span></button>` : ''}
              <button class="move-btn small" ${!isMyTurn ? 'disabled' : ''} onclick="mpEndTurn()">🔄<span class="btn-label">結束回合</span></button>
            </div>
            <p class="weapon-title">🎯 選擇要攻擊的海域</p>
            <div class="mp-direction-grid">${targetBtns || '<p style="font-size:11px; color:var(--muted);">沒有可攻擊的對手</p>'}</div>
            ${mpTargetDirection && !mpMyCombatState.hasFiredThisTurn ? `
              <p class="weapon-title">選擇武器</p><div class="weapon-panel">${weaponBtns}</div>
              <p class="mp-fire-hint">👈 點左邊地圇上的座標瞄準，瞄準的座標會映射到「${DIRECTION_LABEL[mpTargetDirection]}」同一個座標</p>
              <button class="mp-fire-btn" ${readyToFire ? '' : 'disabled'} onclick="mpConfirmFire()">🔥 發射！${mpPendingFireCell ? `（瞄準 ${colLetter(mpPendingFireCell.col)}${mpPendingFireCell.row}）` : ''}</button>
            ` : ''}
          </div>

          <div class="log-panel mono">${(roomData.combatLog || []).map(e => resolveMpLogText(e)).filter(t => t !== null && t !== undefined).slice(-14).reverse().map(t => `<p style="margin:0;">${escapeHtmlMp(t)}</p>`).join('')}</div>
        </div>
      </div>
    `;
    window.__mpLastRoomData = roomData;

    // 自己的船用跟單機demo一樣的渲染方式畫在自己的20x20格上；格子點擊只是「選定瞄準座標」，
    // 不會立刻開火(要另外按紅色發射鍵才會真的開火，見第9點需求)
    const ownGridEl = document.getElementById('mp-own-grid');
    let cellsHtml = '';
    for (let r = 1; r <= MAP_SIZE; r++) for (let c = 1; c <= MAP_SIZE; c++) {
      const isPending = mpPendingFireCell && mpPendingFireCell.row === r && mpPendingFireCell.col === c;
      cellsHtml += `<div class="cell ${canSelectFireCell ? 'mp-fireable' : ''} ${isPending ? 'mp-pending-fire' : ''}" data-row="${r}" data-col="${c}" onclick="mpSelectFireCell(${r},${c})"></div>`;
    }
    ownGridEl.innerHTML = cellsHtml;
    const shipEl = document.createElement('div');
    shipEl.id = 'mp-own-ship';
    shipEl.className = `ship-block type-${mpMyCombatState.shipType} state-${stateClass} heading-${mpMyCombatState.heading}`;
    shipEl.style.position = 'absolute';
    shipEl.style.top = `${(minRow - 1) * cellPct}%`;
    shipEl.style.left = `${(minCol - 1) * cellPct}%`;
    shipEl.style.width = `${(maxCol - minCol + 1) * cellPct}%`;
    shipEl.style.height = `${(maxRow - minRow + 1) * cellPct}%`;
    shipEl.innerHTML = `<span class="bow-arrow">${BOW_ARROW[mpMyCombatState.heading]}</span><span class="ship-pct">${Math.round(healthPct * 100)}%</span>${mpMyCombatState.onFire ? '<span class="fire-emoji">🔥</span>' : ''}`;
    ownGridEl.style.position = 'relative';
    ownGridEl.appendChild(shipEl);
    resizeMpOwnGridToFit();
  }

  function mpSelectTarget(direction) {
    mpTargetDirection = direction;
    mpBattleSelectedWeapon = 'normal';
    mpPendingFireCell = null; // 換目標時清掉之前選的瞄準座標，避免對錯的目標開火
    renderMpBattleView(window.__mpLastRoomData);
  }
  // 點地圇座標：只是「選定」瞄準座標(用紅框標示)，還不會真的開火——要另外按下方的紅色
  // 發射鍵才會真的送出攻擊(第9點需求：更有儀式感，也避免手滑點錯格子就直接開火)
  function mpSelectFireCell(row, col) {
    if (!mpTargetDirection || mpFiringLock) return;
    mpPendingFireCell = { row, col };
    renderMpBattleView(window.__mpLastRoomData);
  }

  // ---------- 我方船隻操作(移動/轉向/修復)：都直接寫進自己的privateCombatState ----------
  async function mpDoShipAction(action) {
    const roomRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
    const stateRef = roomRef.collection('privateCombatState').doc(mpCurrentUser.uid);
    try {
      await mpDb.runTransaction(async (tx) => {
        const roomDoc = await tx.get(roomRef);
        const roomD = roomDoc.data();
        if (roomD.turnOrder[roomD.currentTurnIndex] !== mpCurrentUser.uid) return;
        const stateDoc = await tx.get(stateRef);
        const s = stateDoc.data();
        if (s.actionsLeftThisTurn <= 0) return;
        const spec = SHIP_TYPES[s.shipType];
        let candidate = { row: s.row, col: s.col, heading: s.heading };
        if (action === 'forward') {
          if (s.heading === 'N') candidate.row--;
          else if (s.heading === 'S') candidate.row++;
          else if (s.heading === 'E') candidate.col++;
          else if (s.heading === 'W') candidate.col--;
        } else if (action === 'left') candidate.heading = TURN_LEFT[s.heading];
        else if (action === 'right') candidate.heading = TURN_RIGHT[s.heading];
        if (!shipWithinBoundsGeneric(candidate, spec)) return; // 超出邊界，不消耗次數
        tx.update(stateRef, { row: candidate.row, col: candidate.col, heading: candidate.heading, actionsLeftThisTurn: s.actionsLeftThisTurn - 1 });
      });
    } catch (err) { console.warn('移動失敗', err); }
  }
  async function mpRepairMovement() {
    const stateRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId).collection('privateCombatState').doc(mpCurrentUser.uid);
    try {
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(stateRef);
        const s = doc.data();
        if (s.actionsLeftThisTurn <= 0 || s.actionPenalty <= 0) return;
        tx.update(stateRef, { actionsLeftThisTurn: s.actionsLeftThisTurn - 1, actionPenalty: s.actionPenalty - 1 });
      });
    } catch (err) { console.warn('修復失敗', err); }
  }
  async function mpExtinguishFire() {
    const stateRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId).collection('privateCombatState').doc(mpCurrentUser.uid);
    try {
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(stateRef);
        const s = doc.data();
        if (s.actionsLeftThisTurn < 2 || !s.onFire) return;
        tx.update(stateRef, { actionsLeftThisTurn: s.actionsLeftThisTurn - 2, onFire: false });
      });
    } catch (err) { console.warn('滅火失敗', err); }
  }
  // 潛水艇專屬：修復下潛功能，花2次移動次數，恢復隱蔽(submarineSurfaced=false)
  async function mpRepairDive() {
    const stateRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId).collection('privateCombatState').doc(mpCurrentUser.uid);
    try {
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(stateRef);
        const s = doc.data();
        if (s.actionsLeftThisTurn < 2 || !s.submarineSurfaced) return;
        tx.update(stateRef, { actionsLeftThisTurn: s.actionsLeftThisTurn - 2, submarineSurfaced: false });
      });
    } catch (err) { console.warn('修復下潛失敗', err); }
  }
  async function mpEndTurn() {
    const roomRef = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
    try {
      await mpDb.runTransaction(async (tx) => {
        const roomDoc = await tx.get(roomRef);
        const roomD = roomDoc.data();
        if (roomD.turnOrder[roomD.currentTurnIndex] !== mpCurrentUser.uid) return;
        const activeOrder = roomD.turnOrder.filter(uid => !(roomD.eliminatedUids || []).includes(uid));
        const curIdx = activeOrder.indexOf(mpCurrentUser.uid);
        const nextUid = activeOrder[(curIdx + 1) % activeOrder.length];
        tx.update(roomRef, { currentTurnIndex: roomD.turnOrder.indexOf(nextUid) });
      });
      // 回合真正輪到自己時才補回操作次數(在下一次輪到自己、監聽到currentTurnIndex變化時處理，
      // 這裡簡化成結束回合的當下就先重設好自己的次數，反正輪到自己前這個欄位不會被用到)
      const stateRef = roomRef.collection('privateCombatState').doc(mpCurrentUser.uid);
      const doc = await stateRef.get();
      const s = doc.data();
      const spec = SHIP_TYPES[s.shipType];
      const maxActions = Math.max(0, spec.baseActions - s.actionPenalty);
      const updates = { actionsLeftThisTurn: maxActions, hasFiredThisTurn: false };
      if (s.onFire) {
        const fireDmg = Math.round(spec.maxHealth * 0.1);
        updates.health = Math.max(0, s.health - fireDmg);
      }
      await stateRef.update(updates);
    } catch (err) { console.warn('結束回合失敗', err); }
  }

  // ---------- 開火：選定目標方位後，點擊「自己」地圖上的座標——自己畫面看到砲彈往上發射，
  // 對方會在他自己的地圖同一個座標看到砲彈落下(見下面的incomingAttack監聽處理)。
  // 開火判定本身透過Worker伺服器端處理，前端只會拿到「有沒有命中」，不會讀到任何精確的
  // 座標或血量數字——真正的伺服器端隔離 ----------
  // 確認發射：從mpPendingFireCell(已經點選的瞄準座標)送出攻擊。砲彈動畫改成從「自己船隻」
  // 的實際畫面位置發射(不是從點擊的格子發射)，比較符合直覺——瞄準座標只是決定要打到
  // 對方哪裡，砲彈本體是從自己的船射出去的
  async function mpConfirmFire() {
    if (mpFiringLock || !mpPendingFireCell) return;
    if (!mpTargetDirection) { console.warn('[開火] 沒有選擇目標方位，取消'); return; }
    const roomData = window.__mpLastRoomData;
    if (!roomData) { alert('房間資料還沒載入完成，稍等一下再試'); return; }
    if (!roomData.turnOrder || roomData.turnOrder[roomData.currentTurnIndex] !== mpCurrentUser.uid) {
      console.warn('[開火] 判定不是自己的回合', { turnOrder: roomData.turnOrder, currentTurnIndex: roomData.currentTurnIndex, myUid: mpCurrentUser.uid });
      alert('還沒輪到你的回合');
      return;
    }
    if (mpMyCombatState.hasFiredThisTurn) { alert('這回合已經開過火了'); return; }
    const { row, col } = mpPendingFireCell;
    mpFiringLock = true;
    playFireSound();

    // 砲彈從自己船隻的實際畫面位置發射，往上飛出畫面外——代表「我方砲彈射向對方」
    const shipEl = document.getElementById('mp-own-ship');
    if (shipEl) {
      const rect = shipEl.getBoundingClientRect();
      const startX = rect.left + rect.width / 2, startY = rect.top + rect.height / 2;
      const shell = document.createElement('div');
      shell.className = 'shell';
      shell.style.left = startX + 'px';
      shell.style.top = startY + 'px';
      document.body.appendChild(shell);
      requestAnimationFrame(() => {
        shell.style.transition = 'top .55s cubic-bezier(.35,0,.7,1)';
        shell.style.top = '-30px'; // 往上飛出畫面外
      });
      setTimeout(() => shell.remove(), 600);
    }

    try {
      const idToken = await mpCurrentUser.getIdToken();
      console.log('[開火] 送出請求', { roomId: mpRoomState.roomId, targetDirection: mpTargetDirection, row, col, weaponKey: mpBattleSelectedWeapon, workerUrl: NAVAL_WORKER_URL });
      const res = await fetch(NAVAL_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'naval_battle_fire', idToken,
          roomId: mpRoomState.roomId, targetDirection: mpTargetDirection,
          row, col, weaponKey: mpBattleSelectedWeapon,
        }),
      });
      let data;
      try { data = await res.json(); }
      catch (parseErr) {
        const rawText = await res.text().catch(() => '(無法讀取回應內容)');
        console.error('[開火] Worker回應不是合法JSON，HTTP狀態:', res.status, '原始內容:', rawText);
        alert(`開火失敗：伺服器回應格式異常(HTTP ${res.status})，請確認Worker有正確部署`);
        mpFiringLock = false;
        return;
      }
      console.log('[開火] Worker回應', { status: res.status, data });
      if (!res.ok || data.error) {
        alert(`開火失敗（HTTP ${res.status}）：${data.error || '未知錯誤'}`);
        mpFiringLock = false;
        return;
      }
      // 命中/落空的結果已經寫進公開戰報(combatLog)，會透過房間監聽自動顯示在戰報欄，
      // 這裡不需要額外顯示——真正的爆炸/水花視覺效果發生在「對方」的畫面上(見incomingAttack監聽)。
      // 開火成功後，這回合已經用掉唯一的一次開火機會，清掉瞄準狀態、目標方位也一併清掉，
      // 避免畫面留著誤導的瞄準提示
      mpPendingFireCell = null;
      mpTargetDirection = null;
    } catch (err) {
      console.error('[開火] 發生例外錯誤(可能是網路問題、CORS、或Worker網址設定錯誤)', err);
      alert('開火失敗（網路或連線問題）：' + err.message + '\n請打開瀏覽器主控台(F12)查看詳細錯誤');
    }
    mpFiringLock = false;
  }

  // 接收攻擊：偵測自己的privateCombatState裡有沒有出現「新的」incomingAttack(用nonce比對，
  // 避免同一次攻擊因為畫面重新渲染就重複播放動畫)。有的話，在「自己」的地圖上對應座標
  // 播放砲彈落下的動畫+命中或落空的爆炸/水花特效——這就是對方在他畫面點座標開火時，
  // 我方畫面應該看到的效果
  let mpLastProcessedAttackNonce = null;
  function checkIncomingAttack(state) {
    const atk = state.incomingAttack;
    if (!atk || atk.nonce === mpLastProcessedAttackNonce) return;
    mpLastProcessedAttackNonce = atk.nonce;
    // 用攻擊方傳來的船型+武器key，精確查出這次攻擊實際用的武器參數(墜落速度/砲彈尺寸/
    // 爆炸音色)，不是寫死的一般砲彈規格——例如潛水艇的「一般武器」其實是魚雷，音效
    // 應該是水下悶重感，不是一般爆炸聲
    const attackerSpec = SHIP_TYPES[atk.attackerShipType];
    const weaponSpec = (attackerSpec && attackerSpec.weapons[atk.weaponKey]) || SHIP_TYPES.amphibious.weapons.normal;
    const cellEl = document.querySelector(`#mp-own-grid .cell[data-row="${atk.row}"][data-col="${atk.col}"]`);
    if (!cellEl) return;
    const rect = cellEl.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2, targetY = rect.top + rect.height / 2;
    const shell = document.createElement('div');
    shell.className = 'shell';
    shell.style.width = weaponSpec.shellSize + 'px';
    shell.style.height = weaponSpec.shellSize + 'px';
    shell.style.left = targetX + 'px';
    shell.style.top = '-30px';
    document.body.appendChild(shell);
    if (weaponSpec.whistle) playWhistleSound(weaponSpec.fallMs);
    requestAnimationFrame(() => {
      shell.style.transition = `top ${weaponSpec.fallMs}ms cubic-bezier(.45,0,.85,1)`;
      shell.style.top = targetY + 'px';
    });
    setTimeout(() => {
      shell.remove();
      playExplosionSound(atk.isHit, weaponSpec.explosionProfile);
      spawnBlast(targetX, targetY, atk.isHit, weaponSpec.aoe ? Math.max(weaponSpec.aoe.w, weaponSpec.aoe.h) : 1);
      cellEl.classList.add(atk.isHit ? 'flash-hit' : 'flash-miss');
      setTimeout(() => cellEl.classList.remove(atk.isHit ? 'flash-hit' : 'flash-miss'), 500);
    }, weaponSpec.fallMs);
  }

  async function leaveMpRoom() {
    try {
      const ref = mpDb.collection('navalBattleRooms').doc(mpRoomState.roomId);
      await mpDb.runTransaction(async (tx) => {
        const doc = await tx.get(ref);
        if (!doc.exists) return;
        const data = doc.data();
        const members = data.members.filter(m => m.uid !== mpCurrentUser.uid);
        if (!members.length || data.hostUid === mpCurrentUser.uid) {
          tx.delete(ref);
        } else {
          tx.update(ref, { members, memberUids: members.map(m => m.uid) });
        }
      });
    } catch (err) { console.warn(err); }
    mpMySelectedShip = null;
    mpCleanupRoom();
    renderMpLobby();
  }
</script>
