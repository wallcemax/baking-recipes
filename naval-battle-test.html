<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海戰指揮室｜Just Do Eat</title>
<script>
  // 越早設定越好：在CSS載入、任何內容渲染之前，就先算出瀏覽器實際可視高度設成CSS變數，
  // 避免第一次繪製時用到不準確的vh/dvh單位、渲染出錯誤版面後才被JS修正過來的閃爍畫面。
  // 這個變數之後在<style>裡的html,body會用到
  document.documentElement.style.setProperty('--real-vh', window.innerHeight + 'px');
</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  :root {
    --void: #060e1a;
    --deep: #0a1a2e;
    --panel: #0e2438;
    --grid-line: #1e4a5a;
    --grid-line-bright: #2d7d7d;
    --scan: #4fd1c5;
    --ink: #cfe8e6;
    --muted: #6b8a92;
    --intact: #3d8f6a;
    --damaged: #e8a23a;
    --critical: #d64545;
    --wreck: #3a2e2e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; height: var(--real-vh, 100dvh); margin: 0; overflow-y: auto; overflow-x: hidden; } /* 用JS動態量測的實際可視高度(--real-vh)取代不可靠的vh/dvh單位計算，相容性比純CSS dvh更好；overflow-y改成auto當安全網，萬一高度計算還有誤差，至少能捲動看到全部內容，不會被完全鎖死看不到 */
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #0e2f42 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, #0a1f2e 0%, transparent 55%),
      var(--void);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column;
  }
  .mono { font-family: "SF Mono", "Consolas", "Courier New", monospace; }

  header { flex-shrink: 0; padding: 8px 14px 6px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .eyebrow { font-size: 9px; letter-spacing: 0.25em; color: var(--scan); font-weight: 700; margin: 0 0 2px; opacity: .85; }
  h1 { font-family: "Arial Black", "Noto Sans TC", sans-serif; font-size: clamp(16px, 3vw, 24px); font-weight: 900; margin: 0; letter-spacing: 0.02em; text-shadow: 0 0 16px rgba(79,209,197,.35); }
  .back-links { display: flex; align-items: center; gap: 10px; padding-top: 2px; }
  a.back-link { color: var(--scan); font-size: 11px; font-weight: 700; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
  a.back-link:hover { text-decoration: underline; }
  .legend-toggle-btn { background: var(--panel); border: 1px solid var(--grid-line-bright); color: var(--scan); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; cursor: pointer; }

  .legend-popup { position: fixed; inset: 0; background: rgba(6,14,26,.75); z-index: 500; display: flex; align-items: center; justify-content: center; }
  .legend-popup.hidden { display: none; }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 12px 10px; width: 100%; max-width: 1400px; margin: 0 auto; }

  /* -------- 左右版面：地圖主視覺(自動填滿剩餘空間) + 側邊欄(固定寬度、內部自行捲動) -------- */
  .game-layout { flex: 1; min-height: 0; display: flex; gap: 10px; }
  .game-main { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .game-sidebar { width: 260px; flex-shrink: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }

  @media (max-width: 900px) {
    .game-layout { flex-direction: column; }
    .game-main { flex: 0 1 44vh; }
    .game-sidebar { width: 100%; flex: 1; min-height: 0; }
    h1 { font-size: 16px; }
    .eyebrow { font-size: 8px; }
  }

  /* -------- 戰術資訊列 -------- */
  /* -------- 3D 戰術投影桌：尺寸由外層flex容器(.game-main)動態分配的可用空間決定，
     不再是寫死的固定尺寸——這樣不管螢幕多大多小，地圖都會剛好填滿可用空間、不會超出 -------- */
  .map-stage {
    perspective: 1400px;
    perspective-origin: 50% 25%;
    flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* 座標標籤：字母標在頂端、數字標在左側，故意放在.map-tilt外面(不受3D傾斜影響)，
     保持文字清晰好讀。用JS動態產生內容、對齊.map-tilt的實際尺寸位置 */
  .map-coord-labels { position: absolute; pointer-events: none; z-index: 5; font-family: monospace; font-size: 13px; font-weight: 700; color: var(--scan); opacity: .85; white-space: nowrap; }
  .map-coord-col-labels { display: flex; }
  .map-coord-col-labels span, .map-coord-row-labels span { display: flex; align-items: center; justify-content: center; }
  .map-coord-row-labels { display: flex; flex-direction: column; }
  .map-tilt {
    position: relative;
    transform: rotateX(46deg) rotateZ(0deg);
    transform-style: preserve-3d;
    /* 寬高不在這裡用CSS aspect-ratio自動計算(在巢狀flexbox+3D變形的環境下不夠可靠)，
       改成由JS直接量測.map-stage實際可用空間、算出正方形邊長後用style.width/height強制設定 */
  }
  .map-frame {
    position: relative;
    width: 100%; height: 100%;
    background: linear-gradient(155deg, #0c2436, #071420);
    border: 1px solid var(--grid-line-bright);
    border-radius: 4px;
    box-shadow:
      0 0 0 1px rgba(45,125,125,.15),
      0 40px 90px -20px rgba(0,0,0,.85),
      0 0 60px -10px rgba(79,209,197,.15);
    padding: 3px;
  }
  /* 4象限分隔線：淡藍色橫線+直線貫穿地圇中心，把地圇視覺上切成4塊 */
  .map-frame::before {
    content: '';
    position: absolute; inset: 3px;
    background:
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(120,190,230,.5) calc(50% - 1px), rgba(120,190,230,.5) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(180deg, transparent calc(50% - 1px), rgba(120,190,230,.5) calc(50% - 1px), rgba(120,190,230,.5) calc(50% + 1px), transparent calc(50% + 1px));
    pointer-events: none;
    z-index: 2;
    border-radius: 3px;
  }
  /* 小光球沿著象限分隔線跑動、忽暗忽亮：兩層radial-gradient疊加，一顆沿橫線移動、
     一顆沿直線移動，透明度同步做出忽暗忽亮的脈動感 */
  .map-frame::after {
    content: '';
    position: absolute; inset: 3px;
    background-image:
      radial-gradient(circle 3px, rgba(160,220,255,1), rgba(160,220,255,.4) 60%, transparent 75%),
      radial-gradient(circle 3px, rgba(160,220,255,1), rgba(160,220,255,.4) 60%, transparent 75%);
    background-repeat: no-repeat, no-repeat;
    background-size: 10px 10px, 10px 10px;
    animation: radar-dots-travel 3.5s ease-in-out infinite;
    pointer-events: none;
    border-radius: 3px;
    z-index: 1;
  }
  @keyframes radar-dots-travel {
    0%   { background-position: 50% 50%, 50% 50%; opacity: .25; }
    25%  { background-position: 92% 50%, 50% 8%;  opacity: 1; }
    50%  { background-position: 50% 50%, 50% 50%; opacity: .25; }
    75%  { background-position: 8% 50%,  50% 92%; opacity: 1; }
    100% { background-position: 50% 50%, 50% 50%; opacity: .25; }
  }

  .grid20 {
    position: relative;
    container-type: inline-size;
    container-name: battle-grid;
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    grid-template-rows: repeat(20, 1fr);
    aspect-ratio: 1 / 1;
    gap: 1px;
    background: var(--grid-line);
  }
  .cell {
    background: #0a1c2c;
    position: relative;
    transition: background .15s;
  }
  .cell:hover { background: #123448; }
  .cell.coord-mark::before {
    content: attr(data-coord);
    position: absolute; top: 1px; left: 2px;
    font-size: 5px; color: var(--muted); opacity: .5;
    font-family: monospace;
  }

  /* -------- 船身：造型依船型各自不同，四種朝向各自對應不同的clip-path
     (不用transform:rotate，因為朝向N/S時外框是窄長、朝向E/W時是寬扁，長寬會互換，
     直接切換clip-path形狀比旋轉一個固定形狀更精確可控)。用CSS自訂屬性--bow-sharp
     控制船頭收尖的起始位置，數字越小船頭越尖銳、越大越鈍平，讓不同船型呈現不同輪廓特徵 -------- */
  .ship-block {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    transition: top .3s ease, left .3s ease, width .3s ease, height .3s ease, clip-path .3s ease;
    pointer-events: none;
  }
  .ship-block .ship-pct { font-family: monospace; font-weight: 900; font-size: clamp(8px, 2cqw, 13px); text-shadow: 0 1px 3px rgba(0,0,0,.7); z-index: 2; }
  .ship-block .bow-arrow { position: absolute; font-size: clamp(9px, 2.4cqw, 15px); text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .ship-block .fire-emoji { position: absolute; font-size: clamp(10px, 2.8cqw, 17px); z-index: 3; animation: fire-flicker .7s ease-in-out infinite; filter: drop-shadow(0 0 4px rgba(255,120,30,.8)); }
  @keyframes fire-flicker { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.15) rotate(4deg); } }

  /* 各船型的船頭尖銳度：數字是收尖起始的百分比位置，越小越尖銳(快速攻擊艦感)、越大越鈍平(登陸艦感) */
  .ship-block.type-amphibious { --bow-sharp: 36; } /* 兩棲突擊艦：船頭較鈍平，登陸艦的平坦感 */
  .ship-block.type-cruiser { --bow-sharp: 20; }    /* 巡洋艦：中等尖銳 */
  .ship-block.type-destroyer { --bow-sharp: 12; }  /* 驅逐艦：最尖銳，快速攻擊艦的俐落感 */
  .ship-block.type-frigate { --bow-sharp: 22; }    /* 巡防艦：中規中矩 */

  /* 船頭朝北：外框窄長，clip-path在頂端收尖(收尖位置由--bow-sharp決定) */
  .ship-block.heading-N { clip-path: polygon(50% 0%, 100% calc(var(--bow-sharp, 24) * 1%), 100% 100%, 0% 100%, 0% calc(var(--bow-sharp, 24) * 1%)); }
  .ship-block.heading-N .bow-arrow { top: 2%; }
  .ship-block.heading-N .fire-emoji { top: 30%; left: 50%; transform: translateX(-50%); }
  /* 船頭朝南：clip-path在底端收尖 */
  .ship-block.heading-S { clip-path: polygon(50% 100%, 100% calc(100% - var(--bow-sharp, 24) * 1%), 100% 0%, 0% 0%, 0% calc(100% - var(--bow-sharp, 24) * 1%)); }
  .ship-block.heading-S .bow-arrow { bottom: 2%; }
  .ship-block.heading-S .fire-emoji { bottom: 30%; left: 50%; transform: translateX(-50%); }
  /* 船頭朝東：外框寬扁，clip-path在右端收尖 */
  .ship-block.heading-E { clip-path: polygon(100% 50%, calc(100% - var(--bow-sharp, 24) * 1%) 100%, 0% 100%, 0% 0%, calc(100% - var(--bow-sharp, 24) * 1%) 0%); }
  .ship-block.heading-E .bow-arrow { right: 2%; }
  .ship-block.heading-E .fire-emoji { right: 30%; top: 50%; transform: translateY(-50%); }
  /* 船頭朝西：clip-path在左端收尖 */
  .ship-block.heading-W { clip-path: polygon(0% 50%, calc(var(--bow-sharp, 24) * 1%) 100%, 100% 100%, 100% 0%, calc(var(--bow-sharp, 24) * 1%) 0%); }
  .ship-block.heading-W .bow-arrow { left: 2%; }
  .ship-block.heading-W .fire-emoji { left: 30%; top: 50%; transform: translateY(-50%); }

  /* 潛水艇：完全改用膠囊/橢圓造型(border-radius)取代尖形clip-path，明確區隔水下載具的輪廓，
     不管哪個朝向都是同一種圓潤造型(細長橢圓形本身就有方向性，不需要額外用尖形強調船頭) */
  .ship-block.type-submarine { clip-path: none; border-radius: 50%; }

  .ship-block.state-intact { background: linear-gradient(160deg, #4aae7d, #2d7050); box-shadow: 0 0 18px -2px rgba(74,174,125,.55); color: #eafff2; }
  .ship-block.state-damaged { background: linear-gradient(160deg, #f0b352, #c07f24); box-shadow: 0 0 18px -2px rgba(240,179,82,.55); color: #2a1b04; }
  .ship-block.state-critical { background: linear-gradient(160deg, #ea5b5b, #a82f2f); box-shadow: 0 0 22px -2px rgba(234,91,91,.65); color: #fff0f0; animation: critical-pulse 1.1s ease-in-out infinite; }
  .ship-block.state-wrecked { background: repeating-linear-gradient(45deg, #241c1c, #241c1c 4px, #1a1414 4px, #1a1414 8px); box-shadow: none; color: #8a7070; }
  .ship-block.state-wrecked .ship-pct::after { content: ' ☠'; }
  @keyframes critical-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

  /* -------- 操作面板：本回合剩餘次數、前進/左轉/右轉按鈕 -------- */
  .turn-panel { background: var(--panel); border: 1px solid var(--grid-line-bright); border-radius: 10px; padding: 14px 16px; margin-top: 18px; text-align: center; }
  .turn-panel .turn-title { font-size: 13px; font-weight: 800; color: var(--scan); margin-bottom: 4px; }
  .turn-panel .health-readout { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .turn-panel .health-readout b { color: var(--ink); font-size: 14px; }
  .health-bar { height: 8px; background: var(--deep); border-radius: 99px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--grid-line); }
  .health-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--intact), #6ecf9a); transition: width .3s ease, background .3s ease; }
  .health-bar.mid i { background: linear-gradient(90deg, var(--damaged), #f2c169); }
  .health-bar.low i { background: linear-gradient(90deg, var(--critical), #f07a7a); }
  .turn-panel .actions-left { font-family: monospace; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .turn-panel .actions-left b { color: var(--scan); font-size: 15px; }
  .move-btns { display: flex; justify-content: center; gap: 10px; }
  .move-btn { background: var(--deep); border: 1px solid var(--grid-line-bright); color: var(--ink); border-radius: 8px; padding: 10px 16px; font-size: 18px; cursor: pointer; transition: background .15s, transform .1s; min-width: 54px; }
  .move-btn:hover:not(:disabled) { background: #123448; }
  .move-btn:active:not(:disabled) { transform: scale(.92); }
  .move-btn:disabled { opacity: .3; cursor: not-allowed; }
  .move-btn .btn-label { display: block; font-size: 9px; color: var(--muted); margin-top: 3px; font-family: sans-serif; }
  .move-btn.small { padding: 8px 10px; font-size: 15px; min-width: 84px; }

  .ship-switcher { text-align: center; margin: 8px 0 14px; font-size: 12px; color: var(--muted); }
  .ship-switcher select { background: var(--panel); color: var(--ink); border: 1px solid var(--grid-line-bright); border-radius: 6px; padding: 5px 8px; font-size: 12px; }

  .weapon-title { font-size: 12px; font-weight: 800; color: var(--scan); margin: 14px 0 6px; }
  .weapon-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
  .weapon-btn { background: var(--deep); border: 1px solid var(--grid-line-bright); color: var(--ink); border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; transition: background .15s; }
  .weapon-btn:hover:not(:disabled) { background: #123448; }
  .weapon-btn.active { border-color: var(--scan); box-shadow: 0 0 0 1px var(--scan); background: #123448; }
  .weapon-btn:disabled { opacity: .3; cursor: not-allowed; }
  .weapon-btn .wname { display: block; font-size: 12px; font-weight: 800; }
  .weapon-btn .wmeta { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; font-family: monospace; }

  /* -------- 圖例 -------- */
  .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 26px; font-size: 11px; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }

  .coord-readout { text-align: center; margin-top: 16px; min-height: 20px; font-size: 12px; color: var(--scan); font-family: monospace; }

  .corner-bracket { position: fixed; width: 26px; height: 26px; border: 2px solid var(--grid-line-bright); opacity: .5; pointer-events: none; }
  .corner-bracket.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .corner-bracket.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .corner-bracket.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .corner-bracket.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  /* -------- 砲彈：獨立在2D螢幕座標系統的元素，不受地圖的3D transform影響，
     用getBoundingClientRect()抓格子實際渲染後的螢幕座標當作落點目標 -------- */
  .shell {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8d6, #d4a017 60%, #6b4a0a);
    box-shadow: 0 0 8px 2px rgba(255,200,80,.7);
    transform: translate(-50%, -50%);
    z-index: 300;
    pointer-events: none;
  }
  .shell::after {
    content: '';
    position: absolute; left: 50%; bottom: 100%;
    width: 2px; height: 26px;
    background: linear-gradient(180deg, transparent, rgba(255,200,120,.55));
    transform: translateX(-50%);
  }

  /* 爆炸特效：命中(橘紅火焰)/落空(藍白水花)用不同色調，一眼分辨結果 */
  .blast {
    position: fixed;
    width: 14px; height: 14px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 250;
    pointer-events: none;
    opacity: 1;
  }
  .blast.hit { background: radial-gradient(circle, #fff5d6 0%, #ffb347 28%, #ff5b35 52%, rgba(255,80,30,0) 72%); }
  .blast.miss { background: radial-gradient(circle, #eafbff 0%, #7fd4e8 32%, #2d7d9a 55%, rgba(45,125,154,0) 72%); }
  .blast.animate { transition: transform .45s cubic-bezier(.15,.8,.3,1), opacity .5s ease .1s; transform: translate(-50%, -50%) scale(var(--blast-scale, 9)); opacity: 0; }

  /* RPG風格傷害飄字：命中時跳出紅色數字往上飄、淡出 */
  .dmg-float { position: fixed; font-weight: 900; font-family: "Arial Black", sans-serif; color: #ff5b5b; text-shadow: 0 0 6px rgba(0,0,0,.8), 0 2px 2px rgba(0,0,0,.6); z-index: 350; pointer-events: none; transform: translate(-50%, -50%); font-size: 15px; }
  .dmg-float.animate { transition: transform 1s cubic-bezier(.15,.7,.3,1), opacity 1s ease .2s; transform: translate(-50%, -160%) scale(1.15); opacity: 0; }

  /* 命中格子的短暫閃光，強化「這裡被打中了」的回饋 */
  .cell.flash-hit { animation: flash-hit .5s ease; }
  .cell.flash-miss { animation: flash-miss .5s ease; }
  @keyframes flash-hit { 0% { background: #ff8a5b; } 100% { background: #0a1c2c; } }
  @keyframes flash-miss { 0% { background: #4fb8d1; } 100% { background: #0a1c2c; } }

  /* -------- 開火控制 + 戰報日誌 -------- */
  .log-panel {
    background: var(--panel); border: 1px solid var(--grid-line);
    border-radius: 8px; padding: 10px 14px; margin-top: 18px;
    height: 150px; flex-shrink: 0; overflow-y: auto;
    font-size: 12px; line-height: 1.9;
  }
  .log-panel .log-empty { color: var(--muted); text-align: center; }
  .log-panel .log-hit { color: #f0b352; }
  .log-panel .log-miss { color: var(--muted); }
  .log-panel .log-wreck { color: var(--critical); font-weight: 700; }

  /* -------- 多人連線介面 -------- */
  .hidden { display: none !important; }
  #multiplayer-view { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; }
  #mp-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .mp-panel { background: var(--panel); border: 1px solid var(--grid-line-bright); border-radius: 10px; padding: 16px; max-width: 480px; margin: 20px auto; text-align: center; }
  .mp-btn { background: var(--deep); border: 1px solid var(--grid-line-bright); color: var(--ink); border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  .mp-btn:hover:not(:disabled) { background: #123448; }
  .mp-btn:disabled { opacity: .35; cursor: not-allowed; }
  .mp-btn.primary { background: linear-gradient(135deg, var(--scan), #2d9d90); color: #04211d; border-color: transparent; }
  .mp-btn.small { width: auto; padding: 6px 12px; font-size: 11px; }
  .mp-input { width: 100%; background: var(--deep); border: 1px solid var(--grid-line-bright); border-radius: 8px; padding: 9px 12px; color: var(--ink); font-size: 13px; margin-top: 6px; font-family: inherit; }
  .mp-input-large { font-size: 17px; padding: 14px 16px; letter-spacing: 2px; text-align: center; }
  .mp-label { font-size: 11px; color: var(--muted); text-align: left; display: block; margin: 10px 0 2px; }
  .mp-room-list-item { width: 100%; text-align: left; background: var(--deep); border: 1px solid var(--grid-line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; color: var(--ink); }
  .mp-room-list-item:hover { border-color: var(--grid-line-bright); }
  .mp-room-list-item b { font-size: 13px; }
  .mp-room-list-item small { display: block; color: var(--muted); margin-top: 3px; font-size: 11px; }

  .mp-members-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
  .mp-member-card { background: var(--deep); border: 2px solid var(--grid-line); border-radius: 8px; padding: 8px; font-size: 11px; text-align: center; }
  .mp-member-card.ready { border-color: var(--intact); background: #0f2a1e; }
  .mp-member-card .mp-mname { font-weight: 800; font-size: 12px; }
  .mp-member-card.empty { opacity: .35; }

  .mp-direction-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
  .mp-direction-btn { background: var(--deep); border: 2px solid var(--grid-line-bright); color: var(--ink); border-radius: 8px; padding: 14px 8px; font-size: 13px; font-weight: 800; cursor: pointer; }
  .mp-direction-btn:hover:not(:disabled) { background: #123448; }
  .mp-direction-btn.selected { border-color: var(--scan); background: #123448; box-shadow: 0 0 0 1px var(--scan); }
  .mp-direction-btn:disabled { opacity: .3; cursor: not-allowed; }

  .mp-ship-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
  .mp-ship-btn { background: var(--deep); border: 2px solid var(--grid-line-bright); color: var(--ink); border-radius: 8px; padding: 10px 8px; font-size: 11px; cursor: pointer; text-align: left; }
  .mp-ship-btn:hover:not(:disabled) { background: #123448; }
  .mp-ship-btn.selected { border-color: var(--scan); background: #123448; box-shadow: 0 0 0 1px var(--scan); }
  .mp-ship-btn:disabled { opacity: .4; cursor: not-allowed; }
  .mp-ship-btn b { display: block; font-size: 13px; margin-bottom: 2px; }
  .mp-locked-note { font-size: 11px; color: var(--critical); margin-top: 6px; }

  /* -------- 多人戰鬥畫面：直接沿用單機模式已經驗證過能正常運作的.game-layout/.game-main/
     .game-sidebar/.turn-panel/.map-stage/.map-tilt/.map-frame/.grid20，不再另外發明新的
     class——只補上多人模式特有的少數幾樣東西(方位選擇按鈕、開火提示) -------- */
  .mp-fireable { cursor: crosshair; box-shadow: inset 0 0 0 1px rgba(214,69,69,.35); }
  .mp-fireable:hover { background: #2a1414 !important; box-shadow: inset 0 0 8px rgba(255,90,90,.6); }
  .mp-fire-hint { font-size: 11px; color: var(--critical); font-weight: 700; margin-top: 8px; text-align: center; }
  /* 已選定的瞄準座標：紅色脈動外框，明確標示「等等要打這裡」 */
  .mp-pending-fire { background: #4a1616 !important; box-shadow: inset 0 0 0 2px #ff5b5b, inset 0 0 12px rgba(255,90,90,.7) !important; animation: pending-fire-pulse 1s ease-in-out infinite; }
  @keyframes pending-fire-pulse { 0%, 100% { box-shadow: inset 0 0 0 2px #ff5b5b, inset 0 0 12px rgba(255,90,90,.7); } 50% { box-shadow: inset 0 0 0 2px #ff8a8a, inset 0 0 20px rgba(255,90,90,.9); } }
  /* 紅色個性化發射按鈕：比一般按鈕更搶眼，強化「按下去就真的開火了」的儀式感 */
  .mp-fire-btn {
    width: 100%; margin-top: 10px; padding: 14px 8px;
    background: linear-gradient(135deg, #d64545, #a82f2f);
    border: 2px solid #ff5b5b;
    color: #fff; font-size: 15px; font-weight: 900; letter-spacing: .05em;
    border-radius: 10px; cursor: pointer;
    box-shadow: 0 0 20px -4px rgba(255,90,90,.6), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .1s, box-shadow .2s;
  }
  .mp-fire-btn:hover:not(:disabled) { box-shadow: 0 0 28px -2px rgba(255,90,90,.85), inset 0 1px 0 rgba(255,255,255,.25); }
  .mp-fire-btn:active:not(:disabled) { transform: scale(.96); }
  .mp-fire-btn:disabled { background: var(--deep); border-color: var(--grid-line); color: var(--muted); box-shadow: none; cursor: not-allowed; }


  @media (max-width: 500px) {
    .coord-mark::before { display: none; }
  }

  /* 橫向手機(矮螢幕)：用max-height判斷(不是max-width)，因為橫向手機的特徵是「矮」不是「窄」。
     維持左右並排(不像直向那樣切成上下疊放，橫向寬度通常還夠用)，但壓縮標頭高度跟間距，
     確保有限的垂直空間盡量留給地圇。這段刻意放在樣式表最後面，因為CSS特異度相同時
     後面的規則才會生效，放在前面會被後面同特異度的基礎定義覆蓋掉、完全不會生效 */
  @media (max-height: 480px) and (orientation: landscape) {
    header { padding: 4px 10px 3px; }
    .header-row { gap: 6px; }
    h1 { font-size: 14px; }
    .eyebrow { font-size: 7px; margin-bottom: 0; }
    .back-links { padding-top: 0; gap: 6px; }
    a.back-link, .legend-toggle-btn { font-size: 10px; padding: 3px 8px; }
    .game-layout { gap: 6px; }
    .turn-panel .turn-title { font-size: 12px; }
    .turn-panel .health-readout { font-size: 12px; }
    .move-btn { padding: 6px 4px; font-size: 14px; min-width: 40px; }
    .move-btn .btn-label { font-size: 9px; }
    .log-panel { height: 90px; }
  }

  /* 手機安全網：涵蓋所有窄螢幕或矮螢幕的情況(不管直向橫向)。移除.stage跟.game-layout的
     min-height:0強制縮小行為——那個寫法會讓內容乖乖壓縮塞進可用空間，就算body本身設定
     可以捲動，也沒有東西會真的超出邊界觸發捲動。改成min-height:auto讓內容用自然高度撐開，
     如果真的比螢幕還高，就會確實超出body邊界，這樣才能捲動到被藏起來的部分。這是最後一道
     防線：桌面版跟正常情況下的手機，因為--real-vh計算通常是準確的，內容剛好貼合可視空間，
     min-height:auto幾乎不會造成視覺差異；只有計算真的出現誤差時，這個安全網才會真正發揮作用 */
  @media (max-width: 780px), (max-height: 500px) {
    .stage { min-height: auto; }
    .game-layout { min-height: auto; }
  }
</style>
</head>
<body>

<script>
  const MAP_SIZE = 20;
  const ACTIONS_PER_TURN = 5;

  // ============================================================
  // 五種船型：長寬先確定下來，詳細戰損數值(血量門檻、基礎移動次數等)之後再補。
  // 目前「船頭/船中前/船中後/船尾」四區塊戰損機制，是針對船長4格的船設計的
  // (兩棲突擊艦、潛水艇剛好都是船長4)——船長3或2的船(巡洋艦/驅逐艦/巡防艦)
  // 要怎麼對應到幾個區塊，等你給後續設定再調整，目前先讓它們可以正常出現、
  // 移動、被擊中受損，只是還沒有細分區塊效果
  // ============================================================
  const SHIP_TYPES = {
    amphibious: {
      name: '兩棲突擊艦', length: 4, width: 2, baseActions: 4, maxHealth: 1000,
      fireChance: { frontmid: 1.0 }, // 前中區塊打中必失火(100%)
      weapons: {
        normal: { name: '一般砲彈', power: 100, uses: null, fallMs: 650, shellSize: 8, explosionProfile: { lowpassFreq: 1100, volume: 0.42, durationSec: 0.45, bassFreq: 90 } }, // uses:null代表不限次數
        saturation: { name: '飽和攻擊', power: 100, shots: 3, sameTarget: true, uses: 5, fallMs: 480, shellSize: 7, explosionProfile: { lowpassFreq: 1300, volume: 0.35, durationSec: 0.3, bassFreq: 80 } }, // 連續快速齊射，每發音色比單發一般砲彈稍微輕快
      },
    },
    cruiser: {
      name: '巡洋艦', length: 3, width: 2, baseActions: 5, maxHealth: 800,
      fireChance: { mid: 0.5 }, // 中段區塊打中50%機率失火
      weapons: {
        normal: { name: '一般砲彈', power: 100, uses: null, fallMs: 650, shellSize: 8, explosionProfile: { lowpassFreq: 1100, volume: 0.42, durationSec: 0.45, bassFreq: 90 } },
        heavy: { name: '重砲射擊', power: 150, uses: 4, aoe: { w: 2, h: 2 }, fallMs: 900, shellSize: 13, explosionProfile: { lowpassFreq: 450, volume: 0.65, durationSec: 0.85, bassFreq: 45 } }, // 較重、彈道較慢，爆炸聲低沉厚重
      },
    },
    destroyer: {
      name: '驅逐艦', length: 3, width: 2, baseActions: 6, maxHealth: 700,
      fireChance: { mid: 0.5 },
      weapons: {
        normal: { name: '一般砲彈', power: 100, uses: null, fallMs: 650, shellSize: 8, explosionProfile: { lowpassFreq: 1100, volume: 0.42, durationSec: 0.45, bassFreq: 90 } },
        rocket: { name: '多管火箭彈', power: 50, uses: 5, aoe: { w: 3, h: 2 }, multiShell: true, fallMs: 550, shellSize: 7, explosionProfile: { lowpassFreq: 2000, volume: 0.22, durationSec: 0.22, bassFreq: null } }, // 多管=6管齊發，範圍內每格各一顆，單發火箭威力較小、聲音輕快清脆
      },
    },
    frigate: {
      name: '巡防艦', length: 2, width: 1, baseActions: 7, maxHealth: 500,
      fireChance: { bow: 0.5 },
      weapons: {
        normal: { name: '一般砲彈', power: 100, uses: null, fallMs: 650, shellSize: 8, explosionProfile: { lowpassFreq: 1100, volume: 0.42, durationSec: 0.45, bassFreq: 90 } },
        missile: { name: '超音速反艦飛彈', power: 150, uses: 5, aoe: { w: 2, h: 1 }, fallMs: 280, shellSize: 10, whistle: true, explosionProfile: { lowpassFreq: 800, volume: 0.55, durationSec: 0.5, bassFreq: 70, crackFreq: 2800 } }, // 名符其實，墜落速度明顯加快，尖銳撞擊聲+深沉衝擊音
      },
    },
    submarine: {
      name: '潛水艇', length: 4, width: 1, baseActions: 4, maxHealth: 500,
      fireChance: { frontmid: 1.0 },
      weapons: {
        normal: { name: '普通魚雷', power: 100, uses: null, fallMs: 650, shellSize: 8, explosionProfile: { lowpassFreq: 600, volume: 0.4, durationSec: 0.55, bassFreq: 55 } }, // 水下爆炸悶重感
        multitorpedo: { name: '多管魚雷', power: 100, uses: 5, pattern: 'triple-gap', fallMs: 600, shellSize: 8, explosionProfile: { lowpassFreq: 650, volume: 0.35, durationSec: 0.4, bassFreq: 55 } }, // 魚雷-空格-魚雷-空格-魚雷，同樣是水下悶重感
      },
    },
  };
  // 不同船長對應不同數量的區塊：長度4分四塊(頭/前中/中後/尾)，長度3分三塊(頭/中/尾)，
  // 長度2分兩塊(頭/尾)——這套對應表已經用Node.js驗證過3種長度都恰好對應正確格數、
  // 頭尾方向正確
  const ZONE_MAP_BY_LENGTH = {
    4: { 0: 'stern', 1: 'rearmid', 2: 'frontmid', 3: 'bow' },
    3: { 0: 'stern', 1: 'mid', 2: 'bow' },
    2: { 0: 'stern', 1: 'bow' },
  };
  const ZONE_LABEL = { bow: '船頭', frontmid: '船中前', rearmid: '船中後', mid: '船中', stern: '船尾' };

  // 依剩餘血量比例換算成視覺狀態(用比例而不是絕對值，這樣不同船型血量上限不同也能共用同一套判斷)
  function damageState(ship) {
    const spec = SHIP_TYPES[ship.type];
    const pctRemaining = ship.health / spec.maxHealth;
    if (ship.health <= 0) return 'wrecked';
    if (pctRemaining <= 0.25) return 'critical';
    if (pctRemaining <= 0.75) return 'damaged';
    return 'intact';
  }

  // 船隻用「基準格」+「朝向」表示，不是固定方塊。轉向時基準格保持不動、船身繞著它旋轉——
  // 這套座標數學已經用Node.js單獨驗證過3種船長(4/3/2)、4種朝向都恰好佔滿船身格數、
  // 船頭船尾方向正確、沒有重複格子，才套進這裡
  const BOW_ARROW = { N: '▲', S: '▼', E: '▶', W: '◀' };
  const TURN_LEFT = { N: 'W', W: 'S', S: 'E', E: 'N' };
  const TURN_RIGHT = { N: 'E', E: 'S', S: 'W', W: 'N' };

  function getShipCells(ship) {
    const spec = SHIP_TYPES[ship.type];
    const { row, col, heading } = ship;
    const cells = [];
    // 基準格對齊的index：長度2的船只有0,1兩格、沒有真正的中心格，用index0當基準
    // (避免基準格落在index1導致某些朝向下算出來的格子超出預期)；長度3/4都用index1
    const centerIdx = spec.length === 2 ? 0 : 1;
    for (let len = 0; len < spec.length; len++) {
      for (let wid = 0; wid < spec.width; wid++) {
        const lenOffset = len - centerIdx;
        const widOffset = wid;
        let r, c;
        if (heading === 'N') { r = row - lenOffset; c = col + widOffset; }
        else if (heading === 'S') { r = row + lenOffset; c = col + widOffset; }
        else if (heading === 'E') { r = row + widOffset; c = col + lenOffset; }
        else if (heading === 'W') { r = row + widOffset; c = col - lenOffset; }
        const zone = ZONE_MAP_BY_LENGTH[spec.length][len];
        cells.push({ row: r, col: c, isBow: len === spec.length - 1, zone });
      }
    }
    return cells;
  }
  function shipMoveForward(ship) {
    const { row, col, heading } = ship;
    if (heading === 'N') return { ...ship, row: row - 1 };
    if (heading === 'S') return { ...ship, row: row + 1 };
    if (heading === 'E') return { ...ship, col: col + 1 };
    if (heading === 'W') return { ...ship, col: col - 1 };
  }
  function shipWithinBounds(ship) {
    return getShipCells(ship).every(c => c.row >= 1 && c.row <= MAP_SIZE && c.col >= 1 && c.col <= MAP_SIZE);
  }
  // 目前這回合實際可用的最大移動次數：船隻原始設定值扣掉累積的戰損扣減(actionPenalty)，
  // 扣減量已經包含了船頭中彈(+1)、船中後中彈(+2)、船尾中彈(封頂效果)全部疊加後的結果
  function getMaxActions(ship) {
    return Math.max(0, SHIP_TYPES[ship.type].baseActions - ship.actionPenalty);
  }

  // 測試用的示範船艦資料：先放一艘可操作的船驗證移動/轉向/戰損/武器邏輯，之後接連線邏輯時
  // 會改成從房間即時同步、每個玩家各自的船隊
  function createDemoShip(type) {
    const spec = SHIP_TYPES[type];
    const weaponUsesLeft = {};
    Object.entries(spec.weapons).forEach(([key, w]) => { if (w.uses !== null) weaponUsesLeft[key] = w.uses; });
    return { id: 'alpha', name: '阿爾法', type, row: 10, col: 10, heading: 'N', health: spec.maxHealth, onFire: false, actionPenalty: 0, weaponUsesLeft };
  }
  const DEMO_SHIPS = [createDemoShip('amphibious')];
  let myShip = DEMO_SHIPS[0];
  let actionsLeft = getMaxActions(myShip);

  // 切換示範船型：方便測試5種不同船隻的戰損/武器機制，不用重新整理頁面
  // 圖例彈出視窗：全螢幕版面把圖例改成點擊才顯示的彈窗，不佔用固定版面空間
  function toggleLegend() {
    document.getElementById('legend-popup').classList.toggle('hidden');
  }

  function switchDemoShipType(type) {
    const newShip = createDemoShip(type);
    DEMO_SHIPS[0] = newShip;
    myShip = newShip;
    selectedWeapon = 'normal';
    actionsLeft = getMaxActions(myShip);
    document.getElementById('ship-alpha')?.remove(); // 清掉舊船型的DOM元素，避免尺寸沒有正確更新
    document.getElementById('ship-title').textContent = `🚢 操作「${myShip.name}」號（${SHIP_TYPES[type].name}）`;
    renderShip(myShip);
    updateTurnPanel();
    updateWeaponPanel();
    document.getElementById('log-panel').innerHTML = '<p class="log-empty">戰報紀錄會顯示在這裡</p>';
    addLogEntry(`🔄 切換示範船型為「${SHIP_TYPES[type].name}」`, 'miss');
  }

  // 直接量測.map-stage實際的可用寬高，取較小值當作正方形邊長，強制設定給.map-tilt——
  // 不依賴CSS aspect-ratio在巢狀flexbox+3D變形環境下自動計算(那個做法在Claude的
  // artifact預覽環境裡不可靠，量出來的地圖會被拉伸變形)，改成JS直接算好精確的px數值
  function resizeMapToFit() {
    const stage = document.querySelector('.map-stage');
    const tilt = document.querySelector('.map-tilt');
    if (!stage || !tilt) return;
    let size;
    if (window.innerWidth <= 900) {
      // 手機版：直接用視窗寬度/高度計算尺寸，不依賴.map-stage的flex鏈路量測結果——
      // 手機版疊加了好幾層響應式規則(直向/橫向/安全網)，那條鏈路很容易在某個環節算錯，
      // 直接用視窗尺寸算更穩定、更好預測。同時限制不超過視窗高度的42%，確保橫向手機
      // (螢幕很矮)也不會算出過大、超出容器範圍的尺寸
      size = Math.max(200, Math.min(window.innerWidth * 0.86, window.innerHeight * 0.42, 420));
    } else {
      const availW = stage.clientWidth;
      const availH = stage.clientHeight;
      size = Math.max(60, Math.min(availW, availH)); // 至少60px，避免容器還沒佈局完成時量到0
    }
    tilt.style.width = size + 'px';
    tilt.style.height = size + 'px';
    renderMapCoordLabels(tilt, size);
  }

  // 座標標籤：字母(A~T)標在地圇頂端、數字(1~20)標在左側。這次改成放進.map-tilt「內部」，
  // 也就是會跟著3D傾斜一起變形的容器——之前放在.map-tilt外面(平面、不變形)，結果跟
  // 3D透視下「近大遠小」的格子間距完全對不上，永遠是歪的。現在標籤本身也套用同一個
  // rotateX變形，用跟格子一樣的百分比定位邏輯，兩者自然會對齊(因為承受同一組變形矩陣)
  function renderMapCoordLabels(tilt, size) {
    let colLabels = tilt.querySelector('.map-coord-col-labels');
    let rowLabels = tilt.querySelector('.map-coord-row-labels');
    if (!colLabels) {
      colLabels = document.createElement('div');
      colLabels.className = 'map-coord-labels map-coord-col-labels';
      colLabels.innerHTML = Array.from({ length: MAP_SIZE }, (_, i) => `<span>${colLetter(i + 1)}</span>`).join('');
      tilt.appendChild(colLabels);
    }
    if (!rowLabels) {
      rowLabels = document.createElement('div');
      rowLabels.className = 'map-coord-labels map-coord-row-labels';
      rowLabels.innerHTML = Array.from({ length: MAP_SIZE }, (_, i) => `<span>${i + 1}</span>`).join('');
      tilt.appendChild(rowLabels);
    }
    // 定位基準改成.map-tilt本身(top/left直接用px相對於.map-tilt，不再用「calc(50% - ...)」
    // 去猜外層置中位置)——字母列貼齊地圇頂端正上方，數字列貼齊地圇左側正左邊，寬高剛好
    // 跟地圇同寬/同高，每個字母數字的格子寬度對應到地圇上的一格
    const cellSize = size / MAP_SIZE;
    colLabels.style.width = size + 'px';
    colLabels.style.height = '16px';
    colLabels.style.top = '-18px';
    colLabels.style.left = '0';
    Array.from(colLabels.children).forEach(el => { el.style.width = cellSize + 'px'; el.style.height = '16px'; });
    rowLabels.style.width = '24px';
    rowLabels.style.height = size + 'px';
    rowLabels.style.top = '0';
    rowLabels.style.left = '-28px';
    Array.from(rowLabels.children).forEach(el => { el.style.width = '24px'; el.style.height = cellSize + 'px'; });
  }

  // 多人戰鬥畫面專用的地圖尺寸量測：跟單機模式同樣的做法，不依賴CSS min()自動計算
  // (那個做法在這個巢狀flexbox環境下不可靠，之前地圖會被拉伸變形就是這個原因)，
  // 改成JS直接量測#mp-own-map-stage的實際可用空間，取寬高較小值當正方形邊長強制設定。
  // 每次renderMpBattleView重新渲染(例如戰報有新內容)都要重新呼叫，確保尺寸不會
  // 因為側邊欄內容變化而跟著跑掉
  let mpOwnGridResizeObserver = null;
  function resizeMpOwnGridToFit() {
    const stage = document.getElementById('mp-own-map-stage');
    const tilt = document.getElementById('mp-own-map-tilt');
    if (!stage || !tilt) return;
    let size;
    if (window.innerWidth <= 900) {
      size = Math.max(200, Math.min(window.innerWidth * 0.86, window.innerHeight * 0.42, 420));
    } else {
      const availW = stage.clientWidth;
      const availH = stage.clientHeight;
      size = Math.max(60, Math.min(availW, availH));
    }
    tilt.style.width = size + 'px';
    tilt.style.height = size + 'px';
    renderMapCoordLabels(tilt, size);
    // 只在第一次設定ResizeObserver，避免每次重新渲染都重複建立新的observer疊加
    if (!mpOwnGridResizeObserver && window.ResizeObserver) {
      mpOwnGridResizeObserver = new ResizeObserver(() => resizeMpOwnGridToFit());
      mpOwnGridResizeObserver.observe(stage);
    }
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid20');
    let cellsHtml = '';
    for (let r = 1; r <= MAP_SIZE; r++) {
      for (let c = 1; c <= MAP_SIZE; c++) {
        const colLetter = String.fromCharCode(64 + c); // 1=A, 2=B...20=T，仿照海戰棋常見的座標表示法
        cellsHtml += `<div class="cell" data-row="${r}" data-col="${c}" data-coord="${colLetter}${r}" onclick="fireAt(${r},${c})"></div>`;
      }
    }
    gridEl.innerHTML = cellsHtml;
    DEMO_SHIPS.forEach(renderShip);
  }

  // 船身用「外框bounding box」定位(取所有佔用格子的row/col最小最大值)，
  // 再用對應朝向的clip-path裁出船頭尖形——這樣不管朝向是窄長(N/S)還是寬扁(E/W)，
  // 外框尺寸都會正確對應船身實際佔用的格子範圍
  function renderShip(ship) {
    const gridEl = document.getElementById('grid20');
    let el = document.getElementById(`ship-${ship.id}`);
    if (!el) {
      el = document.createElement('div');
      el.id = `ship-${ship.id}`;
      gridEl.appendChild(el);
    }
    const cells = getShipCells(ship);
    const rows = cells.map(c => c.row), cols = cells.map(c => c.col);
    const minRow = Math.min(...rows), maxRow = Math.max(...rows);
    const minCol = Math.min(...cols), maxCol = Math.max(...cols);
    const cellPct = 100 / MAP_SIZE;
    const spec = SHIP_TYPES[ship.type];
    const healthPct = Math.max(0, Math.round((ship.health / spec.maxHealth) * 100));

    el.className = `ship-block type-${ship.type} state-${damageState(ship)} heading-${ship.heading}`;
    el.style.top = `${(minRow - 1) * cellPct}%`;
    el.style.left = `${(minCol - 1) * cellPct}%`;
    el.style.width = `${(maxCol - minCol + 1) * cellPct}%`;
    el.style.height = `${(maxRow - minRow + 1) * cellPct}%`;
    // 船身上的血量顯示改用百分比(比較不會在窄船身上被文字擠壓)，實際數字留給右側資訊欄顯示；
    // 著火中額外疊加一個跳動的火焰emoji，一眼就能看出這艘船正在燒
    el.innerHTML = `<span class="bow-arrow">${BOW_ARROW[ship.heading]}</span><span class="ship-pct">${healthPct}%</span>${ship.onFire ? '<span class="fire-emoji">🔥</span>' : ''}`;
  }

  // ============================================================
  // 音效：用Web Audio API即時合成，不依賴外部音效檔案
  // ============================================================
  let audioCtx = null;
  function getAudioCtx() {
    // AudioContext要在使用者手勢(點擊)裡才能啟動，開火動作本身就是點擊，天然滿足這個條件
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playFireSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    // 發射聲：音高快速下滑的三角波，模擬砲擊的悶重感
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.exponentialRampToValueAtTime(48, now + 0.16);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  }
  // 風嘯聲：飛彈這種高速墜落的武器專用，用高通濾波過的白噪音+隨時間下降的濾波頻率，
  // 模擬高速氣流呼嘯而過的感覺，音效長度跟著武器實際墜落時間(durationMs)走
  function playWhistleSound(durationMs) {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const durSec = durationMs / 1000;
    const bufferSize = Math.floor(ctx.sampleRate * durSec);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 6;
    // 濾波中心頻率從高往低掃(呼嘯聲由尖銳漸漸貼近目標的感覺)，搭配音量微幅漸強再收尾
    filter.frequency.setValueAtTime(3600, now);
    filter.frequency.exponentialRampToValueAtTime(1400, now + durSec);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.16, now + durSec * 0.3);
    gain.gain.setValueAtTime(0.16, now + durSec * 0.75);
    gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
  }
  // 爆炸聲改成吃武器各自的音效參數(explosionProfile)，不再是每種武器都同一種「放鞭炮」聲：
  // lowpassFreq控制悶重/清脆(數字越小越悶重)、volume控制音量大小、durationSec控制殘響長短、
  // bassFreq有設定的話會額外疊加低頻衝擊音(數字是起始頻率，越低越沉)強化重量感
  function playExplosionSound(isHit, profile) {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const p = isHit ? profile : { lowpassFreq: 1800, volume: 0.22, durationSec: 0.35, bassFreq: null }; // 落空統一用清脆水花聲，不用武器的重擊音色

    const bufferSize = Math.floor(ctx.sampleRate * p.durationSec);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = p.lowpassFreq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(p.volume, now);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);

    if (p.bassFreq) {
      // 疊加低頻衝擊音強化重量感，起始頻率越低(bassFreq越小)聽起來越沉重
      const osc = ctx.createOscillator();
      const oGain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.bassFreq, now);
      osc.frequency.exponentialRampToValueAtTime(p.bassFreq * 0.3, now + p.durationSec * 0.7);
      oGain.gain.setValueAtTime(p.volume * 0.85, now);
      oGain.gain.exponentialRampToValueAtTime(0.001, now + p.durationSec * 0.85);
      osc.connect(oGain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + p.durationSec * 0.85);
    }
    if (p.crackFreq) {
      // 額外的高頻「crack」聲，飛彈這種武器適合疊加一聲尖銳撞擊感在爆炸前段
      const osc2 = ctx.createOscillator();
      const oGain2 = ctx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(p.crackFreq, now);
      osc2.frequency.exponentialRampToValueAtTime(p.crackFreq * 0.4, now + 0.08);
      oGain2.gain.setValueAtTime(p.volume * 0.5, now);
      oGain2.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc2.connect(oGain2).connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.09);
    }
  }

  // ============================================================
  // 開火流程：發射音效 -> 砲彈從畫面上方掉落到目標座標(用getBoundingClientRect
  // 抓格子在3D傾斜後的實際螢幕座標，不用自己算透視變形的三角函數) -> 落地爆炸 -> 判定命中/落空
  // ============================================================
  let firingInProgress = false; // 避免砲彈還沒落地就又點別的格子，畫面同時疊好幾發搞混
  // 依選定的武器計算實際會命中的座標清單：單發武器只有1個座標，AOE武器是矩形範圍，
  // 飽和攻擊是同一個座標打3次，多管魚雷是「魚雷-空格-魚雷-空格-魚雷」橫向間隔陣型。
  // 這幾種座標計算方式都已經用Node.js單獨驗證過
  let selectedWeapon = 'normal'; // 目前選擇要用的武器key，預設一般砲彈(不限次數)

  function fireAt(row, col) {
    if (firingInProgress) return;
    const spec = SHIP_TYPES[myShip.type];
    const weaponSpec = spec.weapons[selectedWeapon];
    if (weaponSpec.uses !== null) {
      const left = myShip.weaponUsesLeft[selectedWeapon];
      if (left <= 0) { showFireBlockedMsg(`「${weaponSpec.name}」這場遊戲的使用次數已經用完了`); return; }
    }

    firingInProgress = true;
    playFireSound();
    if (weaponSpec.uses !== null) myShip.weaponUsesLeft[selectedWeapon]--;
    updateWeaponPanel();

    if (weaponSpec.aoe && weaponSpec.multiShell) {
      // 多管火箭這種「本來就是多管齊發」的範圍武器：範圍內每一格各發射一顆獨立砲彈，
      // 不是單發+放大爆炸(那是重砲/飛彈這種單一大型彈藥的表現方式)
      const targets = getAoeCells(weaponSpec, row, col);
      let completedCount = 0;
      targets.forEach((target, i) => {
        setTimeout(() => fireSingleShell(target.row, target.col, weaponSpec, () => {
          completedCount++;
          if (completedCount === targets.length) firingInProgress = false;
        }), i * 90); // 多管齊發的間隔比其他多發武器更緊湊，強調「一波打出去」的感覺
      });
    } else if (weaponSpec.aoe) {
      // 單一大型彈藥的範圍武器(重砲/飛彈)：只發射「一枚」砲彈，落地後用一個放大版的
      // 爆炸視覺涵蓋整個範圍
      fireAoeShell(row, col, weaponSpec, () => { firingInProgress = false; });
    } else {
      // 一般單發武器、或本質上就是「連續多發」的武器(飽和攻擊同點連射、多管魚雷間隔陣型)：
      // 各自獨立的砲彈+爆炸+判定，用小間隔錯開看起來像連續齊射
      const targets = getWeaponTargetCells(weaponSpec, row, col);
      let completedCount = 0;
      targets.forEach((target, i) => {
        setTimeout(() => fireSingleShell(target.row, target.col, weaponSpec, () => {
          completedCount++;
          if (completedCount === targets.length) firingInProgress = false;
        }), i * 160);
      });
    }
  }

  function getWeaponTargetCells(weaponSpec, centerRow, centerCol) {
    if (weaponSpec.pattern === 'triple-gap') {
      return [
        { row: centerRow, col: centerCol - 2 },
        { row: centerRow, col: centerCol },
        { row: centerRow, col: centerCol + 2 },
      ];
    }
    if (weaponSpec.shots && weaponSpec.sameTarget) {
      return Array.from({ length: weaponSpec.shots }, () => ({ row: centerRow, col: centerCol }));
    }
    return [{ row: centerRow, col: centerCol }];
  }
  // AOE武器專用：計算範圍內實際涵蓋的所有格子座標(重砲2x2、火箭3x2、飛彈2x1都用這個算)
  function getAoeCells(weaponSpec, centerRow, centerCol) {
    const { w, h } = weaponSpec.aoe;
    const halfW = Math.floor(w / 2), halfH = Math.floor(h / 2);
    const cells = [];
    for (let dr = -halfH; dr < h - halfH; dr++) {
      for (let dc = -halfW; dc < w - halfW; dc++) {
        cells.push({ row: centerRow + dr, col: centerCol + dc });
      }
    }
    return cells;
  }

  function fireSingleShell(row, col, weaponSpec, onDone) {
    // 目標座標可能落在地圖範圍外(多管魚雷陣型的邊緣座標可能超出20x20)，
    // 這種情況直接當作落空處理，不用真的去查詢格子DOM元素(找不到會出錯)
    if (row < 1 || row > MAP_SIZE || col < 1 || col > MAP_SIZE) {
      addLogEntry(`💦 攻擊範圍延伸到地圖外，那個位置沒有效果`, 'miss');
      onDone();
      return;
    }
    const cellEl = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
    const rect = cellEl.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;

    const shell = createShellEl(targetX, targetY, weaponSpec);
    if (weaponSpec.whistle) playWhistleSound(weaponSpec.fallMs);
    requestAnimationFrame(() => {
      shell.style.transition = `top ${weaponSpec.fallMs}ms cubic-bezier(.45,0,.85,1)`;
      shell.style.top = targetY + 'px';
    });

    setTimeout(() => {
      shell.remove();
      resolveShot(row, col, targetX, targetY, weaponSpec);
      onDone();
    }, weaponSpec.fallMs);
  }

  // AOE武器的發射流程：一枚砲彈掉到指定中心點，落地後爆炸視覺會放大到涵蓋整個範圍，
  // 但範圍內每一格還是要各自獨立判定命中/落空(可能同時打中船身好幾個不同區塊)
  function fireAoeShell(centerRow, centerCol, weaponSpec, onDone) {
    if (centerRow < 1 || centerRow > MAP_SIZE || centerCol < 1 || centerCol > MAP_SIZE) {
      addLogEntry(`💦 目標超出地圖範圍`, 'miss');
      onDone();
      return;
    }
    const cellEl = document.querySelector(`.cell[data-row="${centerRow}"][data-col="${centerCol}"]`);
    const rect = cellEl.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;

    const shell = createShellEl(targetX, targetY, weaponSpec);
    if (weaponSpec.whistle) playWhistleSound(weaponSpec.fallMs);
    requestAnimationFrame(() => {
      shell.style.transition = `top ${weaponSpec.fallMs}ms cubic-bezier(.45,0,.85,1)`;
      shell.style.top = targetY + 'px';
    });

    setTimeout(() => {
      shell.remove();
      resolveAoeShot(centerRow, centerCol, targetX, targetY, weaponSpec);
      onDone();
    }, weaponSpec.fallMs);
  }

  function createShellEl(startX, startY, weaponSpec) {
    const shell = document.createElement('div');
    shell.className = 'shell';
    shell.style.width = weaponSpec.shellSize + 'px';
    shell.style.height = weaponSpec.shellSize + 'px';
    shell.style.left = startX + 'px';
    shell.style.top = '-30px';
    document.body.appendChild(shell);
    return shell;
  }

  function showFireBlockedMsg(msg) {
    playBlockedSound();
    addLogEntry(`🚫 ${msg}`, 'miss');
  }

  // 命中判定改成即時計算船身目前實際佔用的格子(不是固定方塊)——船隻移動/轉向之後，
  // 這裡查到的格子範圍會自動跟著變，不需要另外同步維護
  function findHitCellAndShip(row, col) {
    for (const ship of DEMO_SHIPS) {
      const cell = getShipCells(ship).find(c => c.row === row && c.col === col);
      if (cell) return { ship, cell };
    }
    return null;
  }

  // 依區塊套用對應戰損效果：這套邏輯已經用Node.js單獨驗證過所有情境
  // (船頭累加扣減+傷害減半、機率式起火不重複觸發、船中後2倍傷害+扣減2、
  // 船尾封頂不會讓已經更嚴重的損傷變好、船長3/2的船對應到3/2個區塊)，才套進這裡
  function applyZoneHit(ship, zone, weaponPower) {
    const spec = SHIP_TYPES[ship.type];
    let actualDmg = weaponPower;
    let effectMsg = '';
    if (zone === 'bow') {
      actualDmg = Math.round(weaponPower / 2);
      ship.actionPenalty += 1;
      effectMsg = '船頭中彈，傷害減半、移動上限-1';
    } else if (zone === 'rearmid') {
      actualDmg = weaponPower * 2;
      ship.actionPenalty += 2;
      effectMsg = '船中後中彈，致命傷害(2倍)、移動上限-2';
    } else if (zone === 'stern') {
      ship.actionPenalty = Math.max(ship.actionPenalty, spec.baseActions - 2);
      effectMsg = '船尾中彈，失去動力，移動上限封頂在2';
    } else {
      // frontmid(兩棲突擊艦/潛水艇)或mid(巡洋艦/驅逐艦)或bow(巡防艦)：依船型設定的機率判斷會不會起火
      const fireChance = spec.fireChance[zone] || 0;
      if (!ship.onFire && fireChance > 0 && Math.random() < fireChance) {
        ship.onFire = true;
        effectMsg = `${ZONE_LABEL[zone]}中彈，引發火勢！`;
      } else if (ship.onFire) {
        effectMsg = `${ZONE_LABEL[zone]}中彈，火勢持續延燒中`;
      } else {
        effectMsg = `${ZONE_LABEL[zone]}中彈`;
      }
    }
    ship.health = Math.max(0, ship.health - actualDmg);
    return { actualDmg, effectMsg };
  }

  function resolveShot(row, col, screenX, screenY, weaponSpec) {
    const hit = findHitCellAndShip(row, col);
    const isHit = !!hit;
    playExplosionSound(isHit, weaponSpec.explosionProfile);
    spawnBlast(screenX, screenY, isHit);

    const cellEl = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
    const colLetter = String.fromCharCode(64 + col);
    const coord = `${colLetter}${row}`;

    if (!isHit) {
      cellEl.classList.add('flash-miss');
      setTimeout(() => cellEl.classList.remove('flash-miss'), 500);
      addLogEntry(`💦 ${coord} 落空，砲彈墜入海中`, 'miss');
      return;
    }

    cellEl.classList.add('flash-hit');
    setTimeout(() => cellEl.classList.remove('flash-hit'), 500);

    const { ship, cell } = hit;
    if (ship.health <= 0) {
      addLogEntry(`☠️ ${coord} 命中「${ship.name}」，但這裡已經是殘骸了`, 'hit');
      return;
    }

    const { actualDmg, effectMsg } = applyZoneHit(ship, cell.zone, weaponSpec.power);
    renderShip(ship);
    updateTurnPanel();
    spawnDamageFloat(screenX, screenY, actualDmg);
    if (ship.health <= 0) {
      addLogEntry(`💥 ${coord} 命中「${ship.name}」的${ZONE_LABEL[cell.zone]}，${effectMsg}，血量歸零已被淘汰！`, 'wreck');
    } else {
      addLogEntry(`🎯 ${coord} 命中「${ship.name}」的${ZONE_LABEL[cell.zone]}，${effectMsg}，造成${actualDmg}點傷害(剩餘${ship.health}/${SHIP_TYPES[ship.type].maxHealth})`, 'hit');
    }
  }

  // AOE武器的命中判定：範圍內每一格各自獨立判定命中/落空(可能同時打中船身好幾個不同區塊)，
  // 但整個範圍只用「一次」放大版爆炸視覺+一次爆炸音效呈現，不是每格各放一次
  function resolveAoeShot(centerRow, centerCol, screenX, screenY, weaponSpec) {
    const cells = getAoeCells(weaponSpec, centerRow, centerCol);
    const validCells = cells.filter(c => c.row >= 1 && c.row <= MAP_SIZE && c.col >= 1 && c.col <= MAP_SIZE);
    // 爆炸視覺縮放倍率用範圍的最大邊長決定(已經用Node.js驗證過這個算法)：
    // 2x2->2倍、3x2->3倍、2x1->2倍，讓視覺涵蓋範圍大致對應實際命中範圍
    const scale = Math.max(weaponSpec.aoe.w, weaponSpec.aoe.h);

    const hitResults = validCells.map(c => ({ cellInfo: c, hit: findHitCellAndShip(c.row, c.col) }));
    const anyHit = hitResults.some(r => r.hit);

    playExplosionSound(anyHit, weaponSpec.explosionProfile);
    spawnBlast(screenX, screenY, anyHit, scale);

    const centerColLetter = String.fromCharCode(64 + centerCol);
    addLogEntry(`💣 「${weaponSpec.name}」在${centerColLetter}${centerRow}引爆，範圍${weaponSpec.aoe.w}×${weaponSpec.aoe.h}`, anyHit ? 'hit' : 'miss');

    hitResults.forEach(({ cellInfo, hit }) => {
      const cellEl = document.querySelector(`.cell[data-row="${cellInfo.row}"][data-col="${cellInfo.col}"]`);
      const colLetter = String.fromCharCode(64 + cellInfo.col);
      const coord = `${colLetter}${cellInfo.row}`;

      if (!hit) {
        if (cellEl) { cellEl.classList.add('flash-miss'); setTimeout(() => cellEl.classList.remove('flash-miss'), 500); }
        return; // 範圍內沒中的格子不逐一寫日誌，避免洗版，只在最後統整落空訊息
      }
      if (cellEl) { cellEl.classList.add('flash-hit'); setTimeout(() => cellEl.classList.remove('flash-hit'), 500); }

      const { ship, cell } = hit;
      if (ship.health <= 0) {
        addLogEntry(`　└ ${coord}：「${ship.name}」這裡已經是殘骸了`, 'hit');
        return;
      }
      const { actualDmg, effectMsg } = applyZoneHit(ship, cell.zone, weaponSpec.power);
      renderShip(ship);
      updateTurnPanel();
      if (cellEl) {
        const r = cellEl.getBoundingClientRect();
        spawnDamageFloat(r.left + r.width / 2, r.top + r.height / 2, actualDmg);
      }
      if (ship.health <= 0) {
        addLogEntry(`　└ ${coord}：命中「${ship.name}」的${ZONE_LABEL[cell.zone]}，${effectMsg}，血量歸零已被淘汰！`, 'wreck');
      } else {
        addLogEntry(`　└ ${coord}：命中「${ship.name}」的${ZONE_LABEL[cell.zone]}，${effectMsg}，造成${actualDmg}點傷害(剩餘${ship.health}/${SHIP_TYPES[ship.type].maxHealth})`, 'hit');
      }
    });
    if (!anyHit) addLogEntry(`💦 範圍內沒有命中任何目標`, 'miss');
  }

  function spawnBlast(x, y, isHit, scale = 1) {
    const blast = document.createElement('div');
    blast.className = `blast ${isHit ? 'hit' : 'miss'}`;
    blast.style.left = x + 'px';
    blast.style.top = y + 'px';
    blast.style.setProperty('--blast-scale', (isHit ? 9 : 5) * scale); // AOE武器爆炸範圍隨scale放大
    document.body.appendChild(blast);
    requestAnimationFrame(() => blast.classList.add('animate'));
    setTimeout(() => blast.remove(), 600);
  }

  // RPG風格傷害飄字：在命中座標附近跳出紅色數字往上飄再淡出，讓傷害數字更直觀
  function spawnDamageFloat(x, y, amount) {
    const el = document.createElement('div');
    el.className = 'dmg-float';
    el.textContent = `-${amount}`;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('animate'));
    setTimeout(() => el.remove(), 1200);
  }


  function addLogEntry(text, type) {
    const panel = document.getElementById('log-panel');
    const emptyMsg = panel.querySelector('.log-empty');
    if (emptyMsg) emptyMsg.remove();
    const entry = document.createElement('p');
    entry.className = `log-${type}`;
    entry.style.margin = '0';
    entry.textContent = text;
    panel.insertBefore(entry, panel.firstChild); // 新的紀錄插在最上面，最新的最先看到
    // 只保留最近20筆，避免日誌無限長下去
    while (panel.children.length > 20) panel.removeChild(panel.lastChild);
  }

  // ============================================================
  // 回合操作：前進/左轉/右轉，每回合限制3次(ACTIONS_PER_TURN)。
  // 前進跟轉向都要先算出「動作後的船身狀態」、確認整艘船的8個格子都還在
  // 20x20地圖範圍內才真的套用，超出邊界就擋下、不消耗這次操作次數
  // ============================================================
  function playTurnSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.linearRampToValueAtTime(420, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }
  function playBlockedSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  function doShipAction(action) {
    if (actionsLeft <= 0) return;

    let candidate;
    if (action === 'forward') candidate = shipMoveForward(myShip);
    else if (action === 'left') candidate = { ...myShip, heading: TURN_LEFT[myShip.heading] };
    else if (action === 'right') candidate = { ...myShip, heading: TURN_RIGHT[myShip.heading] };

    if (!shipWithinBounds(candidate)) {
      playBlockedSound();
      addLogEntry(`🚫 「${myShip.name}」${action === 'forward' ? '前方是地圖邊界，無法前進' : '這個方向轉向會超出地圖，動作取消'}`, 'miss');
      return; // 超出邊界：不消耗操作次數，讓玩家重新選擇動作
    }

    // 直接修改myShip本身的屬性(myShip跟DEMO_SHIPS[0]是同一個物件參照)，不要整個用新物件
    // 取代myShip變數——不然DEMO_SHIPS陣列裡留著的會是移動前的舊資料，之後命中判定用
    // DEMO_SHIPS查詢船隻位置時就會抓錯地方(這是原本程式碼就有的bug，這次一併修掉)
    myShip.row = candidate.row;
    myShip.col = candidate.col;
    myShip.heading = candidate.heading;
    renderShip(myShip);
    actionsLeft--;
    updateTurnPanel();

    if (action === 'forward') {
      playTurnSound();
      addLogEntry(`⛵ 「${myShip.name}」前進一格`, 'miss');
    } else {
      playTurnSound();
      addLogEntry(`${action === 'left' ? '↺' : '↻'} 「${myShip.name}」${action === 'left' ? '左轉' : '右轉'}，船頭轉向`, 'miss');
    }
  }

  // 修復移動力：花1次移動次數，回復1點移動上限扣減量(不會超過船隻原始設定值)，
  // 已經扣掉的血量不會因此恢復——這只是修好推進系統，不是幫船補血
  function repairMovement() {
    if (actionsLeft <= 0 || myShip.actionPenalty <= 0) return;
    actionsLeft--;
    myShip.actionPenalty = Math.max(0, myShip.actionPenalty - 1);
    updateTurnPanel();
    addLogEntry(`🔧 「${myShip.name}」修復推進系統，移動上限回復1點(目前上限${getMaxActions(myShip)})`, 'miss');
  }
  // 撲滅火勢：花2次移動次數，撲滅船中前中彈引發的火勢，之後就不會再每回合扣血
  function extinguishFire() {
    if (actionsLeft < 2 || !myShip.onFire) return;
    actionsLeft -= 2;
    myShip.onFire = false;
    updateTurnPanel();
    addLogEntry(`🧯 「${myShip.name}」撲滅了船上的火勢`, 'miss');
  }
  // 結束回合：把移動次數補回到目前的最大上限(getMaxActions已經反映船頭/船中後/船尾累積的
  // 戰損扣減)，並且如果還在著火，這時候才觸發「輪到船主自己回合開始」的10%扣血
  function endTurn() {
    if (myShip.onFire) {
      const spec = SHIP_TYPES[myShip.type];
      const fireDmg = Math.round(spec.maxHealth * 0.1); // 每回合扣血量上限的10%(絕對數值，不會隨血量降低而扣越來越少)
      myShip.health = Math.max(0, myShip.health - fireDmg);
      renderShip(myShip);
      addLogEntry(`🔥 「${myShip.name}」火勢持續延燒，損失${fireDmg}點(剩餘${myShip.health}/${spec.maxHealth})`, myShip.health <= 0 ? 'wreck' : 'hit');
    }
    actionsLeft = getMaxActions(myShip);
    updateTurnPanel();
    addLogEntry(`🔄 「${myShip.name}」的新回合開始，移動次數回復到${actionsLeft}`, 'miss');
  }

  function updateTurnPanel() {
    const spec = SHIP_TYPES[myShip.type];
    const health = Math.max(0, myShip.health);
    const healthPct = health / spec.maxHealth;
    document.getElementById('health-num').textContent = health;
    document.getElementById('health-max').textContent = spec.maxHealth;
    const barEl = document.getElementById('health-bar-fill');
    barEl.style.width = `${Math.round(healthPct * 100)}%`;
    const barWrap = barEl.parentElement;
    barWrap.className = 'health-bar' + (healthPct <= 0.25 ? ' low' : healthPct <= 0.75 ? ' mid' : '');

    document.getElementById('actions-left-num').textContent = actionsLeft;
    document.getElementById('max-actions-num').textContent = getMaxActions(myShip);
    document.getElementById('fire-status').style.visibility = myShip.onFire ? 'visible' : 'hidden';
    const noActions = actionsLeft <= 0;
    document.getElementById('btn-forward').disabled = noActions;
    document.getElementById('btn-turn-left').disabled = noActions;
    document.getElementById('btn-turn-right').disabled = noActions;
    document.getElementById('btn-repair').disabled = noActions || myShip.actionPenalty <= 0;
    document.getElementById('btn-extinguish').disabled = actionsLeft < 2 || !myShip.onFire;
    updateWeaponPanel();
  }

  // 武器面板：列出這艘船目前船型可用的所有武器，顯示剩餘次數(不限次數的顯示"無限")，
  // 用完的武器按鈕鎖住不能選；點選武器會切換selectedWeapon，下次開火就用這個武器
  function updateWeaponPanel() {
    const panel = document.getElementById('weapon-panel');
    if (!panel) return;
    const spec = SHIP_TYPES[myShip.type];
    panel.innerHTML = Object.entries(spec.weapons).map(([key, w]) => {
      const left = w.uses === null ? '無限' : `${myShip.weaponUsesLeft[key]}/${w.uses}`;
      const depleted = w.uses !== null && myShip.weaponUsesLeft[key] <= 0;
      const active = selectedWeapon === key;
      return `<button class="weapon-btn ${active ? 'active' : ''}" ${depleted ? 'disabled' : ''} onclick="selectedWeapon='${key}'; updateWeaponPanel();">
        <span class="wname">${w.name}</span>
        <span class="wmeta">威力${w.power}・剩餘${left}</span>
      </button>`;
    }).join('');
  }

  // 動態量測瀏覽器實際可視高度，設成CSS變數給html/body用——比CSS的vh/dvh單位可靠，
  // 因為直接用window.innerHeight(瀏覽器實際回報的可視區域)，不依賴瀏覽器對新版CSS單位
  // (dvh在部分應用程式內嵌瀏覽器，例如Messenger的內嵌瀏覽器，可能不支援)的支援程度。
  // resize事件處理手機網址列顯示/隱藏、螢幕旋轉；visualViewport(如果瀏覽器支援)更精確
  // 處理行動裝置鍵盤彈出等場景
  function setRealViewportHeight() {
    document.documentElement.style.setProperty('--real-vh', window.innerHeight + 'px');
  }
  setRealViewportHeight();
  window.addEventListener('resize', setRealViewportHeight);
  window.addEventListener('orientationchange', () => setTimeout(setRealViewportHeight, 100));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setRealViewportHeight);
  }

  renderGrid();
  updateTurnPanel();
  resizeMapToFit();
  window.addEventListener('resize', resizeMapToFit);
  // ResizeObserver監聽.map-stage本身的尺寸變化，不只是視窗整體resize事件——
  // 側邊欄內容增減、螢幕方向改變等任何影響可用空間的變化都會被捕捉到並重新計算
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => resizeMapToFit());
    const stageEl = document.querySelector('.map-stage');
    if (stageEl) ro.observe(stageEl);
  }

  // ============================================================
  // 多人連線模式：房間 + 選方位 + 選船型(私有、鎖定不能換)。
  // 真正的回合戰鬥邏輯下一輪再實作，這一版先確保連線基礎架構沒問題。
  //
  // 船型選擇是「真正的伺服器端隔離」：寫進navalBattleRooms/{roomId}/privateShips/{uid}
  // 這個子集合，Firestore安全規則限制只有uid等於自己的人才能讀取——這個判斷是在

  // ============================================================
