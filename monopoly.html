<style>
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #fff8e9, transparent 35%), linear-gradient(135deg, #f3dfc0, #dfbf91);

.container { width: min(1180px, 96%); margin: auto; padding: 20px 0 50px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.logo { font-family: Georgia, serif; font-size: 26px; font-weight: 900; }
.subtitle { color: #80664d; font-size: 12px; margin-top: 2px; }
a.back-link { color: #a8324a; text-decoration: none; font-weight: 700; font-size: 13px; }
button { border: 1px solid #d7b991; background: #fffaf1; color: #553a27; padding: 10px 16px; border-radius: 13px; font-weight: 800; cursor: pointer; transition: .2s; font-size: 14px; font-family: inherit; }
button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(80,50,25,.15); }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.primary { color: white; background: #a8324a; border-color: #a8324a; }
.card { background: rgba(255,247,231,.92); border: 1px solid #d5b78c; border-radius: 24px; padding: 16px; box-shadow: 0 20px 50px rgba(80,50,25,.15); margin-bottom: 14px; }
input, select { border: 1px solid #d7b991; background: #fffaf9; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; width: 100%; }
label.field-label { font-size: 12px; color: #8a7159; display: block; margin-bottom: 4px; }

.room-list-item { width: 100%; text-align: left; background: #fffaf2; border: 1px solid #e0c8a5; border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.room-list-item:hover { background: #fdf1de; }
.player-slot { background: #fffaf2; border: 1px solid #e0c8a5; border-radius: 16px; padding: 10px; text-align: center; font-size: 13px; }
.player-slot.ready { background: #dcefd9; border-color: #a9d3a2; }
.player-slot.empty { opacity: .4; background: #f0e3cc; }
.char-pick { border: 2px solid #e0c8a5; border-radius: 16px; padding: 10px; text-align: center; cursor: pointer; background: #fffaf2; font-size: 12px; }
.char-pick.selected { border-color: #a8324a; background: #fbe4e9; }
.char-pick.taken { opacity: .35; cursor: not-allowed; }
.char-pick .char-emoji { font-size: 28px; display: block; margin-bottom: 4px; }

.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 8px; margin-bottom: 12px; }
.player { display: flex; align-items: center; gap: 8px; background: #fffaf2; border: 2px solid #e0c8a5; border-radius: 16px; padding: 9px 11px; }
.player.bankrupt { opacity: .4; text-decoration: line-through; }
.player.current-turn { border-color: #a8324a; box-shadow: 0 0 0 3px rgba(168,50,74,.15); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #f0ddbd; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
.player-name { font-weight: 900; font-size: 13px; }
.player-money { font-weight: 900; color: #a8324a; font-size: 13px; position: relative; }
.board-wrapper { display: flex; justify-content: center; }
.board { width: min(820px, 96vw); aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(11,1fr); grid-template-rows: repeat(11,1fr); gap: 3px; background: #4a3021; padding: 5px; border-radius: 18px; box-shadow: 0 20px 40px rgba(70,40,20,.3), inset 0 0 0 2px #755037; position: relative; }
.cell { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; background: #fffaf0; border-radius: 6px; border: 1px solid #ead6b9; font-weight: 800; font-size: 10.5px; cursor: default; overflow: hidden; padding: 2px; line-height: 1.15; }
.cell .icon { display: block; font-size: 19px; }
.cell.shop { background: #eaf1df; }
.cell.event { background: #f7e2e8; }
.cell.chance { background: #e4edf4; }
.cell.special { background: #f2ddba; }
.cell.corner { background: #f1d49b; font-size: 11px; }
.cell.tax { background: #f5cccc; }
.cell.item-tile { background: #e0d4f5; }
.cell.rest { background: #dcdcdc; }
.cell .owner-mark { position: absolute; top: 1px; right: 2px; font-size: 8px; }
.cell .star-mark { position: absolute; bottom: 10px; left: 2px; font-size: 7px; color: #d4a017; letter-spacing: -1px; }
.cell .owner-color-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; }
/* 棋子改用獨立的絕對定位層蓋在棋盤上面，不再巢狀塞在格子的div裡——這樣JS才能算出
   每一格的實際像素座標，讓棋子用transition一格一格跳過去，而不是瞬間傳送到終點 */
#monopoly-piece-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.board-piece { position: absolute; font-size: 20px; filter: drop-shadow(0 2px 2px rgba(50,30,15,.4)); transition: left .28s ease-in-out, top .28s ease-in-out, transform .28s ease-in-out; transform: translate(-50%, -50%); }
.board-piece.hopping { transform: translate(-50%, -70%) scale(1.15); }
/* 右上角狀態列：模式/回合/目前輪到誰，取代原本擠在棋盤中央的文字 */
#monopoly-status-bar { position: absolute; top: 8px; right: 8px; background: rgba(255,250,241,.95); border: 1px solid #d3ad76; border-radius: 12px; padding: 6px 10px; font-size: 11px; text-align: right; box-shadow: 0 4px 10px rgba(0,0,0,.15); z-index: 25; max-width: 42%; }
#monopoly-status-bar .turn-line { font-weight: 900; color: #a8324a; font-size: 12px; }
.center { position: absolute; top: 20%; left: 20%; width: 60%; height: 60%; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: radial-gradient(circle, #fff9ed 0%, #f4dfba 100%); border: 2px solid #d3ad76; overflow: hidden; }
.game-title-big { font-family: Georgia, serif; font-size: clamp(14px,2.4vw,20px); font-weight: 900; color: #a8324a; opacity: .5; }
.foodstreet-tile { position: absolute; width: 8.6%; aspect-ratio: 1/1; background: #eaf1df; border-radius: 6px; border: 1px solid #ead6b9; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; text-align: center; transform: translate(-50%,-50%); overflow: hidden; }
.foodstreet-tile .icon { font-size: 15px; }

.controls { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.status { text-align: center; margin-top: 10px; font-weight: 800; color: #a8324a; font-size: 14px; min-height: 20px; }
.log { margin-top: 12px; background: #fffaf2; border: 1px solid #dfc7a6; border-radius: 14px; padding: 10px 13px; font-size: 12px; color: #765d47; max-height: 100px; overflow-y: auto; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(40,25,15,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-box { background: #fffaf1; border-radius: 22px; max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; box-shadow: 0 25px 60px rgba(0,0,0,.3); }
.hidden { display: none !important; }
.chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; background: #f0ddbd; margin: 2px; cursor: pointer; }
.chip.active { background: #a8324a; color: white; }
.toast { position: fixed; right: 16px; bottom: 16px; background: #38271c; color: white; padding: 12px 16px; border-radius: 14px; opacity: 0; transition: .25s; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 100; max-width: 320px; }
.item-card { display: flex; justify-content: space-between; align-items: center; background: #fffaf2; border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }
.star-row { color: #d4a017; font-size: 14px; }

@media(max-width: 700px) {
    .cell { font-size: 6px; }
    .cell .icon { font-size: 11px; }
    .game-title-big { font-size: 13px; }
    .player-piece { font-size: 8px; }
}

<div class="container">
    <div class="header">
        <div>
            <div class="logo">🎲 Just Do Eat · 美食大富翁</div>
            <div class="subtitle">吃遍世界・賺遍美食街・成為料理大亨</div>

</div>

<script>
    // ---------------------------------------------------------------
    // Firebase初始化：跟主站(index.html)用同一份設定，共用同一個登入狀態
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
        authDomain: "recipe-synchronization.firebaseapp.com",
        projectId: "recipe-synchronization",
        storageBucket: "recipe-synchronization.firebasestorage.app",
        messagingSenderId: "559668909743",
        appId: "1:559668909743:web:63dc34572b98839479265a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let myDisplayName = null;

    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => showToast('登入失敗：' + err.message));
    }
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.opacity = '1';
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => { toast.style.opacity = '0'; }, 2800);
    }
    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmtMoney(n) {
        const v = Math.round(n || 0);
        return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString();
    }

    auth.onAuthStateChanged(async user => {
        currentUser = user;
        document.getElementById('login-gate').classList.toggle('hidden', !!user);
        if (!user) { document.getElementById('app-root').innerHTML = ''; return; }
        try {
            const doc = await db.collection('userProgress').doc(user.uid).get();
            myDisplayName = (doc.exists && doc.data().nickname) || user.displayName || '玩家';
        } catch (e) { myDisplayName = user.displayName || '玩家'; }
        renderMonopolyLobby();
    });

    // ============================================================

    async function joinMonopolyRoom(roomId, password) {
        try {
            const ref = db.collection('monopolyGameRoomsV2').doc(roomId);
            const doc = await ref.get();
            if (!doc.exists) { showToast('房間不存在，可能剛好被關閉了'); renderMonopolyLobby(); return; }
            const data = doc.data();
            if (data.password !== password) { showToast('密碼錯誤'); return; }
            if (data.status !== 'waiting') { showToast('這個房間已經開始遊戲了，沒辦法中途加入'); return; }
            if (data.members.length >= MAX_MONOPOLY_MEMBERS) { showToast('房間已滿'); return; }
            if (data.memberUids.includes(currentUser.uid)) { enterMonopolyRoom(roomId); return; }
            await ref.update({
                members: firebase.firestore.FieldValue.arrayUnion({ uid: currentUser.uid, name: myDisplayName }),
                memberUids: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
            });
            enterMonopolyRoom(roomId);
        } catch (err) { showToast('加入房間失敗：' + err.message); }
    }

    // ---------- 房間：即時同步 ----------
    function enterMonopolyRoom(roomId) {
        monopolyState.roomId = roomId;
        monopolyState.unsubscribe = db.collection('monopolyGameRoomsV2').doc(roomId).onSnapshot(doc => {
            if (!doc.exists) { showToast('房間已經被關閉'); monopolyCleanup(); renderMonopolyLobby(); return; }
            const data = doc.data();
            monopolyState.myCharId = (data.charSelections || {})[currentUser.uid] || null;
            if (data.status === 'waiting') renderMonopolyWaitingRoom(data);
            else if (data.status === 'playing') renderMonopolyBoard(data);
            else if (data.status === 'gameover') renderMonopolyGameOver(data);
        }, err => console.warn('房間同步失敗', err));
    }
    function renderMonopolyWaitingRoom(data) {
        const isHost = data.hostUid === currentUser.uid;
        const readyUids = data.readyUids || [];
        const charSelections = data.charSelections || {};
        const npcCount = data.members.filter(m => isNpcUid(m.uid)).length;
        // NPC一律視為「已經選好角色、已經準備好」，不需要額外的準備流程——加入NPC的當下
        // 就會直接配好角色、寫進readyUids，這裡的判斷只是保險，即使資料沒同步也不會卡住
        const allPicked = data.members.every(m => isNpcUid(m.uid) || charSelections[m.uid]);
        const allReady = data.members.length >= 2 && data.members.every(m => isNpcUid(m.uid) || readyUids.includes(m.uid));
        const canStart = allPicked && allReady;
        const iAmReady = readyUids.includes(currentUser.uid);

        const slots = Array.from({ length: MAX_MONOPOLY_MEMBERS }, (_, i) => {
            const m = data.members[i];
            if (!m) return `<div class="player-slot empty">空位</div>`;
            const isNpc = isNpcUid(m.uid);
            const ready = isNpc || readyUids.includes(m.uid);
            const charId = charSelections[m.uid];
            const char = CHARACTERS.find(c => c.id === charId);
            const personalityLabel = isNpc && m.personality ? `・${NPC_PERSONALITIES[m.personality].label}` : '';
            const removeBtn = isHost
                ? (isNpc
                    ? `<br><button onclick="event.stopPropagation(); removeMonopolyNpc('${m.uid}')" style="font-size:10px; padding:3px 8px; margin-top:4px; color:#a8324a;">✕移除</button>`
                    : (m.uid !== currentUser.uid ? `<br><button onclick="event.stopPropagation(); kickMonopolyMember('${m.uid}','${escapeHtml(m.name).replace(/'/g, "\\'")}')" style="font-size:10px; padding:3px 8px; margin-top:4px; color:#a8324a;">✕踢除</button>` : ''))
                : '';
            return `<div class="player-slot ${ready ? 'ready' : ''}">${m.uid === data.hostUid ? '👑 ' : (isNpc ? '🤖 ' : '')}${escapeHtml(m.name)}${personalityLabel}<br>${char ? `${char.emoji}${char.name}` : '（未選角色）'}<br>${ready ? '✅已準備' : '⏳準備中'}${removeBtn}</div>`;
        }).join('');

        const charGrid = CHARACTERS.map(c => {
            const takenBy = Object.entries(charSelections).find(([uid, cid]) => cid === c.id && uid !== currentUser.uid);
            const isMine = charSelections[currentUser.uid] === c.id;
            const taken = !!takenBy;
            return `<div class="char-pick ${isMine ? 'selected' : ''} ${taken ? 'taken' : ''}" onclick="${taken ? '' : `pickMonopolyCharacter('${c.id}')`}">
                <span class="char-emoji">${c.emoji}</span>
                <b>${c.name}</b>
                <span style="display:block; color:#8a7159; margin-top:2px;">${c.bonusType}+50%</span>
            </div>`;
        }).join('');

        const modeLabels = { classic: '經典模式(戰到只剩一人)', timed: '限時模式(30分鐘)', quick: '快速模式' };
        document.getElementById('app-root').innerHTML = `
            <div class="card">
                <p style="font-size:12px; color:#8a7159;">房間代碼</p>
                <p style="font-size:22px; font-weight:900; letter-spacing:2px;">${monopolyState.roomId}</p>
                <p style="font-weight:800; font-size:14px; margin:10px 0 6px;">👥 房間成員（${data.members.length}/${MAX_MONOPOLY_MEMBERS}）・至少2人才能開始（含電腦NPC）</p>
                <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:8px;">${slots}</div>
                ${isHost && data.members.length < MAX_MONOPOLY_MEMBERS && npcCount < MAX_NPC_COUNT ? `<button style="width:100%; margin-bottom:8px;" onclick="addMonopolyNpc()">🤖 加入電腦NPC（一人也能玩）</button>` : ''}
                <p style="font-size:12px; color:#8a7159;">${modeLabels[data.mode] || data.mode}${data.weatherEnabled ? '・🌦️天氣系統開啟' : ''}</p>
            </div>
            <div class="card">
                <p style="font-weight:800; font-size:14px; margin-bottom:8px;">選擇角色（每人各自不同，經營對應類型店鋪+50%營收）</p>
                <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">${charGrid}</div>
            </div>
            <div class="card">
                <button class="primary" style="width:100%; margin-bottom:8px;" onclick="toggleMonopolyReady(${!iAmReady})" ${charSelections[currentUser.uid] ? '' : 'disabled'}>${iAmReady ? '取消準備' : '✅ 我準備好了'}</button>
                <button style="width:100%;" onclick="confirmStartMonopolyGame()" ${canStart ? '' : 'disabled'}>${canStart ? '🎲 開始遊戲' : (allPicked ? '等待全部人準備好...' : '等待全部人選好角色...')}</button>
            </div>
            <button style="width:100%;" onclick="leaveMonopolyRoom()">離開房間</button>
        `;

    async function pickMonopolyCharacter(charId) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            const claimed = await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                const charSelections = data.charSelections || {};
                // 確認這個角色沒有被「別人」選走才真的寫入——不能只靠介面上disabled擋，
                // 避免兩人幾乎同時點同一個角色的race condition，讓兩人選到同一個角色
                const takenByOther = Object.entries(charSelections).some(([uid, cid]) => cid === charId && uid !== currentUser.uid);
                if (takenByOther) return false;
                tx.update(ref, { [`charSelections.${currentUser.uid}`]: charId });
                return true;
            });
            if (!claimed) showToast('這個角色剛好被別人選走了，換一個吧');
        } catch (err) { showToast('選擇角色失敗：' + err.message); }
    }
    async function toggleMonopolyReady(ready) {
        try {
            await db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId).update({
                readyUids: ready ? firebase.firestore.FieldValue.arrayUnion(currentUser.uid) : firebase.firestore.FieldValue.arrayRemove(currentUser.uid),
            });
        } catch (err) { console.warn('切換準備狀態失敗', err); }
    }
    async function kickMonopolyMember(uid, name) {
        if (!confirm(`確定要把「${name}」踢出房間嗎？`)) return;
        try {
            const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
            const doc = await ref.get();
            const data = doc.data();
            const members = data.members.filter(m => m.uid !== uid);
            const charSelections = { ...data.charSelections };
            delete charSelections[uid];
            await ref.update({
                members, memberUids: members.map(m => m.uid),
                readyUids: (data.readyUids || []).filter(u => u !== uid),
                charSelections,
            });
        } catch (err) { showToast('踢除失敗：' + err.message); }
    }
    // 加入電腦NPC：隨機分配一個還沒被選走的角色、隨機分配三種個性之一，直接標記為已準備——
    // NPC沒有真人在操作，不需要走「選角色→按準備」這個流程，加入的當下就一次配好
    async function addMonopolyNpc() {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                if (data.members.length >= MAX_MONOPOLY_MEMBERS) return;
                const npcCount = data.members.filter(m => isNpcUid(m.uid)).length;
                if (npcCount >= MAX_NPC_COUNT) return;
                const charSelections = data.charSelections || {};
                const takenCharIds = new Set(Object.values(charSelections));
                const availableChars = CHARACTERS.filter(c => !takenCharIds.has(c.id));
                if (!availableChars.length) return; // 角色都被選光了，加不了新的NPC
                const char = availableChars[Math.floor(Math.random() * availableChars.length)];
                const personalityKeys = Object.keys(NPC_PERSONALITIES);
                const personality = personalityKeys[Math.floor(Math.random() * personalityKeys.length)];
                const npcUid = `npc_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
                const npcName = NPC_NAME_POOL[Math.floor(Math.random() * NPC_NAME_POOL.length)] + `(${NPC_PERSONALITIES[personality].label})`;
                const members = [...data.members, { uid: npcUid, name: npcName, personality }];
                tx.update(ref, {
                    members, memberUids: [...data.memberUids, npcUid],
                    charSelections: { ...charSelections, [npcUid]: char.id },
                    readyUids: firebase.firestore.FieldValue.arrayUnion(npcUid),
                });
            });
        } catch (err) { showToast('加入NPC失敗：' + err.message); }
    }
    async function removeMonopolyNpc(npcUid) {
        try {
            const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
            const doc = await ref.get();
            const data = doc.data();
            const members = data.members.filter(m => m.uid !== npcUid);
            const charSelections = { ...data.charSelections };
            delete charSelections[npcUid];
            await ref.update({
                members, memberUids: members.map(m => m.uid),
                readyUids: (data.readyUids || []).filter(u => u !== npcUid),
                charSelections,
            });
        } catch (err) { showToast('移除NPC失敗：' + err.message); }
    }
    async function leaveMonopolyRoom() {
        try {
            const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
            const doc = await ref.get();
            if (doc.exists) {
                const data = doc.data();
                const members = data.members.filter(m => m.uid !== currentUser.uid);
                if (!members.length || data.hostUid === currentUser.uid) {
                    await ref.delete();
                } else {
                    const charSelections = { ...data.charSelections };
                    delete charSelections[currentUser.uid];
                    await ref.update({ members, memberUids: members.map(m => m.uid), charSelections });
                }
            }
        } catch (err) { console.warn(err); }
        monopolyCleanup();
        renderMonopolyLobby();
    }

    // ============================================================
    // 遊戲開始：初始化棋盤(所有店鋪無主、0星)、玩家狀態(現金/道具/位置)
    // ============================================================
    async function confirmStartMonopolyGame() {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            const claimed = await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                if (!freshDoc.exists || freshDoc.data().status !== 'waiting') return false;
                const d = freshDoc.data();
                const readyUids = d.readyUids || [];
                const charSelections = d.charSelections || {};
                if (d.members.length < 2) return false;
                if (!d.members.every(m => readyUids.includes(m.uid) && charSelections[m.uid])) return false;

                // 快速模式：起點獎金更高、店鋪更便宜、租金更高(用一個全域倍率去調整基本營收即可反映租金)
                const isQuick = d.mode === 'quick';
                const priceMultiplier = isQuick ? 0.8 : 1;
                const revenueMultiplier = isQuick ? 1.3 : 1;
                const startMoney = isQuick ? START_MONEY * 1.2 : START_MONEY;

                const board = BOARD_LAYOUT.map(tileDef => {
                    if (tileDef.type === 'shop') {
                        const shopInfo = SHOP_DATA[tileDef.name];
                        return {
                            ownerUid: null, stars: 0, mortgaged: false,
                            price: Math.round(shopInfo.price * priceMultiplier),
                            revenue: Math.round(shopInfo.revenue * revenueMultiplier),
                            promo: Math.round(shopInfo.promo * priceMultiplier),
                            rentBoostUntilRound: 0, // 網紅推薦事件：租金加成到第幾回合為止
                        };
                    }
                    if (tileDef.type === 'special') {
                        return { ownerUid: null, price: Math.round(SPECIAL_SHOP_PRICE * priceMultiplier), mortgaged: false };
                    }
                    return {};
                });

                const turnOrder = d.members.map(m => m.uid).sort(() => Math.random() - 0.5);
                const players = {};
                d.members.forEach(m => {
                    players[m.uid] = {
                        name: m.name, charId: charSelections[m.uid],
                        position: 0, onBranch: false, pendingBranchEntry: false,
                        money: startMoney, shops: [], items: {},
                        bankrupt: false, doublesCount: 0,
                        isNpc: isNpcUid(m.uid), npcPersonality: m.personality || null,
                    };
                });

                tx.update(ref, {
                    status: 'playing', board, players, turnOrder, currentTurnUid: turnOrder[0],
                    currentRound: 1, lastDiceRoll: null, pendingAction: null, tradeOffers: [],
                    weather: d.weatherEnabled ? WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)].id : null,
                    weatherChangeAtRound: d.weatherEnabled ? (1 + 3 + Math.floor(Math.random() * 3)) : null,
                    activeWorldEffects: {}, // 例如拉麵節效果的到期回合
                    startedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    eventLog: ['🎲 遊戲開始！' + turnOrder.map(uid => players[uid].name).join(' → ')],
                });
                return true;
            });
            if (!claimed) { showToast('還沒全部人準備好、選好角色，或已經被其他成員開始了'); return; }
        } catch (err) { showToast('開始遊戲失敗：' + err.message); }
    }

    // ---------- 移動邏輯：逐步模擬每一步，正確處理美食街分岔跟主圈環繞 ----------
    // 一步一步模擬(不是直接用模數運算)，這樣才能正確處理「美食街支線走完之後要接回
    // 美食街出口繼續走」跟「主圈繞回起點」這兩種不同的環繞規則
    function simulateMove(startPos, startOnBranch, steps) {
        let pos = startPos, onBranch = startOnBranch, passedGo = false;
        const path = []; // 記錄每一步經過的{pos,onBranch}，給前端做一格一格跳的動畫用
        for (let i = 0; i < steps; i++) {
            pos++;
            if (onBranch) {
                if (pos > BOARD_LAYOUT.length - 1) { pos = FOODSTREET_EXIT_INDEX; onBranch = false; }
            } else {
                if (pos >= MAIN_LOOP_SIZE) { pos = 0; passedGo = true; }
            }
            path.push({ pos, onBranch });
        }
        return { pos, onBranch, passedGo, path };
    }
    function getCharacter(charId) { return CHARACTERS.find(c => c.id === charId); }
    function getTileDef(index) { return BOARD_LAYOUT[index]; }

    // ---------- 租金計算：基本營收 × 星級倍率 × 特殊效果(事件加成) × 角色加成 ----------
    function calcShopRent(tileIndex, boardTile, ownerPlayer, currentRound, weather) {
        const tileDef = getTileDef(tileIndex);
        const shopInfo = SHOP_DATA[tileDef.name];
        let rent = boardTile.revenue * STAR_REVENUE_MULTIPLIER[boardTile.stars || 0];
        // 網紅推薦事件：指定店3回合內租金x1.5
        if (boardTile.rentBoostUntilRound && currentRound <= boardTile.rentBoostUntilRound) rent *= 1.5;
        // 天氣效果：依店鋪類型影響營收
        if (weather) {
            const w = WEATHER_TYPES.find(x => x.id === weather);
            if (w && w.affects[shopInfo.type]) rent *= w.affects[shopInfo.type];
        }
        // 角色加成：擁有者經營對應類型店鋪+50%
        const char = getCharacter(ownerPlayer.charId);
        if (char && char.bonusType === shopInfo.type) rent *= CHARACTER_BONUS_MULTIPLIER;
        return Math.round(rent);
    }
    // 特殊店鋪(蔬果市場/肉類交易所/漁會拍賣所/南北乾貨批發)的租金：依同一個人擁有幾間去查表
    function calcSpecialShopRent(ownerUid, board) {
        const ownedCount = SPECIAL_SHOP_NAMES.filter(name => {
            const idx = BOARD_LAYOUT.findIndex(t => t.name === name);
            return board[idx] && board[idx].ownerUid === ownerUid;
        }).length;
        return SPECIAL_SHOP_REVENUE_BY_COUNT[ownedCount] || 0;
    }

    // ---------- 擲骰：支援雙數骰子/遙控骰子道具，處理連續對子、監獄以外的規則(這個規格書沒有監獄機制) ----------
    let pendingDiceOverride = null; // {type:'double'} 或 {type:'remote', value:N}，使用道具後在下一次擲骰時生效
    async function rollMonopolyDice() {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        let d1, d2 = null, isDouble = false;
        if (pendingDiceOverride && pendingDiceOverride.type === 'remote') {
            d1 = pendingDiceOverride.value;
        } else if (pendingDiceOverride && pendingDiceOverride.type === 'double') {
            d1 = 1 + Math.floor(Math.random() * 6);
            d2 = 1 + Math.floor(Math.random() * 6);
            isDouble = d1 === d2;
        } else {
            d1 = 1 + Math.floor(Math.random() * 6);
        }
        const usedOverride = pendingDiceOverride;
        pendingDiceOverride = null;
        const steps = d1 + (d2 || 0);

        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                if (data.currentTurnUid !== currentUser.uid || data.pendingAction) return;
                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                // 確認這一輪還沒擲過骰子，或是連續對子可以再擲一次——不只靠前端按鈕disabled擋，
                // 避免繞過介面重複呼叫，在同一輪裡擲好幾次骰子
                if (data.lastDiceRoll && me.doublesCount <= 0) return;

                if (isDouble) me.doublesCount += 1; else me.doublesCount = 0;

                let startPos = me.position, startOnBranch = me.onBranch || false;
                if (me.pendingBranchEntry) { startPos = MAIN_LOOP_SIZE - 1; startOnBranch = true; me.pendingBranchEntry = false; }
                const moveResult = simulateMove(startPos, startOnBranch, steps);
                let logMsg = `🎲 ${me.name} 擲出 ${d2 ? `${d1}+${d2}` : d1}${usedOverride ? `（使用${ITEM_DEFS[usedOverride.type === 'double' ? 'double_dice' : 'remote_dice'].icon}）` : ''}，移動到「${getTileDef(moveResult.pos).name}」`;
                if (moveResult.passedGo) { me.money += PASS_GO_BONUS; logMsg += `，經過起點獲得 ${fmtMoney(PASS_GO_BONUS)}`; }
                me.position = moveResult.pos;
                me.onBranch = moveResult.onBranch;
                // 恰好「停在」美食街入口(不是路過)，下一輪要走支線
                if (!moveResult.onBranch && moveResult.pos === FOODSTREET_ENTRANCE_INDEX) {
                    me.pendingBranchEntry = true;
                    logMsg += '，下一回合將進入美食街支線';
                }
                players[currentUser.uid] = me;

                const resolution = resolveTileLanding(data, players, me, moveResult.pos, logMsg, currentUser.uid);
                tx.update(ref, {
                    players: resolution.players, board: resolution.board, lastDiceRoll: [d1, d2],
                    pendingAction: resolution.pendingAction,
                    eventLog: firebase.firestore.FieldValue.arrayUnion(...resolution.logs),
                    activeWorldEffects: resolution.activeWorldEffects || data.activeWorldEffects || {},
                    // 記錄這次移動的完整路徑，讓所有裝置(不只是自己這台)都能重播同一段跳格動畫
                    lastMovePath: { uid: currentUser.uid, startPos, startOnBranch, steps: moveResult.path, moveToken: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}` },
                });
            });
        } catch (err) { showToast('擲骰失敗：' + err.message); }
    }
    // ---------- 落地判定：依格子類型決定要做什麼，回傳更新後的players/board/pendingAction ----------
    function resolveTileLanding(data, players, me, pos, firstLogMsg, actingUid) {
        const tileDef = getTileDef(pos);
        const board = [...data.board];
        const logs = [firstLogMsg];
        let pendingAction = null;

        if (tileDef.type === 'shop') {
            const tile = { ...board[pos] };
            if (!tile.ownerUid) {
                pendingAction = { type: 'buy_shop', tileIndex: pos, uid: actingUid };
            } else if (tile.ownerUid === actingUid) {
                // 踩到自己的店：可以選擇宣傳升級(每次踩到才能宣傳一次)
                if ((tile.stars || 0) < 5) pendingAction = { type: 'promote_offer', tileIndex: pos, uid: actingUid };
            } else if (!tile.mortgaged) {
                const owner = { ...players[tile.ownerUid] };
                const rent = calcShopRent(pos, tile, owner, data.currentRound, data.weather);
                // VIP卡可以免除這次租金：先檢查身上有沒有，詢問要不要使用交給待處理動作處理，
                // 這裡先算出應繳金額、留給confirmPayRent流程判斷道具的使用
                pendingAction = { type: 'pay_rent', tileIndex: pos, uid: actingUid, ownerUid: tile.ownerUid, amount: rent };
            }
            board[pos] = tile;
        } else if (tileDef.type === 'special') {
            const tile = { ...board[pos] };
            if (!tile.ownerUid) {
                pendingAction = { type: 'buy_special', tileIndex: pos, uid: actingUid };
            } else if (tile.ownerUid !== actingUid && !tile.mortgaged) {
                const rent = calcSpecialShopRent(tile.ownerUid, board);
                pendingAction = { type: 'pay_rent', tileIndex: pos, uid: actingUid, ownerUid: tile.ownerUid, amount: rent };
            }
        } else if (tileDef.type === 'event') {
            const card = EVENT_CARDS[Math.floor(Math.random() * EVENT_CARDS.length)];
            const result = applyEventOrChance(card, me, board, pos, data, actingUid);
            me.money = result.money;
            logs.push(`🎴 ${card.text}`);
            if (result.needsLuckySalt) pendingAction = { type: 'event_penalty_check', uid: actingUid, amount: result.penaltyAmount, cardText: card.text };
            else if (me.money < 0) pendingAction = { type: 'bankrupt_check', uid: actingUid };
        } else if (tileDef.type === 'chance') {
            const card = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)];
            const result = applyEventOrChance(card, me, board, pos, data, actingUid);
            me.money = result.money;
            logs.push(`🍀 ${card.text}`);
            if (result.grantedItem) logs.push(`🎁 ${me.name} 獲得道具「${ITEM_DEFS[result.grantedItem].icon}${ITEM_DEFS[result.grantedItem].name}」`);
            if (me.money < 0) pendingAction = { type: 'bankrupt_check', uid: actingUid };
        } else if (tileDef.type === 'tax') {
            const totalAssets = calcTotalAssets(me, board);
            const taxAmount = totalAssets > 20000 ? Math.round(totalAssets * 0.05) : 1000;
            me.money -= taxAmount;
            logs.push(`💸 ${me.name} 繳交稅金 ${fmtMoney(taxAmount)}${totalAssets > 20000 ? '（總資產超過$20,000，繳5%）' : ''}`);
            if (me.money < 0) pendingAction = { type: 'bankrupt_check', uid: actingUid };
        } else if (tileDef.type === 'item-tile') {
            const itemKeys = Object.keys(ITEM_DEFS);
            const granted = itemKeys[Math.floor(Math.random() * itemKeys.length)];
            me.items = { ...me.items, [granted]: (me.items[granted] || 0) + 1 };
            logs.push(`🎁 ${me.name} 獲得道具「${ITEM_DEFS[granted].icon}${ITEM_DEFS[granted].name}」`);
        } else if (tileDef.type === 'rest') {
            me.restNextTurn = true;
            me.restJustSet = true; // 標記「這是剛踩到公休格的這一輪」，跟真正該被跳過的下一輪做區分
            logs.push(`💤 ${me.name} 踩到公休一天，下一輪要休息`);
        }
        // foodstreet-in/foodstreet-out/corner 這幾種格子本身沒有額外效果(起點的獎金已經在移動時處理過了)

        players[actingUid] = me;
        return { players, board, pendingAction, logs };
    }
    // 事件/運氣卡效果套用：money變化、特殊效果(移到起點、租金加成、獲得道具等)
    function applyEventOrChance(card, me, board, pos, data, actingUid) {
        let money = me.money;
        let needsLuckySalt = false, penaltyAmount = 0, grantedItem = null;
        if (card.money) {
            if (card.money < 0 && me.items.lucky_salt > 0) {
                needsLuckySalt = true; penaltyAmount = -card.money;
            } else {
                money += card.money;
            }
        }
        if (card.special === 'moveToStart') { me.position = 0; me.onBranch = false; money += PASS_GO_BONUS; }
        if (card.special === 'promoteRentBoost' && me.shops.length) {
            const myShopIdx = me.shops[Math.floor(Math.random() * me.shops.length)];
            board[myShopIdx] = { ...board[myShopIdx], rentBoostUntilRound: (data.currentRound || 1) + 3 };
        }
        if (card.special === 'redcatPenalty') {
            const redcatIdx = BOARD_LAYOUT.findIndex(t => t.name === '紅貓拉麵');
            if (board[redcatIdx] && board[redcatIdx].ownerUid === actingUid) money -= 1000;
        }
        if (card.special === 'grantRandomItem') {
            const itemKeys = Object.keys(ITEM_DEFS);
            grantedItem = itemKeys[Math.floor(Math.random() * itemKeys.length)];
            me.items = { ...me.items, [grantedItem]: (me.items[grantedItem] || 0) + 1 };
        }
        return { money, needsLuckySalt, penaltyAmount, grantedItem };
    }
    // 總資產：現金 + 店鋪估值(用購買價一半概估，跟抵押價值一致) + 道具價值(不列入，道具沒有明確標價) - 負債(此規格書沒有明確的負債欄位，先不列入)
    function calcTotalAssets(player, board) {
        const shopValue = (player.shops || []).reduce((sum, idx) => {
            const tile = board[idx];
            return sum + (tile && tile.price ? Math.round(tile.price / 2) : 0);
        }, 0);
        return player.money + shopValue;
    }

    // ---------- 待處理動作視窗：購買/特殊店鋪購買/宣傳升級/繳租/事件懲罰/破產處理 ----------
    function renderMonopolyPendingAction(data) {
        const action = data.pendingAction;
        const modalEl = document.getElementById('monopoly-action-modal');
        if (!modalEl || !action || action.uid !== currentUser.uid) { if (modalEl) modalEl.innerHTML = ''; return; }
        const me = data.players[currentUser.uid];

        if (action.type === 'buy_shop') {
            const tile = data.board[action.tileIndex];
            const tileDef = getTileDef(action.tileIndex);
            const shopInfo = SHOP_DATA[tileDef.name];
            const hasDeed = me.items.deed_cert > 0;
            modalEl.innerHTML = `
                <div class="modal-backdrop"><div class="modal-box" style="text-align:center;">
                    <p style="font-size:32px;">${SHOP_TYPE_ICON[shopInfo.type]}</p>
                    <p style="font-weight:900; font-size:18px;">${escapeHtml(tileDef.name)}</p>
                    <p style="color:#8a7159; font-size:12px; margin-bottom:6px;">${shopInfo.type}・基本營收 ${fmtMoney(tile.revenue)}</p>
                    <p style="margin:6px 0 14px;">要花 <b style="color:#a8324a;">${fmtMoney(tile.price)}</b> 買下這間店嗎？</p>
                    ${hasDeed ? `<label style="display:flex; align-items:center; gap:6px; justify-content:center; margin-bottom:10px; font-size:13px;"><input type="checkbox" id="use-deed-cert" style="width:auto;"> 使用🎫證明地契免除購買價格</label>` : ''}
                    <div style="display:flex; gap:8px;">
                        <button class="primary" style="flex:1;" onclick="resolveMonopolyBuyShop(true)">購買</button>
                        <button style="flex:1;" onclick="resolveMonopolyBuyShop(false)">不買</button>
                    </div>
                    ${me.money < tile.price && !hasDeed ? `<p style="font-size:11px; color:#a8324a; margin-top:8px;">餘額不足</p>` : ''}
                </div></div>`;
        } else if (action.type === 'buy_special') {
            const tile = data.board[action.tileIndex];
            const tileDef = getTileDef(action.tileIndex);
            modalEl.innerHTML = `
                <div class="modal-backdrop"><div class="modal-box" style="text-align:center;">
                    <p style="font-size:32px;">${tileDef.icon}</p>
                    <p style="font-weight:900; font-size:18px;">${escapeHtml(tileDef.name)}</p>
                    <p style="color:#8a7159; font-size:12px; margin-bottom:6px;">特殊店鋪(不能宣傳升級)，擁有越多間，其他玩家踩到時的租金越高</p>
                    <p style="margin:6px 0 14px;">要花 <b style="color:#a8324a;">${fmtMoney(tile.price)}</b> 買下嗎？</p>
                    <div style="display:flex; gap:8px;">
                        <button class="primary" style="flex:1;" onclick="resolveMonopolyBuySpecial(true)" ${me.money < tile.price ? 'disabled' : ''}>購買</button>
                        <button style="flex:1;" onclick="resolveMonopolyBuySpecial(false)">不買</button>
                    </div>
                </div></div>`;
        } else if (action.type === 'promote_offer') {
            const tile = data.board[action.tileIndex];
            const tileDef = getTileDef(action.tileIndex);
            const nextStar = (tile.stars || 0) + 1;
            const cost = Math.round(tile.promo * STAR_PROMO_COST_MULTIPLIER[nextStar]);
            modalEl.innerHTML = `
                <div class="modal-backdrop"><div class="modal-box" style="text-align:center;">
                    <p style="font-weight:900; font-size:18px;">${escapeHtml(tileDef.name)}</p>
                    <p class="star-row" style="margin:6px 0;">${'⭐'.repeat(tile.stars || 0)}${'☆'.repeat(5 - (tile.stars || 0))}</p>
                    <p style="margin:6px 0 14px;">要花 <b style="color:#a8324a;">${fmtMoney(cost)}</b> 宣傳升到 ${nextStar} 星嗎？（每踩到一次才能宣傳一次）</p>
                    <div style="display:flex; gap:8px;">
                        <button class="primary" style="flex:1;" onclick="resolveMonopolyPromote(true)" ${me.money < cost ? 'disabled' : ''}>宣傳升級</button>

    async function resolveMonopolyBuyShop(buy) {
        const useDeed = document.getElementById('use-deed-cert')?.checked;
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                if (!data.pendingAction || data.pendingAction.uid !== currentUser.uid || data.pendingAction.type !== 'buy_shop') return;
                const tileIndex = data.pendingAction.tileIndex;
                const board = [...data.board];
                const tile = { ...board[tileIndex] };
                const tileDef = getTileDef(tileIndex);
                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                let log;
                const price = useDeed && me.items.deed_cert > 0 ? 0 : tile.price;
                if (buy && me.money >= price) {
                    me.money -= price;
                    if (useDeed && me.items.deed_cert > 0) me.items = { ...me.items, deed_cert: me.items.deed_cert - 1 };
                    tile.ownerUid = currentUser.uid;
                    me.shops = [...me.shops, tileIndex];
                    log = `🏪 ${me.name} 買下了「${tileDef.name}」${useDeed ? '(使用證明地契免費取得)' : ''}`;
                } else {
                    log = `🙅 ${me.name} 沒有買下「${tileDef.name}」`;
                }
                board[tileIndex] = tile;
                players[currentUser.uid] = me;
                tx.update(ref, { board, players, pendingAction: null, eventLog: firebase.firestore.FieldValue.arrayUnion(log) });
            });
        } catch (err) { showToast('操作失敗：' + err.message); }
    }

                const tileDef = getTileDef(tileIndex);
                const players = { ...data.players };

    async function resolveMonopolyPayRent(useVip) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);

                const { tileIndex, ownerUid, amount } = data.pendingAction;
                const tileDef = getTileDef(tileIndex);
                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                let log, nextPending = null;
                if (useVip && me.items.vip_card > 0) {

    async function mortgageMonopolyShop(tileIndex) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                const board = [...data.board];
                const tile = { ...board[tileIndex] };
                if (tile.ownerUid !== currentUser.uid || tile.mortgaged) return;
                const tileDef = getTileDef(tileIndex);
                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                const value = Math.round(tile.price / 2);
                me.money += value;
                tile.mortgaged = true;
                if (tile.stars !== undefined) tile.stars = 0; // 抵押的店鋪星級歸零(重新贖回後要重新宣傳)
                board[tileIndex] = tile;
                players[currentUser.uid] = me;
                const stillOwes = me.money < 0;
                tx.update(ref, {
                    board, players, pendingAction: stillOwes ? data.pendingAction : null,
                    eventLog: firebase.firestore.FieldValue.arrayUnion(`🏚️ ${me.name} 抵押了「${tileDef.name}」換得 ${fmtMoney(value)}`),
                });
            });
        } catch (err) { showToast('抵押失敗：' + err.message); }
    }

    async function declareMonopolyBankrupt() {
        if (!confirm('確定要宣告破產嗎？這個動作沒辦法復原')) return;
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                const board = [...data.board];
                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                // 規格書：欠其他玩家的話剩餘資產移交債權人，欠銀行(踩到事件/稅務等非玩家對象)則資產回銀行重新拍賣。
                // 這裡簡化判斷：如果pendingAction有指定ownerUid(欠玩家)，店鋪轉移給該玩家；否則店鋪釋出回銀行(變回無主)
                const creditorUid = data.pendingAction && data.pendingAction.ownerUid;
                (me.shops || []).forEach(idx => {
                    if (creditorUid && players[creditorUid]) {
                        board[idx] = { ...board[idx], ownerUid: creditorUid, mortgaged: false };
                        players[creditorUid] = { ...players[creditorUid], shops: [...players[creditorUid].shops, idx] };
                    } else {
                        board[idx] = { ...board[idx], ownerUid: null, stars: 0, mortgaged: false };
                    }
                });
                me.bankrupt = true; me.shops = []; me.money = 0;
                players[currentUser.uid] = me;
                const remainingActive = data.turnOrder.filter(uid => !players[uid].bankrupt);
                const updates = { board, players, pendingAction: null, eventLog: firebase.firestore.FieldValue.arrayUnion(`💔 ${me.name} 宣告破產，退出遊戲！`) };
                if (data.mode !== 'timed' && remainingActive.length <= 1) updates.status = 'gameover';
                tx.update(ref, updates);
            });
        } catch (err) { showToast('操作失敗：' + err.message); }
    }

    // ---------- 棋盤畫面渲染 ----------
    // 把49格的一維棋盤索引，換算成11x11 CSS Grid的座標，外圈走一圈剛好放得下40+9格
    // (11x11外圈總共40格，跟主圈格數剛好一樣；美食街支線9格另外画在旁邊獨立的一小條，
    // 不擠進主圈的外圈裡，避免主圈格子被切斷)
    function computeMainLoopGridPositions() {
        const positions = [];
        const n = 11; // 11x11
        for (let i = 0; i < MAIN_LOOP_SIZE; i++) {
            if (i <= 10) positions.push({ col: i + 1, row: 1 });
            else if (i <= 20) positions.push({ col: 11, row: i - 10 + 1 });
            else if (i <= 30) positions.push({ col: 11 - (i - 20), row: 11 });
            else positions.push({ col: 1, row: 11 - (i - 30) });
        }
        return positions;
    }
    function computeFoodstreetDiagonalPositions() {
        // 美食街入口在(col11,row1)、出口在(col1,row11)，9個支線格子沿著兩點之間的
        // 反對角線排列，座標從(10,2)到(2,10)，用百分比換算成絕對定位(11宮格每格約9.09%寬)
        const positions = [];
        for (let i = 0; i < FOODSTREET_BRANCH.length; i++) {
            const col = 10 - i, row = 2 + i;
            positions.push({ leftPct: (col - 0.5) / 11 * 100, topPct: (row - 0.5) / 11 * 100 });
        }
        return positions;
    }
    function tileCellPixelCenter(tileIndex, gridPositions, foodstreetPositions, boardEl) {
        const rect = boardEl.getBoundingClientRect();
        if (tileIndex < MAIN_LOOP_SIZE) {
            const p = gridPositions[tileIndex];
            const cellW = rect.width / 11, cellH = rect.height / 11;
            return { x: (p.col - 0.5) * cellW, y: (p.row - 0.5) * cellH };
        }
        const p = foodstreetPositions[tileIndex - MAIN_LOOP_SIZE];
        return { x: rect.width * p.leftPct / 100, y: rect.height * p.topPct / 100 };
    }
    let lastRenderedMoney = {}; // 記錄每個玩家上次渲染時的金額，用來偵測變化、跳出加減錢的飄字
    let lastAnimatedMoveToken = null; // 記錄上次已經播放過動畫的移動token，避免同一段移動被重複播放

                <div class="log">${(data.eventLog || []).slice(-8).reverse().map(e => `<div>${escapeHtml(e)}</div>`).join('')}</div>

            <div id="monopoly-side-modal"></div>
        `;
        if (isMyTurn && data.pendingAction) renderMonopolyPendingAction(data);

        requestAnimationFrame(() => renderAndAnimatePieces(data, gridPositions, foodstreetPositions));
        // 金額變化飄字：比對這次跟上次渲染的金額差異
        data.turnOrder.forEach(uid => {
            const p = data.players[uid];

    function renderTileCellHtml(tileDef, tile, icon, data, gridPos) {

    // ---------- 棋子動畫：獨立絕對定位層，一格一格跳過去，模擬「拿起來再放下去」的感覺 ----------
    function renderAndAnimatePieces(data, gridPositions, foodstreetPositions) {
        const boardEl = document.getElementById('monopoly-board-el');
        const layerEl = document.getElementById('monopoly-piece-layer');
        if (!boardEl || !layerEl) return;

        const movePath = data.lastMovePath;
        const shouldAnimateThisMove = movePath && movePath.moveToken !== lastAnimatedMoveToken;

        data.turnOrder.forEach(uid => {
            const p = data.players[uid];
            if (p.bankrupt) { const el = document.getElementById(`piece-${uid}`); if (el) el.remove(); return; }
            const char = getCharacter(p.charId);
            let pieceEl = document.getElementById(`piece-${uid}`);
            if (!pieceEl) {
                pieceEl = document.createElement('div');
                pieceEl.id = `piece-${uid}`;
                pieceEl.className = 'board-piece';
                pieceEl.textContent = char ? char.emoji : '👤';
                layerEl.appendChild(pieceEl);
            }
            const tileIdx = p.onBranch ? MAIN_LOOP_SIZE + Math.max(0, p.position - MAIN_LOOP_SIZE) : p.position;

            if (shouldAnimateThisMove && movePath.uid === uid) {
                // 這個玩家剛好是這次移動的主角：沿著完整路徑一格一格跳過去
                animatePieceAlongPath(pieceEl, movePath, gridPositions, foodstreetPositions, boardEl);
            } else if (!piecePositionsInitialized) {
                // 第一次進畫面：直接定位，不要從起點瞬間跳過來一次造成誤導的動畫
                const center = tileCellPixelCenter(tileIdx, gridPositions, foodstreetPositions, boardEl);
                pieceEl.style.left = center.x + 'px';
                pieceEl.style.top = center.y + 'px';
            } else if (movePath && movePath.uid !== uid) {
                // 不是這次移動的主角，維持原地不動(避免因為其他人移動觸發重繪，自己的棋子跟著誤動)
                const center = tileCellPixelCenter(tileIdx, gridPositions, foodstreetPositions, boardEl);
                pieceEl.style.left = center.x + 'px';
                pieceEl.style.top = center.y + 'px';
            }
        });
        piecePositionsInitialized = true;
        if (shouldAnimateThisMove) lastAnimatedMoveToken = movePath.moveToken;
    }
    function animatePieceAlongPath(pieceEl, movePath, gridPositions, foodstreetPositions, boardEl) {
        const startIdx = movePath.startOnBranch ? MAIN_LOOP_SIZE + Math.max(0, movePath.startPos - MAIN_LOOP_SIZE) : movePath.startPos;
        const startCenter = tileCellPixelCenter(movePath.startPos, gridPositions, foodstreetPositions, boardEl);
        pieceEl.style.transition = 'none';
        pieceEl.style.left = startCenter.x + 'px';
        pieceEl.style.top = startCenter.y + 'px';
        // 強制瀏覽器先套用起點位置，下一輪事件循環才開始動畫，不然transition:none會被忽略
        requestAnimationFrame(() => {
            pieceEl.style.transition = '';
            let i = 0;
            function hop() {
                if (i >= movePath.steps.length) return;
                const step = movePath.steps[i];
                const center = tileCellPixelCenter(step.pos, gridPositions, foodstreetPositions, boardEl);
                pieceEl.classList.add('hopping');
                pieceEl.style.left = center.x + 'px';
                pieceEl.style.top = center.y + 'px';
                setTimeout(() => pieceEl.classList.remove('hopping'), 140);
                i++;
                setTimeout(hop, 180);
            }
            hop();
        });
    }

    // ---------- 催促功能：跟KTV掌聲鼓勵同一套模式，寫一筆事件到房間子集合，對方監聽到跳動畫提醒 ----------
    async function sendMonopolyUrge() {
        try {
            await db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId).collection('urges').add({
                fromUid: currentUser.uid, fromName: myDisplayName, createdAt: firebase.firestore.FieldValue.serverTimestamp(),

    let monopolyUrgeUnsubscribe = null;
    let lastSeenUrgeAt = 0;
    let currentTurnUidLive = null; // 持續更新的「目前輪到誰」，每次renderMonopolyBoard都會更新，不是訂閱當下就固定住的舊資料
    function listenForMonopolyUrge(data) {
        currentTurnUidLive = data.currentTurnUid;
        if (monopolyUrgeUnsubscribe) return; // 監聽本身只需要訂閱一次，不用每次渲染都重新訂閱
        monopolyUrgeUnsubscribe = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId).collection('urges')
            .orderBy('createdAt', 'desc').limit(1)
            .onSnapshot(snap => {
                if (snap.empty) return;
                const doc = snap.docs[0];
                const urgeData = doc.data();
                // 只有「現在真的輪到我」的那個人才會看到催促動畫，不是任何非發送者都看得到——
                // 用currentTurnUidLive這個持續更新的變數判斷，不是訂閱當下就固定住的舊資料
                if (urgeData.fromUid === currentUser.uid || currentTurnUidLive !== currentUser.uid) return;
                const createdMs = urgeData.createdAt && urgeData.createdAt.toMillis ? urgeData.createdAt.toMillis() : Date.now();
                if (createdMs <= lastSeenUrgeAt) return;
                lastSeenUrgeAt = createdMs;
                playMonopolyUrgeAnimation(urgeData.fromName);
            }, err => console.warn('催促監聽失敗', err));

    async function sendMonopolyTradeOffer() {
        const targetUid = document.getElementById('trade-target-uid').value;

    function renderPendingTradeOffers(data) {

        if (!incoming.length) return '';
        return incoming.map(t => {

            const giveShopNames = t.giveShops.map(i => getTileDef(i).name).join('、') || '無';
            const wantShopNames = t.wantShops.map(i => getTileDef(i).name).join('、') || '無';
            return `<div class="card" style="border-color:#a8324a;">
                <p style="font-weight:800; margin-bottom:6px;">🤝 ${escapeHtml(initiator.name)} 提出交易</p>
                <p style="font-size:12px;">對方給你：現金 ${fmtMoney(t.giveCash)}・店鋪：${escapeHtml(giveShopNames)}</p>

    async function respondMonopolyTrade(offerId, accept) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                const offers = [...(data.tradeOffers || [])];
                const offerIdx = offers.findIndex(t => t.id === offerId);
                if (offerIdx < 0 || offers[offerIdx].status !== 'pending') return;
                const offer = offers[offerIdx];
                const board = [...data.board];
                const players = { ...data.players };
                const initiator = { ...players[offer.initiatorUid] };
                const target = { ...players[offer.targetUid] };
                let log;
                if (accept && initiator.money >= offer.giveCash && target.money >= offer.wantCash) {
                    initiator.money = initiator.money - offer.giveCash + offer.wantCash;
                    target.money = target.money - offer.wantCash + offer.giveCash;
                    offer.giveShops.forEach(idx => {
                        board[idx] = { ...board[idx], ownerUid: offer.targetUid };
                        initiator.shops = initiator.shops.filter(i => i !== idx);
                        target.shops = [...target.shops, idx];
                    });
                    offer.wantShops.forEach(idx => {
                        board[idx] = { ...board[idx], ownerUid: offer.initiatorUid };
                        target.shops = target.shops.filter(i => i !== idx);
                        initiator.shops = [...initiator.shops, idx];
                    });
                    offers[offerIdx] = { ...offer, status: 'accepted' };
                    log = `🤝 ${initiator.name} 和 ${target.name} 完成了一筆交易`;
                } else {
                    offers[offerIdx] = { ...offer, status: 'rejected' };
                    log = `🙅 ${target.name} 拒絕了 ${initiator.name} 的交易提案`;
                }
                players[offer.initiatorUid] = initiator;
                players[offer.targetUid] = target;
                tx.update(ref, { board, players, tradeOffers: offers, eventLog: firebase.firestore.FieldValue.arrayUnion(log) });
            });
        } catch (err) { showToast('回應交易失敗：' + err.message); }
    }

    // ---------- 結束回合：換下一位，連續對子(限用雙數骰子道具時才會發生)可以再擲一次，公休者自動跳過 ----------
    async function endMonopolyTurn() {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
