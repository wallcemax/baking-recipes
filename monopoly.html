                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                if (me.restJustSet) {
                    // 這是剛踩到公休格、正常結束這一輪——不能在這裡就清掉restNextTurn，
                    // 不然「下一輪要休息」的效果會直接被吃掉，永遠不會真的跳過任何一輪
                    me.restJustSet = false;
                    players[currentUser.uid] = me;
                    tx.update(ref, { players });
                } else if (me.restNextTurn) {
                    // 真正輪到要跳過的這一輪：清掉restNextTurn，代表懲罰已經生效過了
                    me.restNextTurn = false;
                    players[currentUser.uid] = me;
                    tx.update(ref, { players });
                } else if (me.doublesCount > 0) {
                    // 剛才擲出對子(只有用雙數骰子道具才可能發生)，同一個人可以再擲一次，不換人
                    tx.update(ref, { lastDiceRoll: null });
                    return;
                }
                const activeOrder = data.turnOrder.filter(uid => !players[uid].bankrupt);
                const curIdxInActive = activeOrder.indexOf(currentUser.uid);
                const nextUid = activeOrder[(curIdxInActive + 1) % activeOrder.length];
                const isNewRound = (curIdxInActive + 1) >= activeOrder.length;
                const updates = { currentTurnUid: nextUid, lastDiceRoll: null, pendingAction: null, players };
                if (isNewRound) {
                    const newRound = data.currentRound + 1;
                    updates.currentRound = newRound;
                    // 限時模式的結束判斷交給前端計時器(startedAt+30分鐘)另外處理，這裡只處理經典模式沒有回合上限
                }
                tx.update(ref, updates);
            });
        } catch (err) { showToast('操作失敗：' + err.message); }
    }
    async function confirmMonopolySurrender() {
        if (!confirm('確定要投降嗎？這個動作沒辦法復原，確定要離開這場遊戲嗎？')) return;
        if (!confirm('再次確認：真的要投降嗎？')) return;
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                const board = [...data.board];
                const players = { ...data.players };
                const me = { ...players[currentUser.uid] };
                (me.shops || []).forEach(idx => { board[idx] = { ...board[idx], ownerUid: null, stars: 0, mortgaged: false }; });
                me.bankrupt = true; me.shops = [];
                players[currentUser.uid] = me;
                const remainingActive = data.turnOrder.filter(uid => !players[uid].bankrupt);
                const updates = { board, players, eventLog: firebase.firestore.FieldValue.arrayUnion(`🏳 ${me.name} 投降了`) };
                if (data.currentTurnUid === currentUser.uid) {
                    const curIdxInActive = data.turnOrder.filter(uid => !players[uid].bankrupt || uid === currentUser.uid).indexOf(currentUser.uid);
                    const nextUid = remainingActive[curIdxInActive % remainingActive.length] || remainingActive[0];
                    if (nextUid) { updates.currentTurnUid = nextUid; updates.lastDiceRoll = null; updates.pendingAction = null; }
                }
                if (data.mode !== 'timed' && remainingActive.length <= 1) updates.status = 'gameover';
                tx.update(ref, updates);
            });
        } catch (err) { showToast('投降失敗：' + err.message); }
    }

    // ---------- 天氣變化：每3-5回合換一次(只有開啟天氣系統的房間才會執行) ----------
    let weatherCheckInFlight = false;
    async function checkWeatherChange(data) {
        if (!data.weatherChangeAtRound || data.currentRound < data.weatherChangeAtRound || weatherCheckInFlight) return;
        if (data.turnOrder[0] !== currentUser.uid) return; // 只讓房間裡turnOrder排第一位的人負責觸發，避免大家都搶著寫
        weatherCheckInFlight = true;
        try {
            const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const d = freshDoc.data();
                if (d.currentRound < d.weatherChangeAtRound) return;
                const newWeather = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)];
                tx.update(ref, {
                    weather: newWeather.id, weatherChangeAtRound: d.currentRound + 3 + Math.floor(Math.random() * 3),
                    eventLog: firebase.firestore.FieldValue.arrayUnion(`${newWeather.icon} 天氣變成了「${newWeather.name}」`),
                });
            });
        } catch (err) { console.warn('天氣變化失敗', err); }
        weatherCheckInFlight = false;
    }
    // ---------- 隨機世界事件：每5回合觸發一次 ----------
    let worldEventCheckInFlight = false;
    async function checkAndTriggerWorldEvents(data) {
        if (data.currentRound % 5 !== 0 || data.lastWorldEventRound === data.currentRound || worldEventCheckInFlight) return;
        if (data.turnOrder[0] !== currentUser.uid) return; // 同樣只讓排第一位的人觸發，避免重複
        worldEventCheckInFlight = true;
        try {
            const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const d = freshDoc.data();
                if (d.currentRound % 5 !== 0 || d.lastWorldEventRound === d.currentRound) return;
                const event = WORLD_EVENTS[Math.floor(Math.random() * WORLD_EVENTS.length)];
                const board = [...d.board];
                const players = { ...d.players };
                const logs = [`🌍 世界事件：${event.text}`];

                if (event.special === 'regionalStorm' || event.special === 'globalStorm') {
                    // 依規格書：擁有者要付「所有地5%總和」的修繕費——這裡簡化成每個人自己名下所有店鋪估值5%
                    d.turnOrder.forEach(uid => {
                        const p = { ...players[uid] };
                        if (p.bankrupt) return;
                        const shopValueSum = (p.shops || []).reduce((sum, idx) => sum + (board[idx].price || 0), 0);
                        const fee = Math.round(shopValueSum * 0.05);
                        if (fee > 0) { p.money -= fee; logs.push(`🔧 ${p.name} 支付修繕費 ${fmtMoney(fee)}`); }
                        players[uid] = p;
                    });
                } else if (event.special === 'starBoost') {
                    const candidates = [];
                    BOARD_LAYOUT.forEach((t, idx) => { if (t.type === 'shop' && board[idx].ownerUid && (board[idx].stars || 0) < 5) candidates.push(idx); });
                    if (candidates.length) {
                        const pick = candidates[Math.floor(Math.random() * candidates.length)];
                        board[pick] = { ...board[pick], stars: (board[pick].stars || 0) + 1 };
                        logs.push(`⭐ 「${getTileDef(pick).name}」獲得+1星！`);
                    }
                } else if (event.special === 'ramenFestival') {
                    BOARD_LAYOUT.forEach((t, idx) => {
                        if (t.type === 'shop' && SHOP_DATA[t.name].type === '拉麵店') {
                            board[idx] = { ...board[idx], rentBoostUntilRound: d.currentRound + 2 };
                        }
                    });
                }
                tx.update(ref, { board, players, lastWorldEventRound: d.currentRound, eventLog: firebase.firestore.FieldValue.arrayUnion(...logs) });
            });
        } catch (err) { console.warn('世界事件觸發失敗', err); }
        worldEventCheckInFlight = false;
    }

    // ---------- 遊戲結束：經典模式(只剩一人)或限時模式(30分鐘到)，依總資產排名 ----------
    let monopolyGameOverScoreSaved = false;
    function renderMonopolyGameOver(data) {
        const results = data.turnOrder.map(uid => {
            const p = data.players[uid];
            return { uid, name: p.name, total: calcTotalAssets(p, data.board), bankrupt: p.bankrupt };
        }).sort((a, b) => b.total - a.total);
        const isHost = data.hostUid === currentUser.uid;
        if (isHost && !monopolyGameOverScoreSaved) {
            monopolyGameOverScoreSaved = true;
            results.forEach(r => {
                if (r.bankrupt || isNpcUid(r.uid)) return; // NPC的分數不存進真人排行榜(而且NPC假uid本來就過不了gameScores規則的userId==auth.uid檢查)
                db.collection('gameScores').add({ gameId: 'monopoly', userId: r.uid, userName: r.name, score: Math.max(0, r.total), createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
            });
        }
        const rows = results.map((r, i) => {
            const medal = i === 0 ? '🏆' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
            return `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-radius:16px; margin-bottom:8px; background:${i === 0 ? '#a8324a' : '#fffaf2'}; color:${i === 0 ? 'white' : ''};">
                <span style="font-weight:800;">${medal} ${escapeHtml(r.name)}${r.bankrupt ? '（已破產）' : ''}${i === 0 ? '（料理大亨！）' : ''}</span>
                <span style="font-weight:900; font-size:18px;">${fmtMoney(r.total)}</span>
            </div>`;
        }).join('');
        document.getElementById('app-root').innerHTML = `
            <div class="card" style="text-align:center;">
                <p style="font-size:36px; margin-bottom:6px;">🎉</p>
                <p style="font-family:Georgia,serif; font-weight:900; font-size:20px;">遊戲結束！</p>
            </div>
            <div class="card">${rows}</div>
            <div style="display:flex; gap:8px;">
                ${isHost ? `<button class="primary" style="flex:1;" onclick="backToMonopolyWaitingRoom()">🔄 再玩一場</button>` : ''}
                <button style="flex:1;" onclick="leaveMonopolyRoom()">離開房間</button>
            </div>
        `;
    }
    async function backToMonopolyWaitingRoom() {
        monopolyGameOverScoreSaved = false;
        try {
            await db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId).update({
                status: 'waiting', readyUids: [], board: null, players: null, turnOrder: null, currentTurnUid: null, eventLog: [],
            });
        } catch (err) { showToast('重設房間失敗：' + err.message); }
    }

    // ---------- 限時模式：30分鐘計時，時間到自動結算(由turnOrder[0]負責觸發，避免大家搶著寫) ----------
    let timedModeCheckInFlight = false;
    setInterval(async () => {
        if (!monopolyState.roomId || timedModeCheckInFlight) return;
        try {
            const doc = await db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId).get();
            const data = doc.data();
            if (!data || data.status !== 'playing' || data.mode !== 'timed' || !data.startedAt) return;
            if (data.turnOrder[0] !== currentUser.uid) return;
            const elapsedMs = Date.now() - data.startedAt.toMillis();
            if (elapsedMs < 30 * 60 * 1000) return;
            timedModeCheckInFlight = true;
            await db.runTransaction(async (tx) => {
                const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
                const freshDoc = await tx.get(ref);
                const d = freshDoc.data();
                if (!d || d.status !== 'playing') return;
                tx.update(ref, { status: 'gameover' });
            });
            timedModeCheckInFlight = false;
        } catch (err) { timedModeCheckInFlight = false; }
    }, 15000); // 每15秒檢查一次時間到了沒

    // ---------- 遊戲模式說明視窗：遊戲進行中隨時可以點右上角ℹ️查看目前模式的完整規則 ----------
    const MODE_INFO_TEXT = {
        classic: '經典模式：沒有回合上限，一直玩到只剩一位玩家沒有破產為止。破產的人會退出遊戲、店鋪釋出或轉移給債權人，最後存活的那位就是贏家。',
        timed: '限時模式：從遊戲開始算起30分鐘後自動結算，依「現金+店鋪估值」的總資產排名，最高的獲勝。時間到了不管當時是誰的回合都會直接結算，記得把握時間佈局。',
        quick: '快速模式：起點獎金比經典模式多20%、店鋪購買價格打8折、租金(基本營收)提高30%，整體步調更快，適合15-20分鐘的短局。',
    };
    function showMonopolyModeInfo(mode) {
        const modalEl = document.getElementById('monopoly-side-modal');
        if (!modalEl) return;
        modalEl.innerHTML = `
            <div class="modal-backdrop" onclick="if(event.target===this) this.parentElement.innerHTML=''"><div class="modal-box">
                <p style="font-weight:900; font-size:16px; margin-bottom:10px;">ℹ️ 模式規則說明</p>
                <p style="font-size:13px; line-height:1.6;">${MODE_INFO_TEXT[mode] || ''}</p>
                <button style="width:100%; margin-top:12px;" onclick="document.getElementById('monopoly-side-modal').innerHTML=''">關閉</button>
            </div></div>`;
    }

    // ============================================================
    // NPC自動代打：只有房主的裝置會驅動NPC回合(避免多人同時搶著幫同一個NPC行動)。
    // 每次renderMonopolyBoard收到新的房間狀態，都會檢查「現在是不是輪到NPC」，
    // 是的話就跑一段NPC的行動序列(擲骰->處理落地事件->結束回合)，序列跑完後
    // 如果連續對子還輪到同一個NPC，會在下一次render時自然再被觸發一次，
    // 不用寫成複雜的遞迴迴圈
    // ============================================================
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    let npcTurnInProgress = false;
    function maybeRunNpcTurn(data) {
        if (!data || data.hostUid !== currentUser.uid) return; // 只有房主負責驅動NPC回合
        if (npcTurnInProgress) return;
        if (data.status !== 'playing') return;
        const currentPlayer = data.players[data.currentTurnUid];
        if (!currentPlayer || !currentPlayer.isNpc || currentPlayer.bankrupt) return;
        npcTurnInProgress = true;
        runNpcTurnSequence(data.currentTurnUid).catch(err => console.warn('NPC回合執行失敗', err)).finally(() => { npcTurnInProgress = false; });
    }
    async function runNpcTurnSequence(npcUid) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        await sleep(1100); // 給玩家一點時間看清楚換誰的回合，不要瞬間就動作
        let doc = await ref.get();
        let data = doc.data();
        if (!data || data.currentTurnUid !== npcUid || data.status !== 'playing') return;
        const personality = (data.players[npcUid] && data.players[npcUid].npcPersonality) || 'balanced';

        // 保險檢查：理論上NPC自己的回合開始時不該有殘留的pendingAction，但如果有(例如上一動作
        // 觸發了破產判定還沒處理完)，先處理掉
        if (data.pendingAction && data.pendingAction.uid === npcUid) {
            await npcResolvePendingActionLoop(npcUid, personality);
            doc = await ref.get(); data = doc.data();
            if (!data || data.currentTurnUid !== npcUid) return;
        }

        // 擲骰(NPC不主動使用雙數骰子/遙控骰子道具，維持簡單版邏輯)
        if (!data.pendingAction && (!data.lastDiceRoll || (data.players[npcUid].doublesCount || 0) > 0)) {
            await npcRollDice(npcUid);
            await sleep(950);
            doc = await ref.get(); data = doc.data();
            if (!data || data.currentTurnUid !== npcUid) return;
        }

        // 處理擲骰後產生的待處理動作(可能是購買/宣傳/繳租/事件懲罰，繳租或事件懲罰又可能
        // 連帶觸發破產判定，所以用loop版本一路處理到沒有pendingAction為止)
        if (data.pendingAction && data.pendingAction.uid === npcUid) {
            await sleep(700);
            await npcResolvePendingActionLoop(npcUid, personality);
            doc = await ref.get(); data = doc.data();
            if (!data || data.currentTurnUid !== npcUid) return;
        }

        await sleep(600);
        await npcEndTurn(npcUid);
    }
    // 反覆處理pendingAction，直到清空為止(繳租/事件懲罰扣到負數會連帶觸發破產判定，
    // 破產判定裡NPC會先嘗試抵押店鋪，抵押完可能還是不夠、需要再次判斷是否要宣告破產)
    async function npcResolvePendingActionLoop(npcUid, personality) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        for (let guard = 0; guard < 20; guard++) { // guard避免萬一邏輯有誤造成無限迴圈，20次一定夠用
            const doc = await ref.get();
            const data = doc.data();
            if (!data || !data.pendingAction || data.pendingAction.uid !== npcUid) return;
            await npcResolvePendingAction(npcUid, personality, data.pendingAction, data);
            await sleep(600);
        }
    }
    // ---------- NPC擲骰：跟真人版rollMonopolyDice()邏輯一致，但用明確的npcUid而不是currentUser.uid ----------
    async function npcRollDice(npcUid) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        const d1 = 1 + Math.floor(Math.random() * 6);
        const steps = d1;
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                if (data.currentTurnUid !== npcUid || data.pendingAction) return;
                if (data.lastDiceRoll && (data.players[npcUid].doublesCount || 0) <= 0) return;
                const players = { ...data.players };
                const npc = { ...players[npcUid] };
                npc.doublesCount = 0; // NPC簡化版不使用雙數骰子道具，不會有連續對子的情況

                let startPos = npc.position, startOnBranch = npc.onBranch || false;
                if (npc.pendingBranchEntry) { startPos = MAIN_LOOP_SIZE - 1; startOnBranch = true; npc.pendingBranchEntry = false; }
                const moveResult = simulateMove(startPos, startOnBranch, steps);
                let logMsg = `🎲 ${npc.name} 擲出 ${d1}，移動到「${getTileDef(moveResult.pos).name}」`;
                if (moveResult.passedGo) { npc.money += PASS_GO_BONUS; logMsg += `，經過起點獲得 ${fmtMoney(PASS_GO_BONUS)}`; }
                npc.position = moveResult.pos;
                npc.onBranch = moveResult.onBranch;
                if (!moveResult.onBranch && moveResult.pos === FOODSTREET_ENTRANCE_INDEX) {
                    npc.pendingBranchEntry = true;
                    logMsg += '，下一回合將進入美食街支線';
                }
                players[npcUid] = npc;

                const resolution = resolveTileLanding(data, players, npc, moveResult.pos, logMsg, npcUid);
                tx.update(ref, {
                    players: resolution.players, board: resolution.board, lastDiceRoll: [d1, null],
                    pendingAction: resolution.pendingAction,
                    eventLog: firebase.firestore.FieldValue.arrayUnion(...resolution.logs),
                    lastMovePath: { uid: npcUid, startPos, startOnBranch, steps: moveResult.path, moveToken: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}` },
                });
            });
        } catch (err) { console.warn('NPC擲骰失敗', err); }
    }
    // ---------- NPC決策：依個性的現金緩衝門檻決定買不買/升不升級，道具能省則省 ----------
    async function npcResolvePendingAction(npcUid, personality, pendingAction, snapshotData) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        const reserveRatio = NPC_PERSONALITIES[personality].reserveRatio;
        const minReserve = START_MONEY * reserveRatio;

        if (pendingAction.type === 'buy_shop' || pendingAction.type === 'buy_special') {
            try {
                await db.runTransaction(async (tx) => {
                    const freshDoc = await tx.get(ref);
                    const data = freshDoc.data();
                    if (!data.pendingAction || data.pendingAction.uid !== npcUid) return;
                    const tileIndex = data.pendingAction.tileIndex;
                    const board = [...data.board];
                    const tile = { ...board[tileIndex] };
                    const tileDef = getTileDef(tileIndex);
                    const players = { ...data.players };
                    const npc = { ...players[npcUid] };
                    const buy = (npc.money - tile.price) >= minReserve;
                    let log;
                    if (buy) {
                        npc.money -= tile.price;
                        tile.ownerUid = npcUid;
                        npc.shops = [...npc.shops, tileIndex];
                        log = `🏪 ${npc.name} 買下了「${tileDef.name}」`;
                    } else {
                        log = `🙅 ${npc.name} 沒有買下「${tileDef.name}」`;
                    }
                    board[tileIndex] = tile;
                    players[npcUid] = npc;
                    tx.update(ref, { board, players, pendingAction: null, eventLog: firebase.firestore.FieldValue.arrayUnion(log) });
                });
            } catch (err) { console.warn('NPC購買失敗', err); }
        } else if (pendingAction.type === 'promote_offer') {
            try {
                await db.runTransaction(async (tx) => {
                    const freshDoc = await tx.get(ref);
                    const data = freshDoc.data();
                    if (!data.pendingAction || data.pendingAction.uid !== npcUid) return;
                    const tileIndex = data.pendingAction.tileIndex;
                    const board = [...data.board];
                    const tile = { ...board[tileIndex] };
                    const tileDef = getTileDef(tileIndex);
                    const players = { ...data.players };
                    const npc = { ...players[npcUid] };
                    const nextStar = (tile.stars || 0) + 1;
                    const cost = Math.round(tile.promo * STAR_PROMO_COST_MULTIPLIER[nextStar]);
                    let log = null;
                    if ((npc.money - cost) >= minReserve) {
                        npc.money -= cost;
                        tile.stars = nextStar;
                        log = `⭐ ${npc.name} 把「${tileDef.name}」宣傳升到 ${nextStar} 星`;
                    }
                    board[tileIndex] = tile;
                    players[npcUid] = npc;
                    tx.update(ref, { board, players, pendingAction: null, eventLog: log ? firebase.firestore.FieldValue.arrayUnion(log) : data.eventLog });
                });
            } catch (err) { console.warn('NPC宣傳失敗', err); }
        } else if (pendingAction.type === 'pay_rent') {
            try {
                await db.runTransaction(async (tx) => {
                    const freshDoc = await tx.get(ref);
                    const data = freshDoc.data();
                    if (!data.pendingAction || data.pendingAction.uid !== npcUid) return;
                    const { tileIndex, ownerUid, amount } = data.pendingAction;
                    const tileDef = getTileDef(tileIndex);
                    const players = { ...data.players };
                    const npc = { ...players[npcUid] };
                    let log, nextPending = null;
                    if (npc.items.vip_card > 0) {
                        npc.items = { ...npc.items, vip_card: npc.items.vip_card - 1 };
                        log = `🎟️ ${npc.name} 使用VIP卡免除了「${tileDef.name}」的租金`;
                    } else {
                        npc.money -= amount;
                        const owner = { ...players[ownerUid] };
                        owner.money += amount;
                        players[ownerUid] = owner;
                        log = `💸 ${npc.name} 付給 ${owner.name} 租金 ${fmtMoney(amount)}`;
                        if (npc.money < 0) nextPending = { type: 'bankrupt_check', uid: npcUid };
                    }
                    players[npcUid] = npc;
                    tx.update(ref, { players, pendingAction: nextPending, eventLog: firebase.firestore.FieldValue.arrayUnion(log) });
                });
            } catch (err) { console.warn('NPC付租失敗', err); }
        } else if (pendingAction.type === 'event_penalty_check') {
            try {
                await db.runTransaction(async (tx) => {
                    const freshDoc = await tx.get(ref);
                    const data = freshDoc.data();
                    if (!data.pendingAction || data.pendingAction.uid !== npcUid) return;
                    const players = { ...data.players };
                    const npc = { ...players[npcUid] };
                    let log, nextPending = null;
                    if (npc.items.lucky_salt > 0) {
                        npc.items = { ...npc.items, lucky_salt: npc.items.lucky_salt - 1 };
                        log = `🧂 ${npc.name} 使用幸運鹽免除了懲罰`;
                    } else {
                        npc.money -= data.pendingAction.amount;
                        log = `💸 ${npc.name} 支付了 ${fmtMoney(data.pendingAction.amount)}`;
                        if (npc.money < 0) nextPending = { type: 'bankrupt_check', uid: npcUid };
                    }
                    players[npcUid] = npc;
                    tx.update(ref, { players, pendingAction: nextPending, eventLog: firebase.firestore.FieldValue.arrayUnion(log) });
                });
            } catch (err) { console.warn('NPC事件處理失敗', err); }
        } else if (pendingAction.type === 'bankrupt_check') {
            try {
                await db.runTransaction(async (tx) => {
                    const freshDoc = await tx.get(ref);
                    const data = freshDoc.data();
                    if (!data.pendingAction || data.pendingAction.uid !== npcUid || data.pendingAction.type !== 'bankrupt_check') return;
                    const players = { ...data.players };
                    const npc = { ...players[npcUid] };
                    const board = [...data.board];
                    // NPC資金不足：先抵押一間還沒抵押的店鋪換現金，能撐過就撐、撐不過才宣告破產
                    const mortgageable = (npc.shops || []).find(idx => !board[idx].mortgaged);
                    if (mortgageable !== undefined) {
                        const tile = { ...board[mortgageable] };
                        const tileDef = getTileDef(mortgageable);
                        const value = Math.round(tile.price / 2);
                        npc.money += value;
                        tile.mortgaged = true;
                        if (tile.stars !== undefined) tile.stars = 0;
                        board[mortgageable] = tile;
                        players[npcUid] = npc;
                        const stillOwes = npc.money < 0;
                        tx.update(ref, {
                            board, players, pendingAction: stillOwes ? data.pendingAction : null,
                            eventLog: firebase.firestore.FieldValue.arrayUnion(`🏚️ ${npc.name} 抵押了「${tileDef.name}」換得 ${fmtMoney(value)}`),
                        });
                    } else {
                        // 沒有店鋪可以抵押了，只能宣告破產——邏輯跟真人版declareMonopolyBankrupt()一致
                        const creditorUid = data.pendingAction.ownerUid;
                        (npc.shops || []).forEach(idx => {
                            if (creditorUid && players[creditorUid]) {
                                board[idx] = { ...board[idx], ownerUid: creditorUid, mortgaged: false };
                                players[creditorUid] = { ...players[creditorUid], shops: [...players[creditorUid].shops, idx] };
                            } else {
                                board[idx] = { ...board[idx], ownerUid: null, stars: 0, mortgaged: false };
                            }
                        });
                        npc.bankrupt = true; npc.shops = []; npc.money = 0;
                        players[npcUid] = npc;
                        const remainingActive = data.turnOrder.filter(uid => !players[uid].bankrupt);
                        const updates = { board, players, pendingAction: null, eventLog: firebase.firestore.FieldValue.arrayUnion(`💔 ${npc.name} 宣告破產，退出遊戲！`) };
                        if (data.mode !== 'timed' && remainingActive.length <= 1) updates.status = 'gameover';
                        tx.update(ref, updates);
                    }
                });
            } catch (err) { console.warn('NPC破產處理失敗', err); }
        }
    }
    // ---------- NPC結束回合：跟真人版endMonopolyTurn()邏輯一致，但用明確的npcUid ----------
    async function npcEndTurn(npcUid) {
        const ref = db.collection('monopolyGameRoomsV2').doc(monopolyState.roomId);
        try {
            await db.runTransaction(async (tx) => {
                const freshDoc = await tx.get(ref);
                const data = freshDoc.data();
                if (data.currentTurnUid !== npcUid || data.pendingAction) return;
                const players = { ...data.players };
                const npc = { ...players[npcUid] };
                if (npc.restJustSet) {
                    npc.restJustSet = false;
                    players[npcUid] = npc;
                    tx.update(ref, { players });
                    return;
                } else if (npc.restNextTurn) {
                    npc.restNextTurn = false;
                    players[npcUid] = npc;
                    tx.update(ref, { players });
                    return;
                } else if ((npc.doublesCount || 0) > 0) {
                    tx.update(ref, { lastDiceRoll: null });
                    return;
                }
                const activeOrder = data.turnOrder.filter(uid => !players[uid].bankrupt);
                const curIdxInActive = activeOrder.indexOf(npcUid);
                const nextUid = activeOrder[(curIdxInActive + 1) % activeOrder.length];
                const isNewRound = (curIdxInActive + 1) >= activeOrder.length;
                const updates = { currentTurnUid: nextUid, lastDiceRoll: null, pendingAction: null, players };
                if (isNewRound) updates.currentRound = data.currentRound + 1;
                tx.update(ref, updates);
            });
        } catch (err) { console.warn('NPC結束回合失敗', err); }
    }
