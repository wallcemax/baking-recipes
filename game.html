<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎮 遊戲場 - JUST DO EAT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#A8324A">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --cream: #FBF3E7;
            --paper: #FFFDF9;
            --espresso: #3A2A1E;
            --espresso-soft: #6B5847;
            --jam: #A8324A;
            --jam-dark: #862A3D;
            --honey: #C98A2C;
            --sage: #6F8C6E;
            --chambray: #5B7A96;
            --line: #E8DCC8;
            --muted: #B3A492;
            --danger: #C4453F;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--cream);
            background-image: url('https://res.cloudinary.com/bumzwp9g/image/upload/w_1200,q_auto,f_auto/v1785422181/freepik_edit_eikbec.png');
            background-image: image-set(
                url('https://res.cloudinary.com/bumzwp9g/image/upload/w_900,q_auto,f_auto/v1785422181/freepik_edit_eikbec.png') 1x,
                url('https://res.cloudinary.com/bumzwp9g/image/upload/w_1800,q_auto,f_auto/v1785422181/freepik_edit_eikbec.png') 2x
            );
            background-size: cover; background-position: center top; background-attachment: fixed; background-repeat: no-repeat;
            color: var(--espresso);
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
        }
        .font-display { font-family: 'cwTeXYen', 'Noto Serif TC', serif; letter-spacing: 0.02em; }
        .btn-primary, .btn-secondary, .btn-amber, .btn-sage, .chip {
            font-family: 'cwTeXYen', 'Noto Sans TC', sans-serif;
        }
        *:focus-visible { outline: 2px solid var(--jam); outline-offset: 2px; border-radius: 4px; }

        /* recipe card with pie-crust scalloped bottom edge */
        .recipe-card {
            position: relative;
            background: rgba(255,253,249,0.88);
            border: 1px solid var(--line);
            border-radius: 1.5rem 1.5rem 0 0;
            padding-bottom: 1.5rem;
            transition: transform .25s ease, box-shadow .25s ease;
            cursor: pointer;
        }
        .recipe-card:hover, .recipe-card:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px -12px rgba(58,42,30,0.25);
        }
        /* 卡片hover時再加一點點縮放，跟原本的上浮陰影疊加，質感更明顯一些 */
        .recipe-card:hover, .recipe-card:focus-visible { transform: translateY(-4px) scale(1.012); }

        /* 食譜卡片圖片：統一裁切比例，底部加一點漸層讓文字（如果疊在圖片上）好讀，
           沒有圖片的食譜用漸層+大emoji當預設插畫，不會整塊空白 */
        .recipe-card-image-wrap {
            position: relative; width: 100%; aspect-ratio: 4 / 3;
            border-radius: 1rem; overflow: hidden; margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #F4E4EA, #FCE9C8);
        }
        .recipe-card-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
        .recipe-card:hover .recipe-card-image-wrap img { transform: scale(1.05); }
        .recipe-card-image-wrap::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(58,42,30,0.18), transparent 55%);
            pointer-events: none;
        }
        .recipe-card-image-placeholder {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 2.75rem; opacity: .55;
        }

        /* 收藏愛心點擊的小彈跳動畫 */
        @keyframes heartPop {
            0% { transform: scale(1); }
            35% { transform: scale(1.5) rotate(-8deg); }
            60% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .fav-btn.pop i { animation: heartPop .4s ease; }

        /* Modal淡入：只要modal-backdrop這個元素從hidden變成顯示，就會自動套用這個動畫，
           不用另外改任何一個開啟modal的JS函式 */
        @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalSheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-backdrop:not(.hidden) { animation: modalFadeIn .18s ease; }
        .modal-backdrop:not(.hidden) > .sheet-panel { animation: modalSheetUp .22s cubic-bezier(.2,.8,.3,1); }

        /* 骨架屏載入動畫：資料還在讀取時用灰色色塊佔位，取代純文字「載入中」 */
        @keyframes skeletonShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton {
            background: linear-gradient(90deg, #EFE6D8 25%, #F6EFE3 50%, #EFE6D8 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s ease-in-out infinite;
            border-radius: 1rem;
        }

        /* 空狀態（查無資料、清單是空的...）統一的插圖樣式 */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .empty-state .empty-state-icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: .7; }

        /* 價格/熱量這類數字，統一用等寬數字對齊，掃視比較好對齊 */
        .num-tabular { font-variant-numeric: tabular-nums; font-family: "LXGW WenKai Mono TC", monospace; }

        /* Toast提示（取代alert()）：右上角滑入，幾秒後自動淡出消失 */
        #toast-container {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 9999;
            display: flex; flex-direction: column-reverse; gap: 0.6rem; align-items: center;
            max-width: min(90vw, 360px); pointer-events: none;
        }
        #toast-container .toast-item { pointer-events: auto; }
        @keyframes toastSlideIn { from { transform: translateY(120%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .toast-item {
            background: var(--espresso); color: #fff; padding: 0.85rem 1.15rem;
            border-radius: 1rem; font-size: 0.9rem; line-height: 1.5;
            box-shadow: 0 10px 24px -8px rgba(0,0,0,0.35);
            animation: toastSlideIn .28s cubic-bezier(.2,.8,.3,1);
            transition: opacity .25s ease, transform .25s ease;
        }
        .toast-item.toast-leaving { opacity: 0; transform: translateY(20px); }
        .toast-item.toast-success { background: var(--sage); }
        .toast-item.toast-error { background: #A6362F; }

        /* 圖片淡入：img載入完成前先透明，onload時淡入，避免圖片突然彈出 */
        .fade-img { opacity: 0; transition: opacity .45s ease; }
        .fade-img.loaded { opacity: 1; }

        /* 食譜步驟編號徽章：實心圓圈數字，取代純文字編號，比較好抓重點 */
        .step-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 1.75rem; height: 1.75rem; border-radius: 999px; flex-shrink: 0;
            background: var(--jam); color: #fff; font-weight: 700; font-size: 0.85rem;
            font-family: 'Noto Serif TC', serif;
        }

        /* 成就徽章卡片：依稀有度給不同的邊框/光暈顏色 */
        .badge-card {
            position: relative; border-radius: 1.25rem; padding: 1rem;
            text-align: center; border: 2px solid var(--line); background: var(--paper);
            transition: transform .2s ease;
        }
        .badge-card:hover { transform: translateY(-2px); }
        .badge-card.locked { opacity: .45; filter: grayscale(.6); }
        .badge-card .badge-icon { font-size: 2.25rem; margin-bottom: 0.4rem; }
        .badge-card.rarity-common { border-color: #B8C4B8; }
        .badge-card.rarity-rare { border-color: #6F8C6E; box-shadow: 0 0 0 1px rgba(111,140,110,0.25); }
        .badge-card.rarity-epic { border-color: #A8324A; box-shadow: 0 0 16px -4px rgba(168,50,74,0.45); }
        .badge-card.rarity-legendary { border-color: var(--honey); box-shadow: 0 0 20px -2px rgba(201,138,44,0.55); }

        .form-input {
            width: 100%; padding: 0.9rem 1.15rem;
            border: 1px solid var(--line); border-radius: 1rem;
            background: var(--paper); font-size: 1rem; color: var(--espresso);
            transition: border-color .2s, box-shadow .2s;
        }
        .form-input::placeholder { color: var(--muted); }
        .form-input:focus { outline: none; border-color: var(--jam); box-shadow: 0 0 0 3px rgba(168,50,74,0.14); }

        /* 搜尋欄疊加文字太長超出可視範圍時，用跑馬燈效果水平捲動顯示。
           固定用inline-block(不只是套用marquee時才用)，是因為預設的inline元素量測scrollWidth
           不太可靠，容易量不準，導致判斷「有沒有超出」這個邏輯失效 */
        #search-placeholder-text {
            display: inline-block;
            max-width: 100%;
        }
        #search-placeholder-text.marquee {
            animation: search-marquee 9s linear infinite;
            padding-left: 100%; /* 從輸入框最右邊開始，往左捲動 */
            max-width: none;
        }
        @keyframes search-marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .btn-primary {
            background: var(--jam); color: #fff; border-radius: 999px;
            padding: 0.95rem 1.75rem; font-weight: 600; transition: background .2s, transform .1s;
        }
        .btn-primary:hover { background: var(--jam-dark); }
        .btn-primary:active { transform: scale(.97); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
        .btn-secondary {
            background: var(--cream); color: var(--espresso); border: 1px solid var(--line);
            border-radius: 999px; padding: 0.95rem 1.75rem; font-weight: 600; transition: background .2s;
        }
        .btn-secondary:hover { background: #F1E7D6; }
        .btn-danger { background: var(--danger); color: #fff; border-radius: 999px; padding: 0.95rem 1.75rem; font-weight: 600; transition: background .2s; }
        .btn-danger:hover { background: #A6362F; }
        .btn-amber { background: var(--honey); color: #fff; border-radius: 999px; padding: 0.95rem 1.75rem; font-weight: 600; transition: background .2s; }
        .btn-amber:hover { background: #AC7420; }
        .btn-sage { background: var(--chambray); color: #fff; border-radius: 999px; padding: 0.95rem 1.75rem; font-weight: 600; transition: background .2s; }
        .btn-sage:hover { background: #4A6883; }

        .chip {
            padding: 0.55rem 1.1rem; border-radius: 999px; border: 1px solid var(--line);
            background: var(--paper); color: var(--espresso-soft); font-size: 0.95rem;
            white-space: nowrap; transition: all .2s; flex-shrink: 0;
        }
        .chip.active { background: var(--jam); color: #fff; border-color: var(--jam); }
        .chip-row { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
        .chip-row::-webkit-scrollbar { display: none; }

        /* 手機底部導覽列美化：浮動毛玻璃質感 + 選中狀態底色 + 按壓回饋，中央新增按鈕加上柔和光暈 */
        #mobile-bottom-nav {
            background: rgba(253, 250, 244, 0.88);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 -6px 24px rgba(74, 46, 30, 0.08);
        }
        #mobile-bottom-nav .nav-btn {
            border-radius: 1rem; transition: transform .15s ease, background-color .2s ease, color .2s ease;
            font-size: 0.8rem;
        }
        #mobile-bottom-nav .nav-btn:active { transform: scale(0.90); }
        #mobile-bottom-nav .nav-btn.nav-active { color: var(--jam) !important; background: rgba(168, 50, 74, 0.08); }
        #mobile-bottom-nav .nav-fab {
            box-shadow: 0 6px 18px rgba(168, 50, 74, 0.38), 0 0 0 6px rgba(253, 250, 244, 0.9);
            transition: transform .15s ease;
        }
        #mobile-bottom-nav .nav-fab:active { transform: scale(0.92); }

        /* 手機版漢堡選單：開關按鈕跟選單項目的樣式 */
        .mobile-menu-toggle-btn {
            width: 2.5rem; height: 2.5rem; border-radius: 0.9rem; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; line-height: 1; color: var(--jam); background: rgba(168,50,74,0.08);
            transition: transform .15s ease, background-color .2s ease;
        }
        .mobile-menu-toggle-btn:active { transform: scale(0.9); background: rgba(168,50,74,0.16); }
        .mobile-menu-item {
            width: 100%; display: flex; align-items: center; gap: 0.85rem; text-align: left;
            padding: 0.8rem 0.75rem; border-radius: 1rem; color: var(--espresso); font-weight: 500;
            transition: background-color .15s ease, transform .1s ease;
        }
        .mobile-menu-item:active { transform: scale(0.98); background: var(--cream); }
        .mobile-menu-item-icon {
            width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem; flex-shrink: 0;
        }

        /* 電腦版header的下拉選單：把管理員專屬功能（食材熱量管理/孤兒圖片清單/成就總覽）收進一個
           「⚙ 管理」按鈕裡，不然這幾顆按鈕全部平鋪在header上，隨著功能越加越多only會越擠 */
        .header-dropdown-panel {
            position: absolute !important; right: 0; top: calc(100% + 0.5rem); width: 15rem; z-index: 9999 !important;
            background: var(--paper); border-radius: 1.25rem; overflow: hidden;
            box-shadow: 0 16px 32px -8px rgba(58,42,30,0.28), 0 0 0 1px rgba(58,42,30,0.04);
        }
        .header-dropdown-item {
            width: 100%; display: flex; align-items: center; gap: 0.75rem; text-align: left;
            padding: 0.7rem 0.9rem; color: var(--espresso); font-weight: 500; font-size: 0.9rem;
            transition: background-color .15s ease;
        }
        .header-dropdown-item:hover { background: var(--cream); }

        /* 做菜音樂：烹飪模式時插入在「食材」標題右邊、同一列並排的細長播放器，
           不顯示影片畫面，時間軸/跑馬燈歌名/隨機/上一首/播放暫停/下一首全部擠在同一行 */
        #cooking-music-widget {
            display: flex; align-items: center; gap: 0.5rem; flex: 1 1 auto; min-width: 0;
            padding: 0.3rem 0.6rem; border-radius: 999px; background: rgba(58,42,30,0.9);
        }
        /* #id的優先權比.hidden這個class選擇器高，如果不額外補這條，該隱藏的時候會被上面的
           display:flex蓋過去，導致播放器該藏的時候藏不住 */
        #cooking-music-widget.hidden { display: none; }
        /* 廣告略過用的小畫面：故意做得很小，平常聽歌不會太搶眼，但遇到廣告出現略過鈕時
           還是看得到、點得到 */
        #cooking-video-skip-widget {
            width: 6.5rem; aspect-ratio: 16/9; border-radius: 0.6rem; overflow: hidden; background: #000;
            box-shadow: 0 4px 10px -2px rgba(58,42,30,0.3); flex-shrink: 0;
        }
        #cooking-video-skip-widget.hidden { display: none; }
        /* 個人頁面：查看更多的完整清單改成跟儀表板一致的縮圖格線 */
        .personal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: 1.1rem 0.75rem; }
        .personal-grid-item { width: auto; }
        .personal-grid-item img { width: 100%; aspect-ratio: 1/1; }
        /* 儀表板上的我的食譜/我的收藏區塊：限制成固定9欄的格線，最多兩列共18筆，
           半透明白色背景加上區塊感，跟旁邊的成就/音樂卡片明顯分開 */
        .personal-section-block {
            background: rgba(255,253,249,0.65); border-radius: 1.25rem; padding: 1.1rem 1.1rem 0.9rem;
        }
        .personal-section-block .personal-grid {
            grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(2, auto); grid-auto-flow: row;
            overflow: hidden; max-height: calc(2 * (6.5rem + 1.6rem) + 1.1rem);
        }
        @media (max-width: 900px) {
            /* 手機螢幕塞不下9欄，改成固定兩列、往右一直排下去、用左右滑動瀏覽，
               不要硬擠成4欄變5列，那樣配合外層overflow:hidden會把後面的項目直接裁切消失 */
            .personal-section-block .personal-grid {
                grid-template-columns: none; grid-auto-columns: 5.5rem; grid-template-rows: repeat(2, auto);
                grid-auto-flow: column; overflow-x: auto; overflow-y: hidden; max-height: none;
                -webkit-overflow-scrolling: touch; padding-bottom: 0.3rem;
            }
            .personal-section-block .personal-grid .personal-grid-item { width: 5.5rem; }
        }
        .personal-info-card { }
        /* 個人頁面儀表板：成就/做菜音樂資訊卡 */
        .personal-info-card {
            display: flex; align-items: center; gap: 0.85rem; padding: 1rem 1.1rem; border-radius: 1.1rem;
            background: var(--paper); text-align: left; box-shadow: 0 4px 12px -4px rgba(58,42,30,0.08);
        }
        .personal-info-card:hover { background: var(--cream); }
        .personal-info-card-icon { font-size: 1.6rem; flex-shrink: 0; }
        .personal-info-card-text { display: flex; flex-direction: column; min-width: 0; }
        .personal-info-card-title { font-weight: 600; }
        .personal-info-card-sub { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* 我的食譜/我的收藏：橫向捲動的小縮圖列 */
        .personal-scroll-row { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.3rem; -webkit-overflow-scrolling: touch; }
        .personal-scroll-item { flex-shrink: 0; width: 6.5rem; cursor: pointer; }
        .personal-scroll-item img {
            width: 6.5rem; height: 6.5rem; object-fit: cover; border-radius: 0.9rem; margin-bottom: 0.35rem;
            background: var(--line);
        }
        .personal-scroll-item p {
            font-size: 0.78rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; text-align: center;
        }
        #cooking-music-widget .music-progress-track {
            width: 3rem; flex-shrink: 0; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.22);
            overflow: hidden; cursor: pointer;
        }
        #cooking-music-widget .music-progress-fill { height: 100%; width: 0%; background: var(--jam); }
        #cooking-music-widget .music-title-wrap {
            flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap;
            display: flex; align-items: center; height: 1.4rem;
        }
        #cooking-music-widget .music-title-text { display: inline-block; font-size: 0.75rem; line-height: 1.4rem; color: #F5EBDF; }
        #cooking-music-widget .music-title-text.marquee { animation: music-marquee 14s linear infinite; padding-left: 100%; }
        @keyframes music-marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
        #cooking-music-widget .music-controls { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
        #cooking-music-widget .music-ctrl-btn {
            width: 1.6rem; height: 1.6rem; border-radius: 999px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.12); color: #F5EBDF; font-size: 0.75rem; flex-shrink: 0;
            border: none; outline: none; -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none;
        }
        /* 按下去/被focus時瀏覽器預設會加一圈藍色反白或outline，這裡明確蓋掉，
           統一改成跟平常一樣的半透明白底，只有真的「隨機播放開啟中」才會變成強調色 */
        #cooking-music-widget .music-ctrl-btn:focus,
        #cooking-music-widget .music-ctrl-btn:active,
        #cooking-music-widget .music-ctrl-btn:focus-visible {
            outline: none; background: rgba(255,255,255,0.12);
        }
        #cooking-music-widget .music-ctrl-btn.active,
        #cooking-music-widget .music-ctrl-btn.active:focus,
        #cooking-music-widget .music-ctrl-btn.active:active { background: var(--jam); }
        #cooking-music-widget .music-video-hidden { width: 0; height: 0; overflow: hidden; position: absolute; }

        .cook-mode-text-lg { font-size: 1.15em !important; }

<script>
        const firebaseConfig = {
          apiKey: "AIzaSyB2srYJRT8FqovYt_vCJh35h69H0W7cBLU",
          authDomain: "recipe-synchronization.firebaseapp.com",

          storageBucket: "recipe-synchronization.firebasestorage.app",

        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

        let currentUser = null;
        let userProgress = null;

        // 跟index.html共用同一個Firebase專案+同樣的LOCAL持久化設定，只要在index.html登入過，
        // 這裡會自動偵測到已經登入的狀態，不用重新登入一次(跟ktv.html是同一套做法)
        auth.onAuthStateChanged(async user => {
            currentUser = user;
            document.getElementById('game-login-hint').classList.toggle('hidden', !!user);
            document.getElementById('game-modal-body-wrap').classList.toggle('hidden', !user);
            if (user) {
                try {
                    const doc = await db.collection('userProgress').doc(user.uid).get();
                    userProgress = doc.exists ? doc.data() : {};
                } catch (err) {
                    userProgress = {};
                }
                renderGameMenu();
            }
        });
        // ---------- 音效系統(從index.html移植過來的簡化版，只保留這五個小遊戲會用到的音效) ----------
        let sharedAudioCtx = null;
        function ensureAudioContext() {
            try {
                if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
            } catch (e) {}
        }
        function playGameTone(freq, duration, gain, delay, waveType, options) {
            try {
                ensureAudioContext();
                const ctx = sharedAudioCtx;
                if (!ctx) return;
                options = options || {};
                const t0 = ctx.currentTime + (delay || 0);
                const master = ctx.createGain();
                master.gain.value = 1;
                if (options.filterFreq) {
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = options.filterFreq;
                    filter.Q.value = options.filterQ || 0.7;
                    master.connect(filter); filter.connect(ctx.destination);
                } else {
                    master.connect(ctx.destination);
                }
                const makeOsc = (f, g, type, detune) => {
                    const osc = ctx.createOscillator();
                    const og = ctx.createGain();
                    osc.type = type || waveType || 'sine';
                    osc.frequency.value = f;
                    if (detune) osc.detune.value = detune;
                    osc.connect(og); og.connect(master);
                    og.gain.setValueAtTime(0.0001, t0);
                    og.gain.exponentialRampToValueAtTime(Math.max(g, 0.0002), t0 + (options.attack || 0.012));
                    og.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
                    osc.start(t0);
                    osc.stop(t0 + duration + 0.03);
                };
                makeOsc(freq, gain, waveType, 0);
                if (!options.noHarmonic) makeOsc(freq * 2, gain * 0.22, waveType === 'sine' ? 'triangle' : waveType, 4);
                if (options.subOctave) makeOsc(freq / 2, gain * 0.35, 'sine', -4);
                if (options.percussive) {
                    const bufSize = Math.floor(ctx.sampleRate * 0.05);
                    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
                    const noise = ctx.createBufferSource();
                    noise.buffer = buf;
                    const nf = ctx.createBiquadFilter();
                    nf.type = 'highpass'; nf.frequency.value = 800;
                    const ng = ctx.createGain();
                    ng.gain.setValueAtTime(gain * 0.5, t0);
                    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06);
                    noise.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
                    noise.start(t0);
                }
            } catch (e) {}
        }
        function playSfx(type) {
            switch (type) {
                case 'success': playGameTone(880, 0.12, 0.28); playGameTone(1318, 0.18, 0.24, 0.09); break;
                case 'perfect': playGameTone(1046, 0.1, 0.3); playGameTone(1318, 0.1, 0.26, 0.08); playGameTone(1568, 0.2, 0.24, 0.16); break;
                case 'fail': playGameTone(220, 0.3, 0.3, 0, 'sawtooth'); break;
                case 'burnt': playGameTone(160, 0.35, 0.3, 0, 'sawtooth'); playGameTone(110, 0.4, 0.26, 0.12, 'sawtooth'); break;
                case 'click': playGameTone(600, 0.06, 0.16); break;
                case 'chop': playGameTone(320, 0.05, 0.22, 0, 'square'); break;
                case 'buy': playGameTone(700, 0.08, 0.2); playGameTone(950, 0.1, 0.16, 0.05); break;
                case 'sell': playGameTone(500, 0.08, 0.2); playGameTone(350, 0.1, 0.16, 0.05); break;
                case 'tick': playGameTone(440, 0.04, 0.1); break;
                case 'news': playGameTone(760, 0.09, 0.22); playGameTone(1140, 0.12, 0.18, 0.06); break;
            }
        }
        // ---------- 從index.html移植的小工具函式 ----------
        function getYoutubeVideoId(url) {
            if (!url) return null;
            const watchMatch = url.match(/[?&]v=([^&]+)/);
            const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
            const embedMatch = url.match(/embed\/([^?&]+)/);
            const shortsMatch = url.match(/shorts\/([^?&]+)/);
            if (watchMatch) return watchMatch[1];
            if (shortMatch) return shortMatch[1];
            if (embedMatch) return embedMatch[1];
            if (shortsMatch) return shortsMatch[1];
            return null;
        }
        function getYoutubeThumbnailUrl(url) {
            const videoId = getYoutubeVideoId(url);
            return videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : null;
        }
        function convertToMilliliters(amount, unit) {
            switch ((unit || '').trim().toLowerCase()) {
                case 'ml': case '毫升': return amount;
                case 'l': case '公升': return amount * 1000;
                case 'tbsp': case '大匙': case '湯匙': return amount * 15;
                case 'tsp': case '茶匙': case '小匙': return amount * 5;
                case 'cup': case '杯': return amount * 240;
                default: return null;

        //   ① tfnd-nutrition.json：手動整理的常見口語別名精簡表（例如「地瓜」「番薯」「甘藷」都對得到同一筆），優先查這層

        // 兩層都查不到，才會進入下面手動整理的常見食材備用表，再查不到最後才問 AI

                <div>

        // ---------- 神廚火候控制（QTE）----------
        const QTE_DISHES = [
            { name: '松露濃湯', tip: '溫度達到 85 度時關火' },
            { name: '奶油白醬義大利麵', tip: '醬汁收到剛好濃稠時關火' },
            { name: '炙燒和牛', tip: '油溫達到七分熟油亮時起鍋' },
            { name: '法式吐司', tip: '兩面呈現金黃色時翻面' },
            { name: '焦糖布丁', tip: '糖漿呈現琥珀色時離火' },
        ];
        let qteState = null;

        function qteKeyHandler(e) {
            if (e.code === 'Space') { e.preventDefault(); qteAction(); }
        }
        function qteCleanup() {
            if (qteState) {
                qteState.running = false;
                if (qteState.rafId) cancelAnimationFrame(qteState.rafId);
            }
            document.removeEventListener('keydown', qteKeyHandler);
            qteState = null;
        }

        function startQteGame() {
            if (!currentUser) { alert('請先登入才能玩遊戲'); return; }
            currentGameScreen = 'game';
            qteCleanup();
            ensureAudioContext(); // 在按下「開始」這個真正的點擊當下解鎖音效
            document.getElementById('game-modal-title').textContent = '🔥 神廚火候控制';
            qteState = { round: 0, totalRounds: 5, score: 0, running: false, position: 0, speed: 1.3, zoneStart: 40, zoneWidth: 16, rafId: null, resultLock: false };
            renderQteRound();
        }

        function renderQteRound() {
            const state = qteState;
            if (!state) return;
            if (state.round >= state.totalRounds) { qteCleanup(); showGameOverScreen('qte', state.score); return; }
            const dish = QTE_DISHES[state.round % QTE_DISHES.length];
            // 難度隨回合遞增：指針變快、綠色完美區間變窄
            state.speed = 1.3 + state.round * 0.4;
            state.zoneWidth = Math.max(18 - state.round * 2, 8);
            state.zoneStart = 8 + Math.random() * (92 - state.zoneWidth - 8);
            state.position = 0;
            state.resultLock = false;

            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center mb-4">
                    <p class="text-sm" style="color:var(--muted)">第 ${state.round + 1} / ${state.totalRounds} 關 ・ 分數：<span id="qte-score-num">${state.score}</span></p>
                    <p class="font-display text-lg font-bold mt-1">正在製作「${dish.name}」</p>
                    <p class="text-sm mt-1" style="color:var(--jam)">請在${dish.tip}！越快越準分數越高</p>
                </div>
                <div style="position:relative; height:40px; border-radius:999px; overflow:hidden; background:linear-gradient(90deg, #EFEAE0, #E4DACB); box-shadow:inset 0 2px 6px rgba(58,42,30,0.15);">
                    <div style="position:absolute; top:0; bottom:0; left:${state.zoneStart}%; width:${state.zoneWidth}%; background:linear-gradient(180deg, #9BC49B, #7FAE7F); box-shadow:0 0 14px 2px rgba(111,140,110,0.55); animation:qteZoneGlow 1.1s ease-in-out infinite;"></div>
                    <div id="qte-pointer" style="position:absolute; top:-6px; bottom:-6px; width:6px; background:var(--jam); left:0%; border-radius:999px; box-shadow:0 0 10px 2px rgba(168,50,74,0.6);"></div>
                </div>
                <p id="qte-feedback" class="text-center font-display text-2xl font-bold mt-6" style="min-height:2.5rem;"></p>
                <button id="qte-action-btn" onclick="qteAction()" class="btn-primary w-full mt-4 text-lg">🔥 關火！（電腦可按空白鍵）</button>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-3">放棄遊戲</button>
            `;
            state.running = true;
            document.addEventListener('keydown', qteKeyHandler);
            qteLoop();
        }

        function qteLoop() {
            const state = qteState;
            if (!state || !state.running) return;
            state.position += state.speed; // 單向掃過，不會來回彈跳，強調「第一次」的反應
            const pointer = document.getElementById('qte-pointer');
            if (pointer) pointer.style.left = Math.min(state.position, 100) + '%';
            if (state.position >= 100) { qteResolve(false); return; }
            state.rafId = requestAnimationFrame(qteLoop);
        }

        function qteAction() {
            const state = qteState;
            if (!state || !state.running || state.resultLock) return;
            const inZone = state.position >= state.zoneStart && state.position <= state.zoneStart + state.zoneWidth;
            qteResolve(inZone);
        }

        // inZone 為 false 代表沒按到（含超出範圍沒按到的情況）；分數同時看「有沒有按到」跟「按到當下離區間入口多近」
        function qteResolve(inZone) {
            const state = qteState;
            if (!state || state.resultLock) return;
            state.resultLock = true;
            state.running = false;
            if (state.rafId) cancelAnimationFrame(state.rafId);
            document.removeEventListener('keydown', qteKeyHandler);

            const feedback = document.getElementById('qte-feedback');
            const actionBtn = document.getElementById('qte-action-btn');
            let roundScore = 0;
            if (inZone) {
                const positionInZone = (state.position - state.zoneStart) / state.zoneWidth; // 0=剛進區間(最快)，1=快出區間(較慢)
                const speedFactor = 1 - Math.max(0, Math.min(1, positionInZone));
                roundScore = Math.round(100 * (0.5 + 0.5 * speedFactor));
                state.score += roundScore;
                document.getElementById('qte-score-num').textContent = state.score;
                if (speedFactor > 0.75) {
                    if (feedback) { feedback.textContent = `✨ 快狠準！特級料理！+${roundScore}`; feedback.style.color = 'var(--sage)'; }
                    playSfx('perfect');
                } else {
                    if (feedback) { feedback.textContent = `👍 成功關火！+${roundScore}`; feedback.style.color = 'var(--sage)'; }
                    playSfx('success');
                }
                if (navigator.vibrate) navigator.vibrate([60]);
            } else {
                if (feedback) { feedback.textContent = '🔥 燒焦了…'; feedback.style.color = 'var(--danger)'; }
                playSfx('burnt');
                if (navigator.vibrate) navigator.vibrate([150, 60, 150]);
            }
            if (actionBtn) actionBtn.disabled = true;
            setTimeout(() => { if (qteState === state) { state.round++; renderQteRound(); } }, 1200);
        }

        // ---------- 遊戲結束畫面 + 排行榜（給之後陸續新增的遊戲共用）----------
        // ---------- 食材期貨大亨（低買高賣，含新聞事件影響價格走勢）----------
        const STOCK_INGREDIENT_POOL = [
            { id: 'beef', name: '🥩 牛肉', basePrice: 450 },
            { id: 'egg', name: '🥚 雞蛋', basePrice: 80 },
            { id: 'truffle', name: '🍄 松露', basePrice: 2200 },
            { id: 'flour', name: '🌾 麵粉', basePrice: 35 },
            { id: 'salmon', name: '🐟 鮭魚', basePrice: 380 },
            { id: 'cheese', name: '🧀 起司', basePrice: 260 },
            { id: 'coffee', name: '☕ 咖啡豆', basePrice: 550 },
            { id: 'vegetable', name: '🥬 時蔬', basePrice: 40 },
        ];
        // ingredientMatch 對到特定食材；沒有指定的新聞會隨機影響某一項食材
        const STOCK_NEWS = [
            { text: '今年冬天極寒，雞蛋產量暴跌！', ingredientMatch: '雞蛋', direction: 1 },
            { text: '牧場爆發傳染病，牛肉供應緊張！', ingredientMatch: '牛肉', direction: 1 },
            { text: '義大利松露大豐收，價格可能鬆動', ingredientMatch: '松露', direction: -1 },
            { text: '寒流來襲，時蔬產量吃緊', ingredientMatch: '時蔬', direction: 1 },
            { text: '咖啡產地豪雨成災，期貨價格看漲', ingredientMatch: '咖啡豆', direction: 1 },
            { text: '鮭魚養殖大豐收，供給大增', ingredientMatch: '鮭魚', direction: -1 },
            { text: '國際運費飆漲，進口食材成本上升', ingredientMatch: null, direction: 1 },
            { text: '小農契作計畫上線，本地食材供應增加', ingredientMatch: null, direction: -1 },
            { text: '網紅餐廳大量採購，市場搶購潮湧現', ingredientMatch: null, direction: 1 },
            { text: '食安風波爆發，消費者需求驟減', ingredientMatch: null, direction: -1 },
        ];
        let stockGameState = null;
        const STOCK_LOT = 5;

        function stockGameCleanup() {
            if (stockGameState && stockGameState.intervalId) clearInterval(stockGameState.intervalId);
            stockGameState = null;
        }

        function startStockGame() {
            if (!currentUser) { alert('請先登入才能玩遊戲'); return; }
            currentGameScreen = 'game';
            qteCleanup();
            stockGameCleanup();
            ensureAudioContext(); // 在按下「開始」這個真正的點擊當下解鎖音效
            const pool = [...STOCK_INGREDIENT_POOL].sort(() => Math.random() - 0.5).slice(0, 5);
            const ingredients = pool.map(p => ({ ...p, price: p.basePrice, lastChangePct: 0, held: 0 }));
            stockGameState = { day: 0, totalDays: 30, cash: 100000, ingredients, priceBias: {}, newsLog: [], intervalId: null, secondsLeft: 5 };
            renderStockBoard();
            stockGameState.intervalId = setInterval(() => {
                const state = stockGameState;
                if (!state) return;
                state.secondsLeft--;
                updateStockTimerLabel();
                if (state.secondsLeft <= 0) {
                    state.secondsLeft = 5;
                    tickStockDay();
                }
            }, 1000);
        }

        function updateStockTimerLabel() {
            const el = document.getElementById('stock-timer');
            if (el && stockGameState) el.textContent = stockGameState.secondsLeft;
        }

        function triggerStockNews() {
            const state = stockGameState;
            const news = STOCK_NEWS[Math.floor(Math.random() * STOCK_NEWS.length)];
            let targetIng = news.ingredientMatch ? state.ingredients.find(i => i.name.includes(news.ingredientMatch)) : null;
            if (!targetIng) targetIng = state.ingredients[Math.floor(Math.random() * state.ingredients.length)];
            state.priceBias[targetIng.id] = { direction: news.direction, daysLeft: 3 + Math.floor(Math.random() * 2) };
            state.newsLog.unshift(`📰 第${state.day + 1}天：${news.text}（${targetIng.name}走勢${news.direction > 0 ? '看漲' : '看跌'}）`);
            state.newsLog = state.newsLog.slice(0, 5);
            playSfx('news');
        }

        function tickStockDay() {
            const state = stockGameState;
            if (!state) return;
            state.day++;
            playSfx('tick');
            Object.keys(state.priceBias).forEach(id => {
                if (state.priceBias[id].daysLeft > 0) state.priceBias[id].daysLeft--;
            });
            if (Math.random() < 0.35) triggerStockNews();
            state.ingredients.forEach(ing => {
                const bias = state.priceBias[ing.id];
                const biasDirection = (bias && bias.daysLeft > 0) ? bias.direction : 0;
                let changePct = (Math.random() * 0.16 - 0.08); // 基礎波動 -8% ~ +8%
                if (biasDirection !== 0) changePct += biasDirection * (0.03 + Math.random() * 0.05); // 新聞帶來的額外偏移
                ing.price = Math.max(1, ing.price * (1 + changePct));
                ing.lastChangePct = changePct;
            });
            if (state.day >= state.totalDays) { endStockGame(); return; }
            renderStockBoard();
        }

        function stockTrade(ingId, action) {
            const state = stockGameState;
            if (!state) return;
            const ing = state.ingredients.find(i => i.id === ingId);
            if (!ing) return;
            if (action === 'buy') {
                const cost = ing.price * STOCK_LOT;
                if (state.cash < cost) return;
                state.cash -= cost;
                ing.held += STOCK_LOT;
                playSfx('buy');
            } else {
                if (ing.held < STOCK_LOT) return;
                state.cash += ing.price * STOCK_LOT;
                ing.held -= STOCK_LOT;
                playSfx('sell');
            }
            renderStockBoard();
        }

        function renderStockBoard() {
            const state = stockGameState;
            if (!state) return;
            const totalHoldingsValue = state.ingredients.reduce((sum, ing) => sum + ing.price * ing.held, 0);
            const totalAsset = state.cash + totalHoldingsValue;
            document.getElementById('game-modal-title').textContent = '📈 食材期貨大亨';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="flex justify-between items-center mb-1 text-sm">
                    <p>第 ${state.day} / ${state.totalDays} 天 ・ 下次變動：<span id="stock-timer" class="font-semibold" style="color:var(--jam)">${state.secondsLeft}</span>s</p>
                    <p>總資產：<span class="font-bold text-base" style="color:var(--jam)">$${Math.round(totalAsset).toLocaleString()}</span></p>
                </div>
                <p class="text-xs mb-3" style="color:var(--muted)">現金：$${Math.round(state.cash).toLocaleString()}</p>
                <!-- 新聞區固定高度、內部自己捲動，不會把下面買賣區擠下去 -->
                <div class="mb-3 space-y-1 rounded-2xl" style="max-height:84px; overflow-y:auto; background:rgba(244,228,234,0.4); padding:6px;">${state.newsLog.length ? state.newsLog.map((n, i) => `<p class="text-xs px-3 py-1.5 rounded-xl" style="background:var(--cream); color:var(--espresso-soft); ${i === 0 ? 'border-left:3px solid var(--jam);' : ''}">${n}</p>`).join('') : '<p class="text-xs px-2" style="color:var(--muted)">市場平靜，還沒有新聞</p>'}</div>
                <div class="mb-4">
                    ${state.ingredients.map(ing => {
                        const isUp = ing.lastChangePct > 0, isDown = ing.lastChangePct < 0;
                        const changeColor = isUp ? 'var(--danger)' : isDown ? 'var(--sage)' : 'var(--muted)';
                        const borderColor = isUp ? 'var(--danger)' : isDown ? 'var(--sage)' : 'var(--line)';
                        const changeLabel = state.day === 0 ? '' : `${isUp ? '▲' : isDown ? '▼' : '－'} ${(Math.abs(ing.lastChangePct) * 100).toFixed(1)}%`;
                        const canBuy = state.cash >= ing.price * STOCK_LOT;
                        const canSell = ing.held >= STOCK_LOT;
                        return `<div class="px-4 py-3 rounded-2xl mb-2" style="background:var(--cream); border-left:4px solid ${borderColor}; transition:border-color .3s;">
                            <div class="flex justify-between items-center mb-1">
                                <p class="font-semibold">${ing.name}</p>
                                <p class="font-bold">$${Math.round(ing.price).toLocaleString()} <span class="text-xs font-semibold" style="color:${changeColor}">${changeLabel}</span></p>
                            </div>
                            <div class="flex justify-between items-center">
                                <p class="text-xs" style="color:var(--muted)">持有 ${ing.held}</p>
                                <div class="flex gap-1.5">
                                    <button onclick="stockTrade('${ing.id}','buy')" ${canBuy ? '' : 'disabled'} class="btn-amber !px-3 !py-1 text-xs" style="${canBuy ? '' : 'opacity:.4'}">⬆️ 買 ${STOCK_LOT}</button>
                                    <button onclick="stockTrade('${ing.id}','sell')" ${canSell ? '' : 'disabled'} class="btn-secondary !px-3 !py-1 text-xs" style="${canSell ? '' : 'opacity:.4'}">⬇️ 賣 ${STOCK_LOT}</button>
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
                <button onclick="renderGameMenu()" class="btn-secondary w-full">放棄遊戲</button>
            `;
        }

        function endStockGame() {
            const state = stockGameState;
            if (!state) return;
            if (state.intervalId) clearInterval(state.intervalId);
            const totalHoldingsValue = state.ingredients.reduce((sum, ing) => sum + ing.price * ing.held, 0);
            const finalAsset = Math.round(state.cash + totalHoldingsValue);
            const startingCash = 100000;
            const profitPct = (finalAsset - startingCash) / startingCash;
            // 分數改用「獲利百分比 x 1000」，不要直接用資產金額，這樣才能跟其他遊戲的分數量級對齊，
            // 不會出現一個遊戲幾百分、另一個遊戲幾百萬分這種不成比例的落差；最低 0 分（賠錢不會扣成負分）
            const score = Math.max(0, Math.round(profitPct * 1000));
            const detail = `最終資產：$${finalAsset.toLocaleString()}（起始資金 $100,000，獲利 ${(profitPct * 100).toFixed(1)}%）`;
            stockGameState = null;
            showGameOverScreen('stock', score, detail);
        }

        // ---------- 虛擬廚房挑戰賽（切菜 → 火候 → 結算，過關後推薦同分類真食譜）----------
        // 虛擬廚房挑戰賽：依料理種類分成三條不同玩法的賽道，抽到不同菜會玩到完全不一樣的小遊戲
        //   stir（快炒烹飪：中/西/日式、其他）  → 切菜 + 火候控制
        //   bake（烘焙：蛋糕/麵包/餅乾塔派）    → 節奏拌料 + 烤箱蓄熱計時
        //   chill（冷藏組裝：健康餐/慕斯布丁/寶寶食品）→ 食材擺盤 + 裝飾加分
        const DASH_DISHES = [
            { name: '奶油炒野菇', category: '西式烹飪', track: 'stir', ingredients: ['🍄', '🧈', '🧄', '🌿'] },
            { name: '蔥爆牛肉', category: '中式烹飪', track: 'stir', ingredients: ['🥩', '🧅', '🧄', '🌶️'] },
            { name: '照燒雞腿', category: '日式烹飪', track: 'stir', ingredients: ['🍗', '🧅', '🍯', '🌰'] },
            { name: '田園蔬菜沙拉', category: '健康餐', track: 'chill', ingredients: ['🥬', '🍅', '🥕', '🧀'] },
            { name: '蜂蜜檸檬磅蛋糕', category: '蛋糕/糕餅', track: 'bake', ingredients: ['🍋', '🍯', '🥚', '🧈'] },
            { name: '蒜香奶油餐包', category: '麵包/包子', track: 'bake', ingredients: ['🌾', '🧈', '🧄', '🥛'] },
            { name: '檸檬奶酥塔', category: '餅乾/塔派', track: 'bake', ingredients: ['🍋', '🧈', '🌾', '🥚'] },
            { name: '芒果奶酪', category: '慕斯/布丁', track: 'chill', ingredients: ['🥭', '🍮', '🥛', '🍯'] },
            { name: '南瓜蔬菜泥', category: '寶寶食品', track: 'chill', ingredients: ['🎃', '🥕', '🍚', '🍌'] },
            { name: '私房萬用醬料', category: '其他', track: 'stir', ingredients: ['🧄', '🌶️', '🍯', '🧂'] },
        ];
        let dashGameState = null;

        function dashGameCleanup() {
            if (dashGameState) {
                if (dashGameState.chopTimeoutId) clearTimeout(dashGameState.chopTimeoutId);
                if (dashGameState.heatRafId) cancelAnimationFrame(dashGameState.heatRafId);
                if (dashGameState.rhythmTimeoutId) clearTimeout(dashGameState.rhythmTimeoutId);
                if (dashGameState.ovenRafId) cancelAnimationFrame(dashGameState.ovenRafId);
                if (dashGameState.platingTimerId) clearTimeout(dashGameState.platingTimerId);
                if (dashGameState.garnishTimers) dashGameState.garnishTimers.forEach(t => clearTimeout(t));
                dashGameState.heatRunning = false;
                dashGameState.ovenRunning = false;
            }
            dashGameState = null;
        }

        function startDashGame() {
            if (!currentUser) { alert('請先登入才能玩遊戲'); return; }
            currentGameScreen = 'game';
            qteCleanup(); stockGameCleanup(); dashGameCleanup();
            ensureAudioContext(); // 在按下「開始」這個真正的點擊當下解鎖音效
            const dish = DASH_DISHES[Math.floor(Math.random() * DASH_DISHES.length)];
            dashGameState = {
                dish,
                primaryHits: 0, primaryTotal: dish.ingredients.length, // 三條賽道共用：第一階段命中數/總數
                secondaryHits: 0, secondaryTotal: 1,                    // 三條賽道共用：第二階段命中數/總數
                chopIndex: 0, chopResolved: false, chopTimeoutId: null,
                heatRunning: false, heatRafId: null,
                rhythmIndex: 0, rhythmResolved: false, rhythmTimeoutId: null,
                ovenRunning: false, ovenRafId: null, ovenLevel: 0,
                platingPlaced: {}, platingTimeLeft: 6.0, platingTimerId: null,
                garnishHits: 0, garnishTotal: 4, garnishActive: -1, garnishRound: 0, garnishTimers: [],
            };
            if (dish.track === 'bake') renderDashRhythmRound();
            else if (dish.track === 'chill') renderDashPlatingRound();
            else renderDashChopRound();
        }

        // ============== 賽道 A・快炒烹飪：切菜 + 火候控制 ==============
        function renderDashChopRound() {
            const state = dashGameState;
            if (!state) return;
            if (state.chopIndex >= state.primaryTotal) { startDashHeat(); return; }
            const dish = state.dish;
            const emoji = dish.ingredients[state.chopIndex];
            state.chopResolved = false;
            document.getElementById('game-modal-title').textContent = `🔪 備料切菜（${dish.name}）`;
            document.getElementById('game-modal-body').innerHTML = `
                <p class="text-center text-sm mb-2" style="color:var(--muted)">第 ${state.chopIndex + 1}/${state.primaryTotal} 項食材 ・ 命中 <span style="color:var(--jam); font-weight:600">${state.primaryHits}</span></p>
                <div class="flex justify-center items-center rounded-3xl" style="height:200px; background:radial-gradient(circle, rgba(244,228,234,0.6), transparent 70%);">
                    <button onclick="dashChopHit()" class="text-7xl" style="animation: dashPop 0.9s linear forwards; filter:drop-shadow(0 6px 10px rgba(58,42,30,0.25));">${emoji}</button>
                </div>
                <p class="text-center text-xs" style="color:var(--muted)">食材消失前點一下切它！</p>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-4">放棄遊戲</button>
            `;
            state.chopTimeoutId = setTimeout(() => {
                if (state.chopResolved) return;
                state.chopResolved = true;
                playSfx('fail');
                state.chopIndex++;
                setTimeout(renderDashChopRound, 200);
            }, 900);
        }
        function dashChopHit() {
            const state = dashGameState;
            if (!state || state.chopResolved) return;
            state.chopResolved = true;
            clearTimeout(state.chopTimeoutId);
            state.primaryHits++;
            playSfx('chop');
            if (navigator.vibrate) navigator.vibrate([30]);
            state.chopIndex++;
            setTimeout(renderDashChopRound, 200);
        }

        function startDashHeat() {
            const state = dashGameState;
            if (!state) return;
            state.heatPosition = 0;
            state.heatDirection = 1;
            state.heatSpeed = 2.2;
            state.heatZoneWidth = 14;
            state.heatZoneStart = 15 + Math.random() * (85 - state.heatZoneWidth - 15);
            document.getElementById('game-modal-title').textContent = `🔥 火候控制（${state.dish.name}）`;
            document.getElementById('game-modal-body').innerHTML = `
                <p class="text-center text-sm mb-4" style="color:var(--jam)">在綠色區間按下「起鍋」，火太大會焦、太小會生！</p>
                <div style="position:relative; height:40px; border-radius:999px; overflow:hidden; background:linear-gradient(90deg, #EFEAE0, #E4DACB); box-shadow:inset 0 2px 6px rgba(58,42,30,0.15);">
                    <div style="position:absolute; top:0; bottom:0; left:${state.heatZoneStart}%; width:${state.heatZoneWidth}%; background:linear-gradient(180deg, #9BC49B, #7FAE7F); box-shadow:0 0 14px 2px rgba(111,140,110,0.55); animation:qteZoneGlow 1.1s ease-in-out infinite;"></div>
                    <div id="dash-heat-pointer" style="position:absolute; top:-6px; bottom:-6px; width:6px; background:var(--jam); left:0%; border-radius:999px; box-shadow:0 0 10px 2px rgba(168,50,74,0.6);"></div>
                </div>
                <button onclick="dashHeatAction()" class="btn-primary w-full mt-6 text-lg">🍳 起鍋！</button>
            `;
            state.heatRunning = true;
            dashHeatLoop();
        }
        function dashHeatLoop() {
            const state = dashGameState;
            if (!state || !state.heatRunning) return;
            state.heatPosition += state.heatDirection * state.heatSpeed;
            if (state.heatPosition >= 100) { state.heatPosition = 100; state.heatDirection = -1; }
            if (state.heatPosition <= 0) { state.heatPosition = 0; state.heatDirection = 1; }
            const pointer = document.getElementById('dash-heat-pointer');
            if (pointer) pointer.style.left = state.heatPosition + '%';
            state.heatRafId = requestAnimationFrame(dashHeatLoop);
        }
        function dashHeatAction() {
            const state = dashGameState;
            if (!state || !state.heatRunning) return;
            state.heatRunning = false;
            if (state.heatRafId) cancelAnimationFrame(state.heatRafId);
            const success = state.heatPosition >= state.heatZoneStart && state.heatPosition <= state.heatZoneStart + state.heatZoneWidth;
            state.secondaryHits = success ? 1 : 0;
            playSfx(success ? 'success' : 'burnt');
            if (navigator.vibrate) navigator.vibrate(success ? [60] : [150, 60, 150]);
            finishDashGame();
        }

        // ============== 賽道 B・烘焙：節奏拌料 + 烤箱蓄熱計時 ==============
        const DASH_RHYTHM_TOTAL = 5;
        function renderDashRhythmRound() {
            const state = dashGameState;
            if (!state) return;
            if (state.rhythmIndex >= DASH_RHYTHM_TOTAL) { startDashOven(); return; }
            state.rhythmResolved = false;
            document.getElementById('game-modal-title').textContent = `🥣 節奏拌料（${state.dish.name}）`;
            document.getElementById('game-modal-body').innerHTML = `
                <p class="text-center text-sm mb-2" style="color:var(--muted)">第 ${state.rhythmIndex + 1}/${DASH_RHYTHM_TOTAL} 下 ・ 命中 <span style="color:var(--jam); font-weight:600">${state.primaryHits}</span></p>
                <div class="flex justify-center items-center" style="height:200px;">
                    <div style="position:relative; width:172px; height:172px;">
                        <div style="position:absolute; inset:0; border-radius:999px; border:4px solid var(--honey);"></div>
                        <div id="dash-rhythm-ring" style="position:absolute; inset:0; margin:auto; width:20px; height:20px; border-radius:999px; background:var(--jam); animation:dashRhythmGrow 1.15s linear forwards;"></div>
                    </div>
                </div>
                <button onclick="dashRhythmTap()" class="btn-primary w-full mt-4 text-lg">🥄 攪拌！</button>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-2">放棄遊戲</button>
            `;
            state.rhythmTimeoutId = setTimeout(() => {
                if (state.rhythmResolved) return;
                state.rhythmResolved = true;
                playSfx('fail');
                state.rhythmIndex++;
                setTimeout(renderDashRhythmRound, 200);
            }, 1200);
        }
        function dashRhythmTap() {
            const state = dashGameState;
            if (!state || state.rhythmResolved) return;
            const ring = document.getElementById('dash-rhythm-ring');
            if (!ring) return;
            const size = ring.getBoundingClientRect().width;
            // 圓圈長到接近外框（172px）時點下去才算準
            const hit = size >= 128 && size <= 172;
            state.rhythmResolved = true;
            clearTimeout(state.rhythmTimeoutId);
            if (hit) { state.primaryHits++; playSfx('chop'); if (navigator.vibrate) navigator.vibrate([30]); }
            else { playSfx('fail'); }
            state.rhythmIndex++;
            setTimeout(renderDashRhythmRound, 200);
        }

        function startDashOven() {
            const state = dashGameState;
            if (!state) return;
            state.ovenLevel = 0;
            state.ovenRunning = false;
            state.ovenZoneStart = 55 + Math.random() * 15; // 目標區間偏高，烤箱要蓄熱到一定程度才好
            state.ovenZoneWidth = 14;
            document.getElementById('game-modal-title').textContent = `🔥 烤箱計時（${state.dish.name}）`;
            document.getElementById('game-modal-body').innerHTML = `
                <p class="text-center text-sm mb-4" style="color:var(--jam)">按住「加熱」蓄熱，熱度進到綠色區間時放開！</p>
                <div style="position:relative; height:200px; width:60px; margin:0 auto; border-radius:999px; overflow:hidden; background:linear-gradient(180deg, #E4DACB, #EFEAE0); box-shadow:inset 0 2px 6px rgba(58,42,30,0.15);">
                    <div style="position:absolute; left:0; right:0; bottom:${state.ovenZoneStart}%; height:${state.ovenZoneWidth}%; background:linear-gradient(180deg, #7FAE7F, #9BC49B); box-shadow:0 0 14px 2px rgba(111,140,110,0.55); animation:qteZoneGlow 1.1s ease-in-out infinite;"></div>
                    <div id="dash-oven-fill" style="position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(180deg, #E8A33D, var(--danger));"></div>
                </div>
                <button id="dash-oven-btn" class="btn-primary w-full mt-6 text-lg select-none" style="touch-action:none;">🔥 按住加熱</button>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-2">放棄遊戲</button>
            `;
            const btn = document.getElementById('dash-oven-btn');
            if (btn) {
                btn.addEventListener('pointerdown', e => { e.preventDefault(); dashOvenStart(); });
                btn.addEventListener('pointerup', e => { e.preventDefault(); dashOvenRelease(); });
                btn.addEventListener('pointerleave', e => { e.preventDefault(); dashOvenRelease(); });
            }
        }
        function dashOvenStart() {
            const state = dashGameState;
            if (!state || state.ovenRunning) return;
            state.ovenRunning = true;
            dashOvenLoop();
        }
        function dashOvenLoop() {
            const state = dashGameState;
            if (!state || !state.ovenRunning) return;
            state.ovenLevel = Math.min(100, state.ovenLevel + 1.8);
            const fill = document.getElementById('dash-oven-fill');
            if (fill) fill.style.height = state.ovenLevel + '%';
            if (state.ovenLevel >= 100) { dashOvenRelease(); return; }
            state.ovenRafId = requestAnimationFrame(dashOvenLoop);
        }
        function dashOvenRelease() {
            const state = dashGameState;
            if (!state || !state.ovenRunning) return;
            state.ovenRunning = false;
            if (state.ovenRafId) cancelAnimationFrame(state.ovenRafId);
            const success = state.ovenLevel >= state.ovenZoneStart && state.ovenLevel <= state.ovenZoneStart + state.ovenZoneWidth;
            state.secondaryHits = success ? 1 : 0;
            playSfx(success ? 'success' : 'burnt');
            if (navigator.vibrate) navigator.vibrate(success ? [60] : [150, 60, 150]);
            finishDashGame();
        }

        // ============== 賽道 C・冷藏組裝：食材擺盤 + 裝飾加分 ==============
        function renderDashPlatingRound() {
            const state = dashGameState;
            if (!state) return;
            state.platingPlaced = {};
            state.platingTimeLeft = 6.0;
            document.getElementById('game-modal-title').textContent = `🍽️ 食材擺盤（${state.dish.name}）`;
            document.getElementById('game-modal-body').innerHTML = dashPlatingHTML();
            dashPlatingTimerLoop();
        }
        function dashPlatingHTML() {
            const state = dashGameState;
            const dish = state.dish;
            const positions = [{ top: '10%', left: '50%' }, { top: '50%', left: '87%' }, { top: '88%', left: '50%' }, { top: '50%', left: '13%' }];
            const slotsHtml = dish.ingredients.map((emoji, i) => {
                const placed = !!state.platingPlaced[i];
                const pos = positions[i] || positions[0];
                return `<button ${placed ? 'disabled' : `onclick="dashPlatingPlace(${i})"`} style="position:absolute; top:${pos.top}; left:${pos.left}; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:999px; border:2px dashed ${placed ? 'var(--sage)' : '#D9C9A8'}; background:${placed ? 'rgba(159,196,159,0.3)' : 'rgba(255,255,255,0.6)'}; display:flex; align-items:center; justify-content:center; font-size:1.6rem;">${placed ? emoji : '？'}</button>`;
            }).join('');
            return `
                <p class="text-center text-sm mb-2" style="color:var(--muted)">時間內把所有食材點上盤子！剩餘 <span id="dash-plating-timer" style="color:var(--jam); font-weight:600">${state.platingTimeLeft.toFixed(1)}</span> 秒</p>
                <div style="position:relative; width:220px; height:220px; margin:0 auto 16px; border-radius:999px; background:radial-gradient(circle, rgba(244,228,234,0.6), transparent 70%); border:3px solid var(--paper);">
                    ${slotsHtml}
                </div>
                <button onclick="renderGameMenu()" class="btn-secondary w-full">放棄遊戲</button>
            `;
        }
        function dashPlatingTimerLoop() {
            const state = dashGameState;
            if (!state || state.primaryHits >= state.primaryTotal) return;
            state.platingTimeLeft -= 0.1;
            const timerEl = document.getElementById('dash-plating-timer');
            if (timerEl) timerEl.textContent = Math.max(0, state.platingTimeLeft).toFixed(1);
            if (state.platingTimeLeft <= 0) { startDashGarnish(); return; }
            state.platingTimerId = setTimeout(dashPlatingTimerLoop, 100);
        }
        function dashPlatingPlace(i) {
            const state = dashGameState;
            if (!state || state.platingPlaced[i]) return;
            state.platingPlaced[i] = true;
            state.primaryHits++;
            playSfx('chop');
            if (navigator.vibrate) navigator.vibrate([30]);
            document.getElementById('game-modal-body').innerHTML = dashPlatingHTML();
            if (state.primaryHits >= state.primaryTotal) { clearTimeout(state.platingTimerId); setTimeout(startDashGarnish, 300); }
        }

        function startDashGarnish() {
            const state = dashGameState;
            if (!state) return;
            if (state.platingTimerId) clearTimeout(state.platingTimerId);
            state.garnishHits = 0;
            state.garnishTotal = 4;
            state.garnishActive = -1;
            state.garnishRound = 0;
            document.getElementById('game-modal-title').textContent = `✨ 裝飾加分（${state.dish.name}）`;
            document.getElementById('game-modal-body').innerHTML = `
                <p class="text-center text-sm mb-4" style="color:var(--muted)">閃光出現時點一下加分！</p>
                <div style="position:relative; width:220px; height:180px; margin:0 auto;">
                    ${[0, 1, 2, 3].map(i => `<button id="dash-garnish-${i}" onclick="dashGarnishTap(${i})" style="position:absolute; width:52px; height:52px; border-radius:999px; background:var(--cream); border:2px solid var(--line); transition:background .15s, box-shadow .15s; ${['top:0;left:8%', 'top:0;right:8%', 'bottom:0;left:8%', 'bottom:0;right:8%'][i]}"></button>`).join('')}
                </div>
            `;
            dashGarnishNextFlash();
        }
        function dashGarnishNextFlash() {
            const state = dashGameState;
            if (!state) return;
            state.garnishRound++;
            if (state.garnishRound > state.garnishTotal) { finishDashGame(); return; }
            const idx = Math.floor(Math.random() * 4);
            state.garnishActive = idx;
            const btn = document.getElementById(`dash-garnish-${idx}`);
            if (btn) { btn.style.background = 'var(--honey)'; btn.style.boxShadow = '0 0 16px 4px rgba(232,163,61,0.6)'; }
            state.garnishTimers.push(setTimeout(() => {
                if (state.garnishActive === idx) {
                    if (btn) { btn.style.background = 'var(--cream)'; btn.style.boxShadow = 'none'; }
                    state.garnishActive = -1;
                    dashGarnishNextFlash();
                }
            }, 700));
        }
        function dashGarnishTap(i) {
            const state = dashGameState;
            if (!state || state.garnishActive !== i) return;
            state.garnishHits++;
            state.secondaryHits = state.garnishHits;
            state.secondaryTotal = state.garnishTotal;
            state.garnishActive = -1;
            playSfx('chop');
            if (navigator.vibrate) navigator.vibrate([30]);
            const btn = document.getElementById(`dash-garnish-${i}`);
            if (btn) { btn.style.background = 'var(--sage)'; btn.style.boxShadow = 'none'; }
            setTimeout(dashGarnishNextFlash, 150);
        }

        // 結算：三條賽道統一用「第一階段命中率(佔60分) + 第二階段命中率(佔30分)」計分，
        // 燒焦時有搞笑抖動動畫，並推薦同分類真食譜
        function finishDashGame() {
            const state = dashGameState;
            if (!state) return;
            const primaryScore = Math.round(state.primaryHits / state.primaryTotal * 60);
            const secondaryScore = Math.round(state.secondaryHits / state.secondaryTotal * 30);
            const score = primaryScore + secondaryScore;
            let rating, emoji;
            if (state.primaryHits === state.primaryTotal && state.secondaryHits === state.secondaryTotal) { rating = '特級料理'; emoji = '✨'; }
            else if (state.primaryHits >= state.primaryTotal / 2 || state.secondaryHits >= state.secondaryTotal / 2) { rating = '普通'; emoji = '🍽️'; }
            else { rating = '燒焦了！'; emoji = '🔥😱'; }
            const dish = state.dish;
            dashGameState = null;
            renderDashResult(rating, emoji, score, dish);
        }

        function renderDashResult(rating, emoji, score, dish) {
            document.getElementById('game-modal-title').textContent = '🍽️ 廚房挑戰賽';
            const isBurnt = rating === '燒焦了！';
            const isPerfect = rating === '特級料理';
            const cardBg = isBurnt ? 'linear-gradient(180deg, #FBEAE7, #FBF3E7)' : isPerfect ? 'linear-gradient(180deg, #FCF2DC, #FBF3E7)' : 'var(--paper)';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center py-6 rounded-3xl mb-4" style="background:${cardBg}">
                    <div class="text-6xl mb-3 ${isBurnt ? 'dash-shake' : 'celebrate-pop'}">${emoji}</div>
                    <p class="font-display text-2xl font-bold mb-1" style="color:${isBurnt ? 'var(--danger)' : 'var(--jam)'}">${rating}</p>
                    <p class="text-sm mb-4" style="color:var(--muted)">「${dish.name}」挑戰結束 ・ 分數：<span class="font-bold" style="color:var(--honey)">${score}</span></p>
                    <div class="flex gap-3 justify-center flex-wrap">
                        <button onclick="submitGameScore('dash', ${score})" class="btn-primary">上傳分數到排行榜</button>
                        <button onclick="renderGameMenu()" class="btn-secondary">返回選單</button>
                    </div>
                </div>
                <div>
                    <h3 class="font-display font-semibold text-base mb-3">😋 想試試真正的「${dish.category}」食譜嗎？</h3>
                    <div id="dash-recommend-list"><p class="text-sm" style="color:var(--muted)">載入推薦中…</p></div>
                </div>
            `;
            loadDashRecommendations(dish.category);
        }

        async function loadDashRecommendations(category) {
            try {
                const snap = await db.collection('recipes').where('category', '==', category).limit(15).get();
                const candidates = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => !r.visibility || r.visibility === 'public');
                const picks = candidates.sort(() => Math.random() - 0.5).slice(0, 3);
                const list = document.getElementById('dash-recommend-list');
                if (!list) return;
                if (picks.length === 0) { list.innerHTML = `<p class="text-sm" style="color:var(--muted)">目前這個分類還沒有食譜，去新增一篇吧！</p>`; return; }
                list.innerHTML = picks.map((r, i) => `
                    <div onclick="dashOpenRecipe(${i})" class="flex items-center gap-3 px-4 py-3 rounded-2xl mb-2 cursor-pointer" style="background:var(--cream)">
                        ${r.imageUrl ? `<img src="${r.imageUrl}" class="w-12 h-12 rounded-xl object-cover shrink-0">` : (r.youtubeUrl && getYoutubeThumbnailUrl(r.youtubeUrl)) ? `<img src="${getYoutubeThumbnailUrl(r.youtubeUrl)}" class="w-12 h-12 rounded-xl object-cover shrink-0">` : `<div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0" style="background:var(--line)">🍽️</div>`}
                        <div class="min-w-0">
                            <p class="font-medium truncate">${r.name}</p>
                            <p class="text-xs" style="color:var(--muted)">${r.servings} 個</p>
                        </div>
                    </div>
                `).join('');
                window.__dashRecommendPicks = picks; // 暫存，給下面點擊用真正的食譜物件開啟詳細頁
            } catch (err) {
                const list = document.getElementById('dash-recommend-list');
                if (list) list.innerHTML = `<p class="text-sm" style="color:var(--danger)">推薦載入失敗：${err.message}</p>`;
            }
