        // ---------- 深夜食堂（文字 Roguelike 生存遊戲）----------
        let dinerGameState = null;
        const DINER_TOTAL_DAYS = 20;
        // 每局固定安排 4 天是節日事件（第 5/10/15/20 天），其餘天數用機率抽：
        // A/B 一般事件最常見、C 神秘事件較稀有、D Boss 事件最稀有
        const DINER_HOLIDAY_DAYS = [5, 10, 15, 20];

        function dinerGameCleanup() {
            dinerGameState = null;
        }

        function startDinerGame() {
            if (!currentUser) { alert('請先登入才能玩遊戲'); return; }
            currentGameScreen = 'game';
            qteCleanup(); stockGameCleanup(); dashGameCleanup(); dinerGameCleanup();
            ensureAudioContext(); // 在按下「開始」這個真正的點擊當下解鎖音效
            const usedIndices = new Set();
            dinerGameState = {
                day: 0, life: 100, reputation: 50, money: 500,
                usedIndices, ended: false,
            };
            playSfx('click');
            dinerNextDay();
        }

        // 依照今天是不是節日、抽出今天要遇到的事件
        function dinerPickEvent(day) {
            const state = dinerGameState;
            const isHoliday = DINER_HOLIDAY_DAYS.includes(day);
            let pool;
            if (isHoliday) {
                pool = DINER_EVENTS.filter(e => e.cat === 'E');
            } else {
                const roll = Math.random();
                let cat;
                if (roll < 0.55) cat = 'A';
                else if (roll < 0.85) cat = 'B';
                else if (roll < 0.95) cat = 'C';
                else cat = 'D';
                pool = DINER_EVENTS.filter(e => e.cat === cat);
            }
            // 盡量避免同一局裡抽到重複事件（210 則事件、單局最多 20 天，理論上不用重複）
            const indices = pool.map(e => DINER_EVENTS.indexOf(e)).filter(i => !state.usedIndices.has(i));
            const finalPool = indices.length > 0 ? indices : pool.map(e => DINER_EVENTS.indexOf(e));
            const chosenIndex = finalPool[Math.floor(Math.random() * finalPool.length)];
            state.usedIndices.add(chosenIndex);
            return DINER_EVENTS[chosenIndex];
        }

        function dinerNextDay() {
            const state = dinerGameState;
            if (!state || state.ended) return;
            state.day++;
            if (state.day > DINER_TOTAL_DAYS) { dinerEndGame(true); return; }
            const event = dinerPickEvent(state.day);
            state.currentEvent = event;
            renderDinerDay(event);
        }

        const DINER_CAT_LABELS = { A: '奇葩顧客', B: '突發狀況', C: '✨神秘事件', D: '🔥重大挑戰', E: '🎉節日限定' };
        const DINER_CAT_COLORS = { A: 'var(--jam)', B: '#8B7355', C: '#7B5FA6', D: 'var(--danger)', E: 'var(--honey)' };

        function renderDinerDay(event) {
            const state = dinerGameState;
            document.getElementById('game-modal-title').textContent = '🌙 深夜食堂';
            const dayPct = Math.round((state.day / DINER_TOTAL_DAYS) * 100);
            document.getElementById('game-modal-body').innerHTML = `
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-1 text-xs" style="color:var(--muted)">
                        <span>第 ${state.day} / ${DINER_TOTAL_DAYS} 天</span>
                        <span style="color:${DINER_CAT_COLORS[event.cat]}; font-weight:600">${DINER_CAT_LABELS[event.cat]}</span>
                    </div>
                    <div style="height:6px; border-radius:999px; overflow:hidden; background:var(--line);">
                        <div style="height:100%; width:${dayPct}%; background:linear-gradient(90deg, var(--honey), var(--jam)); transition:width .4s;"></div>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    ${dinerStatCard('❤️', '生命', state.life, 'var(--danger)')}
                    ${dinerStatCard('⭐', '名聲', state.reputation, 'var(--honey)')}
                    ${dinerStatCard('💰', '資金', state.money, 'var(--sage)')}
                </div>
                <div class="rounded-3xl px-5 py-5 mb-4" style="background:linear-gradient(180deg, var(--cream), var(--paper)); border:1px solid var(--line); min-height:90px;">
                    <p class="font-display font-bold text-base mb-1" style="color:${DINER_CAT_COLORS[event.cat]}">「${event.name}」</p>
                    <p class="text-sm leading-relaxed">${event.story}</p>
                </div>
                <div class="space-y-2.5">
                    <button onclick="dinerChoose('a')" class="w-full text-left px-4 py-3 rounded-2xl transition" style="background:var(--cream); border:1px solid var(--line);">
                        <span class="font-bold" style="color:var(--jam)">A</span> 　<span class="text-sm">${event.a}</span>
                    </button>
                    <button onclick="dinerChoose('b')" class="w-full text-left px-4 py-3 rounded-2xl transition" style="background:var(--cream); border:1px solid var(--line);">
                        <span class="font-bold" style="color:var(--honey)">B</span> 　<span class="text-sm">${event.b}</span>
                    </button>
                    <button onclick="dinerChoose('c')" class="w-full text-left px-4 py-3 rounded-2xl transition" style="background:var(--cream); border:1px solid var(--line);">
                        <span class="font-bold" style="color:#7B5FA6">C</span> 　<span class="text-sm">${event.c}</span>
                    </button>
                </div>
                <p id="diner-result" class="text-center text-sm font-semibold mt-4" style="min-height:1.5rem;"></p>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-3">放棄遊戲</button>
            `;
        }

        function dinerStatCard(icon, label, value, color) {
            const pct = Math.max(0, Math.min(100, label === '資金' ? (value / 500 * 100) : value));
            return `<div class="text-center px-2 py-2.5 rounded-2xl" style="background:var(--cream); border:1px solid var(--line);">
                <div class="text-lg">${icon}</div>
                <div class="font-bold text-sm" style="color:${color}">${Math.round(value)}</div>
                <div style="height:4px; border-radius:999px; overflow:hidden; background:var(--line); margin-top:4px;">
                    <div style="height:100%; width:${Math.max(0, Math.min(100, pct))}%; background:${color}; transition:width .4s;"></div>
                </div>
            </div>`;
        }

        function dinerChoose(option) {
            const state = dinerGameState;
            if (!state || state.ended) return;
            const event = state.currentEvent;
            const isBoss = event.cat === 'D';
            const mult = isBoss ? 1.5 : 1;
            const isHoliday = event.cat === 'E';
            let resultText = '';
            let lifeDelta = 0, repDelta = 0, moneyDelta = 0;

            if (option === 'a') {
                moneyDelta = -Math.round((10 + Math.random() * 10) * mult);
                repDelta = Math.round((3 + Math.random() * 5) * mult);
                resultText = `你選擇了 A：${event.a}`;
                playSfx('click');
            } else if (option === 'b') {
                moneyDelta = Math.round((30 + Math.random() * 70) * mult);
                repDelta = isHoliday
                    ? Math.round(Math.random() * 15 * mult)
                    : Math.round((Math.random() * 20 - 10) * mult);
                resultText = `你選擇了 B：${event.b}`;
                playSfx(moneyDelta > 0 ? 'buy' : 'sell');
            } else {
                const success = Math.random() < 0.5;
                if (success) {
                    moneyDelta = Math.round((80 + Math.random() * 70) * mult);
                    repDelta = Math.round((10 + Math.random() * 10) * mult);
                    resultText = `你選擇了 C：${event.c} → 🎉 成功了！`;
                    playSfx('perfect');
                } else {
                    if (Math.random() < 0.5) {
                        lifeDelta = -Math.round((20 + Math.random() * 20) * mult);
                    } else {
                        moneyDelta = -Math.round((30 + Math.random() * 30) * mult);
                    }
                    resultText = `你選擇了 C：${event.c} → 😱 失敗了…`;
                    playSfx('burnt');
                }
            }

            state.life = Math.max(0, state.life + lifeDelta);
            state.reputation = Math.max(0, state.reputation + repDelta);
            state.money = Math.max(0, state.money + moneyDelta);

            const deltaParts = [];
            if (lifeDelta) deltaParts.push(`生命${lifeDelta > 0 ? '+' : ''}${lifeDelta}`);
            if (repDelta) deltaParts.push(`名聲${repDelta > 0 ? '+' : ''}${repDelta}`);
            if (moneyDelta) deltaParts.push(`資金${moneyDelta > 0 ? '+' : ''}${moneyDelta}`);

            const resultEl = document.getElementById('diner-result');
            if (resultEl) {
                resultEl.textContent = `${resultText}（${deltaParts.join('、') || '沒有變化'}）`;
                resultEl.style.color = (lifeDelta < 0 || moneyDelta < 0) && !(lifeDelta === 0 && moneyDelta >= 0) ? 'var(--danger)' : 'var(--sage)';
            }
            if (navigator.vibrate) navigator.vibrate(lifeDelta < 0 ? [120, 60, 120] : [40]);

            // 停用選項按鈕，避免連續點擊
            document.querySelectorAll('#game-modal-body button[onclick^="dinerChoose"]').forEach(b => b.disabled = true);

            setTimeout(() => {
                if (state.life <= 0 || state.reputation <= 0 || state.money <= 0) {
                    dinerEndGame(false);
                } else {
                    dinerNextDay();
                }
            }, 1400);
        }

        function dinerEndGame(survived) {
            const state = dinerGameState;
            if (!state) return;
            state.ended = true;
            const daysSurvived = Math.min(state.day, DINER_TOTAL_DAYS);
            let score = daysSurvived * 15;
            let title, emoji, desc;
            if (survived) {
                score += Math.round((state.life + state.reputation) / 4) + Math.round(state.money / 50);
                title = '順利撐過 20 天！';
                emoji = '🎊';
                desc = `你的深夜食堂成功經營下來了。最終生命 ${Math.round(state.life)}、名聲 ${Math.round(state.reputation)}、資金 ${Math.round(state.money)}`;
                playSfx('perfect');
            } else {
                const cause = state.life <= 0 ? '體力耗盡，撐不下去了' : state.reputation <= 0 ? '名聲掃地，再也沒有客人上門' : '資金見底，週轉不靈只能收攤';
                title = `第 ${daysSurvived} 天，${cause}`;
                emoji = '🌙💤';
                desc = '深夜食堂的故事，就在這裡告一段落了。';
                playSfx('burnt');
            }
            dinerGameState = null;
            document.getElementById('game-modal-title').textContent = '🌙 深夜食堂';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center py-6 rounded-3xl mb-4" style="background:linear-gradient(180deg, var(--cream), var(--paper))">
                    <div class="text-6xl mb-3 ${survived ? 'celebrate-pop' : 'dash-shake'}">${emoji}</div>
                    <p class="font-display text-xl font-bold mb-1" style="color:${survived ? 'var(--jam)' : 'var(--danger)'}">${title}</p>
                    <p class="text-sm mb-4" style="color:var(--muted)">${desc}</p>
                    <p class="text-sm mb-4">存活 ${daysSurvived} 天 ・ 分數：<span class="font-bold" style="color:var(--honey)">${score}</span></p>
                    <div class="flex gap-3 justify-center flex-wrap">
                        <button onclick="submitGameScore('diner', ${score})" class="btn-primary">上傳分數到排行榜</button>
                        <button onclick="renderGameMenu()" class="btn-secondary">返回選單</button>
                    </div>
                </div>
            `;
        }


        // ---------- 小餐廳經營模擬（Tiny Diner）----------
        // 為了不觸發 AI 查詢（避免耗用 Gemini 免費額度），這裡另外寫一套只查
        // 「Firestore 快取／本地食材資料庫」的版本，查不到就直接回傳 null，
        // 不會像食譜詳細頁那樣繼續往下問 AI —— 遊戲只會挑選熱量資料「完整」的食譜
        async function resolveIngredientNutritionNoAI(name) {
            if (Object.prototype.hasOwnProperty.call(aiNutritionCache, name)) return aiNutritionCache[name];
            const trimmedName = name.trim();
            const docId = trimmedName.replace(/\//g, '_').slice(0, 200);
            try {
                const cacheDoc = await db.collection('ingredientNutrition').doc(docId).get();
                if (cacheDoc.exists) return cacheDoc.data();
            } catch (e) {}
            try {
                const aliasSnap = await db.collection('ingredientNutrition').where('keywords', 'array-contains', trimmedName).limit(1).get();
                if (!aliasSnap.empty) return aliasSnap.docs[0].data();
            } catch (e) {}
            await Promise.all([tfndLoadPromise, tfndFullLoadPromise]);
            const local = guessIngredientNutrition(name);
            if (local) return local;
            return null; // 沒有 AI 備援，查不到就是查不到
        }
        async function resolveIngredientDensityNoAI(name) {
            if (Object.prototype.hasOwnProperty.call(densityCache, name)) return densityCache[name];
            const trimmedName = name.trim();
            const docId = trimmedName.replace(/\//g, '_').slice(0, 200);
            try {
                const cacheDoc = await db.collection('ingredientNutrition').doc(docId).get();
                if (cacheDoc.exists && typeof cacheDoc.data().density === 'number') return cacheDoc.data().density;
            } catch (e) {}
            try {
                const aliasSnap = await db.collection('ingredientNutrition').where('keywords', 'array-contains', trimmedName).limit(1).get();
                if (!aliasSnap.empty && typeof aliasSnap.docs[0].data().density === 'number') return aliasSnap.docs[0].data().density;
            } catch (e) {}
            return guessIngredientDensity(name);
        }
        async function resolveGramsNoAI(amount, unit, name) {
            const u = (unit || '').trim();
            switch (u.toLowerCase()) {
                case 'g': return amount;
                case 'kg': return amount * 1000;
                case 'oz': return amount * 28.3495;
                case 'lb': return amount * 453.592;
            }
            const ml = convertToMilliliters(amount, unit);
            if (ml !== null) {
                const density = await resolveIngredientDensityNoAI(name);
                if (density === null) return null;
                return ml * density;
            }
            if (COUNT_UNIT_WORDS.includes(u)) {
                const pieceWeight = guessPieceWeight(name);
                if (pieceWeight !== null) return amount * pieceWeight;
            }
            return null;
        }
        // 算出一篇食譜的總熱量；只要有任何一項食材的資料不完整（熱量或重量換算查不到），
        // 整篇食譜直接判定為「資料不完整」回傳 null，不會用進遊戲的候選菜單池
        async function computeRecipeCaloriesNoAI(recipe) {
            if (!recipe.ingredients || !recipe.ingredients.length) return null;
            let totalKcal = 0;
            for (const ing of recipe.ingredients) {
                const nutrition = await resolveIngredientNutritionNoAI(ing.name);
                if (!nutrition || typeof nutrition.kcal !== 'number') return null;
                const grams = await resolveGramsNoAI(ing.amount, ing.unit, ing.name);
                if (grams === null) return null;
                totalKcal += (nutrition.kcal / 100) * grams;
            }
            const servings = recipe.servings > 0 ? recipe.servings : 1;
            return Math.max(50, Math.round(totalKcal / servings)); // 換算成「每份」熱量，作為一份餐點的熱量基準
        }

        const TINY_DINER_KCAL_TO_PRICE = 0.18; // 每大卡換算的售價（新台幣）
        const TINY_DINER_COST_RATIO = 0.4; // 食材成本估算為售價的 4 成（餐飲業常見的抓法）
        const TINY_DINER_TOTAL_DAYS = 10;
        let tinyDinerState = null;

        function tinyDinerCleanup() { tinyDinerState = null; }

        async function startTinyDinerGame() {
            if (!currentUser) { alert('請先登入才能玩遊戲'); return; }
            currentGameScreen = 'game';
            qteCleanup(); stockGameCleanup(); dashGameCleanup(); dinerGameCleanup(); tinyDinerCleanup();
            ensureAudioContext();
            document.getElementById('game-modal-title').textContent = '🏮 小餐廳經營模擬';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center py-10">
                    <div class="text-4xl mb-3">🍳</div>
                    <p class="text-sm" style="color:var(--muted)">正在從真實食譜資料庫挑選有完整熱量資料的菜色…</p>
                </div>
            `;
            try {
                const snap = await db.collection('recipes').limit(200).get();
                const allRecipes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(r => (!r.visibility || r.visibility === 'public') && r.ingredients && r.ingredients.length);
                // 依照首頁排序邏輯排序（最新編輯在前），優先檢查首頁前 12 篇夠不夠用，
                // 不夠的話才繼續往後面（隨機順序）找，減少不必要的檢查次數
                allRecipes.sort((a, b) => {
                    // 依「建立日期」排序，不是「最後編輯日期」——編輯過的舊食譜不應該因為改過內容
                    // 就跳到最前面，建立日期沒有的舊資料才退回用編輯日期頂替
                    const toMillis = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : 0;
                    const aTime = toMillis(a.createdAt) || toMillis(a.updatedAt);
                    const bTime = toMillis(b.createdAt) || toMillis(b.updatedAt);
                    return bTime - aTime;
                });
                const top12 = allRecipes.slice(0, 12);
                const rest = allRecipes.slice(12).sort(() => Math.random() - 0.5);
                const candidates = [...top12, ...rest];
                const pool = [];
                for (const recipe of candidates) {
                    if (pool.length >= 15) break;
                    const kcalPerServing = await computeRecipeCaloriesNoAI(recipe);
                    if (kcalPerServing === null) continue; // 資料不完整，跳過，不觸發 AI
                    pool.push({
                        id: recipe.id,
                        name: recipe.name,
                        category: recipe.category,
                        kcal: kcalPerServing,
                        price: Math.max(20, Math.round(kcalPerServing * TINY_DINER_KCAL_TO_PRICE)),
                        popularity: 0.6 + Math.random() * 0.8, // 每局隨機給一個受歡迎度權重
                    });
                }
                if (pool.length < 4) {
                    document.getElementById('game-modal-body').innerHTML = `
                        <div class="text-center py-10">
                            <div class="text-4xl mb-3">😥</div>
                            <p class="text-sm mb-4" style="color:var(--muted)">目前平台上熱量資料完整的食譜還不夠多（至少需要 4 篇），沒辦法開始這個遊戲。
                            多去幾篇食譜的詳細頁看一下熱量估算，讓系統把資料存起來，之後就會有更多菜色可以選了！</p>
                            <button onclick="renderGameMenu()" class="btn-secondary">返回選單</button>
                        </div>
                    `;
                    return;
                }
                tinyDinerState = { day: 0, money: 5000, startMoney: 5000, pool, log: [] };
                playSfx('click');
                tinyDinerNextDay();
            } catch (err) {
                document.getElementById('game-modal-body').innerHTML = `<p class="text-center text-sm py-10" style="color:var(--danger)">菜單池載入失敗：${err.message}</p><button onclick="renderGameMenu()" class="btn-secondary w-full">返回選單</button>`;
            }
        }

        // 每日客群：對應到某個食譜分類，當天菜單如果有該分類的菜，會賣得更好、價格也稍微好一點；
        // 沒有對應分類也沒關係，生意就是一般般，不會扣分
        const TINY_DINER_CUSTOMER_GROUPS = [
            { name: '上班族OL', icon: '👩‍💼', category: '蛋糕/糕餅', dislike: '寶寶食品' },
            { name: '學生族群', icon: '🎒', category: '麵包/包子', dislike: '健康餐' },
            { name: '銀髮長輩', icon: '👴', category: '中式烹飪', dislike: '慕斯/布丁' },
            { name: '健身狂熱者', icon: '💪', category: '健康餐', dislike: '蛋糕/糕餅' },
            { name: '甜點控', icon: '🍪', category: '餅乾/塔派', dislike: '中式烹飪' },
            { name: '浪漫情侶', icon: '💑', category: '西式烹飪', dislike: '麵包/包子' },
            { name: '動漫迷', icon: '🎌', category: '日式烹飪', dislike: '寶寶食品' },
            { name: '新手爸媽', icon: '👶', category: '寶寶食品', dislike: '其他' },
            { name: '美食探險家', icon: '🧭', category: '慕斯/布丁', dislike: '麵包/包子' },
            { name: '在地熟客', icon: '🏘️', category: '其他', dislike: '西式烹飪' },
        ];
        const TINY_DINER_GROUP_POP_BOOST = 1.8; // 對應分類的受歡迎度加成
        const TINY_DINER_GROUP_PRICE_BOOST = 1.15; // 對應分類的價格加成

        function tinyDinerNextDay() {
            const state = tinyDinerState;
            if (!state) return;
            state.day++;
            if (state.day > TINY_DINER_TOTAL_DAYS) { endTinyDinerGame(); return; }
            state.todayMenu = [];
            state.todayGroup = TINY_DINER_CUSTOMER_GROUPS[Math.floor(Math.random() * TINY_DINER_CUSTOMER_GROUPS.length)];
            renderTinyDinerMenuSelect();
        }

        function renderTinyDinerMenuSelect() {
            const state = tinyDinerState;
            document.getElementById('game-modal-title').textContent = '🏮 小餐廳經營模擬';
            const dayPct = Math.round((state.day / TINY_DINER_TOTAL_DAYS) * 100);
            const group = state.todayGroup;
            document.getElementById('game-modal-body').innerHTML = `
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1 text-xs" style="color:var(--muted)">
                        <span>第 ${state.day} / ${TINY_DINER_TOTAL_DAYS} 天</span>
                        <span>資金：<span class="font-bold" style="color:var(--jam)">$${Math.round(state.money).toLocaleString()}</span></span>
                    </div>
                    <div style="height:6px; border-radius:999px; overflow:hidden; background:var(--line);">
                        <div style="height:100%; width:${dayPct}%; background:linear-gradient(90deg, var(--honey), var(--jam));"></div>
                    </div>
                </div>
                <div class="flex items-center gap-3 px-4 py-3 rounded-2xl mb-3" style="background:rgba(244,228,234,0.5); border:1px solid var(--line);">
                    <div class="text-3xl">${group.icon}</div>
                    <div>
                        <p class="text-xs" style="color:var(--muted)">今日主要客群</p>
                        <p class="text-sm font-semibold">${group.name}</p>
                    </div>
                </div>
                <p class="text-sm font-semibold mb-2">今天要賣什麼？挑 4~6 道菜（已選 <span id="tdn-count">0</span>/6）</p>
                <div class="space-y-2 mb-4" style="max-height:40vh; overflow-y:auto;">
                    ${state.pool.map((dish, i) => {
                        return `<label class="flex items-center justify-between px-4 py-2.5 rounded-2xl cursor-pointer" style="background:var(--cream); border:1px solid var(--line);">
                            <div class="flex items-center gap-2 min-w-0">
                                <input type="checkbox" onchange="tinyDinerToggleDish(${i}, this.checked)" class="shrink-0">
                                <div class="min-w-0">
                                    <p class="text-sm font-medium truncate">${dish.name}</p>
                                    <p class="text-xs" style="color:var(--muted)">${dish.category} ・ ${dish.kcal} kcal/份</p>
                                </div>
                            </div>
                            <p class="font-bold text-sm shrink-0" style="color:var(--jam)">$${dish.price}</p>
                        </label>`;
                    }).join('')}
                </div>
                <button id="tdn-confirm-btn" onclick="tinyDinerConfirmMenu()" disabled class="btn-primary w-full opacity-40">確認菜單，進入備料階段</button>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-3">放棄遊戲</button>
            `;
        }

        function tinyDinerToggleDish(i, checked) {
            const state = tinyDinerState;
            if (!state) return;
            const dish = state.pool[i];
            if (checked) {
                if (state.todayMenu.length >= 6) { alert('最多只能選 6 道菜'); event.target.checked = false; return; }
                state.todayMenu.push(dish);
            } else {
                state.todayMenu = state.todayMenu.filter(d => d.id !== dish.id);
            }
            document.getElementById('tdn-count').textContent = state.todayMenu.length;
            const btn = document.getElementById('tdn-confirm-btn');
            const ok = state.todayMenu.length >= 4 && state.todayMenu.length <= 6;
            btn.disabled = !ok;
            btn.style.opacity = ok ? '1' : '0.4';
        }

        function tinyDinerConfirmMenu() {
            playSfx('click');
            renderTinyDinerPrepPhase();
        }

        function tinyDinerEffectivePrice(dish) {
            const state = tinyDinerState;
            const isMatch = state && state.todayGroup && dish.category === state.todayGroup.category;
            return isMatch ? Math.round(dish.price * TINY_DINER_GROUP_PRICE_BOOST) : dish.price;
        }
        function tinyDinerEffectivePopularity(dish) {
            const state = tinyDinerState;
            if (!state || !state.todayGroup) return dish.popularity;
            if (dish.category === state.todayGroup.dislike) return 0; // 討厭的分類完全賣不出去
            const isMatch = dish.category === state.todayGroup.category;
            return isMatch ? dish.popularity * TINY_DINER_GROUP_POP_BOOST : dish.popularity;
        }

        function renderTinyDinerPrepPhase() {
            const state = tinyDinerState;
            document.getElementById('game-modal-title').textContent = '📦 今日備料';
            document.getElementById('game-modal-body').innerHTML = `
                <p class="text-sm mb-1" style="color:var(--muted)">今天預估會有 <b>10~20 位</b>客人上門，直接輸入每道菜要準備幾份（備太少客人吃不到，備太多賣不完會浪費食材成本）</p>
                <p class="text-sm mb-4">目前資金：<span class="font-bold" style="color:var(--jam)">$${Math.round(state.money).toLocaleString()}</span></p>
                <div class="space-y-2.5 mb-4">
                    ${state.todayMenu.map((dish, i) => {
                        const unitCost = Math.round(dish.price * TINY_DINER_COST_RATIO);
                        return `<div class="px-4 py-3 rounded-2xl" style="background:var(--cream); border:1px solid var(--line);">
                            <div class="flex justify-between items-center mb-1.5">
                                <p class="text-sm font-medium">${dish.name}</p>
                                <p class="text-xs" style="color:var(--muted)">售價 $${dish.price} ・ 成本約 $${unitCost}/份</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <label class="text-xs shrink-0" style="color:var(--muted)">準備份數</label>
                                <input type="number" min="0" value="5" id="tdn-prep-${i}" oninput="tinyDinerUpdatePrepCost()" class="form-input !py-1.5 text-sm" style="width:80px;">
                            </div>
                        </div>`;
                    }).join('')}
                </div>
                <p class="text-sm mb-4">預估食材總成本：<span id="tdn-prep-cost" class="font-bold" style="color:var(--danger)">$0</span></p>
                <button onclick="tinyDinerConfirmPrep()" class="btn-primary w-full">開始今日營業</button>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-3">放棄遊戲</button>
            `;
            tinyDinerUpdatePrepCost();
        }

        function tinyDinerUpdatePrepCost() {
            const state = tinyDinerState;
            let totalCost = 0;
            state.todayMenu.forEach((dish, i) => {
                const el = document.getElementById(`tdn-prep-${i}`);
                const qty = el ? Math.max(0, parseInt(el.value) || 0) : 0;
                totalCost += qty * Math.round(dish.price * TINY_DINER_COST_RATIO);
            });
            const costEl = document.getElementById('tdn-prep-cost');
            if (costEl) costEl.textContent = `$${totalCost.toLocaleString()}`;
        }

        const TINY_DINER_NAMES = ['王小明', '陳小華', '林美玲', '張先生', '李小姐', '黃太太', '吳大哥', '蔡同學', '許阿姨', '楊經理', '周小姐', '劉先生', '鄭小妹', '謝老闆', '賴同學', '洪太太', '游先生', '蕭小姐', '范大哥', '簡阿伯'];
        const TINY_DINER_REASONS = ['慶祝生日', '犒賞辛苦的自己', '跟好久不見的朋友聚餐', '深夜嘴饞睡不著', '終於等到最愛的口味上市', '路過被香味吸引', '特地從外地來嚐鮮', '慶祝升遷加薪', '紀念日想吃點好的', '純粹肚子餓', '加班後犒賞自己', '慶祝考試通過', '想念家鄉的味道', '跟著網路評價找上門', '單純想放鬆一下'];

        function tinyDinerConfirmPrep() {
            const state = tinyDinerState;
            const prepped = state.todayMenu.map((dish, i) => {
                const el = document.getElementById(`tdn-prep-${i}`);
                const qty = el ? Math.max(0, parseInt(el.value) || 0) : 0;
                return { dish, qty, remaining: qty, effPrice: tinyDinerEffectivePrice(dish), effPop: tinyDinerEffectivePopularity(dish) };
            });
            const totalCost = prepped.reduce((sum, p) => sum + p.qty * Math.round(p.dish.price * TINY_DINER_COST_RATIO), 0);

            // 先把今天所有客人依受歡迎度加權隨機決定好（事件序列），再逐一播放動畫呈現
            const customerCount = 10 + Math.floor(Math.random() * 11);
            const totalWeight = prepped.reduce((sum, p) => sum + p.effPop, 0);
            const events = [];
            for (let c = 0; c < customerCount; c++) {
                let picked;
                if (totalWeight <= 0) {
                    // 極端情況：整份菜單剛好都是今天客群討厭的分類，沒有人想買任何東西
                    picked = prepped[Math.floor(Math.random() * prepped.length)];
                } else {
                    let roll = Math.random() * totalWeight;
                    picked = null;
                    for (const p of prepped) {
                        roll -= p.effPop;
                        if (roll <= 0 && p.effPop > 0) { picked = p; break; }
                    }
                    if (!picked) picked = prepped[prepped.length - 1];
                }
                const success = totalWeight > 0 && picked.remaining > 0;
                if (success) picked.remaining--;
                events.push({
                    name: TINY_DINER_NAMES[Math.floor(Math.random() * TINY_DINER_NAMES.length)],
                    reason: TINY_DINER_REASONS[Math.floor(Math.random() * TINY_DINER_REASONS.length)],
                    dish: picked.dish,
                    price: picked.effPrice,
                    success,
                });
            }
            const wasted = prepped.reduce((sum, p) => sum + p.remaining, 0);
            playSfx('click');
            renderTinyDinerEventFeed(events, totalCost, wasted, customerCount);
        }

        function renderTinyDinerEventFeed(events, totalCost, wasted, customerCount) {
            document.getElementById('game-modal-title').textContent = '🏮 今日營業中…';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="flex justify-between items-center mb-3 text-sm">
                    <p>來客 <span id="tdn-feed-count">0</span> / ${customerCount}</p>
                    <p>營業額：<span id="tdn-feed-revenue" class="font-bold" style="color:var(--sage)">$0</span></p>
                </div>
                <!-- 固定大小的事件卡片，每位客人依序替換內容，不會讓版面一直長高 -->
                <div id="tdn-event-card" class="rounded-3xl px-5 flex flex-col items-center justify-center text-center" style="height:150px; background:var(--cream); border:1px solid var(--line); transition:background .2s;">
                    <p class="text-sm" style="color:var(--muted)">準備開店…</p>
                </div>
                <div class="flex justify-center gap-1.5 mt-4">
                    ${events.map((_, idx) => `<span id="tdn-dot-${idx}" style="width:6px; height:6px; border-radius:999px; background:var(--line); display:inline-block; transition:background .2s;"></span>`).join('')}
                </div>
            `;
            const cardEl = document.getElementById('tdn-event-card');
            let revenue = 0, served = 0, turnedAway = 0;
            let i = 0;
            const step = () => {
                if (i >= events.length) {
                    const profit = revenue - totalCost;
                    tinyDinerState.money += profit;
                    playSfx(profit >= 0 ? 'success' : 'burnt');
                    setTimeout(() => renderTinyDinerDayResult({ customerCount, served, turnedAway, revenue, totalCost, profit, wasted }), 600);
                    return;
                }
                const ev = events[i];
                const dot = document.getElementById(`tdn-dot-${i}`);
                if (dot) dot.style.background = ev.success ? 'var(--sage)' : 'var(--danger)';
                cardEl.style.opacity = '0';
                setTimeout(() => {
                    if (ev.success) {
                        revenue += ev.price;
                        served++;
                        cardEl.style.background = 'rgba(155,196,155,0.25)';
                        cardEl.innerHTML = `<div class="text-3xl mb-2">😊</div>
                            <p class="text-sm font-medium mb-1">${ev.name} 買了「${ev.dish.name}」</p>
                            <p class="text-xs mb-1" style="color:var(--muted)">為了${ev.reason}</p>
                            <p class="font-bold text-lg" style="color:var(--sage)">+$${ev.price}</p>`;
                        playSfx('tick');
                    } else {
                        turnedAway++;
                        cardEl.style.background = 'rgba(196,69,63,0.12)';
                        cardEl.innerHTML = `<div class="text-3xl mb-2">😥</div>
                            <p class="text-sm font-medium mb-1">${ev.name} 想吃「${ev.dish.name}」</p>
                            <p class="text-xs" style="color:var(--muted)">為了${ev.reason}，可惜已經賣完了，失望離開</p>`;
                    }
                    cardEl.style.opacity = '1';
                    document.getElementById('tdn-feed-count').textContent = i + 1;
                    document.getElementById('tdn-feed-revenue').textContent = `$${revenue.toLocaleString()}`;
                    i++;
                    setTimeout(step, 850);
                }, 150);
            };
            step();
        }

        function renderTinyDinerDayResult(result) {
            const state = tinyDinerState;
            document.getElementById('game-modal-title').textContent = `📊 第 ${state.day} 天結算`;
            const isProfit = result.profit >= 0;
            const group = state.todayGroup;
            const hadMatch = state.todayMenu.some(d => d.category === group.category);
            const hadDislike = state.todayMenu.some(d => d.category === group.dislike);
            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center py-4 rounded-3xl mb-4" style="background:linear-gradient(180deg, var(--cream), var(--paper))">
                    <div class="text-5xl mb-2">${isProfit ? '📈' : '📉'}</div>
                    <p class="font-display text-xl font-bold" style="color:${isProfit ? 'var(--sage)' : 'var(--danger)'}">今日${isProfit ? '獲利' : '虧損'} $${Math.abs(Math.round(result.profit)).toLocaleString()}</p>
                </div>
                <p class="text-xs mb-1 text-center" style="color:var(--muted)">${group.icon} 今天客群是「${group.name}」，${hadMatch ? `菜單裡剛好有「${group.category}」，賣得特別好！` : `菜單裡沒有「${group.category}」，生意就一般般`}</p>
                ${hadDislike ? `<p class="text-xs mb-3 text-center" style="color:var(--danger)">⚠️ 菜單裡有「${group.dislike}」，這道菜今天完全賣不出去</p>` : '<div class="mb-3"></div>'}
                <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
                    <div class="px-4 py-3 rounded-2xl" style="background:var(--cream)"><p style="color:var(--muted)">來客數</p><p class="font-bold">${result.customerCount} 位</p></div>
                    <div class="px-4 py-3 rounded-2xl" style="background:var(--cream)"><p style="color:var(--muted)">成交 / 撲空</p><p class="font-bold">${result.served} / ${result.turnedAway}</p></div>
                    <div class="px-4 py-3 rounded-2xl" style="background:var(--cream)"><p style="color:var(--muted)">營業額</p><p class="font-bold" style="color:var(--sage)">$${Math.round(result.revenue).toLocaleString()}</p></div>
                    <div class="px-4 py-3 rounded-2xl" style="background:var(--cream)"><p style="color:var(--muted)">食材成本</p><p class="font-bold" style="color:var(--danger)">$${Math.round(result.totalCost).toLocaleString()}</p></div>
                </div>
                ${result.wasted > 0 ? `<p class="text-xs mb-4" style="color:var(--muted)">⚠️ 有 ${result.wasted} 份備料沒賣完，成本已經算進去了，下次可以少備一點</p>` : ''}
                ${result.turnedAway > 0 ? `<p class="text-xs mb-4" style="color:var(--muted)">😥 有 ${result.turnedAway} 位客人撲空離開，下次可以多備一點熱門菜色</p>` : ''}
                <p class="text-sm mb-4">目前總資金：<span class="font-bold" style="color:var(--jam)">$${Math.round(state.money).toLocaleString()}</span></p>
                <button onclick="tinyDinerNextDay()" class="btn-primary w-full">${state.day >= TINY_DINER_TOTAL_DAYS ? '查看最終結算' : '進入下一天'}</button>
            `;
        }

        function endTinyDinerGame() {
            const state = tinyDinerState;
            if (!state) return;
            const netProfit = state.money - state.startMoney;
            const score = Math.max(0, Math.round(netProfit / 20));
            tinyDinerState = null;
            playSfx(netProfit >= 0 ? 'perfect' : 'fail');
            document.getElementById('game-modal-title').textContent = '🏮 小餐廳經營模擬';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center py-8">
                    <div class="text-6xl mb-3 ${netProfit >= 0 ? 'celebrate-pop' : ''}">${netProfit >= 0 ? '🎉' : '😥'}</div>
                    <p class="font-display text-2xl font-bold mb-2" style="color:${netProfit >= 0 ? 'var(--jam)' : 'var(--danger)'}">10 天經營結束！</p>
                    <p class="text-sm mb-4" style="color:var(--muted)">最終資金 $${Math.round(state.money).toLocaleString()}（${netProfit >= 0 ? '淨賺' : '淨賠'} $${Math.abs(Math.round(netProfit)).toLocaleString()}）</p>
                    <p class="text-sm mb-6">分數：<span class="font-bold" style="color:var(--honey)">${score}</span></p>
                    <div class="flex gap-3 justify-center flex-wrap">
                        <button onclick="submitGameScore('tinydiner', ${score})" class="btn-primary">上傳分數到排行榜</button>
                        <button onclick="renderGameMenu()" class="btn-secondary">返回選單</button>
                    </div>
                </div>
            `;
        }
        // ---------- 遊戲結束/排行榜/上傳分數 ----------
        function dashOpenRecipe(idx) {
            const recipe = (window.__dashRecommendPicks || [])[idx];
            if (!recipe || !recipe.id) return;
            // game.html是獨立頁面，不能像原本index.html裡那樣直接呼叫showDetail()彈出食譜詳細頁
            // (那個函式牽動整個食譜檢視/編輯系統，沒辦法簡單複製一份過來)，改成導回首頁、
            // 帶上openRecipe網址參數，讓index.html載入時偵測到這個參數、自動幫忙開啟那篇食譜
            window.location.href = `index.html?openRecipe=${encodeURIComponent(recipe.id)}`;
        }
        const GAME_NAMES = { qte: '神廚火候控制', stock: '食材期貨大亨', dash: '虛擬廚房挑戰賽', diner: '深夜食堂', tinydiner: '小餐廳經營模擬' };
        function showGameOverScreen(gameId, score, detailText) {
            const gameName = GAME_NAMES[gameId] || gameId;
            document.getElementById('game-modal-title').textContent = '🎮 遊戲場';
            document.getElementById('game-modal-title').style.cssText = '';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="text-center py-8">
                    <div class="text-5xl mb-3">🎉</div>
                    <p class="font-display text-2xl font-bold mb-2" style="color:var(--jam)">遊戲結束！</p>
                    <p class="text-lg mb-1">${gameName} 分數：<span class="font-bold" style="color:var(--honey)">${score}</span></p>
                    <p class="text-xs mb-6" style="color:var(--muted)">${detailText || ''}</p>
                    <div class="flex gap-3 justify-center flex-wrap">
                        <button onclick="submitGameScore('${gameId}', ${score})" class="btn-primary">上傳分數到排行榜</button>
                        <button onclick="renderGameMenu()" class="btn-secondary">返回選單</button>
                    </div>
                </div>
            `;
        }
        async function submitGameScore(gameId, score) {
            if (!currentUser) { alert('請先登入才能上傳分數'); return; }
            try {
                await db.collection('gameScores').add({
                    gameId, userId: currentUser.uid, userName: (userProgress && userProgress.nickname) || currentUser.displayName || '匿名',
                    score, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                alert('分數已上傳！');
                showLeaderboard(gameId);
            } catch (err) {
                alert('上傳失敗：' + err.message);
            }
        }
        async function showLeaderboard(gameId) {
            currentGameScreen = 'leaderboard';
            document.getElementById('game-modal-title').textContent = '🏆 排行榜';
            document.getElementById('game-modal-body').innerHTML = `
                <div class="modal-photo-header rounded-2xl px-4 py-4 mb-4" style="background-image: image-set(url('https://res.cloudinary.com/bumzwp9g/image/upload/w_700,q_auto,f_auto/v1785486362/Achievement_gqdqic.png') 1x, url('https://res.cloudinary.com/bumzwp9g/image/upload/w_1400,q_auto,f_auto/v1785486362/Achievement_gqdqic.png') 2x);">
                    <p class="font-display font-bold text-lg mb-1">🏆 排行榜</p>
                    <div class="flex gap-2 flex-wrap">
                        <button onclick="showLeaderboard('qte')" class="chip ${gameId === 'qte' ? 'active' : ''}">神廚火候控制</button>
                        <button onclick="showLeaderboard('stock')" class="chip ${gameId === 'stock' ? 'active' : ''}">食材期貨大亨</button>
                        <button onclick="showLeaderboard('dash')" class="chip ${gameId === 'dash' ? 'active' : ''}">廚房挑戰賽</button>
                        <button onclick="showLeaderboard('diner')" class="chip ${gameId === 'diner' ? 'active' : ''}">深夜食堂</button>
                        <button onclick="showLeaderboard('tinydiner')" class="chip ${gameId === 'tinydiner' ? 'active' : ''}">餐廳經營</button>
                    </div>
                </div>
                <div id="leaderboard-list"><p class="text-sm" style="color:var(--muted)">載入中…</p></div>
                <button onclick="renderGameMenu()" class="btn-secondary w-full mt-4">返回選單</button>
            `;
            try {
                const snap = await db.collection('gameScores').where('gameId', '==', gameId).orderBy('score', 'desc').limit(10).get();
                const list = document.getElementById('leaderboard-list');
                if (!list) return;
                if (snap.empty) { list.innerHTML = `<p class="text-sm" style="color:var(--muted)">還沒有任何紀錄，來當第一名吧！</p>`; return; }
                const docs = snap.docs.map(doc => doc.data());
                const uniqueUids = [...new Set(docs.map(d => d.userId).filter(Boolean))];
                const nicknameByUid = {};
                await Promise.all(uniqueUids.map(uid =>
                    db.collection('userProfiles').doc(uid).get()
                        .then(doc => { if (doc.exists && doc.data().nickname) nicknameByUid[uid] = doc.data().nickname; })
                        .catch(() => {})
                ));
                list.innerHTML = docs.map((d, i) => {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
                    const liveName = (d.userId && nicknameByUid[d.userId]) || d.userName || '匿名';
                    return `<div class="flex justify-between items-center px-4 py-2.5 rounded-2xl mb-2" style="background:var(--cream)">
                        <span>${medal} ${liveName}</span>
                        <span class="font-bold" style="color:var(--jam)">${d.score}</span>
                    </div>`;
                }).join('');
            } catch (err) {
                const list = document.getElementById('leaderboard-list');
                if (list) list.innerHTML = `<p class="text-sm" style="color:var(--danger)">載入失敗：${err.message}</p>`;
            }
        }
</script>
</body>
</html>
